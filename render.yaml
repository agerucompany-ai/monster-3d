# Render Blueprint — 神獣オリュンポス（対CPU＋オンライン対戦）
# 2サービス構成:
#   1) monster-3d        : 単一HTML(index.html)を配る静的サイト（=ゲーム本体）
#   2) monster3d-server-agc : WebSocket中継サーバー (Node)。client の DEFAULT_WS と名前を一致させること。
#
# 既に monster-3d（静的）を手動作成済みの場合は、server だけを
# New → Web Service → このリポジトリ → Root Directory = server で追加すればよい。

services:
  # --- ゲーム本体（単一HTML 静的配信） ---
  - type: web
    name: monster-3d
    runtime: static
    buildCommand: ""
    staticPublishPath: .
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    # 3Dモデル(GLB)・画像は版名付きURL(?v=)で読むので長期キャッシュ。HTML と Service Worker は毎回確認
    headers:
      - path: /models/*
        name: Content-Type
        value: model/gltf-binary
      - path: /models/*
        name: Cache-Control
        value: public, max-age=31536000, immutable
      - path: /img/*
        name: Cache-Control
        value: public, max-age=604800
      - path: /sw.js
        name: Content-Type
        value: application/javascript; charset=utf-8
      - path: /sw.js
        name: Cache-Control
        value: no-cache
      - path: /index.html
        name: Cache-Control
        value: no-cache

  # --- WebSocket中継サーバー ---
  - type: web
    name: monster3d-server-agc
    runtime: node
    plan: free
    rootDir: server
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /health
    envVars:
      - key: NODE_VERSION
        value: "20"
