NR_SC.n01_1=[{w:null,t:"第1話　北の海の風車"},{w:null,t:"父の電話が切れた、その夜。三人は、北へ向かう空の船に乗った。"},{w:null,t:"夜が明けると、窓の下は、灰色の海だった。"},{w:null,t:"海の上に、白い風車が、何十本も並んで回っていた。"},{w:"elly",f:"surprised",t:"……さむっ。窓、つめたい。"},{w:"alek",f:"normal",t:"ここからは、ずっと寒い。上着、もう一枚着ろ。"},{w:"hero",f:"serious",t:"父さん、電話のあと、つながらないんだ。"},{w:"partner",t:"……海の上は、落ちつかない。"},{w:"elly",f:"normal",t:"今、空の上だよ。"}];
NR_SC.n01_2=[{w:null,t:"空の船は、海の中の小さな島に下りた。風車の番の小屋が一つ。"},{w:null,t:"小屋の戸が開いて、作業服の男の人が出てきた。"},{w:"ryo",t:"……ヤマト？"},{w:"hero",f:"surprised",t:"父さん！"},{w:null,t:"ヤマトは走っていって、途中で止まった。父も、止まった。"},{w:"ryo",t:"……本物だな。"},{w:"hero",f:"normal",t:"……画面より、ひげが多い。"},{w:"ryo",t:"剃るひまがなかった。"},{w:null,t:"フォルンが、父の足のにおいを、くんくんかいだ。"},{w:"ryo",t:"お、手のひらの子か。……画面で見るより、気が強そうだ。"},{w:"partner",t:"……よけいなお世話だ。"}];
NR_DIR.n01_3={"k": "勝負", "t": "首の赤い海の子たち（野生・三体ずつ）・盤＝風車の島（海と岸と平原）・覚えること＝海と風。水の子は海で速く、射程も伸びる。風の子は平原で速い。フォルンは海に入らず、岸の上から。"};
NR_SC.n01_3=[{w:"ryo",t:"電話、切れたろ。あの夜から、こっちの風車がおかしいんだ。"},{w:"ryo",t:"止めても、勝手に回る。だれかが、外から動かしてる。"},{w:"alek",f:"normal",t:"……アークか。"},{w:"ryo",t:"たぶんな。この辺の風車は、全部、北の研究所につながってる。"},{w:null,t:"海の向こうから、低い波の音。風が強くなってきた。"},{w:null,t:"その時、島の岸に、海の子たちが何体も上がってきた。首が、赤く光っている。"},{w:"ryo",t:"また来た。夜になると、いつもこうだ。"},{w:"elly",f:"normal",t:"海の上は、水の子が強いよ。平らな所は、風の子が速い。"}];
NR_SC.n01_4w=[{w:null,t:"海の子たちは、首を光らせたまま、海へ戻っていった。"},{w:"ryo",t:"……やるな。父さんより強い。"},{w:"elly",f:"normal",t:"ここの子、三体ずつ来るね。しかも、大きい姿。"},{w:"alek",f:"normal",t:"北は、三段目から。こっちも六体まで出せる。"},{w:null,t:"夜。小屋の中で、四人は、缶づめのスープを分けた。"}];
NR_SC.n01_4l=[{w:null,t:"押しこまれた時、父が、小屋の明かりのスイッチを切った。"},{w:null,t:"海の子たちは、暗くなった島から、すっと海へ戻っていった。"},{w:"ryo",t:"……光に寄ってくるんだ。夜は、明かりを消す。"},{w:"elly",f:"normal",t:"ここの子、三体ずつ来るね。しかも、大きい姿。"},{w:"alek",f:"normal",t:"北は、三段目から。こっちも六体まで出せる。"},{w:null,t:"夜。小屋の中で、四人は、缶づめのスープを分けた。"}];
NR_SC.n01_5=[{w:"hero",f:"normal",t:"父さん。夏になったら、ハナをこっちに連れてきたい。"},{w:"ryo",t:"……フォルンに、会わせるのか。"},{w:"hero",f:"normal",t:"うん。日本には、連れていけないから。"},{w:"ryo",t:"相手は母さんか。……ヴィクターより手ごわいぞ。"},{w:"hero",f:"normal",t:"……うん。それは、わかってる。"},{w:"ryo",t:"はは。じゃあ、作戦を立てとけ。"}];
NR_SC.n01_6=[{w:null,t:"夜ふけ。父が、小屋の古い画面を見て、首をかしげた。"},{w:"ryo",t:"……まただ。夜だけ、研究所への電気が、ぐんと増える。",ph:1},{w:"alek",f:"normal",t:"研究所で、何を動かしてるんだ。"},{w:"ryo",t:"分からん。昼は、ふつうなんだ。",ph:1},{w:null,t:"窓の外。北の水平線の上で、緑色の光の帯が、ゆらゆらと流れていた。"},{w:null,t:"第1話　おわり"}];
NR_SC.n02_1=[{w:null,t:"第2話　話さない子"},{w:null,t:"昼。父の船で、高い崖にはさまれた細い海を進み、小さな町に着いた。"},{w:"ryo",t:"上の山に、研究所の出張所がある。"},{w:"ryo",t:"今、会議で人が集まってるはずだ。"},{w:null,t:"船着き場に、白いぼうしの女の子が、アザラシの子を抱いて立っていた。"},{w:"elly",f:"smile",t:"こんにちは。この町の子？"},{w:null,t:"女の子は、うなずいた。それだけだった。"},{w:"hero",f:"normal",t:"名前は？"},{w:null,t:"女の子は、船着き場の木の札を指さした。「リヴの家の船」と書いてある。"},{w:"elly",f:"normal",t:"……リヴ？"},{w:null,t:"リヴは、うなずいた。"},{w:"alek",f:"normal",t:"話すのが、きらいなのか。"},{w:null,t:"リヴは、首を横にふった。そして、抱いているアザラシの子の頭をなでた。"},{w:"hero",f:"normal",t:"……その子、なんて名前？"},{w:null,t:"リヴは、アザラシの子をヤマトに向けた。ポチャラシが、「ポチャ」と鳴いた。"},{w:"partner",t:"……ポチャ、らしい。"}];
NR_SC.n02_2=[{w:null,t:"町の上の、ガラスの建物。研究所の出張所の前に、見覚えのある人が立っていた。"},{w:"elena",t:"……来たのね。"},{w:null,t:"アレクは、目をそらして、小さくうなずいた。"},{w:"elena",t:"エジプトの返事、届いた？"},{w:"alek",f:"normal",t:"……届いた。"},{w:null,t:"それきり、二人は何も言わなかった。エリーが、そっとヤマトのそでを引いた。"},{w:"hero",f:"normal",t:"博士。北の研究所って、どんな所？"},{w:"elena",t:"氷河の谷にある、アークの中心。"},{w:"elena",t:"世界じゅうの研究所が、あそこにつながってる。"},{w:"hero",f:"surprised",t:"……アークって、そこにあるんだ。"},{w:"elena",t:"それと……。あの研究所、古い神殿の真上に建ってるの。"},{w:"elly",f:"surprised",t:"神殿の上に？"},{w:"elena",t:"建てる時に、地面の下から見つかったの。"},{w:"elena",t:"でも、記録は、ほとんど消されてる。"},{w:null,t:"リヴが、ガラスの窓の外の、白い山を見ていた。"}];
NR_DIR.n02_3={"k": "勝負", "t": "首の赤い氷の子たち（野生・三体ずつ）・盤＝凍った岸（雪と氷が多い）・覚えること＝氷。氷の子は雪の上で強く、炎には弱い。雪の少ない所へ出てきた子から焼く。リヴのポチャが、この勝負だけ味方に入る。"};
NR_SC.n02_3=[{w:null,t:"夕方。町の岸の氷の上で、首の赤く光る氷の子たちが、魚の箱をあさっていた。"},{w:"x",n:"町の人",t:"また来た！　ゆうべから、言うことを聞かない子が増えてるんだ。"},{w:null,t:"リヴが、ポチャを抱いたまま、一歩前に出た。"},{w:"hero",f:"normal",t:"手伝う。"},{w:"elly",f:"normal",t:"氷の子は、炎に弱いよ。でも、雪と氷の上では強い。"},{w:"alek",f:"normal",t:"フォルン、岸の上から撃て。氷の上に、相手を集めさせるな。"}];
NR_SC.n02_4w=[{w:null,t:"氷の子たちは、首を光らせたまま、海へ逃げていった。"},{w:"x",n:"町の人",t:"助かった。……リヴの友だちか？"},{w:null,t:"リヴは、少し考えてから、うなずいた。"},{w:null,t:"日が沈む。崖の上の氷河が、夕日で赤くなった。"}];
NR_SC.n02_4l=[{w:null,t:"氷の子たちは、魚の箱を一つかかえて、海へ戻っていった。"},{w:"x",n:"町の人",t:"……一箱で、すんだか。"},{w:null,t:"日が沈む。崖の上の氷河が、夕日で赤くなった。"}];
NR_SC.n02_5=[{w:null,t:"その時、町の上の氷河の方から、低い音が聞こえた。"},{w:null,t:"じゃら……、じゃら……。重い鎖を引きずるような音。"},{w:"partner",t:"……鎖。その下に、でかいのがいる。"},{w:null,t:"リヴの顔が、白い山の方を向いたまま、動かなくなった。"},{w:null,t:"ポチャが、リヴの腕の中で、小さく鳴いた。"},{w:null,t:"第2話　おわり"}];
NR_SC.n03_1=[{w:null,t:"第3話　止まった朝"},{w:null,t:"朝。フィヨルドの町の宿で、ヤマトは、フォルンの鼻息で目をさました。"},{w:"partner",t:"……鳥が、いない。"},{w:null,t:"窓の外。町の空を、いつも飛んでいる配達の鳥が、一羽もいない。"},{w:null,t:"ヤマトの端末の画面は、まっ黒だった。どこを押しても、つかない。"},{w:"hero",f:"surprised",t:"……電池？　昨日、満タンにしたのに。"},{w:null,t:"となりの部屋から、エリーの声がした。"}];
NR_SC.n03_2=[{w:"elly",f:"surprised",t:"ピリポン！　……ソヨモモ！　起きて！"},{w:null,t:"エリーのフードの中で、ピリポンが、目をあけたまま動かなかった。"},{w:null,t:"アレクの足もとのクロッコも、ユキマダラも、同じだった。"},{w:null,t:"ヤマトの枕もとのコグリフも、セイリュも、動かなかった。"},{w:"alek",f:"serious",t:"……首。光ってる。"},{w:null,t:"みんなの首のチップが、赤く、ゆっくり点滅していた。"},{w:null,t:"窓の下の通りでは、町の人の子たちが、道のまん中で止まっていた。"},{w:null,t:"宿の外で、父が、海の方を見て立ちつくしていた。"},{w:"ryo",t:"……風車が、全部、止まった。"}];
NR_SC.n03_3=[{w:null,t:"三人と父とリヴは、町の上の出張所へ走った。中も、まっ黒な画面ばかり。"},{w:null,t:"クロエ博士が、古い紙の地図を、机に広げていた。"},{w:"elena",t:"世界じゅうの研究所の子が、止まってる。……アークから、合図。"},{w:"elly",f:"sad",t:"……ギリシャの時と、同じ。でも、今度は全部。"},{w:null,t:"リヴが、止まったポチャを、だまって抱きしめていた。"},{w:null,t:"フォルンが、机の上に飛び乗った。しっぽの火が、ゆれている。"},{w:"elena",t:"……アークにのってない子には、合図が届かない。"},{w:"hero",f:"normal",t:"……前にも、それ、言われた。"},{w:null,t:"ヤマトは、自分の手のひらを、一度だけ見た。"}];
NR_DIR.n03_4={"k": "勝負", "t": "首の赤い大きな子たち・盤＝雪の坂道（出口は教会）・覚えること＝フォルン一体で逃げきる。倒しに行かない。止まった仲間の子を抱えた三人と父とリヴが、坂の下の教会まで逃げきれば勝ち。"};
NR_SC.n03_4=[{w:null,t:"出張所のガラスの外に、首の赤い大きな子たちが集まってきた。"},{w:null,t:"止まっているのではない。赤い目で、こっちを見ている。"},{w:"alek",f:"serious",t:"……止めるだけじゃない。動かしてる子もいる。"},{w:"elena",t:"ここは、もたない。下の石の教会へ。古い壁は厚いわ。"},{w:"hero",f:"serious",t:"フォルン、一人で行けるか。"},{w:"partner",t:"行く。おまえは、うしろから来い。"}];
NR_SC.n03_5w=[{w:null,t:"みんなとフォルンは、教会の重い扉の中へ、すべりこんだ。"},{w:null,t:"クロエ博士と父が、扉にかんぬきをかけた。外で、低いうなり声。"}];
NR_SC.n03_5l=[{w:null,t:"大きな子の爪が、フォルンの背中をかすめた。フォルンは、ふり返って、火を吐いた。"},{w:null,t:"大きな子がひるんだすきに、みんなは教会の扉へ転がりこんだ。"},{w:null,t:"クロエ博士と父が、扉にかんぬきをかけた。外で、低いうなり声。"}];
NR_SC.n03_6=[{w:null,t:"古い石の教会の中は、暗かった。窓から、うすい光だけ。"},{w:null,t:"エリーは、動かないピリポンとソヨモモを、ひざにのせていた。"},{w:null,t:"アレクは、ユキマダラの背中に、上着をかけた。"},{w:null,t:"ヤマトは、コグリフを、長いすに寝かせた。"},{w:null,t:"その足もとで、フォルンだけが、扉の方を見て、しっぽの火をゆらしていた。"},{w:null,t:"第3話　おわり"}];
NR_SC.n04_1=[{w:null,t:"第4話　古い子たち"},{w:null,t:"昼。教会の中に、町の人たちが、少しずつ逃げこんできた。年寄りが多い。"},{w:"x",n:"町のおばあさん",t:"若い子たちの子は、みんな止まっちまったよ。"},{w:null,t:"おばあさんのうしろから、ひげの白いラッコの子が、のそのそ歩いてきた。"},{w:"hero",f:"surprised",t:"……動いてる。"},{w:"x",n:"年寄りのラッコ",t:"動くさ。わしは、古いからな。"},{w:"elly",f:"surprised",t:"しゃべった……。"},{w:"x",n:"町のおばあさん",t:"古いチップでね。アークにつなぐ前の型。"},{w:"x",n:"年寄りのラッコ",t:"おかげで、あの変な合図も、聞こえん。"},{w:"alek",f:"normal",t:"……アークに、のってないのか。"},{w:null,t:"教会のすみで、太ったアザラシの子が、大きなあくびをした。"},{w:"x",n:"年寄りのアザラシ",t:"昼寝のじゃまだ。何の用だ。"},{w:"x",n:"町のおばあさん",t:"あれも、古い子。うちのとなりの、じいさんの子。"}];
NR_DIR.n04_2={"k": "勝負", "t": "ヴィクターの命令で生まれた子たち・盤＝教会の前の雪の広場（雪と石だたみ）・覚えること＝加勢＝町の古い子。フォルンと、年寄りのラッコ（水）・年寄りのアザラシ（氷）がいっしょに戦う。古い子はゆっくりだが硬い。前に古い子、うしろからフォルン。アザラシは氷の子。雪の上で強い。"};
NR_SC.n04_2=[{w:null,t:"夕方。教会の外の雪の上に、見たことのない子たちが並んだ。"},{w:null,t:"首が赤い。目も赤い。どの子も、同じ顔をしていた。"},{w:"elena",t:"……ヴィクターの命令で、研究所が生んだ子たち。"},{w:"elena",t:"止まった町を、取りに来た。"},{w:"ryo",t:"扉は、もたないぞ。"},{w:"x",n:"年寄りのラッコ",t:"……やれやれ。久しぶりに、運動するか。"},{w:"x",n:"年寄りのアザラシ",t:"昼寝の続きは、あとだな。"},{w:"hero",f:"serious",t:"フォルン。……おじいちゃんたちと、いっしょに。"},{w:"partner",t:"足をひっぱるなよ。"},{w:"x",n:"年寄りのラッコ",t:"こっちのせりふだ、子ぎつね。"}];
NR_SC.n04_3w=[{w:null,t:"赤い目の子たちは、一体ずつ、雪の向こうへ下がっていった。"},{w:"x",n:"年寄りのラッコ",t:"……こしが、いたい。"},{w:null,t:"夜。教会のストーブのまわりで、町の人たちが、スープを回して飲んだ。"}];
NR_SC.n04_3l=[{w:null,t:"押しこまれた時、年寄りのアザラシが、扉の前に寝ころがった。"},{w:"x",n:"年寄りのアザラシ",t:"……ここは、通さん。わしは、重い。"},{w:null,t:"赤い目の子たちは、重いアザラシを押せずに、雪の向こうへ下がっていった。"},{w:null,t:"夜。教会のストーブのまわりで、町の人たちが、スープを回して飲んだ。"}];
NR_SC.n04_4=[{w:null,t:"エリーが、止まったソヨモモを、ストーブの近くに寄せた。"},{w:"x",n:"年寄りのラッコ",t:"……その鳥、止まってるだけだ。死んじゃいない。"},{w:"elly",f:"sad",t:"……うん。"},{w:"x",n:"年寄りのラッコ",t:"昔も、似たようなことがあった。しばらくしたら、戻った。"},{w:"hero",f:"normal",t:"……昔って、いつ？"},{w:"x",n:"年寄りのラッコ",t:"忘れた。古いからな。"},{w:null,t:"その時、教会の外の、ずっと遠くの山の方から、長い声がひびいた。"},{w:null,t:"オオォーン……。狼の遠吠えだった。"},{w:null,t:"リヴが、立ち上がった。窓の外の山を見て、動かなかった。"},{w:null,t:"第4話　おわり"}];
NR_SC.n05_1=[{w:null,t:"第5話　鎖の狼"},{w:null,t:"朝。日の出はおそい。うす暗い雪の山道を、リヴが先に立って登っていく。"},{w:null,t:"ヤマトとフォルン、エリーとアレクが、そのうしろ。"},{w:null,t:"止まった子たちは、教会に置いてきた。"},{w:"elly",f:"sad",t:"……フードが、軽くて変な感じ。"},{w:"alek",f:"normal",t:"……おれもだ。"},{w:null,t:"リヴは、止まったポチャを、上着の中に入れて抱いていた。"},{w:"partner",t:"……鎖の音が、近い。"}];
NR_SC.n05_2=[{w:null,t:"氷河の割れ目に、青い洞があった。奥で、大きな影がうずくまっている。"},{w:null,t:"白と黒の毛の、大きな狼だった。首に、赤く光る輪。"},{w:null,t:"輪から、太い鎖が、氷の柱へのびていた。"},{w:"hero",f:"surprised",t:"……狼。"},{w:null,t:"狼が、牙をむいてうなった。洞の氷が、びりびりとふるえた。"},{w:"partner",t:"……古い子だ。でも、しばられてる。"},{w:null,t:"リヴが、一歩前に出た。狼は、うなるのをやめた。"},{w:null,t:"リヴは、狼の鼻先に、手のひらをそっと当てた。狼は、目を閉じた。"},{w:"elly",f:"surprised",t:"……知り合い？"},{w:null,t:"リヴは、うなずいた。"}];
NR_SC.n05_3=[{w:null,t:"リヴは、上着のポケットから、漁師の使う大きな鉄のはさみを出した。"},{w:"partner",t:"……燃やすか？"},{w:null,t:"リヴは、首を横にふった。そして、はさみを鎖にかけた。"},{w:null,t:"固い。リヴの腕がふるえる。ヤマトが、だまって、はさみの柄を一緒につかんだ。"},{w:null,t:"ばちん。鎖が切れた。首の赤い輪が、氷の上に落ちて、光が消えた。"},{w:null,t:"その時、リヴの上着の中で、ポチャが、ぴくりと前足を動かした。"},{w:"alek",f:"surprised",t:"……今、動いた。"},{w:null,t:"リヴは、ポチャを、ぎゅっと抱きしめた。"}];
NR_DIR.n05_4={"k": "勝負", "t": "鎖の見張り（首の赤い子たち）・盤＝氷河の洞（雪と氷と、古い石の床）・覚えること＝加勢＝フェンガロ。フェンガロ（氷・闇）が味方に入る。雪と氷の上で強く、古い石の床（遺跡）ではよけやすい。フェンガロを前に、フォルンはうしろから焼く。"};
NR_SC.n05_4=[{w:null,t:"洞の入口に、首の赤い子たちが並んだ。鎖の見張りだった。"},{w:null,t:"狼が、のそりと立ち上がった。リヴの前に、ヤマトとフォルンのとなりに出る。"},{w:"alek",f:"normal",t:"……手伝う気だ。"},{w:"hero",f:"serious",t:"フォルン。でかいのと、いっしょに。"},{w:"partner",t:"狼は、きらいじゃない。"}];
NR_SC.n05_5w=[{w:null,t:"見張りの子たちは、一体ずつ、雪の外へ逃げていった。"},{w:null,t:"狼は、リヴのとなりにすわった。リヴは、その首の毛に、顔をうめた。"}];
NR_SC.n05_5l=[{w:null,t:"押しこまれた時、狼が、洞じゅうにひびく声でほえた。"},{w:null,t:"見張りの子たちは、ちりぢりに逃げた。"},{w:null,t:"狼は、リヴのとなりにすわった。リヴは、その首の毛に、顔をうめた。"}];
NR_SC.n05_6=[{w:null,t:"昼。洞を出ると、町へ下りる道が、雪の山で埋まっていた。"},{w:"alek",f:"serious",t:"……雪くずれだ。さっきまで、なかった。"},{w:"elly",f:"surprised",t:"……わざと？"},{w:null,t:"雪の山の上に、赤い光の機械が一つ、ぽつんと残っていた。"},{w:"hero",f:"serious",t:"教会に、みんな残ってるのに。"},{w:null,t:"狼が、雪の山を見上げて、低くうなった。"},{w:null,t:"第5話　おわり"}];
NR_SC.n06_1=[{w:null,t:"第6話　石の教会"},{w:null,t:"夕方。狼が、雪の尾根の上を先に歩いた。ふさがれた道を、大きく回る。"},{w:null,t:"日は、もう沈みかけていた。冬のはじめの北は、夕方が短い。"},{w:"hero",f:"normal",t:"……こっちで、合ってるの？"},{w:null,t:"リヴが、うなずいた。狼も、ふり返らずに進んだ。"},{w:null,t:"尾根の下に、教会の屋根が見えた。窓から、ろうそくの明かり。"}];
NR_SC.n06_2=[{w:null,t:"教会の扉をたたくと、父とクロエ博士が、かんぬきをはずした。"},{w:"ryo",t:"……無事か。道がふさがったって、町の人が。"},{w:"hero",f:"normal",t:"狼が、別の道を知ってた。"},{w:null,t:"狼は、扉の外の雪の上に、どすんと寝そべった。中には入らなかった。"},{w:"elena",t:"……古代テリオン。こんな所に。"},{w:null,t:"リヴの上着の中で、ポチャが、もぞもぞと動いた。"},{w:null,t:"顔を出して、「ポチャ」と小さく鳴いた。"},{w:"elly",f:"smile",t:"……鳴いた！"},{w:null,t:"リヴは、何も言わずに、ポチャの頭をなでた。"},{w:null,t:"年寄りのラッコが、それを見て、ひげを動かした。"},{w:"x",n:"年寄りのラッコ",t:"……狼のそばは、なんだか、楽だな。"}];
NR_DIR.n06_3={"k": "勝負", "t": "赤い目の子たち・盤＝教会と雪の広場（入口が三つ）・覚えること＝守る盤。三つの入口のどれかに相手が入ったら負け。フォルンと、リヴのポチャ（氷）と、年寄りの古い子で、入口を分けて守る。ポチャは氷の子。雪の上で強い。外の狼は、扉の前だけを守る。"};
NR_SC.n06_3=[{w:null,t:"夜。教会の外の雪の広場に、赤い目の子たちが、ゆうべより多く集まってきた。"},{w:"x",n:"町のおばあさん",t:"また来たよ。今夜は、数が多い。"},{w:"alek",f:"normal",t:"扉と窓。三つの入口を守る。全部は、間に合わない。"},{w:null,t:"リヴが、ポチャを床に下ろした。ポチャは、ゆっくり、扉の方へはっていった。"},{w:"elly",f:"surprised",t:"ポチャ、戦うの？"},{w:null,t:"リヴは、うなずいた。"}];
NR_SC.n06_4w=[{w:null,t:"赤い目の子たちは、一体ずつ、雪の向こうの暗やみへ下がっていった。"},{w:null,t:"ポチャが、フォルンのとなりで、ふうっと息をはいた。"},{w:null,t:"教会の中で、町の人たちが、やっと肩の力をぬいた。"}];
NR_SC.n06_4l=[{w:null,t:"窓から、赤い目の子が一体、教会の中へ飛びこんできた。"},{w:null,t:"年寄りのアザラシが、その上に、どすんと乗った。"},{w:"x",n:"年寄りのアザラシ",t:"……昼寝のじゃまだと、言っただろう。"},{w:null,t:"教会の中で、町の人たちが、やっと肩の力をぬいた。"}];
NR_SC.n06_5=[{w:null,t:"夜ふけ。教会の上を、ブーンと小さな機械が一つ、ゆっくり飛んでいった。"},{w:null,t:"機械から、男の声がした。落ちついた、ていねいな声だった。"},{w:"x",n:"ボットの声",t:"北の町、見回り完了。計画どおりです。問題ありません。"},{w:null,t:"機械は、雪の広場の、倒れた赤い目の子たちの上を、見ないように飛んでいった。"},{w:"alek",f:"normal",t:"……問題、あるだろ。"},{w:"elena",t:"ボット。……アークの中心の、計画係よ。"},{w:null,t:"第6話　おわり"}];
NR_SC.n07_1=[{w:null,t:"第7話　図面"},{w:null,t:"朝。まだ暗い。教会の扉の外で、狼が低くうなった。"},{w:"ryo",t:"……だれか来た。"},{w:null,t:"扉を開けると、雪の中に、レンが立っていた。服は破れ、頬に血がにじんでいる。"},{w:null,t:"腕の中に、止まったカブトムシの子を抱いていた。"},{w:"hero",f:"surprised",t:"……レン！"},{w:"dimi",t:"……入れろ。寒い。"},{w:null,t:"クロエ博士が、だまってレンの腕をとって、ストーブの前にすわらせた。"}];
NR_SC.n07_2=[{w:"elena",t:"どこから来たの。"},{w:"dimi",t:"研究所の近く。……合図が来た時、外にいた。"},{w:"elly",f:"sad",t:"カブトムシの子、止まってる。"},{w:"dimi",t:"分かってる。"},{w:null,t:"レンは、上着の内側から、古い端末を出した。画面は消えている。"},{w:"dimi",t:"父さんの端末だ。アークの研究所の、父さんの机にあった。"},{w:"alek",f:"normal",t:"……取ってきたのか。"},{w:"dimi",t:"中に、鍵が入ってる。アークの裏口の鍵。父さんが作った。"},{w:"elena",t:"裏口……？"},{w:"dimi",t:"人の手で、アークを止めるための入口だ。"},{w:"dimi",t:"でも、ここにあるのは、前の半分だけだ。"},{w:"alek",f:"normal",t:"……後ろの半分は？"},{w:"dimi",t:"……後半が、分からない。"},{w:null,t:"レンは、それきり、ストーブの火を見ていた。ヤマトは、何も聞かなかった。"}];
NR_DIR.n07_3={"k": "謎", "t": "図面の謎・研究所の図面から、裏口の入口をさがす・覚えること＝図面を読む。階ごとの紙を重ねると、どの階にもつながっていない部屋が一つある。"};
NR_SC.n07_3a=[{w:"elena",t:"裏口があるなら、図面に入口があるはず。"},{w:null,t:"クロエ博士は、かばんから、古い紙の束を出した。研究所を建てた時の、紙の図面。"},{w:null,t:"教会の長い机に、図面を広げる。紙の端が、くるりと丸まった。"},{w:null,t:"アレクが、だまって、反対の端を手で押さえた。"},{w:null,t:"クロエ博士は、何も言わずに、図面の上に、ろうそくを近づけた。"},{w:"elly",f:"normal",t:"……二人で、見てる。"},{w:"hero",f:"normal",t:"しっ。"}];
NR_SC.n07_3b=[{w:"alek",f:"normal",t:"……この部屋、どの廊下にもつながってない。"},{w:"elena",t:"地下の、いちばん下。……壁の厚さが、ほかとちがう。"},{w:"alek",f:"normal",t:"壁じゃない。……扉だ。"},{w:null,t:"二人は、同じ所を、同じ時に指さした。それから、すぐに手を引っこめた。"}];
NR_SC.n07_4=[{w:null,t:"クロエ博士が、いちばん下の紙をめくった。"},{w:null,t:"その下に、もう一枚、黄ばんだ古い紙がはさまっていた。研究所より、ずっと古い。"},{w:null,t:"石の柱。丸い広間。階段。そのまん中に、大きな角を持つ影の絵。"},{w:null,t:"リヴが、絵の影を、指でそっとなぞった。"},{w:"elena",t:"……神殿の入口。研究所の、真下。"},{w:"dimi",t:"……裏口の扉の、すぐ横だ。"},{w:null,t:"第7話　おわり"}];
NR_SC.n08_1=[{w:null,t:"第8話　町の外"},{w:null,t:"昼。図面の部屋へ行くには、町の外の峠道を通る。"},{w:"ryo",t:"見てくるだけだ。日が落ちる前に戻れ。"},{w:"dimi",t:"おれも行く。"},{w:"elly",f:"normal",t:"カブトムシの子、止まってるのに？"},{w:"dimi",t:"口は止まってない。"},{w:"hero",f:"smile",t:"……それは、そう。"},{w:null,t:"ヤマト、エリー、アレク、レン。リヴとフォルンも、ついてきた。"}];
NR_SC.n08_2=[{w:null,t:"峠の手前。雪の中に、黒い服の二人が立っていた。"},{w:null,t:"ログとパッチ。肩にも頭にも、雪が積もっている。"},{w:"elly",f:"surprised",t:"……あれ、動いてない？"},{w:"alek",f:"normal",t:"ヴィクターの連中だ。近づくな。"},{w:null,t:"ヤマトが、雪玉を一つ、ログの足もとに投げた。ログは、目だけ動かした。"},{w:"log",t:"……何の用だ。"},{w:"hero",f:"normal",t:"なんで、そこに立ってるの。"},{w:"patch",t:"次の命令を待ってる。"},{w:"elly",f:"normal",t:"いつから？"},{w:"patch",t:"……きのうの朝から。"},{w:"dimi",t:"ばかだろ。"},{w:"log",t:"うるせえ。"}];
NR_SC.n08_3=[{w:null,t:"峠の上から、白い服の二人が下りてきた。一人は、分厚い紙の束をかかえている。"},{w:"yuki",t:"止まれ。ここから先は、計画の区域です。"},{w:"haru",t:"さむい……。ユキ、帰ろう……。"},{w:"yuki",t:"だめ。計画書どおり、ここを守る。"},{w:"haru",t:"それ、計画書の何ページ？"},{w:"yuki",t:"四十二ページ。……今、それ聞く？"},{w:"hero",f:"normal",t:"……通りたいだけなんだけど。"},{w:"yuki",t:"通すかどうかは、勝負で決めます。"},{w:"haru",t:"勝負って、何ページ？"},{w:"yuki",t:"……自分で読んで。"}];
NR_DIR.n08_4={"k": "勝負", "t": "ユキ＆ハル（ヴィクター）・二対二・覚えること＝相手の決まった手を読む（計画書どおりに動く相手は、次の手が決まっている）。"};
NR_SC.n08_4a=[{w:null,t:"ヤマトはフォルンを出した。リヴは、だまってポチャを雪の上に下ろした。"},{w:null,t:"レンは、盤の外にしゃがんで、ユキの紙の束をじっと見ていた。"},{w:"dimi",t:"あいつ、さっきから、紙をめくってから動く。"},{w:"dimi",t:"次は、右から来る。……フォルン、左に寄せろ。"},{w:"hero",f:"surprised",t:"なんで分かるの。"},{w:"dimi",t:"四十三ページ。表紙に、矢印が書いてある。"},{w:"yuki",t:"見ないで！"}];
NR_SC.n08_4w=[{w:"yuki",t:"……計画書に、この手はなかった。"},{w:"haru",t:"じゃあ、帰るのは何ページ？"},{w:"yuki",t:"……書いてない。帰る。"},{w:null,t:"ユキとハルは、紙の束をかかえて、峠の上へもどっていった。"}];
NR_SC.n08_4l=[{w:"yuki",t:"……計画どおりです。次の見回りは、夕方。"},{w:"haru",t:"じゃあ、それまで帰ろう。さむい。"},{w:null,t:"二人が引き上げたあと、ヤマトたちは、もう一度、峠の手前まで来た。"},{w:"dimi",t:"次は、めくる前に動け。"},{w:null,t:"ユキとハルは、紙の束をかかえて、峠の上へもどっていった。"}];
NR_SC.n08_5=[{w:null,t:"峠道が、あいた。ログとパッチは、まだ雪の中に立っていた。"},{w:"elly",f:"normal",t:"……行かないの？"},{w:"patch",t:"命令がない。"},{w:"alek",f:"normal",t:"研究所に、聞けばいい。"},{w:null,t:"ログは、耳の通信機を、指で二度たたいた。返事は来ない。"},{w:null,t:"もう一度たたいた。雪が、肩から落ちた。"},{w:"log",t:"……上が、何も言わねえ。"},{w:null,t:"第8話　おわり"}];
NR_SC.n09_1=[{w:null,t:"第9話　鐘の下"},{w:null,t:"夕方。峠から戻ると、教会の上に、見回りの機械が三つ飛んでいた。"},{w:"ryo",t:"ゆうべは一つだった。"},{w:"alek",f:"normal",t:"……今夜、来る。全部。"},{w:null,t:"町の人たちが、長いすを窓の前に積んだ。年寄りのアザラシが、その上で丸くなった。"},{w:"x",n:"町のおばあさん",t:"そこで寝るんじゃないよ。"},{w:"x",n:"年寄りのアザラシ",t:"守ってる。"},{w:null,t:"ヤマトは、長いすのはしに、止まったままのコグリフを寝かせた。"}];
NR_DIR.n09_2={"k": "勝負", "t": "赤い目の子たち（一戦目）・盤＝教会と雪の広場（入口が三つ）・覚えること＝守る盤・連戦。相手は、扉→窓→裏口の決まった順で来る。フォルンとポチャと町の古い子で、次に来る入口に先に立つ。フェンガロは扉の前だけ守る。"};
NR_SC.n09_2a=[{w:null,t:"夜。広場の向こうの暗やみに、赤い目が、数えきれないほど並んだ。"},{w:"x",n:"ボットの声",t:"北の町、制圧を始めます。三つの入口へ、順に。計画どおりです。"},{w:"dimi",t:"順に、だって。……教えてくれてる。"},{w:"alek",f:"normal",t:"扉、窓、裏口の順だ。ユキと同じ。決まった順で来る。"}];
NR_SC.n09_2w=[{w:null,t:"赤い目の子たちは、広場のまん中まで下がった。"},{w:"x",n:"ボットの声",t:"……第二波。計画どおりです。問題ありません。"},{w:null,t:"前より多い赤い目が、もう一度、広場の端に並んだ。"}];
NR_SC.n09_2l=[{w:null,t:"裏口の戸が破られた。赤い目の子が一体、中へ入ってきた。"},{w:null,t:"年寄りのラッコが、ほうきで、外へはき出した。"},{w:"x",n:"年寄りのラッコ",t:"……戸を閉めろ。寒い。"},{w:"x",n:"ボットの声",t:"……第二波。計画どおりです。問題ありません。"},{w:null,t:"前より多い赤い目が、もう一度、広場の端に並んだ。"}];
NR_SC.n09_3=[{w:null,t:"扉が、外から押された。かんぬきが、ぎしっと鳴った。"},{w:null,t:"扉の前のフェンガロが、立ち上がった。教会の中へ、のっそり入ってくる。"},{w:"elly",f:"surprised",t:"入ってきた！"},{w:null,t:"フェンガロは、長いすのはしに、ふせた。コグリフのすぐとなり。"},{w:null,t:"低く、長く、うなった。床の石が、少しふるえた。"},{w:null,t:"長いすの上で、コグリフの羽が、ぴくっと動いた。"},{w:"hero",f:"surprised",t:"……コグリフ？"},{w:null,t:"コグリフが、首を上げた。くちばしから、白い霧が、ふっと出た。"},{w:null,t:"霧は、床をはって、窓のすきまから、外の広場へ流れていった。"},{w:null,t:"ヤマトは、コグリフの首を、両手でつかんだ。何も言わなかった。"},{w:"partner",t:"……起きるの、おそい。"}];
NR_SC.n09_4=[{w:null,t:"広場が、白い霧でうまった。赤い目の子たちは、その場で止まった。"},{w:"x",n:"ボットの声",t:"……想定外の霧。……いえ。計画どおりです。"},{w:null,t:"赤い目の子たちは、霧の中で、立ったまま動かなかった。"},{w:"dimi",t:"止まってる。……次の指示を、待ってるんだ。"},{w:"elly",f:"normal",t:"……ログと、同じだ。"},{w:null,t:"霧の左の端だけ、赤い目がいなかった。そこだけ、だれも立っていない。"},{w:"hero",f:"normal",t:"左が、あいてる。……出る。"},{w:"ryo",t:"ヤマト！"},{w:"hero",f:"normal",t:"すぐ戻る！"}];
NR_DIR.n09_5={"k": "勝負", "t": "赤い目の子たち（二戦目）・盤＝霧の広場・覚えること＝加勢＝コグリフ。コグリフの霧の中では、相手は見えずに止まる。霧のあいた左から入り、まとめ役の大きい子を先に倒す。手持ちはフォルン・ポチャ・コグリフ。"};
NR_SC.n09_5w=[{w:null,t:"まとめ役の大きい子が倒れた。赤い目の子たちは、ばらばらに雪の中へ散っていった。"},{w:"x",n:"ボットの声",t:"北の町。……計画どおりです。……問題、ありません。"},{w:null,t:"見回りの機械は、教会の上を一度回って、北の空へ帰っていった。"}];
NR_SC.n09_5l=[{w:null,t:"ヤマトは押し戻された。コグリフが霧をもう一度吹いて、教会まで帰る道を作った。"},{w:"ryo",t:"……すぐ戻る、じゃなかったのか。"},{w:"hero",f:"normal",t:"戻ったよ。"},{w:"x",n:"ボットの声",t:"北の町。……計画どおりです。……問題、ありません。"},{w:null,t:"見回りの機械は、教会の上を一度回って、北の空へ帰っていった。"}];
NR_SC.n09_6=[{w:null,t:"夜ふけ。鐘の塔のロープが、戦いの間にちぎれて、鐘が少しかたむいていた。"},{w:"ryo",t:"落ちる前に、下ろしておく。"},{w:null,t:"ヤマトと父が、鐘の塔のせまい階段を上った。"},{w:null,t:"鐘の下の床に、木のふたがあった。ほこりが、指の厚さほど積もっている。"},{w:null,t:"ふたを開けると、黒い、古い電話が一つ。ダイヤルの、丸い電話だった。"},{w:"hero",f:"normal",t:"……これ、電話？"},{w:"ryo",t:"アークより、ずっと前のだ。"},{w:null,t:"コグリフが、ヤマトの肩の上から、電話をのぞきこんだ。"},{w:null,t:"第9話　おわり"}];
NR_SC.n10_1=[{w:null,t:"第10話　古い電話"},{w:null,t:"昼。鐘の塔から、黒い電話を下ろして、教会の机に置いた。"},{w:null,t:"受話器を耳に当てる。何の音もしない。"},{w:"x",n:"町のおばあさん",t:"それは、昔の電話局の線だよ。町の外れの。"},{w:"ryo",t:"まだ、局はあるんですか。"},{w:"x",n:"町のおばあさん",t:"建物はね。もう、だれもいない。"},{w:"alek",f:"normal",t:"アークより前の線なら、合図は来ない。"},{w:null,t:"電話の後ろから、細い黒い線が、壁の穴を通って外へ出ていた。"}];
NR_DIR.n10_2={"k": "謎", "t": "電話をつなぐ謎・交換台で、教会の線を、町の外の長い線へつなぐ・覚えること＝線を目でたどる。板の上の札と、外の柱に打たれた番号を見比べて、正しい穴にコードをさす。"};
NR_SC.n10_2a=[{w:null,t:"ヤマトたちは、雪に半分うまった線をたどって、町の外れまで歩いた。"},{w:null,t:"小さな石の建物。中に、穴のたくさんあいた、大きな板が立っていた。"},{w:"elly",f:"surprised",t:"穴だらけ。"},{w:"ryo",t:"交換台だ。昔は、人がここで線をつないでた。"},{w:null,t:"板の前に、先に金具のついたコードが、何十本もぶら下がっている。"}];
NR_SC.n10_2b=[{w:"dimi",t:"教会は、十二番。……外へ出る線は、こっち。"},{w:"hero",f:"normal",t:"なんで分かるの。"},{w:"dimi",t:"柱に書いてあった。来る時、見てないのか。"},{w:"hero",f:"normal",t:"……見てない。"},{w:null,t:"コードを、カチッと穴にさした。板の上の小さなランプが、一つだけ、ともった。"}];
NR_SC.n10_3=[{w:null,t:"教会に戻ると、受話器から、ツーという音がしていた。"},{w:"ryo",t:"……つながった。",ph:1},{w:"elly",f:"normal",t:"だれに、かけるの？"},{w:null,t:"ヤマトは、少し考えてから、ダイヤルを回した。東京の、じいちゃんの家。"},{w:null,t:"ダイヤルがもどるのを、一つずつ待つ。長い。"},{w:"hero",f:"normal",t:"……これ、毎回こんなに待つの？"},{w:"ryo",t:"待つ。",ph:1},{w:null,t:"呼び出しの音が、四回鳴った。"},{w:"genichi",t:"……はい。",ph:1},{w:"hero",f:"surprised",t:"じいちゃん！"},{w:"genichi",t:"ヤマトか。……どこからだ。この番号は。",ph:1},{w:"hero",f:"normal",t:"北の、教会の、古い電話。"},{w:"genichi",t:"……そうか。まだ、残っとったか。",ph:1}];
NR_SC.n10_4=[{w:null,t:"ヤマトは、止まった子たちのことを話した。じいちゃんは、だまって聞いていた。"},{w:"genichi",t:"嬢ちゃんは、そこにおるか。",ph:1},{w:"elly",f:"normal",t:"います。"},{w:"genichi",t:"あの歌を、四つの所で、同じ時に歌え。",ph:1},{w:"elly",f:"surprised",t:"……四つ？"},{w:"genichi",t:"北と、エジプトと、中国と、日本だ。",ph:1},{w:"alek",f:"normal",t:"なんで、歌なんですか。"},{w:"genichi",t:"わけは、あとで言う。",ph:1},{w:"hero",f:"normal",t:"じいちゃん、いつもそれ。"},{w:"genichi",t:"昔の仲間に、古い電話を持っとるのがおる。そっちへ回す。",ph:1},{w:"genichi",t:"一度切る。夜に、もう一度かけろ。",ph:1},{w:null,t:"電話は、そこで切れた。"},{w:"hero",f:"normal",t:"……切られた。"},{w:"dimi",t:"……おまえの家、みんな勝手に切るのか。"}];
NR_SC.n10_5=[{w:null,t:"夕方。父が、町の地図の上に、時計を置いた。"},{w:"ryo",t:"夜は、研究所への電気が増える。夜明けが、いちばん少ない。"},{w:"elena",t:"合図も、夜明けがいちばん弱いはず。"},{w:"alek",f:"normal",t:"なら、歌うのは、ここの夜明けだ。"},{w:"elly",f:"normal",t:"エジプトは？"},{w:"ryo",t:"朝だ。中国は夕方。東京は夜。"},{w:"hero",f:"normal",t:"ばらばらじゃん。"},{w:"dimi",t:"時差だ。学校でやったろ。"},{w:"hero",f:"normal",t:"……画面の学校、寝てた。"}];
NR_SC.n10_6=[{w:null,t:"夜。ヤマトは、もう一度、じいちゃんの家にかけた。"},{w:"genichi",t:"記録庫のじいさんに頼んだ。ハオの所まで走る。"},{w:"hero",f:"surprised",t:"あの、鍵が気まぐれな人？"},{w:"genichi",t:"あいつの足は、気まぐれじゃない。"},{w:"genichi",t:"アスワンの船乗りにも頼んだ。あの子の所へ、船で行く。"},{w:"elly",f:"normal",t:"ナディア。"},{w:"genichi",t:"あした、そっちの夜明けだ。二人とも、その時に電話の前におる。"},{w:"hero",f:"normal",t:"日本は？"},{w:"genichi",t:"……日本は、わしがやる。"},{w:null,t:"受話器の向こうで、ぱたぱたと、小さな足音がした。"},{w:"hana",t:"じいちゃん、だれ？　……にいに？"},{w:null,t:"第10話　おわり"}];
NR_SC.n11_1=[{w:null,t:"第11話　同じ時刻"},{w:null,t:"夜明け前。教会の机の上に、黒い電話。受話器の横に、父の時計。"},{w:null,t:"受話器の向こうは、ざらざらした音。遠くの線が、何本もつながっている。"},{w:"nadia",t:"……聞こえる？　こっち、朝。もう明るい。"},{w:"elly",f:"smile",t:"ナディア！"},{w:"hao",t:"こっちは夕方だ。……夕飯、まだなんだけど。"},{w:"hero",f:"normal",t:"ハオ、今それ言う？"},{w:"hao",t:"記録庫のじいさんが、まんじゅうくれない。"},{w:"x",n:"老人",t:"歌ったら、やる。"},{w:"genichi",t:"……そろったか。"},{w:"hero",f:"normal",t:"じいちゃん。ハナは？"},{w:"genichi",t:"起こした。ねむいと言っとる。"},{w:"hana",t:"……ねむい。"},{w:"ryo",t:"あと一分。"}];
NR_SC.n11_2=[{w:null,t:"父が、時計の針を指でたたいた。"},{w:null,t:"エリーが、息を吸った。"},{w:"elly",f:"normal",t:"……ほー、ほー。"},{w:null,t:"受話器の向こうで、ナディアの声が重なった。少しおくれて、ハオの声。"},{w:null,t:"リヴは、口を閉じたまま、のどの奥で節だけをなぞった。"},{w:null,t:"――ギザの台地の上。朝の光の中で、ナディアが受話器を持って歌う。"},{w:null,t:"そのうしろで、王ラーガが、ゆっくり首を上げた。"},{w:null,t:"――古い祠の前。夕焼けの中で、ハオが歌う。記録庫の老人が、受話器を持っている。"},{w:null,t:"祠の奥で、ボルケンが、目をあけた。"},{w:null,t:"――東京。夜の台所。じいちゃんが、受話器をハナの口もとへ寄せた。"},{w:"hana",t:"ほー、ほー。",ph:1},{w:null,t:"小さな声が、線を通って、北の教会まで届いた。"},{w:null,t:"ヤマトは、受話器から、顔を上げなかった。"},{w:null,t:"東京の窓の外は、暗いままだった。何も来なかった。"},{w:null,t:"ハナは、もう一回だけ歌って、じいちゃんのひざで、目を閉じた。"}];
NR_SC.n11_3=[{w:null,t:"歌が終わった。教会の中は、だれも動かなかった。"},{w:null,t:"扉の外で、フェンガロが立ち上がった。空に向かって、長く吠えた。"},{w:null,t:"南の空から、大きな影が来た。王ラーガ。"},{w:null,t:"東の空から、白い影。ボルケンが、雲の上を走ってくる。"},{w:null,t:"赤い光が一つ、低く飛んできて、教会の上で、輪を一度描いた。"},{w:"dimi",t:"……フェニク。"},{w:null,t:"朱雀は、レンの真上を一回りして、ほかの影のうしろについた。"},{w:null,t:"――世界中の町で、消えた画面の前から、子どもたちが顔を上げた。"},{w:null,t:"子どもたちは、上着もはおらずに、外へ走り出た。"}];
NR_SC.n11_4=[{w:null,t:"教会の長いすの上で、止まっていた子たちが並んでいる。"},{w:null,t:"いちばんはしのソヨモモが、しっぽを一回、ふるわせた。"},{w:"elly",f:"surprised",t:"……ソヨモモ。"},{w:null,t:"ソヨモモは、ふわっと跳んで、エリーの肩にのった。いつもの場所。"},{w:null,t:"フードの中で、ピリポンが、ぱちっと火花を出した。"},{w:"elly",f:"smile",t:"いたっ。……あいさつの、つもり？"},{w:null,t:"アレクの腕の中で、ユキマダラが、片目だけ開けた。くしゃみを一つした。"},{w:"alek",f:"normal",t:"……おれのせいじゃない。"},{w:null,t:"アレクの足もとで、クロッコが、しっぽで床をばたんとたたいた。"},{w:null,t:"セイリュとアルマガネが、毛布の下から、のそのそはい出してきた。"},{w:null,t:"コグリフが、ヤマトの肩にとまって、耳をつついた。"},{w:"hero",f:"normal",t:"いたい。"},{w:null,t:"最後に、レンの腕の中で、カブトムシの子の角が、ゆっくり持ち上がった。"},{w:null,t:"レンは、何も言わずに、角の先を指で押した。押し返された。"}];
NR_DIR.n11_5={"k": "勝負", "t": "赤い目の子たちと見回りの機械・盤＝夜明けの広場・覚えること＝加勢＝戻った仲間と古代。手持ちが全員戻る。古代は戦わないが、そばにいるマスでは、相手の赤い目がうすくなって動きがにぶる。"};
NR_SC.n11_5a=[{w:null,t:"広場の向こうに、赤い目の子たちが並んでいた。見回りの機械が三つ。"},{w:"x",n:"ボットの声",t:"北の町。……計画どおりです。制圧を、続けます。"},{w:null,t:"けれど、赤い目の光が、一つ、また一つと、うすくなっていく。"},{w:"elena",t:"……合図が、弱い。古代のそばだから。"},{w:"alek",f:"normal",t:"今なら、全部で出られる。"},{w:"hero",f:"normal",t:"……みんな、行くよ。"}];
NR_SC.n11_5w=[{w:null,t:"見回りの機械が、一つずつ、雪の上に落ちた。"},{w:null,t:"赤い目の消えた子たちが、雪の中に座りこんで、あたりを見回していた。"},{w:"x",n:"ボットの声",t:"……計画、どおり……。"},{w:null,t:"声は、そこでとぎれた。"}];
NR_SC.n11_5l=[{w:null,t:"見回りの機械が、上から光を落とした。ヤマトたちは、教会の扉まで下がった。"},{w:null,t:"フェンガロが一度吠えると、機械は、高く上がって止まった。"},{w:"x",n:"ボットの声",t:"……計画、どおり……。"},{w:null,t:"声は、そこでとぎれた。"}];
NR_SC.n11_6=[{w:null,t:"日がのぼった。北の空を、ヤマトたちは見上げた。"},{w:null,t:"ラーガ。ボルケン。フェニク。フェンガロ。北の山から上がってきた影たち。"},{w:null,t:"空が、古代テリオンで埋まっていた。"},{w:null,t:"受話器から、ハオの声がした。"},{w:"hao",t:"……そっち、どうなった？"},{w:"hero",f:"normal",t:"……空が、いっぱい。"},{w:null,t:"第11話　おわり"}];
NR_SC.n12_1=[{w:null,t:"第12話　四つの一行"},{w:null,t:"昼。北の空には、まだ古代テリオンたちが、ゆっくり輪を描いていた。"},{w:null,t:"教会の中は、戻った子たちで、うるさかった。"},{w:null,t:"ソヨモモがクロッコの頭にとまり、クロッコが、しっぽで払いのけた。"},{w:"alek",f:"normal",t:"……そこは、席じゃない。"},{w:null,t:"机の上の黒い電話は、つないだままだった。"},{w:"nadia",t:"……そっち、まだ空にいる？"},{w:"elly",f:"smile",t:"いる。ラーガも。"},{w:"nadia",t:"うちのは、ひとこともなく行った。"},{w:"hao",t:"うちのもだ。まんじゅうも、もらえなかった。"},{w:"x",n:"老人",t:"歌は、とちゅうでおわった。"}];
NR_SC.n12_2=[{w:"elly",f:"normal",t:"ねえ。歌のうしろの一行。みんなのも、ちがうよね。"},{w:"nadia",t:"うちのは、もう言ったよ。"},{w:"elly",f:"normal",t:"ハオのは？"},{w:"hao",t:"……おれのとこのは、師匠も知らん。"},{w:"hao",t:"でも、口伝の古い言葉なら、たぶん……「地の下で鳴れ」。"},{w:"elly",f:"normal",t:"うちのは、「眠る者よ」。"},{w:"nadia",t:"「おまえの音のある所で」。"},{w:null,t:"みんなが、リヴを見た。"},{w:null,t:"リヴは、窓の前に立った。ガラスが、白い霜でくもっている。"},{w:null,t:"リヴは、指で、霜の上に、短い字を書いた。町のふつうの字だった。"},{w:"hero",f:"normal",t:"……読めない。こっちの字。"},{w:"elena",t:"……「子らは生きる」、って書いてある。"},{w:null,t:"リヴは、指先の霜を、上着でふいた。"}];
NR_DIR.n12_3={"k": "謎", "t": "四つの一行を並べる謎・四つの一行を、呼びかけ「ほー、ほー」のうしろに並べる・覚えること＝言葉のつながりを読む。前の一行が、次の一行を呼ぶ順になる（だれに→何を→どこで→どうなる）。"};
NR_SC.n12_3a=[{w:null,t:"エリーは、図面の裏に、四つの一行を書いた。"}];
NR_SC.n12_3b=[{w:"elly",f:"normal",t:"……これ、たぶん、こう。"},{w:null,t:"エリーは、紙を、机のまん中に置いた。"},{w:null,t:"ほー、ほー。"},{w:null,t:"眠る者よ。"},{w:null,t:"地の下で鳴れ。"},{w:null,t:"おまえの音のある所で。"},{w:null,t:"子らは生きる。"},{w:null,t:"エリーは、一度だけ、声に出して読んだ。"},{w:null,t:"受話器の向こうも、教会の中も、しばらく、何も言わなかった。"},{w:"hao",t:"……師匠に、教えてくる。"},{w:"nadia",t:"おばあちゃんにも。"}];
NR_SC.n12_4=[{w:null,t:"フォルンが、机からおりて、石の床に、片耳をぺたりとつけた。"},{w:"hero",f:"normal",t:"フォルン。何してんの。"},{w:"partner",t:"……鳴ってる。下で。ずっと。"},{w:"hero",f:"normal",t:"……ギリシャでも、それ、やってた。地面に耳。"},{w:"hao",t:"セイリュも、腹を地面につけて寝る。どこでも。"},{w:null,t:"ポチャが、リヴの足もとで、おなかを床にぺたりとつけた。"},{w:null,t:"コグリフが、羽をたたんで、胸を床におろした。"},{w:null,t:"ソヨモモが、エリーの肩からおりて、床の上で丸くなった。"},{w:null,t:"ユキマダラは、少しまよってから、アレクの靴の横に、おなかをつけた。"},{w:null,t:"カブトムシの子も、セイリュも、アルマガネも。教会の床が、子たちでうまった。"},{w:null,t:"さっきまでのさわぎが、うそのように、だれも動かなかった。"},{w:"hero",f:"normal",t:"なんで、そんな音がするの。"},{w:"partner",t:"……下に、だれか寝てる。"}];
NR_SC.n12_5=[{w:"elly",f:"normal",t:"……迷路の壁。小さい手のあと、いっぱいあった。"},{w:"elly",f:"normal",t:"あれ、子どもの手だった。大きいひづめのとなり。"},{w:"hero",f:"normal",t:"……昔の子、あいつらと、いっしょに住んでたんだ。"},{w:"hero",f:"normal",t:"じゃあ、古代テリオンって、ずっと下で寝てるの？"},{w:"partner",t:"前から。……人より、前から。"},{w:"hero",f:"normal",t:"……じいちゃん、聞いてる？"},{w:"genichi",t:"聞いとる。"},{w:null,t:"受話器の向こうで、じいちゃんが、せきばらいを一つした。それだけだった。"}];
NR_SC.n12_6=[{w:null,t:"クロエ博士は、かばんから、古い小さな機械を出した。父の代からの録音機。"},{w:null,t:"石の床に置いて、録音のつまみを回した。耳には、何も聞こえない。"},{w:null,t:"しばらくして、録ったものを、速くして流した。"},{w:null,t:"低い、うなるような音が、教会の中に広がった。"},{w:null,t:"クロエ博士は、もう一つ、古い記録を流した。同じ形の音だった。"},{w:"alek",f:"normal",t:"……母さん？"},{w:"elena",t:"……父の記録の録音と、同じ。"},{w:null,t:"第12話　おわり"}];
NR_SC.n13_1=[{w:null,t:"第13話　氷原"},{w:null,t:"朝。教会の机に、研究所の図面と、その下の古い紙を並べた。"},{w:"dimi",t:"スペクターは、エジプトから北へ来てる。王を、取りに。"},{w:"alek",f:"normal",t:"なら、先に神殿だ。"},{w:"elena",t:"扉は、わたしが開けられる。……消されてなければ。"},{w:"ryo",t:"おれは町に残る。教会の電話の番だ。"},{w:"hero",f:"normal",t:"……父さん、電話、できる？"},{w:"ryo",t:"ダイヤルくらい回せる。"},{w:"hero",f:"normal",t:"待つの、長いよ。"},{w:"ryo",t:"待つのは、なれてる。"},{w:null,t:"父は、ヤマトの帽子を、深くかぶせなおした。"}];
NR_SC.n13_2=[{w:null,t:"町を出ると、白い平らな氷原が、どこまでも続いていた。"},{w:null,t:"遠くに、黒い四角い建物。アークの研究所。"},{w:null,t:"空の上を、古代たちが、ゆっくりついてくる。影が、氷の上を横切った。"},{w:"elly",f:"normal",t:"……ついてきてくれてる。"},{w:"dimi",t:"ついてきてるだけだ。戦わない。"},{w:null,t:"フェンガロが、先に立って歩いた。鎖のあとが、首にまだ残っている。"},{w:null,t:"氷の上に、二人分の足あとが、研究所の方へ続いていた。"},{w:"hero",f:"normal",t:"……ログとパッチ？"},{w:"alek",f:"normal",t:"命令、来たのか。"},{w:"dimi",t:"来てたら、走ってる。……歩いてる足あとだ。"}];
NR_DIR.n13_3={"k": "勝負", "t": "氷原の見張り（赤い目の子たちと見回りの機械）・盤＝大きな氷原（いくつもの区切り）・覚えること＝大きな盤の行軍。全員で、区切りを一つずつ抜けて研究所へ近づく。見張りは同じ間かくで並ぶので、すき間をつないで進む。割れた氷のマスには乗れない。空の古代の影が通るマスでは、相手の赤い目がうすくなる。"};
NR_SC.n13_3a=[{w:null,t:"氷原のとちゅうに、見回りの機械と、赤い目の子たちが、点々と置かれていた。"},{w:"elena",t:"ボットの守りの線。……計画どおりに、同じ間かくで。"},{w:"alek",f:"normal",t:"同じ間かくなら、すき間も同じ所だ。"},{w:null,t:"ソヨモモが、空から見張りの数を数えてもどってきた。"},{w:"elly",f:"normal",t:"右に三つ。左に二つ。……左だって。"},{w:"hero",f:"normal",t:"なんで分かるの。"},{w:"elly",f:"smile",t:"しっぽで、数えてた。"}];
NR_SC.n13_3w=[{w:null,t:"最後の見張りの機械が、氷の上で、くるくる回って止まった。"},{w:null,t:"氷のかげから、竜が一体、アレクのあとをついてきた。リンドヴルム。"},{w:"alek",f:"normal",t:"……竜は、めったになつかないんだがな。"},{w:null,t:"昼。研究所の黒い壁が、目の前に立っていた。"}];
NR_SC.n13_3l=[{w:null,t:"氷が割れて、足もとに冷たい水が上がってきた。"},{w:null,t:"フェンガロが、ヤマトのえりをくわえて、うしろへ放り投げた。"},{w:"hero",f:"normal",t:"……いたい。ありがと。"},{w:null,t:"氷のかげから、竜が一体、アレクのあとをついてきた。リンドヴルム。"},{w:"alek",f:"normal",t:"……竜は、めったになつかないんだがな。"},{w:null,t:"昼。研究所の黒い壁が、目の前に立っていた。"}];
NR_SC.n13_4=[{w:null,t:"研究所の壁の上に、白い服の二人が立っていた。"},{w:null,t:"一人は、紙の束をかかえ、もう一人は、毛布にくるまっている。"},{w:"yuki",t:"……ここから先は、計画の区域です。"},{w:"hero",f:"normal",t:"また？"},{w:null,t:"ユキは、紙の束を、上から下まで、すばやくめくった。"},{w:null,t:"もう一度めくった。手が、止まった。"},{w:null,t:"ハルが、毛布の中から、空いっぱいの古代を見上げた。"},{w:"haru",t:"……ユキ。これ、計画書の何ページ？"},{w:null,t:"第13話　おわり"}];
NR_SC.n14_1=[{w:null,t:"第14話　問題が、あります"},{w:null,t:"夕方。研究所の壁の上で、ユキは、まだ紙の束をめくっていた。"},{w:"haru",t:"ユキ。何ページ？"},{w:"yuki",t:"……今、さがしてる。"},{w:"haru",t:"空に、でっかいのがいっぱい、は？"},{w:"yuki",t:"書いてない。"},{w:"haru",t:"じゃあ、帰る、は？"},{w:"yuki",t:"それも書いてない。……だから、守る。"},{w:null,t:"ユキは、紙の束を、ぱたんと閉じた。"},{w:"yuki",t:"ここは、通しません。"}];
NR_SC.n14_2=[{w:null,t:"壁の前には、見張りの子と、光を出す機械が、すき間なく並んでいた。"},{w:"alek",f:"normal",t:"正面は、むりだ。"},{w:"elena",t:"研究所の守りは、外向き。……外から来る物だけを見る。"},{w:"dimi",t:"すき間がないなら、どこか、動くやつを見ろ。"},{w:null,t:"ヤマトは、壁の上を見上げた。ハルが、毛布ごと、少しずつ左へずれていく。"},{w:"hero",f:"normal",t:"……ハル、動いてない？"},{w:"elly",f:"normal",t:"左に、何かある。……煙？"},{w:null,t:"壁の左の端に、太い管が出ていて、白い湯気がもくもく上がっていた。"},{w:"haru",t:"……ぬくい。"},{w:"yuki",t:"ハル、持ち場！"},{w:"haru",t:"三分だけ。"}];
NR_DIR.n14_3={"k": "勝負", "t": "ユキ＆ハル（ヴィクター）と壁の見張り・盤＝研究所の外壁・覚えること＝弱点を探す盤。正面は守りが固い。ハルは寒くなると、湯気の出る管の方へ持ち場を離れる。ハルが動いたすき間から入り、ユキを横から押す。"};
NR_SC.n14_3a=[{w:"dimi",t:"あいつが湯気に行ったら、右があく。"},{w:"hero",f:"normal",t:"なんで、そういうの、すぐ分かるの。"},{w:"dimi",t:"お前が、見てないだけだ。"}];
NR_SC.n14_3w=[{w:null,t:"ユキの子が、雪の上にひざをついた。ハルの子は、湯気の前で、もう寝ていた。"},{w:"yuki",t:"……ハル。"},{w:"haru",t:"ぬくいんだもん。"},{w:null,t:"壁の内側への通路が、あいた。"}];
NR_SC.n14_3l=[{w:null,t:"ユキの子に押し返されて、ヤマトたちは、壁から雪の上へ下がった。"},{w:"yuki",t:"……計画どおり。"},{w:null,t:"ハルが、くしゃみをした。ユキの手から、紙の束が、半分すべり落ちた。"},{w:null,t:"紙は、風に乗って、壁の外へ飛んでいった。"},{w:"yuki",t:"あっ……。"},{w:null,t:"そのすきに、リヴが、だまって壁の右へ走った。みんなが続いた。"},{w:null,t:"壁の内側への通路が、あいた。"}];
NR_SC.n14_4=[{w:null,t:"ユキは、壁の上にすわりこんで、耳の通信機を、指でおさえた。"},{w:null,t:"何か言いかけて、やめた。もう一度、おさえた。"},{w:"yuki",t:"……ボット様。ユキです。"},{w:"yuki",t:"……問題が、あります。"},{w:null,t:"通信機の向こうは、しばらく、何も言わなかった。"},{w:"x",n:"ボットの声",t:"……計画どおりです。問題ありません。"},{w:null,t:"通信は、切れた。ユキは、通信機から、ゆっくり指をはなした。"},{w:"haru",t:"……何ページ？"},{w:"yuki",t:"……ない。"},{w:null,t:"ハルは、自分の毛布を半分、ユキの肩にかけた。"}];
NR_SC.n14_5=[{w:null,t:"クロエ博士が、壁の内側の小さな扉に、手のひらを当てた。"},{w:null,t:"ピッと、緑のランプ。扉が開いた。"},{w:"elena",t:"……消されてなかった。"},{w:null,t:"長い階段を、下へ、下へ。図面のとおり、地下のいちばん下まで。"},{w:"alek",f:"normal",t:"ここだ。どの廊下にもつながってない部屋。"},{w:null,t:"つきあたりに、厚い扉。そのすぐ横の石の壁が、くずされていた。"},{w:null,t:"穴の向こうで、機械の音がした。ガリガリと、石をけずる音。"},{w:null,t:"ヴィクターの黒い服の大人たちが、明かりの下で、古い石の階段を掘っていた。"},{w:"dimi",t:"……先に、来てる。"},{w:null,t:"第14話　おわり"}];
NR_SC.n15_1=[{w:null,t:"第15話　北の王"},{w:null,t:"夜。くずされた壁の穴のそばに、ヤマトたちは身をふせていた。"},{w:null,t:"ヴィクターの大人たちが、明かりの下で、機械で石の階段を掘っている。"},{w:"alek",f:"normal",t:"……下まで、あと少しだ。先を越される。"},{w:"dimi",t:"掘ってるのは、正面の階段だけだ。"},{w:"elena",t:"古い紙には、もう一本ある。……柱のうしろに、せまい道。"},{w:null,t:"フェンガロが、鼻を、くずれた石のすき間に押しこんだ。"},{w:null,t:"冷たい風が、すき間から吹き上がってきた。"},{w:"hero",f:"normal",t:"……ここだ。"}];
NR_SC.n15_2=[{w:null,t:"ヤマトたちは、柱のうしろのすき間を、一人ずつ、横になってくぐった。"},{w:null,t:"ソヨモモが、エリーの肩の上で、体をすぼめた。"},{w:"hero",f:"normal",t:"レン、つかえてる。"},{w:"dimi",t:"つかえてない。角が、つかえてる。"},{w:null,t:"カブトムシの子が、角を横にして、すぽんと抜けた。"},{w:null,t:"せまい道の先に、丸い広間。石の柱が、輪になって立っている。"},{w:null,t:"まん中に、大きな岩。……岩ではなかった。角を持つ、眠る獣だった。"},{w:"elly",f:"surprised",t:"……王さま。"},{w:null,t:"フォルンが、床に耳をつけて、すぐに顔を上げた。"},{w:"partner",t:"……教会のより、ずっと大きい。"}];
NR_SC.n15_3=[{w:null,t:"広間の天井から、上の機械の音が、ずん、ずん、とひびいてくる。"},{w:"alek",f:"normal",t:"時間がない。"},{w:null,t:"リヴが、王の前に、ひざをついた。"},{w:null,t:"王の前の石の床は、うすい霜でおおわれていた。"},{w:null,t:"リヴは、指で、霜の上に、あの一行を書いた。教会の窓に書いたのと同じ字。"},{w:null,t:"エリーが、リヴのとなりに、ひざをついた。"},{w:"elly",f:"normal",t:"……ほー、ほー。"},{w:null,t:"リヴは、書いた字の上に、手のひらを置いた。"},{w:null,t:"広間が、しずかになった。上の機械の音まで、遠くなった気がした。"},{w:null,t:"王の角の先に、青白い火花が、ぱちっと走った。"}];
NR_DIR.n15_4={"k": "勝負", "t": "王オーディガル・盤＝丸い広間（柱の輪）・覚えること＝王。王は目をさましたばかりで、だれが来たのかをためす。雷の一撃は、柱のかげに入るとよけられる。王に一度でも手が届けばよい（倒すのではなく、ためされる勝負）。融合は、アレクのリンドヴルム（リュバーン）とヤマトのフォルン（フォルコン）でキマドラ（竜）。"};
NR_SC.n15_4w=[{w:null,t:"柱のかげから、フォルンとリンドヴルムが、同時に跳んだ。"},{w:null,t:"二体が重なった。燃える翼の竜。その火が、王の前足に、ぽっと当たった。"},{w:"alek",f:"normal",t:"……ヤマトの火、熱すぎる。"},{w:"hero",f:"normal",t:"そっちの竜のせいだろ。"},{w:null,t:"王は、それをじっと見下ろした。"},{w:null,t:"王は、角を、ゆっくり下ろした。"},{w:null,t:"王は、子どもたちを、一人ずつ見た。"},{w:null,t:"柱のそばに立つクロエ博士の方へは、一度も目を向けなかった。"},{w:null,t:"王が、リヴを見た。低い、低い音が、床から足に伝わってきた。"},{w:"partner",t:"……「思い出したか」って。"},{w:null,t:"リヴは、うなずいた。手のひらを、霜の字の上から、はなさなかった。"}];
NR_SC.n15_4l=[{w:null,t:"雷が、柱を一本、まっ二つにした。ヤマトたちは、床に転がった。"},{w:null,t:"王は、ヤマトたちの上で、しばらく首をかしげていた。それから、角を下ろした。"},{w:null,t:"王は、子どもたちを、一人ずつ見た。"},{w:null,t:"柱のそばに立つクロエ博士の方へは、一度も目を向けなかった。"},{w:null,t:"王が、リヴを見た。低い、低い音が、床から足に伝わってきた。"},{w:"partner",t:"……「思い出したか」って。"},{w:null,t:"リヴは、うなずいた。手のひらを、霜の字の上から、はなさなかった。"}];
NR_SC.n15_5=[{w:null,t:"正面の階段から、足音がした。急がない、同じ速さの足音。"},{w:null,t:"黒いコートの男が、広間の入口に立った。顔は、フードの影で見えない。"},{w:"dimi",t:"……スペクター。"},{w:"adrian",t:"先に着いたか。……よく、見つけた。"},{w:null,t:"スペクターは、王の方へ、まっすぐ歩いた。"},{w:"adrian",t:"北の王。群れの頭が要る。来てもらう。"},{w:null,t:"王が、首を回した。角の先が、スペクターの胸に向いた。"},{w:null,t:"雷の火花が、角から角へ走った。広間が、青く光った。"},{w:null,t:"スペクターは、一歩も下がらなかった。しばらく、角の先を見ていた。"},{w:"adrian",t:"……では、王は作る。"},{w:null,t:"スペクターは、背を向けて、来た階段を上っていった。足音は、同じ速さのままだった。"}];
NR_SC.n15_6=[{w:"hero",f:"normal",t:"……作るって、何を。"},{w:null,t:"だれも、答えなかった。"},{w:null,t:"天井の上から、掘る機械の音が、止まった。"},{w:null,t:"代わりに、もっと低い、ぶうんという音が始まった。何かに、電気がたまっていく音。"},{w:"elena",t:"……アークの中心。ちょうど、この上。"},{w:null,t:"王が、天井を見上げて、鼻を鳴らした。"},{w:null,t:"第15話　おわり"}];
NR_SC.n16_1=[{w:null,t:"第16話　その子は"},{w:null,t:"夜ふけ。正面の階段から、また足音がした。今度は、たくさん。"},{w:null,t:"ヴィクターの黒い服の大人たちが、大きな筒のような機械をかついで下りてきた。"},{w:null,t:"筒の先に、赤いランプのついた、太い輪がはまっている。"},{w:"elena",t:"……首輪。フェンガロにはめてたのと、同じ。"},{w:"alek",f:"normal",t:"王に、はめる気だ。"},{w:"dimi",t:"王の音を止めたいんだ。上で、何か作るのに、じゃまだから。"},{w:null,t:"王は、まだ起きたばかりで、ゆっくりとしか首を回せなかった。"},{w:"hero",f:"normal",t:"……みんな、前に出て。"}];
NR_DIR.n16_2={"k": "勝負", "t": "ヴィクターの大人たちと首輪の機械・盤＝丸い広間（柱の輪）・覚えること＝加勢＝王オーディガル（一度だけ）。首輪の機械を、王に届く前に止める。王の雷は、一度だけ使える。どこで使うかを選ぶ。融合は、アレクのリンドヴルムとエリーのアルマガネでガイアドラ（竜）。"};
NR_SC.n16_2a=[{w:null,t:"機械の筒が、王の方へ向いた。赤いランプが、ちかちかと速くなる。"},{w:"elly",f:"normal",t:"ヤマト、あれ、もう撃つ！"},{w:"hero",f:"normal",t:"……王さま、今！"},{w:null,t:"王の角から、雷が一本、まっすぐ走った。一度だけ。"},{w:null,t:"筒の機械が、二つ、火花をふいて止まった。"}];
NR_SC.n16_2w=[{w:null,t:"アルマガネとリンドヴルムが、ぶつかるように重なった。岩の鱗の竜。"},{w:null,t:"竜の尾が、機械を二つ、まとめてたたき落とした。"},{w:"elly",f:"surprised",t:"……アルマガネ、重くなった？"},{w:"alek",f:"normal",t:"竜が、重いんだ。"},{w:null,t:"機械は、残り一つになった。その一つが、向きを変えた。子どもたちの方へ。"},{w:null,t:"赤い輪が、撃ち出された。"}];
NR_SC.n16_2l=[{w:null,t:"残った一つの機械が、王の首をねらいかけて、向きを変えた。"},{w:null,t:"子どもたちの方へ。ヤマトたちは、間に合わなかった。"},{w:null,t:"赤い輪が、撃ち出された。"}];
NR_SC.n16_3=[{w:null,t:"灰色の影が、横から飛びこんだ。"},{w:null,t:"輪は、フェンガロの肩に当たって、はじけた。火花と、焦げたにおい。"},{w:null,t:"フェンガロは、二歩、よろけて、石の床に横になった。"},{w:"elly",f:"surprised",t:"フェンガロ！"},{w:null,t:"王が、低く吠えた。広間の柱が、びりびりと鳴った。"},{w:null,t:"ヴィクターの大人たちは、こわれた機械をかついで、階段を逃げていった。"},{w:null,t:"リヴが、フェンガロのそばに走った。肩の毛が、黒く焦げている。"},{w:null,t:"フェンガロは、目をあけたまま、リヴの手に、鼻を押しつけた。"}];
NR_SC.n16_4=[{w:null,t:"広間は、冷えていた。フェンガロの息が、白く、細くなっていく。"},{w:null,t:"フォルンが、とことこ歩いていって、フェンガロのおなかの横に、ぴったり体をつけた。"},{w:null,t:"フォルンのしっぽの火が、小さく、ゆっくり燃えた。"},{w:"hero",f:"normal",t:"フォルン……。"},{w:null,t:"フェンガロの息が、少しずつ、ふつうにもどっていった。"},{w:null,t:"リヴは、長いあいだ、フォルンを見ていた。"},{w:"liv",t:"……その子は、いい。"},{w:null,t:"ヤマトが、口を開けた。エリーが、ヤマトのそでを引いた。"},{w:null,t:"ヤマトは、口を閉じた。"},{w:null,t:"リヴは、フェンガロの頭をなでながら、小さく歌った。"},{w:"liv",t:"……子らは生きる。"},{w:null,t:"北の言葉で、それだけ。リヴは、それきり、また何も言わなかった。"}];
NR_SC.n16_5=[{w:null,t:"しばらくして、クロエ博士が、フェンガロの肩に、上着をかけた。"},{w:"elena",t:"骨は、折れてない。……朝まで、ここで休ませる。"},{w:"alek",f:"normal",t:"レンは？"},{w:null,t:"みんなが、広間を見回した。"},{w:null,t:"広間の奥の、暗い通路の入口。カブトムシの子の角が、一瞬だけ、明かりに光った。"},{w:null,t:"レンのうしろ姿が、通路の奥へ、一人で消えていった。"},{w:"hero",f:"surprised",t:"……レン！"},{w:null,t:"返事は、なかった。"},{w:null,t:"第16話　おわり"}];
NR_SC.n17_1=[{w:null,t:"第17話　最後の守り"},{w:null,t:"未明。神殿の広間で、フェンガロが、ゆっくり立ち上がった。"},{w:null,t:"肩には、クロエ博士の上着が、まだかかっている。"},{w:"elly",f:"surprised",t:"……立った。"},{w:"elena",t:"まだ、走れる体じゃない。"},{w:null,t:"フェンガロは、上着をふり落として、広間の奥の階段の方へ歩き出した。"},{w:"alek",f:"normal",t:"……行く気だ。"},{w:null,t:"リヴが、だまって、フェンガロのとなりに並んだ。"},{w:"hero",f:"normal",t:"……レンが行った方とは、別の階段だね。"},{w:"partner",t:"上に、のびてる。ぶうんの方。"}];
NR_SC.n17_2=[{w:null,t:"長い階段の上は、白い長い通路だった。壁も床も、つるつるの金属。"},{w:null,t:"通路の先に、大きな丸い扉。その前に、赤い目の子たちが、何列も並んでいた。"},{w:null,t:"列のうしろの台の上に、やせた男が一人、立っていた。手に、点検表の板。"},{w:"bot",t:"おはようございます。ここから先は、アークの中心です。"},{w:"hero",f:"normal",t:"……ボット？"},{w:"bot",t:"はい。北の守りは、計画どおりです。問題ありません。"},{w:"alek",f:"normal",t:"見回りの機械、ぜんぶ落ちたけど。"},{w:"bot",t:"計画どおりです。"},{w:"elly",f:"normal",t:"……言うと思った。"}];
NR_DIR.n17_3={"k": "勝負", "t": "ボットの最後の守り（赤い目の子たちの列）・盤＝アークの中心への長い通路・覚えること＝大きな勝負（全部の遊びを使う）。瘴気のマスでは相手の闇の子がよけるので、光のコグリフで（光は闇に強い）。氷の床はポチャ。相性で前に出す子を入れかえる。融合は、アレクのリンドヴルム（リュバーン）とエリーのソヨモモでアラシドラ（竜・嵐）。フェンガロが一度だけ、列のまん中を押し開く。"};
NR_SC.n17_3a=[{w:null,t:"通路の明かりが、ぱちんと消えた。赤い目だけが、暗やみに並んだ。"},{w:"partner",t:"……暗い。"},{w:null,t:"床の金属に、薄い氷がはっていく。ポチャが、うれしそうに鳴いた。"},{w:null,t:"ボットが、点検表に、何かを書きこんだ。"},{w:"bot",t:"……想定内です。第三列、前へ。"},{w:null,t:"アレクが、リンドヴルムの首をたたいた。エリーが、ソヨモモを空へ放った。"},{w:"elly",f:"normal",t:"ソヨモモ、上！"},{w:"alek",f:"normal",t:"……合わせろ。"},{w:null,t:"竜と風が、一つになった。通路いっぱいの、嵐をまとった竜。"},{w:null,t:"ボットのペンが、止まった。"},{w:"bot",t:"……それは。……計画書に、ありません。"}];
NR_SC.n17_3w=[{w:null,t:"最後の列が、床にくずれた。赤い目が、一つずつ消えていった。"},{w:"hero",f:"smile",t:"……っしゃあ！"},{w:"partner",t:"声、大きい。"},{w:null,t:"ボットの前に、もう守る子はいなかった。"}];
NR_SC.n17_3l=[{w:null,t:"赤い目の列に押し返されて、ヤマトたちは、通路の角まで下がった。"},{w:null,t:"フェンガロが、ふらつく足で前に出て、一度だけ、吠えた。"},{w:null,t:"列のまん中が、ぱっと割れた。"},{w:null,t:"ボットの前に、もう守る子はいなかった。"}];
NR_SC.n17_4=[{w:null,t:"ボットの耳の通信機が、ピッと鳴った。"},{w:"x",n:"スペクターの声",t:"ボット。報告を。"},{w:null,t:"ボットは、点検表を見た。何も書かれていない欄を、じっと見ていた。"},{w:"bot",t:"……北の守りは。"},{w:null,t:"ボットは、口を開けたまま、止まった。"},{w:"x",n:"スペクターの声",t:"ボット。"},{w:"bot",t:"……計画どおり、です。"},{w:null,t:"通信機の向こうは、しばらく、何も言わなかった。"},{w:null,t:"ボットの手から、点検表の板が、床に落ちた。カラン、と通路にひびいた。"}];
NR_SC.n17_5=[{w:null,t:"大きな丸い扉の真ん中で、緑のランプが、一つともった。"},{w:null,t:"ボットは、扉を見なかった。床の点検表も、拾わなかった。"},{w:null,t:"扉が、内側から、ゆっくり開きはじめた。"},{w:null,t:"中から、白い光と、ぶうんという音があふれてきた。"},{w:"elena",t:"……中から、開けてる。"},{w:null,t:"第17話　おわり"}];
NR_SC.n18_1=[{w:null,t:"第18話　命令を、どうぞ"},{w:null,t:"扉の中は、丸い大きな部屋だった。天井まで、白い光の柱がのびている。"},{w:null,t:"壁ぜんぶに、細い光の線が走っている。世界中のアークの線が、ここに集まっていた。"},{w:null,t:"光の柱の前に、黒いコートの男が立っていた。"},{w:"adrian",t:"来たか。……ボットは、よくやった。"},{w:"alek",f:"normal",t:"……固まってたけど。"},{w:"adrian",t:"計画を立てたのは、わたしだ。"},{w:null,t:"足もとに、ガラスの台が三つ。研究所の子が、一体ずつ眠っていた。"},{w:null,t:"青い竜の子。雷の角の子。赤いヤモリの子。"},{w:"elena",t:"……リュバーン。トールジン。オキヤモ。"},{w:"elly",f:"normal",t:"何するの。"}];
NR_SC.n18_2=[{w:"adrian",t:"北の王は、来なかった。だから、作る。"},{w:null,t:"スペクターが、台の横の板に、手のひらを置いた。"},{w:null,t:"三つの台が、光の柱の中へ、すべりこんでいった。"},{w:"hero",f:"normal",t:"やめろ！"},{w:null,t:"ヤマトが走った。光の柱の手前で、見えない壁に、はね返された。"},{w:null,t:"柱の中で、三つの影が、ゆっくり一つに重なっていく。"},{w:null,t:"部屋の床が、低く鳴った。ぶうんという音が、どんどん高くなった。"},{w:"partner",t:"……三つが、一つになる。いやがってる。"}];
NR_SC.n18_3=[{w:null,t:"光の柱が、ぱっと消えた。"},{w:null,t:"柱のあった所に、大きな竜が、うずくまっていた。"},{w:null,t:"鱗は青く、角から雷の火花、しっぽの先に、赤い火。"},{w:null,t:"竜は、目をあけた。最初に見たのは、スペクターの方だった。"},{w:"adrian",t:"ラグナディオ。"},{w:null,t:"竜は、首をかしげた。それから、細く、高く、鳴いた。"},{w:"partner",t:"……「命令を、どうぞ」って。"},{w:null,t:"スペクターは、しばらく、竜を見ていた。"}];
NR_SC.n18_4=[{w:null,t:"竜の鳴き声が、部屋の光の線にのって、壁の向こうへ走っていった。"},{w:null,t:"エリーの肩の上で、ソヨモモが、しっぽをひろげたまま、止まった。"},{w:"elly",f:"surprised",t:"……ソヨモモ？"},{w:null,t:"アレクの腕の中で、ユキマダラの目が、すうっと閉じた。"},{w:"alek",f:"normal",t:"……おい。"},{w:null,t:"ピリポンも。クロッコも。コグリフも。ポチャも。"},{w:null,t:"みんな、動いたままの形で、止まった。"},{w:"elena",t:"……古代のそばなのに。合図が、弱くならない。"},{w:null,t:"ヤマトの足もとで、フォルンだけが、しっぽの火をゆらしていた。"},{w:"partner",t:"……また、おれだけか。"},{w:null,t:"ヤマトは、フォルンの頭に、手を置いた。何も言わなかった。"}];
NR_SC.n18_5=[{w:null,t:"研究所の天井の、ガラスの窓。その向こうに、北の空が見えた。"},{w:null,t:"ラーガ。ボルケン。フェニク。山の古代たち。みんな、研究所の上に集まっていた。"},{w:"elly",f:"normal",t:"来て……。"},{w:null,t:"古代たちは、来なかった。"},{w:null,t:"空の上で、ラグナディオを見下ろしたまま、だれも、角も、爪も向けなかった。"},{w:null,t:"扉のそばのフェンガロも、ふせたまま、ラグナディオを見ていた。"},{w:null,t:"第18話　おわり"}];
NR_SC.n19_1=[{w:null,t:"第19話　角を向けない"},{w:null,t:"止まった仲間たちが、床に並んでいた。動いた形のまま。"},{w:null,t:"ラグナディオは、スペクターのうしろで、首を低くして待っていた。"},{w:"adrian",t:"ラグナディオ。あの子を、どかせ。"},{w:null,t:"竜が、フォルンの方を見た。"},{w:"hero",f:"normal",t:"……フォルン。"},{w:"partner",t:"分かってる。"},{w:null,t:"フォルンは、止まったピリポンとクロッコの前に、ちょこんと立った。"}];
NR_DIR.n19_2={"k": "勝負", "t": "ラグナディオ・盤＝アークの中心の丸い部屋・覚えること＝大ボス戦①（フォルン一体）。手持ちはフォルンだけ。相手は大きく、一撃が重い。床の光の線の上では、相手の動きが速くなる。勝てない勝負（どこまでもちこたえるか）。"};
NR_SC.n19_2a=[];
NR_SC.n19_2b=[{w:null,t:"ラグナディオの尾が、床をなぎはらった。光の線が、ばちばちと火花をふいた。"},{w:null,t:"フォルンは、跳んでよけた。しっぽの火を、竜の鼻先にぶつけた。"},{w:null,t:"竜が、びくっと首を引いた。耳が、うしろへ、ぺたりと倒れた。"},{w:null,t:"すぐに、竜はスペクターの方を見た。"},{w:"adrian",t:"続けなさい。"},{w:null,t:"竜の耳が、もとにもどった。"}];
NR_SC.n19_3=[{w:null,t:"天井の窓が、大きな影でくらくなった。"},{w:null,t:"王ラーガが、ガラスの上におりてきた。ボルケンが、そのとなりに。"},{w:"elly",f:"normal",t:"……来た！"},{w:null,t:"ラーガは、ガラスごしに、下の部屋をのぞきこんだ。"},{w:null,t:"ラグナディオを、じっと見た。長い間、見ていた。"},{w:null,t:"それから、ラーガは、ゆっくり首を横に向けた。"},{w:null,t:"ボルケンは、前足をそろえて、すわった。"},{w:"elly",f:"surprised",t:"なんで……！"},{w:null,t:"扉のそばで、フェンガロが立ち上がった。"},{w:null,t:"ラグナディオの尾の火が、フェンガロの方へ流れた。"},{w:null,t:"フェンガロは、一歩、横へよけた。牙は、見せなかった。"}];
NR_SC.n19_4=[{w:null,t:"ヤマトの頭に、迷路の底の牛が浮かんだ。子どもの前でだけ、角を下ろした。"},{w:null,t:"ラドン川の淵も浮かんだ。"},{w:null,t:"大きな淵の主が、足もとを通る小さな子の前でだけ、体をよけていた。"},{w:null,t:"氷の下の玄武が、生まれたての小さな亀の子の横を、よけて泳いでいた。"},{w:null,t:"ヤマトは、ラグナディオを見た。大きな体。でも、目は、まだあいたばかりだった。"},{w:"hero",f:"normal",t:"……あいつ。"},{w:null,t:"ヤマトは、そこで口を閉じた。"}];
NR_SC.n19_5w=[{w:null,t:"フォルンの火が、竜の胸に、小さく焦げあとをつけた。"},{w:null,t:"竜は、自分の胸を、ふしぎそうに見下ろした。それから、スペクターを見た。"},{w:"adrian",t:"……もう、いい。"},{w:null,t:"スペクターは、竜を連れて、光の柱のうしろへ下がった。"},{w:"adrian",t:"古代は、来ない。……分かっただろう。"},{w:null,t:"ヤマトは、答えなかった。"}];
NR_SC.n19_5l=[{w:null,t:"竜の尾が、フォルンを壁まで飛ばした。フォルンは、すぐに起き上がった。"},{w:null,t:"ヤマトが、フォルンの前に走りこんだ。竜の尾が、二人の前で止まった。"},{w:null,t:"スペクターが、片手を上げていた。"},{w:"adrian",t:"……もう、いい。"},{w:null,t:"スペクターは、竜を連れて、光の柱のうしろへ下がった。"},{w:"adrian",t:"古代は、来ない。……分かっただろう。"},{w:null,t:"ヤマトは、答えなかった。"}];
NR_SC.n19_6=[{w:null,t:"部屋は、しずかになった。天井の窓の上で、古代たちは、すわったまま動かない。"},{w:null,t:"床には、止まった仲間たち。ピリポン。クロッコ。コグリフ。ほかのみんな。"},{w:null,t:"その前に、フォルンが一体だけ、立っていた。"},{w:null,t:"しっぽの火が、ゆれていた。"},{w:null,t:"第19話　おわり"}];
NR_SC.n20_1=[{w:null,t:"第20話　自分で"},{w:null,t:"昼。中心の部屋の外の通路。ヤマトたちは、止まった仲間を、壁ぎわに寝かせていた。"},{w:"elena",t:"ここなら、上から見えない。"},{w:"alek",f:"normal",t:"ユキマダラ、重い。"},{w:null,t:"フォルンが、通路の先を見て、耳を立てた。"},{w:"partner",t:"……だれか、いる。たたいてる。"},{w:null,t:"遠くから、ドン、ドン、と、扉をたたく音がした。"}];
NR_SC.n20_2=[{w:null,t:"音のする方へ行くと、通路の角に、黒い服の二人がいた。"},{w:null,t:"ログとパッチ。止まったプカッコとスミヤモを、一体ずつ背負っている。"},{w:"hero",f:"surprised",t:"……ログ！"},{w:"log",t:"うるせえ。……見りゃ分かるだろ。重いんだよ。"},{w:"patch",t:"あんたの子のほうが軽いでしょ。"},{w:"log",t:"気持ちが重いんだよ。"},{w:"elly",f:"normal",t:"何してるの？"},{w:"patch",t:"……べつに。"},{w:null,t:"二人のうしろに、厚い扉。扉の向こうから、ドン、ドン、とたたく音。"},{w:"x",n:"町の人の声",t:"だれか！　開けてくれ！"},{w:"alek",f:"normal",t:"……町の人だ。"}];
NR_SC.n20_3=[{w:"patch",t:"研究所の、食堂とそうじの人たち。三日前から、ここ。"},{w:"hero",f:"normal",t:"なんで、出さないの。"},{w:"log",t:"命令がねえ。出せとも、出すなとも。"},{w:"patch",t:"ボット様の計画書に、この人たちのページがないの。"},{w:"log",t:"上に聞いた。……返事がねえ。"},{w:null,t:"ログは、耳の通信機を、指でたたいた。一回。二回。"},{w:null,t:"何の音もしなかった。"},{w:null,t:"パッチは、扉の横の板を見ていた。番号を押せば、開く板。"},{w:"patch",t:"番号は、分かってる。……押していいかが、分かんない。"}];
NR_DIR.n20_4={"k": "勝負", "t": "見回りの機械・盤＝研究所の地下の通路・覚えること＝人を逃がす盤。町の人たちを、見回りの機械に見つからないように、出口まで連れていく。手持ちはフォルンだけ。ログとパッチが、通路の近道を教える（加勢ではなく、道案内）。"};
NR_SC.n20_4a=[{w:null,t:"パッチの指が、板の前で止まった。"},{w:null,t:"それから、四つ、押した。ピッ、ピッ、ピッ、ピッ。"},{w:null,t:"扉が開いた。中から、エプロンの人たちが、よろよろ出てきた。"},{w:"log",t:"……押したな。"},{w:"patch",t:"押した。"},{w:"log",t:"怒られるぞ。"},{w:"patch",t:"だれに？"},{w:null,t:"ログは、口を開けて、閉じた。"},{w:"patch",t:"こっち。そうじ用の通路。機械は入ってこない。"},{w:"log",t:"せまいぞ。頭、打つなよ。"},{w:null,t:"ゴン、とログが頭を打った。"},{w:"log",t:"……今のは、上のせいだ。"},{w:"patch",t:"天井のせい。"}];
NR_SC.n20_4w=[{w:null,t:"最後のおじいさんが、出口の扉をくぐった。外は、雪の光で白かった。"},{w:null,t:"町の人たちは、雪の上で、教会の方へ歩き出した。"}];
NR_SC.n20_4l=[{w:null,t:"見回りの機械が、赤い光を通路に向けた。"},{w:null,t:"フォルンが、しっぽの火で、機械の目を焼いた。町の人たちは、そのすきに走った。"},{w:null,t:"町の人たちは、雪の上で、教会の方へ歩き出した。"}];
NR_SC.n20_5=[{w:null,t:"出口の前で、ログとパッチは、背中の子をおろした。"},{w:"elly",f:"normal",t:"……ありがと。"},{w:"patch",t:"お礼なら、ボット様に言って。"},{w:"hero",f:"normal",t:"ボット、出せって言ったの？"},{w:null,t:"パッチは、少し考えた。答えなかった。"},{w:"log",t:"怒られたら、上のせいにすりゃいい。"},{w:"patch",t:"上は、何も言ってない。"},{w:"log",t:"……じゃあ、だれのせいだ。"},{w:null,t:"パッチは、止まったスミヤモの頭を、そでで、ごしごしふいた。"},{w:"patch",t:"……わたし。"},{w:"log",t:"……おまえか。"},{w:null,t:"第20話　おわり"}];
NR_SC.n21_1=[{w:null,t:"第21話　二度目"},{w:null,t:"夕方。天井の窓の外が、赤くなった。古代たちは、まだ、すわったまま。"},{w:null,t:"通路から戻ってきたエリーとアレクが、ヤマトの横に並んだ。"},{w:"elly",f:"normal",t:"町の人、みんな外に出た。ログとパッチも。"},{w:"hero",f:"normal",t:"……うん。"},{w:null,t:"ヤマトは、光の柱の前の竜を見ていた。目を、そらさなかった。"},{w:"alek",f:"normal",t:"ヤマト。休め。朝から、ずっとだ。"},{w:"hero",f:"normal",t:"平気。"},{w:"partner",t:"……平気じゃない顔。"},{w:null,t:"光の柱のうしろから、スペクターが出てきた。"},{w:"adrian",t:"もう一度だ。ラグナディオ。"}];
NR_DIR.n21_2={"k": "勝負", "t": "ラグナディオ（二度目）・盤＝アークの中心の丸い部屋・覚えること＝大ボス戦②（負け戦）。手持ちはフォルンだけ。勝てない。進化もしない。"};
NR_SC.n21_2a=[];
NR_SC.n21_2b=[{w:"hero",f:"normal",t:"フォルン、右！"},{w:null,t:"フォルンは、右へ跳んだ。竜の尾が、すぐそこをかすめた。"},{w:"hero",f:"normal",t:"前！　火！"},{w:null,t:"フォルンは、前に出た。火は、竜の鱗の上で、はじけて消えた。"},{w:"hero",f:"normal",t:"もう一回！　前！"},{w:"elly",f:"surprised",t:"ヤマト、今のは……。"},{w:"hero",f:"normal",t:"前！"},{w:null,t:"フォルンは、前に出た。竜の前足が、フォルンを床に押しつけた。"},{w:null,t:"フォルンは、起き上がった。ヤマトの方を、一度だけふり返った。"},{w:"hero",f:"normal",t:"……前。"},{w:null,t:"フォルンは、また、前に出た。"}];
NR_SC.n21_3=[{w:null,t:"竜の雷が、部屋いっぱいに走った。"},{w:null,t:"光がおさまった時、フォルンは、床の上に、横になっていた。"},{w:null,t:"たてがみの火が、小さく、小さくなっていた。"},{w:"hero",f:"surprised",t:"フォルン！"},{w:null,t:"ヤマトは、走っていって、フォルンを抱き上げた。重かった。"},{w:null,t:"竜は、とどめを打たなかった。スペクターの方を見た。"},{w:"adrian",t:"……いい。下がれ。"},{w:null,t:"スペクターは、背を向けた。竜も、そのうしろについていった。"}];
NR_SC.n21_4=[{w:null,t:"部屋の中が、しずかになった。"},{w:null,t:"エリーが、ヤマトのとなりに、ひざをついた。何も言わなかった。"},{w:null,t:"アレクは、立ったまま、こぶしをにぎっていた。何も言わなかった。"},{w:null,t:"リヴが、止まったポチャを抱いたまま、そばに来て、すわった。"},{w:null,t:"クロエ博士が、フォルンの首に、そっと指を当てた。"},{w:"elena",t:"……生きてる。"},{w:null,t:"ヤマトは、うなずかなかった。フォルンを、腕の中で、じっと見ていた。"},{w:null,t:"フォルンは、動かなかった。"},{w:null,t:"第21話　おわり"}];
NR_SC.n22_1=[{w:null,t:"第22話　しゃがむ"},{w:null,t:"夜。天井の窓の外は、まっ暗だった。古代たちの影だけが、星をかくしていた。"},{w:null,t:"ヤマトは、フォルンを床に寝かせて、そのとなりにすわっていた。"},{w:null,t:"フォルンのたてがみの火は、小さいまま、ゆれていた。"},{w:"alek",f:"normal",t:"……次、来たら、どうする。"},{w:"hero",f:"normal",t:"分かんない。"},{w:null,t:"光の柱のうしろから、足音がした。急がない、同じ速さの足音。"},{w:"adrian",t:"三度目だ。"},{w:null,t:"ラグナディオが、スペクターのうしろから出てきた。首を低くして、こちらを見ている。"}];
NR_DIR.n22_2={"k": "勝負", "t": "ラグナディオ（三度目）・盤＝アークの中心の丸い部屋・覚えること＝戦わずに勝つ（しゃがんだまま耐える）。指図を出さない。ヤマトは盤の中で、しゃがんだまま動かない。"};
NR_SC.n22_2a=[];
NR_SC.n22_2b=[{w:null,t:"ヤマトは、立ち上がった。"},{w:null,t:"盤の外の、指図を出す台の前には、行かなかった。"},{w:null,t:"床の白い線をまたいで、盤の中へ、歩いていった。"},{w:"elly",f:"surprised",t:"ヤマト！"},{w:"alek",f:"normal",t:"おい、何して……！"},{w:null,t:"クロエ博士が、アレクの腕をつかんだ。アレクは、止まった。"},{w:null,t:"ヤマトは、竜の目の前まで歩いた。"},{w:null,t:"そして、しゃがんだ。"},{w:null,t:"竜の大きな顔が、ヤマトのすぐ上にあった。"}];
NR_SC.n22_3=[{w:null,t:"ヤマトは、ポケットから、じいちゃんのルーペを出した。"},{w:null,t:"竜の目を、のぞいた。金色の目。まん中が、細く、ふるえている。"},{w:null,t:"ルーペを、少し上へずらした。竜の耳。"},{w:null,t:"耳が、うしろへ、ぺたりと倒れていた。"},{w:null,t:"――東京の部屋が浮かんだ。小さな画面。何百回も見た、フォルンの動画。"},{w:null,t:"雷の音がした時の、フォルンの耳。うしろへ、ぺたりと倒れていた。同じ角度。"},{w:"hero",f:"normal",t:"……耳。"},{w:"hero",f:"normal",t:"うしろに、倒れてる。"},{w:null,t:"竜は、ヤマトを見下ろしたまま、動かなかった。"},{w:null,t:"それから、スペクターの方を見た。"}];
NR_SC.n22_4=[{w:"adrian",t:"ラグナディオ。どかせ。"},{w:null,t:"竜の尾が、持ち上がった。雷の火花が、尾の先に集まっていく。"},{w:"elly",f:"surprised",t:"ヤマト、立って！"},{w:null,t:"ヤマトは、立たなかった。竜の耳を、見ていた。"},{w:null,t:"尾が、ふり下ろされた。"},{w:null,t:"ヤマトの前に、赤い影が飛びこんだ。"},{w:null,t:"フォルンだった。たてがみの火を、めいっぱい燃やして。"},{w:null,t:"雷の尾が、フォルンの背中に落ちた。部屋が、白く光った。"},{w:null,t:"光がおさまった。フォルンは、ヤマトの前に、四本の足で立っていた。"},{w:null,t:"足が、ふるえていた。でも、倒れなかった。"},{w:"partner",t:"……立つな。"},{w:null,t:"ヤマトは、立たなかった。"}];
NR_SC.n22_5=[{w:null,t:"竜は、尾を下ろしたまま、フォルンとヤマトを見ていた。"},{w:null,t:"耳は、まだ、うしろへ倒れたままだった。"},{w:null,t:"竜は、もう一度、スペクターの方を見た。"},{w:null,t:"スペクターは、しばらく、竜の目を見ていた。声の高さは、変わらなかった。"},{w:"adrian",t:"……命令を、続けなさい。"},{w:null,t:"第22話　おわり"}];
NR_SC.n23_1=[{w:null,t:"第23話　やめよう"},{w:null,t:"夜明け前。ヤマトは、しゃがんだまま。その前に、フォルンが四本の足で立っていた。"},{w:null,t:"ラグナディオの尾は、上がったまま止まっていた。"},{w:"adrian",t:"ラグナディオ。続けなさい。"},{w:null,t:"竜は、スペクターを見た。それから、ヤマトを見た。フォルンを見た。"},{w:null,t:"耳は、うしろへ倒れたままだった。"},{w:null,t:"尾の先の雷の火花が、ぱち、ぱち、と小さくなっていった。"},{w:null,t:"尾が、ゆっくり、床におりた。"},{w:null,t:"竜が、低く、短く鳴いた。"},{w:"partner",t:"……「やめよう」って。"},{w:null,t:"スペクターは、何も言わなかった。"}];
NR_SC.n23_2=[{w:null,t:"――同じ時。研究所の地下の、いちばん下。どの廊下にもつながっていない部屋。"},{w:null,t:"厚い扉の前に、レンが一人、すわっていた。手に、父の古い端末。"},{w:null,t:"肩の上で、止まったカブトムシの子が、角を下げている。"},{w:null,t:"端末の画面に、文字が出ていた。「鍵の後半を入れてください」"},{w:null,t:"レンは、ゆうべから、そこにすわっていた。画面の光が、顔を白くしていた。"},{w:null,t:"レンの指が、数字を押した。一つずつ。ゆっくり。"},{w:null,t:"画面に、字がならんだ。「四月九日」"},{w:null,t:"レンは、少しのあいだ、その字を見ていた。"},{w:null,t:"それから、最後のボタンを押した。"}];
NR_SC.n23_3=[{w:null,t:"厚い扉の奥で、カチリと、大きな音がした。"},{w:null,t:"研究所じゅうの壁の光の線が、外側から、一本ずつ消えていった。"},{w:null,t:"――中心の部屋。壁の光の線が消えて、ぶうんという音が、止まった。"},{w:"elena",t:"……アークが、止まった。"},{w:null,t:"エリーの肩の上で、ソヨモモが、ばさっとしっぽを動かした。"},{w:"elly",f:"surprised",t:"ソヨモモ！"},{w:null,t:"ユキマダラが、くしゃみをした。コグリフが、首を上げた。"},{w:"alek",f:"normal",t:"……おれのせいじゃない。"},{w:null,t:"ピリポン。クロッコ。セイリュ。アルマガネ。次々に起き上がった。"}];
NR_SC.n23_4=[{w:null,t:"通路から、足音がした。"},{w:null,t:"レンが、入ってきた。肩の上で、カブトムシの子が、角を持ち上げていた。"},{w:null,t:"レンは、ヤマトの横まで来て、止まった。しゃがんだままのヤマトを、見下ろした。"},{w:"hero",f:"normal",t:"……ありがとう。"},{w:"dimi",t:"お前のためじゃない。"},{w:null,t:"レンは、それ以上、何も言わなかった。父の端末を、上着の内側にしまった。"}];
NR_SC.n23_5=[{w:null,t:"スペクターは、竜を見ていた。竜は、スペクターを見ていなかった。"},{w:null,t:"スペクターは、耳の通信機に、指を当てた。"},{w:"adrian",t:"外の予備の装置を、動かせ。"},{w:null,t:"返事は、来なかった。ボットのいる通路は、しずかなままだった。"},{w:null,t:"スペクターは、通信機から指をはなした。"},{w:null,t:"それから、コートのすそをひるがえして、扉の方へ歩いた。"},{w:null,t:"はじめて、足音の速さが変わった。スペクターは、走っていた。"},{w:null,t:"第23話　おわり"}];
NR_SC.n24_1=[{w:null,t:"第24話　予備の装置"},{w:null,t:"朝。中心の部屋で、ラグナディオが、急に首をふり上げた。"},{w:null,t:"消えていた壁の光の線が、一本だけ、また赤くともった。外へつながる線。"},{w:"elly",f:"surprised",t:"どうしたの！"},{w:"elena",t:"外から、何か打ちこまれてる。……アークを通さずに、直接。"},{w:"dimi",t:"予備の装置だ。研究所の外。父さんの図面の、すみにあった。"},{w:null,t:"竜の目が、赤くなったり、金色にもどったりした。"},{w:"partner",t:"……いやがってる。ずっと。"},{w:null,t:"竜は、天井のガラスを頭で割って、外へ飛び出していった。"},{w:null,t:"フェンガロが、そのあとを追った。リヴも走った。"},{w:"alek",f:"normal",t:"……外だ。みんな、行くぞ。"}];
NR_SC.n24_2=[{w:null,t:"研究所の外。氷の上に、黒い塔が一本、立っていた。"},{w:null,t:"塔の根もとの台に、スペクターがいた。両手で、板の上の文字を打ちつづけている。"},{w:null,t:"塔のわきに、ラグナディオがおりた。目は、赤いままだった。"},{w:null,t:"まわりに、塔に線でつながれた守りの子たちが、ずらりと並んでいた。"},{w:"hero",f:"normal",t:"やめて。いやがってる。"},{w:"adrian",t:"生まれたばかりだ。まだ、分からないだけだ。"},{w:"adrian",t:"ラグナディオ。線を、守れ。"}];
NR_DIR.n24_3={"k": "勝負", "t": "操られたラグナディオと、塔の守りの子たち・盤＝氷の上の黒い塔のまわり・覚えること＝最後の総力戦（全員）。物語では、三人の9体（ヤマト＝フォルン・コグリフ・セイリュ／エリー＝ピリポン・ソヨモモ・アルマガネ／アレク＝クロッコ・ユキマダラ・リンドヴルム）が出る。ゲームの盤は6体：ヤマトのパーティだけを動かし、エリーとアレクの子は借りる子として入れる。ラグナディオは倒さない。守りの子をどけながら、塔の根もとの四本の線を切る。四本目の前には、ラグナディオが立つ。"};
NR_SC.n24_3a=[{w:null,t:"ソヨモモとリンドヴルムが、空から守りの子たちの目をそらした。"},{w:null,t:"ユキマダラが、塔の影から、一本目の線をかみ切った。"},{w:"alek",f:"normal",t:"一本。……次。"},{w:"dimi",t:"おれだ。"},{w:null,t:"カブトムシの子が、角で、二本目の線を、はね上げた。"},{w:null,t:"コグリフの霧の中で、ポチャが、氷の上をすべって、三本目に飛びついた。"},{w:null,t:"塔の光が、三つ消えた。あと、一つ。"},{w:null,t:"四本目の線の前に、ラグナディオが立ちふさがった。耳は、うしろへ倒れていた。"},{w:null,t:"フォルンが、前に出た。たてがみの火が、もう、ほとんど残っていない。"}];
NR_SC.n24_3w=[{w:null,t:"フォルンの火が、竜の鼻先に当たった。けれど、そこで力がつきた。"},{w:null,t:"フォルンは、氷の上に横になった。起き上がろうとして、足がすべった。"}];
NR_SC.n24_3l=[{w:null,t:"竜の尾が、フォルンを氷の上にたたきつけた。"},{w:null,t:"フォルンは、氷の上に横になった。起き上がろうとして、足がすべった。"}];
NR_SC.n24_4=[{w:null,t:"ヤマトは、フォルンのそばまで走った。"},{w:null,t:"そして、氷の上に、ひざをついた。フォルンの目の高さまで、しゃがんだ。"},{w:"hero",f:"normal",t:"……フォルン。"},{w:null,t:"ヤマトは、それだけ言った。"},{w:null,t:"前足が、氷をつかんだ。うしろ足が、ふんばった。フォルンは、立った。"},{w:null,t:"ヤマトの右に、エリーがしゃがんだ。左に、アレクがしゃがんだ。"},{w:null,t:"ピリポンが、フォルンの右に。クロッコが、左に並んだ。"},{w:"partner",t:"……せまい。"},{w:null,t:"三体が、同じ時に、竜の方へ跳んだ。火と雷と水しぶきが、一つに重なった。"}];
NR_SC.n24_5=[{w:null,t:"氷の上に、紺と金の竜が立っていた。"},{w:null,t:"背中から腕まで、金の稲妻がびりびりと走っていた。"},{w:null,t:"おなかに、フォルンの顔があった。"},{w:null,t:"たてがみは金色で、口から火がもれていた。爪の先で、雷がぱちぱち鳴った。"},{w:"alek",f:"surprised",t:"……三つ、重なった。"},{w:"elly",f:"surprised",t:"……ピリポン？"},{w:null,t:"竜の尾が、ふり下ろされた。紺と金の竜は、その尾を、両手の爪で受けとめた。"},{w:null,t:"受けとめたまま、動かなかった。"},{w:null,t:"おなかのフォルンの顔が、竜の目を、まっすぐ見ていた。"},{w:null,t:"竜の目の赤が、少しだけ、うすくなった。"},{w:null,t:"紺と金の竜は、尾をそっと氷の上に下ろした。それから、四本目の線を、引きちぎった。"}];
NR_SC.n24_6=[{w:null,t:"ばちん、と音がした。塔のてっぺんの赤い光が、消えた。"},{w:null,t:"スペクターの手が、板の上で止まった。画面は、まっ暗になっていた。"},{w:null,t:"ラグナディオの目が、金色にもどった。竜は、氷の上に、まるくなった。"},{w:null,t:"紺と金の竜は、ふっとほどけた。フォルンとピリポンとクロッコが、雪の上に転がった。"},{w:"x",n:"クロッコ",t:"…………。"},{w:null,t:"クロッコは、そのまま、雪の上で寝た。"},{w:"alek",f:"normal",t:"……寝るな。"},{w:null,t:"スペクターは、まっ暗な画面を見たまま、動かなかった。"},{w:null,t:"第24話　おわり"}];
NR_SC.n25_1=[{w:null,t:"第25話　古い電話の先"},{w:null,t:"夕方。中心の部屋。ラグナディオは、フェンガロのとなりで、まるくなって眠っていた。"},{w:null,t:"ポチャが、竜のしっぽの先の火に、そっと近づいた。それから、あわてて下がった。"},{w:"elly",f:"normal",t:"……あつかった？"},{w:null,t:"ポチャは、リヴの足のうしろにかくれた。"},{w:"partner",t:"……近づきすぎ。"},{w:null,t:"リヴは、何も言わずに、竜の背中に、自分の上着をかけた。"}];
NR_SC.n25_2=[{w:null,t:"研究所の外の氷の上に、警備隊の車が、何台も止まっていた。"},{w:null,t:"町の人たちが、その横で、毛布にくるまって見ていた。"},{w:null,t:"黒い塔の前で、スペクターは、まっ暗な画面の前に立ったままだった。"},{w:null,t:"警備隊の人が、両わきに立った。スペクターは、手を出した。"},{w:null,t:"手首に、輪がはめられた。スペクターは、輪を見下ろした。"}];
NR_SC.n25_3=[{w:null,t:"研究所の入口の、古い見張り小屋。壁の黒い電話が、ジリリン、と鳴った。"},{w:"dimi",t:"……アークより前の電話だ。ここにも、あったのか。"},{w:null,t:"ヤマトが、受話器を取った。"},{w:"ryo",t:"ヤマト。父さんだ。町の電話局から、線をつないでる。",ph:1},{w:"hero",f:"surprised",t:"父さん！　電話の番、まだしてたの？"},{w:"ryo",t:"ずっとだ。……じいちゃんから。スペクターに、と。",ph:1},{w:null,t:"ヤマトは、受話器のコードを、いっぱいにのばして、小屋の戸口まで出た。"},{w:null,t:"警備隊の人が、少し考えて、スペクターを戸口まで連れてきた。"},{w:null,t:"スペクターは、受話器を受け取った。輪のはまった両手で。"}];
NR_SC.n25_4=[{w:"genichi",t:"……ゲンイチだ。",ph:1},{w:null,t:"スペクターは、しばらく、何も言わなかった。"},{w:"adrian",t:"……覚えている。"},{w:"genichi",t:"島に戻るのが、おそくなった。",ph:1},{w:"adrian",t:"五十年だ。"},{w:"genichi",t:"ああ。",ph:1},{w:null,t:"線の向こうも、こちらも、何も言わなかった。風の音だけがした。"},{w:"genichi",t:"……そっちは、寒いか。",ph:1},{w:"adrian",t:"……ああ。"},{w:null,t:"受話器の横で、エリーが、小さく口ずさんだ。"},{w:"elly",f:"normal",t:"……ほー、ほー。"},{w:null,t:"受話器を持つスペクターの指が、止まった。"},{w:"adrian",t:"……続きが、あったのか。"},{w:null,t:"だれも、答えなかった。"},{w:null,t:"受話器の向こうで、じいちゃんが、息を一つ、はいた。"},{w:null,t:"ツー、と音がした。電話は、切れていた。"},{w:null,t:"スペクターは、受話器を、ヤマトに返した。"},{w:"hero",f:"normal",t:"……切られた？"},{w:"adrian",t:"切られた。"},{w:"hero",f:"normal",t:"いつも、そう。"},{w:null,t:"スペクターは、車の方へ歩いていった。足音は、同じ速さにもどっていた。"}];
NR_SC.n25_5=[{w:null,t:"町の人たちのうしろで、ログとパッチが、車が出ていくのを見ていた。"},{w:null,t:"二人の足もとで、目をさましたプカッコとスミヤモが、雪をかいでいる。"},{w:"log",t:"……上、いなくなったな。"},{w:"patch",t:"うん。"},{w:"log",t:"……おれが、ちゃんとやればよかったのか。"},{w:null,t:"パッチは、少しだけ、ログの顔を見た。"},{w:"patch",t:"……今日は、それも合ってる。"},{w:null,t:"ログは、鼻をすすった。寒いせいだった。"}];
NR_SC.n25_6=[{w:null,t:"――ギリシャ。夕方の町。古い建物の、高い所の、小さな窓。"},{w:null,t:"窓の格子の向こうに、ベラドンナが立っていた。"},{w:null,t:"窓の下の広場で、荷車がひっくり返り、転んだ小さな子の上に、荷がくずれかけていた。"},{w:null,t:"バジリクが、子どもの前に立って、荷を背中で受け止めていた。"},{w:null,t:"ベラドンナは、格子に手をかけて、しばらく、それを見下ろしていた。"},{w:"bella",t:"……あの子、あんな顔するのね。"},{w:null,t:"北欧編　おわり"}];

// 終章の会話の場面(story/egnr_extract.py で台本から機械で抜き出したもの。ここは直接直さない)
const END_SC={}, END_DIR={};
END_SC.z01_1=[{w:null,t:"終章　第1話　ネシ島の海"},{w:null,t:"夕方。エーゲ海。小さな船が一そう、波のない海の上に止まっていた。"},{w:null,t:"船の下には、何もない。島は、五十年前に、海の底へ沈んだ。"},{w:"nadia",t:"……ここ？　何もないよ。"},{w:"elly",f:"normal",t:"ここ。おばあちゃんの地図だと。"},{w:"hao",t:"船、ゆれないな。"},{w:"liv",t:"…………。"},{w:null,t:"リヴは、船べりから、海の中をのぞいていた。"},{w:null,t:"ヤマトのひざの上で、フォルンが、船の床に耳をつけていた。"},{w:"partner",t:"……鳴ってる。今までで、いちばん大きい。"}];
END_SC.z01_2=[{w:null,t:"少しはなれて、もう一そう、船が止まっていた。"},{w:null,t:"警備隊の人が二人。そのあいだに、手首に輪をはめた男。スペクター。"},{w:null,t:"クロエ博士が、こちらの船から、それを見ていた。"},{w:"alek",f:"normal",t:"……なんで、あいつまで。"},{w:"elena",t:"ゲンイチさんが、頼んだの。電話で。"},{w:"alek",f:"normal",t:"……あのじいさん、電話ばっかりだな。"},{w:null,t:"スペクターは、海を見ていた。こちらの船は、見なかった。"}];
END_SC.z01_3=[{w:null,t:"日が、海に近づいた。"},{w:null,t:"エリーが、息を吸った。"},{w:"elly",f:"normal",t:"……ほー、ほー。"},{w:null,t:"ナディアの声が重なった。ハオの声。リヴの声も、小さく。"},{w:null,t:"四つの声が、一つの歌になって、海の上に流れていった。"},{w:null,t:"波が、止まった。船の下の水が、少しずつ明るくなっていく。"},{w:null,t:"海の底から、白い大きな影が、ゆっくり、上がってきた。"}];
END_SC.z01_4=[{w:null,t:"影は、船のすぐそばで、水の上に頭を出した。"},{w:null,t:"年をとった、大きな生き物だった。目は、海の色をしていた。"},{w:null,t:"それは、エリーを見た。ハオを。ナディアを。リヴを。ヤマトを。"},{w:null,t:"クロエ博士の方は、見なかった。警備隊の人の方も。"},{w:null,t:"それから、首を、もう一そうの船の方へ、ゆっくり回した。"},{w:null,t:"スペクターは、輪のはまった手を、ひざの上に置いたままだった。"},{w:null,t:"しばらくして、スペクターの口が、少しだけ動いた。"},{w:"adrian",t:"……ほー、ほー。"},{w:null,t:"そのあとに、知らない言葉の節が続いた。"},{w:null,t:"声は、小さかった。子どものころに覚えたままの、高さだった。"},{w:null,t:"エリーの口が、いっしょに動いた。声は、出さなかった。"},{w:null,t:"最初の一体は、スペクターを見たまま、一度だけ、目を閉じた。"},{w:null,t:"そして、開けた。もう、スペクターの方は見なかった。"},{w:null,t:"スペクターは、歌をやめた。海の方へ、顔を下げた。"}];
END_SC.z01_5=[{w:null,t:"海の底から、低い音が、船の床をつたってきた。"},{w:null,t:"人の耳には、聞こえない。ヤマトの足の裏が、少しだけ、むずむずした。"},{w:null,t:"フォルンが、ヤマトのひざからおりて、船のへさきに立った。"},{w:null,t:"たてがみの火が、ふわりと大きくなった。"},{w:null,t:"火の色が、夕日と同じ色になった。体が、ひとまわり大きくなった。"},{w:"hero",f:"surprised",t:"……フォルン？"},{w:null,t:"フォルレオンの姿だった。"},{w:"partner",t:"……なに。"},{w:"hero",f:"normal",t:"……なんでもない。"},{w:null,t:"最初の一体は、もう一度、子どもたちを見て、海の底へ、ゆっくり帰っていった。"},{w:null,t:"波が、また、ゆれはじめた。"},{w:null,t:"終章　第1話　おわり"}];
END_SC.z02_1=[{w:null,t:"終章　第2話　浜"},{w:null,t:"次の朝。小さな浜。ゆうべの船が、砂の上に引き上げてあった。"},{w:null,t:"ネシ島は沈んだが、いちばん高い丘のてっぺんだけが、海の上に残っていた。"},{w:null,t:"ヤマトたちは、その浜で、たき火のあとを囲んで寝ていた。"},{w:null,t:"アレクだけ、先に起きて、波打ちぎわにすわっていた。クロッコが、となりで寝ていた。"},{w:null,t:"沖から、小さなボートが一つ、近づいてきた。クロエ博士が、こいでいる。"},{w:null,t:"クロッコが、鼻を上げた。パンのにおい。"}];

async function xScene(k,bg){ if(!SC[k]||!SC[k].length) return; if(bg) await runScene(SC[k],{bg}); else await storyField(k); }
const xSuf=b=>b===3?'d':b===2?'w':'l';
async function xStep(A,s){ const f=GF();
  if(s.tod&&TODN!==s.tod) setTime(s.tod,true);
  if(s.kind==='scene'){ let k=s.key; if(s.br){ const b=f[s.br]; k=k+(b===3&&SC[k+'d']?'d':xSuf(b)); } await xScene(k,s.bg); }
  else if(s.kind==='go'){ if(MAP!==s.to) await goMap(s.to,s.toAt); if(MAP!==s.to) return false; if(s.tod) setTime(s.tod,true); }
  else if(s.kind==='fn'){ await s.f(); }
  else if(s.kind==='battle'){ const b=f[s.id+'_b'];
    if(!b){ if(s.prox) return false;   // 地図の人に近づくと始まる(TRAINER_RULE)
      if(s.wild){ const m=MONS.find(q=>+q.o.id===s.wild); if(!m) return false; await startEncounter({type:'wild',m,x:s}); }
      else if(s.anc){ await startEncounter({type:'wild',m:xAncFoe(typeof s.anc==='function'?s.anc():s.anc),x:s}); }
      else { const n=s.foe(); if(s.R&&n) n.rule=Object.assign({keep:1},n.rule||{},{terrain:s.R.terrain,ai:s.R.ai}); await startEncounter({type:'trainer',n,x:s}); }
      return false; }
    if(s.mid) await xScene(s.mid,s.bg);
    if(s.key){ const k=s.key+(b===3&&SC[s.key+'d']?'d':xSuf(b)); await xScene(k,s.bg); }
    if(b!==2&&s.must){ delete f[s.id+'_b']; saveGame(); if(!s.prox) setTimeout(()=>xRun(),700); return false; } }
  if(s.post) await s.post();
  flag(s.id); if(s.last) flag(A.pfx+pad2(s.ep)); saveGame(); followersSet(); return true; }
function xStepOf(e){ if(!e) return null; if(e.x) return e.x; const c=xCur(); if(!c) return null; const s=c.s; if(s.kind!=='battle'||GF()[s.id+'_b']) return null;
  if(e.n&&e.n.o&&e.n.o.egStep===s.id) return s;
  if(e.m&&s.wild&&+e.m.o.id===s.wild&&!e.m.stub) return s; return null; }

// ---- 勝負の盤・借りる子・融合(cnBattleOpt に own3・keep2・triple・maxTurn を足したもの) ----
function xBattleOpt(e,opt,R){ storyStage(opt); if(R.tune&&opt.enemy&&opt.enemy.ancient) opt.enemy.ancient.tune=Object.assign({},opt.enemy.ancient.tune||{},R.tune);   /* 2026-10-31 物語の古代の強さ(地図の古代と分けて合わせる) */ if(R.terrain){ opt.terrainTheme=R.terrain; opt.backdrop=undefined; } if(R.size) opt.size=R.size; if(R.maxTurn) opt.maxTurn=R.maxTurn; if(R.special) opt.special=Object.assign({},R.special);   /* 2026-10-31 専用の盤 */
  if(e.m&&R.ai) opt.enemy.ai=Object.assign({},opt.enemy.ai||{},R.ai);
  const party=opt.player&&opt.player.party; const own=new Set(opt.player.owned||[]);
  if(R.guests&&Array.isArray(party)&&party.length){
    const enju=party.find(p=>ENJU_LINE.includes(+p.mid))||party[0], own2=party.find(p=>CN_GRIF.includes(+p.mid)), own3=party.find(p=>OWN3.includes(+p.mid));
    const L=[]; for(const g of R.guests){ if(g==='partner'){ if(enju&&!L.includes(enju)) L.push(enju); continue; } if(g==='own2'){ if(own2) L.push(own2); continue; } if(g==='own3'){ if(own3) L.push(own3); continue; } L.push({mid:+g,lv:enju.lv,guest:1}); }
    party.length=0; L.forEach(p=>party.push(p));
    for(const g of R.guests) if(typeof g==='number') own.add(g); }   // 借りる子は、その姿のまま(先の姿は持たない扱い)
  for(const k of (R.own||[])) own.add(k);   // その段の姿を持っている扱い(第12話のグリフォ)
  for(const k of (R.keep2||[])){ let m=MEVO[k]; if(ENJU_LINE.includes(k)) m=1003; if(m) own.delete(m); }   // 2段目のまま(2026-10-28から3体融合は3段目どうしなので、今は使っていない)
  opt.player.owned=[...own];
  if(R.fuse||R.triple){ opt.fusionUnlocked=true; const fk=new Set(opt.player.fusionKnown||[]); for(const id of (R.fuse||[]).concat(R.triple||[])) fk.add(id); opt.player.fusionKnown=[...fk]; }
  if(R.triple) opt.tripleUnlocked=true; }

async function xMirror(bg){ STORY=true; objUpdate(); IN.active=false; IN.sx=IN.sy=0; stick.style.display='none'; AUTO=null; stShow('full',bg); PAUSED=true;
  const P=[[20,50],[120,50],[120,150],[250,150],[250,30]], M=[0,0,0];   // 入口→角1→角2→角3→奥の部屋。鏡 0='／' 1='＼'
  const want=[1,1,0];
  const w=document.createElement('div'); w.id='xMirror'; w.style.cssText='position:fixed;left:50%;top:44%;transform:translate(-50%,-50%);z-index:30;width:min(92vw,420px);padding:12px 10px 14px;border-radius:18px;background:rgba(20,26,44,.86);pointer-events:auto;text-align:center';
  w.innerHTML='<div style="display:inline-block;padding:4px 16px;border-radius:999px;background:#2c3e66;color:#fff;font-weight:800;font-size:15px;margin-bottom:8px">鏡</div><svg viewBox="0 0 270 180" style="width:100%;display:block"></svg>';
  document.body.appendChild(w); const svg=w.querySelector('svg'); const NS='http://www.w3.org/2000/svg';
  const el=(t,a)=>{ const e=document.createElementNS(NS,t); for(const k in a) e.setAttribute(k,a[k]); svg.appendChild(e); return e; };
  let done=null; const fin=new Promise(r=>done=r);
  function draw(){ svg.innerHTML=''; el('polyline',{points:P.map(p=>p.join(',')).join(' '),fill:'none',stroke:'#6b6a73',"stroke-width":26,"stroke-linejoin":'miter'}); el('polyline',{points:P.map(p=>p.join(',')).join(' '),fill:'none',stroke:'#3a3946',"stroke-width":20});
    el('circle',{cx:250,cy:22,r:14,fill:'#c9a24a',opacity:.9}); el('rect',{x:4,y:38,width:14,height:24,fill:'#ffd36a'});
    // 光をたどる
    let pt=P[0], dir=[1,0], beam=[pt], ok=true;
    for(let i=1;i<P.length;i++){ const q=P[i]; beam.push(q); if(i===P.length-1) break; const m=M[i-1]; dir=m===1?[dir[1],dir[0]]:[-dir[1],-dir[0]];
      const nx=P[i+1], need=[Math.sign(nx[0]-q[0]),Math.sign(nx[1]-q[1])]; if(dir[0]!==need[0]||dir[1]!==need[1]){ beam.push([q[0]+dir[0]*14,q[1]+dir[1]*14]); ok=false; break; } }
    el('polyline',{points:beam.map(p=>p.join(',')).join(' '),fill:'none',stroke:'#fff2a8',"stroke-width":5,"stroke-linecap":'round'});
    for(let i=0;i<3;i++){ const [x,y]=P[i+1]; const g=el('g',{style:'cursor:pointer'}); const c=document.createElementNS(NS,'circle'); Object.entries({cx:x,cy:y,r:18,fill:'rgba(255,250,240,.18)',stroke:'#fff',"stroke-width":2}).forEach(([k,v])=>c.setAttribute(k,v)); g.appendChild(c);
      const l=document.createElementNS(NS,'line'); const d=M[i]===1?[-11,-11,11,11]:[-11,11,11,-11]; Object.entries({x1:x+d[0],y1:y+d[1],x2:x+d[2],y2:y+d[3],stroke:'#e8f4ff',"stroke-width":5,"stroke-linecap":'round'}).forEach(([k,v])=>l.setAttribute(k,v)); g.appendChild(l);
      g.classList.add('xMir'); g.dataset.i=i; g.addEventListener('click',ev=>{ ev.stopPropagation(); if(ok) return; M[i]=1-M[i]; draw(); }); }
    if(ok) setTimeout(()=>done(),700); }
  draw();
  try{ await fin; } finally{ w.remove(); stHide(); PAUSED=!READY.scene; LAST=performance.now(); STORY=false; objUpdate(); } }

  const anc=new Set(); await Promise.all(WARP_ARCS.flatMap(a=>a[1]).map(id=>briefRegion(id).then(j=>{ for(const w of (j.wild||[])) if(w.ancient||w.boss) anc.add(+w.id); }).catch(()=>{})));

  const roster=bases.map((m,i)=>({uid:'t'+i.toString(36)+'_'+m.id, mid:m.id, lv:50, exp:0, src:'test', t}));
  const forms={}; for(const m of list) if(m.role!=='fusion'&&!story(m)&&(m.level||1)>=2) forms[m.id]=1; const fusions={}; for(const m of list) if(m.role==='fusion') fusions[m.id]=1;
  const pick=[1001,178,1022,180,1026,195].map(id=>bases.find(m=>m.id===id)?id:null).filter(Boolean); for(const m of bases){ if(pick.length>=6) break; if(!pick.includes(m.id)) pick.push(m.id); }
  const party=pick.slice(0,6).map(id=>roster.find(c=>c.mid===id).uid);
  const lines={}; for(const m of bases) lines[m.id]=1;
  return {v:1,g:'m',name:DEFN('m'),partner:1001,flags:{arrived:1},unlock:{evo:true,fusion:true,triple:true},owned:mine.map(m=>m.id),stage:'field',test:4,items:{},
    map:'oliva_town',x:null,z:null,yaw:null, prog:{v:1,gems:99999,roster,party,partyMax:6,lines,forms,fusions,learnV:1,starter:1001,quests:{},log:[],arc:'greece',pulls:0}}; }
async function testGame(fresh){ ST.title.style.display='none'; SKEY=SKEY_TEST; TESTMODE=true; NOSAVE=false;
  let sv=null; if(!fresh) try{ const s=JSON.parse(localStorage.getItem(SKEY_TEST)); if(s&&s.v===1&&s.test===4) sv=s; /* test:1〜3(融合体・2段目の子・物語だけの古の個体を持っていた前の形)は作り直す */ }catch(e){}
  if(!sv) sv=await testSaveNew();

  if(Progress.partyMax()<6) Progress.setPartyMax(6); if(Progress.gems()<99999) Progress.addGems(99999-Progress.gems(),'test');
  testHud(); fadeEl.classList.add('on'); stHide(); ST.el.style.display='none';

async function warpOpen(){ if(!TESTMODE||!canSave()) return; PAUSED=true; const el=$('wpList'); el.innerHTML='';
  for(const [an,ids] of WARP_ARCS){ const h=document.createElement('h3'); h.textContent=an; el.appendChild(h); const g=document.createElement('div'); g.className='wg'; el.appendChild(g);

$('btWarp').addEventListener('click',()=>{ warpOpen(); });

// タイトルの背景(2026-10-27 オーナー:「オープニングはテリオンが何体も出てないと。飛行船は意味不明」→「2Dでいい」)

window.TreeKit={ olive(seed,sc){ const save=CUR; CUR={B:new Builder(),cols:[],dyn:[],extra:[]}; FLATG=true; try{ OB.olive({x:0,z:0,s:1,seed:(seed|0)}); } finally{ FLATG=false; }

window.WORLD={ prof:{n:0,chunk:0,npc:0,mon:0,render:0,all:0,cam:0,ui:0}, READY, CFG, HERO, CAM, STATS, CHUNKS, MONS, NPCS, DOORS,
  tp(x,z,yaw){ HERO.x=x; HERO.z=z; if(yaw!=null) HERO.yaw=yaw; CAM.tx=x; CAM.tz=z; HERO.y=groundAt(x,z); CAM.ty=HERO.y; },
  npcReady(){ return NPCS.filter(n=>n.want).every(n=>n.rig); },
  setTime, cam(){}, fixCam(a){ CAM.fixed=a; }, POST, FP, MIDX:()=>MIDX, modelsPending(){ return Object.values(PROPM).filter(p=>!p._done).length; },
  overlaps(){ const o=[]; for(let i=0;i<FP.length;i++) for(let j=i+1;j<FP.length;j++){ const a=FP[i], b=FP[j]; const d=Math.hypot(a.x-b.x,a.z-b.z); if(d<Math.min(Math.max(a.hw,a.hd),Math.max(b.hw,b.hd))*0.9) o.push([a.k0,a.x.toFixed(1),a.z.toFixed(1),b.k0,b.x.toFixed(1),b.z.toFixed(1)]); } return o; },
  auto(v){ AUTO=v; }, swapHero(url){ return loadHero([url]); },
  pending(){ let n=0; for(const c of CHUNKS.values()){ if(!c.far&&c.state!==2&&chunkDist(c,HERO.x,HERO.z)<CFG.loadR) n++; } return n+cellsWaiting(HERO.x,HERO.z); },
  monReady(){ return MONS.filter(m=>m.inst).length; },
  stats(){ const ri=POST.ri||renderer.info.render; return {fps:FPSB.length/FPSB.reduce((a,b)=>a+b,0),calls:ri.calls,tris:ri.triangles,chunks:[...CHUNKS.values()].filter(c=>c.state===2).length,built:STATS.built,unloaded:STATS.unloaded,lazyBytes:BYTES_LAZY,hero:HERO.url,ms:[...CHUNKS.values()].filter(c=>c.ms).map(c=>c.i+','+c.j+':'+c.ms.toFixed(0))}; },
  triReport(){ const fr=new THREE.Frustum(); fr.setFromProjectionMatrix(new THREE.Matrix4().multiplyMatrices(camera.projectionMatrix,camera.matrixWorldInverse)); const o={};
    scene.traverse(m=>{ if(!m.isMesh||!m.visible) return; let vis=m.frustumCulled===false||fr.intersectsObject(m); if(!vis) return; const g=m.geometry; const t=(g.index?g.index.count:g.attributes.position.count)/3*(m.isInstancedMesh?m.count:1);
      let k=m.isInstancedMesh?'inst_'+(m.userData.k||m.parent&&m.parent.type)+'_'+(m.parent&&m.parent.parent===chunkRoot?'c':'x'):(m.isSkinnedMesh?'skin':'mesh'); if(m.isInstancedMesh&&m.userData.k==='flowers'){ (o._fl=o._fl||[]).push([m.count,m.geometry.boundingSphere.center.toArray().map(v=>v.toFixed(0)).join(','),m.geometry.boundingSphere.radius.toFixed(1),m.geometry.index.count]); } o[k]=(o[k]||0)+t; });
    const per={}; for(const c of CHUNKS.values()){ if(!c.group) continue; c.group.traverse(m=>{ if(m.isInstancedMesh&&fr.intersectsObject(m)){ const t=m.geometry.index.count/3*m.count; const k=[...PROPMAT.entries()].find(e=>e[1]===m.material); per[m.material.uuid.slice(0,4)+'_'+m.count]=(per[m.material.uuid.slice(0,4)+'_'+m.count]||0)+t; } }); }
    const byk={}; for(const c of CHUNKS.values()){ if(!c.group) continue; c.group.traverse(m=>{ if(m.isInstancedMesh&&fr.intersectsObject(m)){ const k=m.userData.k; byk[k]=(byk[k]||0)+m.geometry.index.count/3*m.count; } }); }
    let a1=0,a2=0,g1=0,g2=0; chunkRoot.traverse(m=>{ if(m.isInstancedMesh) a1++; }); g1=chunkRoot.children.length; for(const c of CHUNKS.values()){ if(c.group){ g2++; c.group.traverse(m=>{ if(m.isInstancedMesh) a2++; }); } }
    const fl=[]; chunkRoot.traverse(m=>{ if(m.isInstancedMesh&&m.userData.k==='flowers'&&fr.intersectsObject(m)) fl.push([m.count,m.geometry.boundingSphere.center.toArray().map(v=>v.toFixed(0)).join(','),m.geometry.boundingSphere.radius.toFixed(1)]); });
