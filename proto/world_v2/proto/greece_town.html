GR_SC.g08_02=[{w:null,t:"アルカディアの森の外れ。化石の発掘場。",v:"08_0031"},{w:null,t:"棚に、箱がぎっしり。"},{w:null,t:"戸があいて、研究者が入ってくる。"},{w:"kenkyu",t:"朝ごはん、パンしかないけど。",v:"08_0035"},{w:null,t:"ヤマト、むくっと起きる。"},{w:"hero",t:"パン！",v:"08_0037"},{w:null,t:"テーブルに、かたいパンと、水。"},{w:"elly",t:"ずっと、掘ってるの？",v:"08_0039"},{w:"kenkyu",t:"ずっと。",v:"08_0040"},{w:"elly",t:"ロボットに、やってもらわないの？",v:"08_0041"},{w:"kenkyu",t:"前に、やらせた。骨も石も、ぜんぶ同じ「石」の箱に入れた。",v:"08_0042"},{w:null,t:"研究者、窓の外をあごでさす。"},{w:"kenkyu",t:"それから、手で掘ってる。",v:"08_0044"},{w:null,t:"アレク、窓の外を見ている。"},{w:null,t:"小屋の軒下の壁ぎわに、子ども用の寝袋が一つ、きっちり丸めて置いてある。"},{w:"alek",t:"あれは。",v:"08_0047"},{w:"kenkyu",t:"塔。電波の。半年前から、勝手に建ってる。",v:"08_0048"},{w:"elly",t:"（軒下の寝袋を見て）あれ、だれの？",v:"08_0049"},{w:"kenkyu",t:"工事の子。夜だけ。宿まで、歩くと一時間だから。",v:"08_0050"},{w:"kenkyu",t:"（三人に）掘ってる所には、さわらないで。ひもの中は、だめ。",v:"08_0051"}];
GR_SC.g08_03=[{w:null,t:"ひもで四角く区切った穴が、いくつも並んでいる。"},{w:null,t:"ヤマト、ひものまわりを、うろうろしている。"},{w:"elly",t:"ヤマト、ひもの中、だめって。",v:"08_0056"},{w:"hero",t:"ひもの外なら、いいんだろ。",v:"08_0057"},{w:null,t:"ヤマト、ひもの外の、草の生えた所にしゃがむ。"},{w:"hero",t:"化石なんてさ、どこにでも埋まってんだって。こういう、だれも見てない所に——",v:"08_0059"},{w:null,t:"スコップの先に、かちん。"},{w:"hero",t:"ほら！",v:"08_0061"},{w:null,t:"ヤマト、両手で掘る。"},{w:null,t:"エリーが、パンをかじりながら、穴の上からのぞいている。"},{w:null,t:"穴の中から、ヤマトが、白い石を両手で持ち上げる。"},{w:"hero",t:"見て！　骨！",v:"08_0065"},{w:null,t:"エリー、少しのあいだ見る。"},{w:"elly",t:"……それ、さっき研究者さんが投げてた石だよ。",v:"08_0067"},{w:null,t:"ヤマト、石を見る。"},{w:null,t:"ヤマト、石を置く。"},{w:null,t:"穴は、ヤマトの背より深くなっている。"},{w:"hero",f:"serious",t:"……エリー。手。",v:"08_0071"},{w:null,t:"エリー、手をのばす。"},{w:null,t:"ヤマト、髪を立てたまま、だまってエリーを見上げる。"},{w:null,t:"アレク、遠くの小屋の前で、紙の地図を広げたまま、顔も上げない。"},{w:"hero",t:"アレク！",v:"08_0075"},{w:"alek",t:"……自分で掘ったんだろ。",v:"08_0076"},{w:null,t:"穴のふちに、影がさす。"},{w:null,t:"黄色い毛に、黒いぎざぎざのしま。"},{w:null,t:"となりに、少年が一人。"},{w:"x",n:"少年",t:"……なにしてんの。",v:"08_0080"},{w:"hero",f:"serious",t:"……掘ってた。",v:"08_0081"},{w:null,t:"少年、トラの子の背中を、指で一回たたく。"},{w:null,t:"ヤマト、しっぽをつかむ。"},{w:"hero",t:"いっ——",v:"08_0084"},{w:null,t:"トラの子、立ち上がる。"},{w:null,t:"少年、ヤマトの顔を見る。"},{w:"x",n:"少年",t:"……となりのクラスの。",v:"08_0087"},{w:"hero",f:"serious",t:"……だれ？",v:"08_0088"},{w:"x",n:"少年",t:"レン。四組。",v:"08_0089"},{w:"hero",t:"おれ、三組。",v:"08_0090"},{w:"dimi",t:"だから、となりだろ。",v:"08_0091"},{w:"hero",t:"なんで、いんの。ギリシャに。",v:"08_0092"},{w:"dimi",t:"父さんの会社の現場。あの塔。",v:"08_0093"},{w:null,t:"レン、鉄の骨組みをあごでさす。"},{w:"dimi",t:"見回り。父さんの手伝い。昼は、下を回るの、おれとライガ。",v:"08_0095"},{w:"hero",f:"serious",t:"……おまえ、ひとりで？",v:"08_0096"},{w:"dimi",t:"ライガと。",v:"08_0097"}];
GR_SC.g08_04=[{w:null,t:"発掘場のはしの、骨をしまう小屋。"},{w:null,t:"アバンの、大きな丸い骨。"},{w:"elly",f:"serious",t:"……顔？",v:"08_0104"},{w:"kenkyu",t:"頭の骨。大昔の。",v:"08_0105"},{w:null,t:"ヤマト、穴をのぞく。"},{w:"hero",t:"目、一個しかない。",v:"08_0107"},{w:"kenkyu",t:"大昔の人も、そう思った。こういう骨を見て、一つ目の巨人の話を作った。",v:"08_0108"},{w:"hero",t:"巨人って、ほんとにいたの？",v:"08_0109"},{w:"kenkyu",t:"これは、象。",v:"08_0110"},{w:"hero",t:"象？",v:"08_0111"},{w:"kenkyu",t:"まん中の穴は、鼻の穴。",v:"08_0112"},{w:null,t:"ヤマト、穴を見る。"},{w:"hero",f:"serious",t:"……象の鼻、ここから出てんの。",v:"08_0114"},{w:"kenkyu",t:"出てる。",v:"08_0115"},{w:null,t:"エリー、台のすみの小さな箱の中を、のぞいている。"},{w:null,t:"エリー、指で土をはらう。"},{w:"elly",t:"「この子は、わたしたちの言葉しか聞かない。」",v:"08_0118"},{w:null,t:"研究者の、シートをたたんでいた手が、止まる。"},{w:null,t:"研究者、エリーを見る。"},{w:"kenkyu",t:"……わたし、それ、辞書を引いて三日かかった。",v:"08_0121"},{w:"elly",t:"なんか、読めた。",v:"08_0122"},{w:null,t:"エリー、石を箱にもどす。"},{w:null,t:"研究者は、エリーの横顔を見たまま。"},{w:null,t:"ヤマトは、象の骨の鼻の穴に、腕を入れて、長さをはかっている。"},{w:null,t:"レンは、エリーを少しだけ見て、それから、手首の画面の時刻を見る。"}];
GR_SC.g08_05=[{w:null,t:"小屋の前に、たき火。"},{w:null,t:"レンも、たき火のそばに座っている。"},{w:"kenkyu",t:"お父さんは。",v:"08_0134"},{w:"dimi",t:"塔の上。朝まで。",v:"08_0135"},{w:null,t:"フォルンが、たき火のはしの石の上で、しっぽの火でオリーブを焼いている。"},{w:null,t:"アレクは、クロッコに煮た魚を指で食べさせている。"},{w:null,t:"ライガが、のそっと立ち上がる。"},{w:null,t:"フォルンの首のまわりの毛が、ぼっと燃え上がる。"},{w:null,t:"ライガの毛の先が、ばちばちっと光る。"},{w:"hero",t:"フォルン、やめろ。",v:"08_0141"},{w:null,t:"フォルン、止まらない。"},{w:null,t:"レン、座ったまま、人さし指を一本だけ、すっと立てる。"},{w:null,t:"ライガ、ぴたりと止まる。"},{w:"hero",t:"やめろって。もう行ったって。",v:"08_0146"},{w:"elly",t:"レンも、大会、出るの？",v:"08_0151"},{w:"dimi",t:"出る。",v:"08_0152"},{w:"hero",f:"serious",t:"……おれも、出る。",v:"08_0153"},{w:"dimi",t:"その狐、だれの。",v:"08_0155"},{w:"hero",f:"serious",t:"……優勝したら、おれの。",v:"08_0156"},{w:"dimi",t:"（立ち上がって）寝る。あしたも、見回り。",v:"08_0160"}];
GR_SC.g08_06=[{w:null,t:"たき火が、小さくなっている。"},{w:null,t:"研究者が、鍋を下ろす。"},{w:null,t:"研究者、声を落とす。"},{w:"kenkyu",t:"昼の石。あの字。",v:"08_0168"},{w:"elly",t:"うん。",v:"08_0169"},{w:"kenkyu",t:"ああいう字の時代の子がね、一度だけ、よみがえったことがある。",v:"08_0170"},{w:"hero",t:"テリオン？",v:"08_0171"},{w:"kenkyu",t:"五十年くらい前ね。骨の中にね、設計図が残ってることがある。",v:"08_0172"},{w:"hero",t:"設計図？",v:"08_0173"},{w:"kenkyu",t:"生き物の。それを読んで、印刷した人たちがいた。",v:"08_0174"},{w:"alek",t:"……化石から。",v:"08_0175"},{w:"hero",t:"強かった？",v:"08_0176"},{w:"kenkyu",t:"大きくて、強かった。でも、昔の言葉しか分からない。何を言っても、聞かなかった。",v:"08_0177"},{w:null,t:"ヤマト、たき火のむこうのフォルンを見る。"},{w:"hero",f:"serious",t:"……それ、ふつうじゃん。",v:"08_0179"},{w:"kenkyu",t:"ふつうの子は、おなかがすいたら寄ってくる。あの子たちは、ごはんを出しても、こっちを見なかったって。",v:"08_0180"},{w:null,t:"アレク、地図をなぞっていた指を止める。"},{w:"alek",t:"……それで、消したのか。",v:"08_0182"},{w:"kenkyu",t:"禁止。それから、いなかったことにした。図鑑にも、ニュースにも、出てこない。",v:"08_0183"},{w:"elly",t:"その子たち、どこ行ったの。",v:"08_0184"},{w:"kenkyu",t:"どこかで、寝てる。……って話。",v:"08_0185"},{w:"hero",t:"起こせないの？",v:"08_0186"},{w:"kenkyu",t:"起こし方は、だれも分からない。",v:"08_0187"},{w:"hero",f:"serious",t:"……でも、いたことは、分かってんじゃん。",v:"08_0188"},{w:"kenkyu",t:"いたこと、だけね。それを覚えてるのは、国の上の方の人と、わたしみたいな、骨を掘ってる人だけ。",v:"08_0189"},{w:null,t:"研究者、たき火に枝を一本足す。"},{w:"kenkyu",t:"外で言ったら、わたしが捕まる。",v:"08_0191"},{w:"hero",t:"じゃあ、なんで言ったの。",v:"08_0192"},{w:null,t:"研究者、答えない。"},{w:null,t:"エリー、ぽかんとして、それから、にこっとする。"},{w:"elly",t:"ないしょね！",v:"08_0195"},{w:null,t:"研究者、少しだけ笑う。"},{w:null,t:"アレク、何も言わない。"},{w:null,t:"ヤマト、シャツの外、胸の上に革ひもでさげた古い時計を、手のひらでおさえる。"}];
GR_SC.g08_07=[{w:null,t:"たき火は、もう、おき火。"},{w:null,t:"遠くから、低いエンジンの音。"},{w:null,t:"フォルンの耳が、ぴくっと立つ。"},{w:null,t:"ヤマトも、目をあける。"},{w:null,t:"発掘場の前の土の道を、白いトラックが一台、明かりを消して走ってくる。"},{w:null,t:"トラックが、目の前を通る。"},{w:null,t:"荷台の中から、鳴き声。"},{w:null,t:"トラックは、森の奥の方へ曲がっていく。"},{w:null,t:"ヤマト、体を起こす。"},{w:null,t:"エリー、毛布の中で、目をあけている。"},{w:null,t:"小屋の軒下。"}];
GR_EP[8]={"t": "巨人の骨", "sc": [["g08_01", "発掘場（夜明け前）", 0], ["g08_02", "発掘場の小屋（朝）", 0], ["g08_03", "発掘場（昼前）", 0], ["g08_04", "骨の小屋（昼）", 0], ["g08_05", "発掘場のたき火（夜）", 0], ["g08_06", "たき火のそば（夜ふけ）", 0], ["g08_07", "発掘場の前の道（夜中）", 0]]};
GR_SC.g09_01=[{w:null,t:"森の外れの、化石の発掘場。ゆうべ、窓のない白いトラックが一台、この前の道を森の奥へ走っていった。",v:"09_0019"},{w:null,t:"朝もやの中、掘りかけの四角い穴がいくつも並ぶ。"},{w:null,t:"小屋の軒下の壁ぎわ。"},{w:null,t:"小屋の前の道。"},{w:null,t:"エリー、しゃがんで羽を拾う。"},{w:null,t:"ヤマト、わだちの前に仁王立ち。"},{w:"hero",f:"smile",t:"よし。こういうのは、おれにまかせろ。タイヤのあと、追うだけだろ。",v:"09_0025"},{w:null,t:"ヤマト、地面に顔を近づけて、細いわだちを一本見つける。"},{w:null,t:"細いわだちは、穴と穴のあいだをくねくね回って、小屋の裏へ。"},{w:"kenkyu",t:"それ、わたしの一輪車。",v:"09_0029"},{w:null,t:"ヤマト、手押し車を見る。"},{w:null,t:"小屋の表から、アレクの声。"},{w:"alek",t:"……こっちだ。",v:"09_0032"},{w:"alek",t:"荷台が重い。檻を積んでる。",v:"09_0034"},{w:"kenkyu",t:"その道、地図にないよ。行くなら、帰りに一輪車を押してって。",v:"09_0036"},{w:"alek",t:"……帰りは、ここは通らない。",v:"09_0037"},{w:"alek",t:"……この道、前に一度、通った。",v:"09_0039"},{w:null,t:"第9話　森の奥の施設",v:"09_0041"}];
GR_SC.g09_02=[{w:null,t:"森の奥へ続く、地図にない道。上の空を、配達のドローンが行きかう。下の道は、わだちのほかに、何もない。",v:"09_0047"},{w:null,t:"先頭はアレク。"},{w:"hero",t:"アレク。前の仕事って、何。",v:"09_0049"},{w:"alek",t:"荷物の案内だ。白い盾の会社の。",v:"09_0050"},{w:"hero",t:"荷物って。",v:"09_0051"},{w:"alek",t:"檻だ。",v:"09_0052"},{w:null,t:"ヤマト、それ以上聞かない。"},{w:null,t:"エリーは、さっきの羽を、クッキーの箱のふたのすきまに、そっとさしこんでいる。"},{w:"elly",t:"ねえ、アレク。あの子たち、また森に帰れる？",v:"09_0055"},{w:"alek",t:"……今から見る。",v:"09_0056"},{w:null,t:"道のわきに、新しい看板。"},{w:null,t:"フォルンが、看板の前で足を止める。"},{w:null,t:"ヤマト、フォルンの横にしゃがむ。"},{w:"hero",f:"serious",t:"……フォルン、ここ、来たこと、あんのか。",v:"09_0060"},{w:null,t:"フォルン、看板から目をはなさない。"},{w:"alek",t:"来る前に、逃げたやつだ。そいつは。",v:"09_0062"},{w:null,t:"道の先の木の上に、白いカメラが一つ。"},{w:null,t:"ヤマト、自分のパーカーのフードを、フォルンの頭の上に、ばさっとかぶせる。"}];
GR_SC.g09_03=[{w:null,t:"アイギス社、森の保護センター。窓のない、白い四角い建物だ。",v:"09_0069"},{w:null,t:"森を切りひらいた広場に、白い建物。"},{w:null,t:"前の広場に、白いトラックが三台、横に並んでいる。"},{w:null,t:"門の横の小さな見張り小屋に、人が一人。"},{w:null,t:"三人と三体は、広場のはしの茂みにしゃがんでいる。"},{w:"hero",t:"人、一人しかいねえじゃん。",v:"09_0074"},{w:"alek",t:"ほかは全部、機械だ。",v:"09_0075"},{w:"hero",t:"じゃあ、正面から行けば。",v:"09_0076"},{w:"alek",t:"門に、目がある。",v:"09_0077"},{w:null,t:"門の柱の上に、白いカメラ。"},{w:null,t:"アレク、茂みの中を、建物の裏へ回っていく。"}];
GR_SC.g09_04=[{w:null,t:"アレク、ポケットから、すりへった白いカードを出す。"},{w:null,t:"アレク、カードを見る。"},{w:"hero",f:"serious",t:"……追い出されてんじゃん。",v:"09_0086"},{w:"alek",t:"自分で出たんだ。",v:"09_0087"},{w:null,t:"ぶうん、と音がして、灰色の戸が内側から開く。"},{w:null,t:"三人、ゴミの箱のかげに固まる。"},{w:null,t:"エリーだけ、かげから出る。"},{w:"hero",t:"（小声で）おい！",v:"09_0091"},{w:null,t:"エリー、にこっと笑って、ロボットに頭を下げる。"},{w:"elly",t:"おはよう。おつかれさま。毎日、たいへんだね。",v:"09_0093"},{w:"x",n:"掃除のロボット",t:"ドウゾ。",v:"09_0096"},{w:"hero",t:"ごくろう！",v:"09_0100"}];
GR_SC.g09_05=[{w:null,t:"建物の二階を、ガラス張りの通路が一本、まっすぐ通っている。下を見下ろせるように作ってある。",v:"09_0105"},{w:null,t:"三人、ガラスにくっつくようにして、下を見る。"},{w:null,t:"下は、長い長い流れ作業の部屋。"},{w:null,t:"檻が止まる。"},{w:null,t:"じたばたしていた羽の子の足が、止まる。"},{w:null,t:"エリーの両手が、ガラスに当たっている。"},{w:null,t:"フォルンの背中の毛が、しっぽの付け根から、ぞわっと逆立つ。"},{w:null,t:"ヤマト、フォルンの背中に、手のひらを置く。"},{w:"hero",f:"serious",t:"……あれ、チップ？",v:"09_0117"},{w:"alek",t:"安全チップ。入れると、命令が届く。",v:"09_0118"},{w:"x",n:"係の男の声",t:"主任。歌の子、四十二体です。きょう中に全部入れますか。",v:"09_0121"},{w:"x",n:"ノモスの声",t:"……確認します。",v:"09_0122"},{w:"x",n:"ノモスの声",t:"上に聞かないと、決められない。",v:"09_0124"},{w:"x",n:"係の男の声",t:"……はい。",v:"09_0125"}];
GR_SC.g09_06=[{w:null,t:"通路のつきあたり。"},{w:null,t:"アレク、板の前で止まる。"},{w:null,t:"うしろから、ころころ、と音。"},{w:"elly",t:"あ。さっきの子。",v:"09_0137"},{w:null,t:"ロボットが戸の前に来ると、ぴっ、と小さな音。"},{w:null,t:"アレク、エリーを見る。"},{w:null,t:"三人、戸をくぐる。"},{w:null,t:"掃除のロボットは、裂け目の前の床を、くり返しくり返しふいている。"},{w:"alek",t:"「試験七号。化石の骨から、小さく印刷した子。命令を入れた瞬間に、暴走。……試験は中止」。",v:"09_0145"},{w:"hero",f:"serious",t:"……化石の子って。",v:"09_0147"},{w:"hero",t:"言うこと、聞かなかったんだろ。",v:"09_0148"},{w:"elly",t:"（画面を指でなぞって）オリーヴァ、二つもある。",v:"09_0153"},{w:"elly",t:"「角のある子の家。」……競技場の扉と、ちょっと似てるね。",v:"09_0161"},{w:"alek",t:"……出るぞ。",v:"09_0165"}];
GR_SC.g09_07=[{w:null,t:"細い廊下を、三人が早足で行く。"},{w:null,t:"エリーが、一つの窓の前で、止まる。"},{w:null,t:"エリーは、笑っている。"},{w:null,t:"うしろから来たヤマトが、エリーの背中にぶつかる。"},{w:"hero",t:"おい、何——",v:"09_0173"},{w:null,t:"ヤマト、エリーの横顔を見る。"},{w:null,t:"エリーの腕の中で、クッキーの箱のふたが、内側から持ち上がる。"},{w:null,t:"エリーの足が、動く。"},{w:null,t:"ヤマト、窓の外の白い車を、もう一度だけ見る。"}];
GR_SC.g09_08=[{w:null,t:"天井の高い倉庫。"},{w:null,t:"倉庫の向こうに、大きな搬出の戸。"},{w:null,t:"エリーが、いちばん手前の檻の前にしゃがむ。"},{w:null,t:"エリー、ふたのすきまから羽を出して、柵のすきまから中へ入れる。"},{w:"elly",t:"アレク。",v:"09_0184"},{w:"alek",t:"だめだ。一つ開けたら、全部鳴る。",v:"09_0185"},{w:"elly",t:"じゃあ、全部開けよう。",v:"09_0186"},{w:null,t:"アレク、エリーを見る。"},{w:"hero",t:"（もう檻の留め金をさわりながら）これ、どうやって開けんの。",v:"09_0188"},{w:"alek",t:"さわるな。",v:"09_0189"},{w:null,t:"アレク、倉庫の柱を見回す。"},{w:"x",n:"係の男",t:"主任！　檻が……全部！",v:"09_0200"}];
GR_SC.g09_09=[{w:null,t:"施設の白い屋根から、ドローンが四機、飛び立った。",v:"09_0205"},{w:null,t:"森が深くなる。"},{w:null,t:"森の中を、三人と三体が走る。"},{w:null,t:"ドローンは、葉の屋根の上を飛んでいる。"},{w:"alek",t:"足あとを、読んでる。この泥じゃ、消せない。",v:"09_0209"},{w:null,t:"道が、平らな岩場を横切る。"},{w:null,t:"岩場の向こうは、また泥。"},{w:null,t:"ヤマト、くるっと回る。"},{w:"alek",t:"……何してる。",v:"09_0214"},{w:"hero",t:"足あと、逆。",v:"09_0215"},{w:"elly",t:"牛どろぼうの、赤ちゃん！",v:"09_0218"},{w:"hero",t:"ほらな。こういうのは、おれにまかせろって。",v:"09_0226"}];
GR_SC.g09_10=[{w:null,t:"森がとぎれて、乾いた丘。"},{w:null,t:"ずぶぬれのヤマトが、パーカーをしぼっている。"},{w:null,t:"アレク、岩の上に紙の地図を広げる。"},{w:null,t:"アレク、白い都の点から、港の方へ、指をすべらせる。"},{w:"alek",t:"白い都は、湾のむこう側だ。陸をぐるっと回ったら、大会に間に合わない。",v:"09_0239"},{w:"hero",t:"じゃあ、タクシー。",v:"09_0240"},{w:"alek",t:"乗った瞬間、居場所が会社に行く。",v:"09_0241"},{w:"elly",t:"じゃあ、船！",v:"09_0242"},{w:"alek",t:"人が動かしてる船なら、名簿がない。",v:"09_0243"},{w:"elly",t:"海の船、初めて！",v:"09_0244"},{w:"hero",t:"船なら、まかせろ。",v:"09_0245"},{w:null,t:"エリー、クッキーの箱を開ける。"},{w:null,t:"エリー、そのしっぽを、指でちょんとさわる。"},{w:null,t:"エリー、すぐ顔を上げる。"},{w:"elly",t:"行こ。港。",v:"09_0249"},{w:null,t:"フォルン、もう丘を下りはじめている。"}];
GR_SC.g09_11=[{w:null,t:"明るい部屋。"},{w:null,t:"大きな画面に、森の保護センターの試験室の映像。"},{w:null,t:"画面のはしに、小さな窓。"},{w:null,t:"机の上の通信機から、男の声。"},{w:"x",n:"通信機の声",t:"森のセンターからです。扉の文字が、読まれました。子どもです。",v:"09_0257"},{w:null,t:"赤い爪の指が、声の記録を、もう一度流す。"},{w:"x",n:"エリーの声（記録）",t:"「角のある子の家。」",v:"09_0259"},{w:null,t:"赤い爪の指が、画面のエリーの顔に、とん、と止まる。"},{w:"x",n:"女の声",t:"……この子ね。字が読める子。",v:"09_0261"},{w:null,t:"赤い爪の手が、ケーキにフォークを入れる。"}];
GR_EP[9]={"t": "森の奥の施設", "sc": [["g09_01", "アルカディアの森の外れ・発掘場（夜明け）", 0], ["g09_02", "森の道（朝）", 0], ["g09_03", "森の奥・施設の前（朝）", 0], ["g09_04", "施設の裏口", 0], ["g09_05", "施設の中・見学の通路", 0], ["g09_06", "試験室", 0], ["g09_07", "施設の中・窓のある廊下", 0], ["g09_08", "施設の中・檻の部屋", 0], ["g09_09", "森の中（昼）", 0], ["g09_10", "森の出口（夕方）", 0], ["g09_11", "どこかの部屋（夜）", 0]]};
GR_SC.g10_01=[{w:null,t:"港町ナフリア。白い都へ渡る船は、ここから出る。",v:"10_0019"},{w:null,t:"湾の向こうの長い防波堤の上を、大きな影がゆっくり歩いている。"},{w:null,t:"岸の、網をほす木の台の上に、ヤマト。"},{w:"x",n:"港の子1",t:"あ、タロスだ。",v:"10_0023"},{w:"x",n:"港の子2",t:"百年、ずっと回ってるんだって。",v:"10_0024"},{w:"x",n:"港の子3",t:"昔の島の、青銅の巨人の名前。うちのじいちゃんがつけたの。",v:"10_0025"},{w:"hero",t:"でけえ。……あれ、戦えんの。",v:"10_0026"},{w:"x",n:"港の子1",t:"戦わないよ。歩くだけ。",v:"10_0027"},{w:null,t:"子どもたちの目が、台の下へ下りる。"},{w:"x",n:"港の子2",t:"その狐、お兄ちゃんの？",v:"10_0029"},{w:"hero",t:"おれの。",v:"10_0030"},{w:"x",n:"港の子2",t:"うそだあ。日本の子って、テリオン持っちゃだめなんでしょ。学校で習ったもん。日本だけ、地図が白いの。",v:"10_0031"},{w:null,t:"ヤマト、台の上で、一瞬だけ止まる。"},{w:"x",n:"港の子3",t:"じゃあ、その狐、だれの？",v:"10_0033"},{w:null,t:"子どもたちの目が、フォルンの耳のうしろへ行く。"},{w:"hero",f:"serious",t:"……おれの。",v:"10_0035"},{w:null,t:"子どもたちは、まだ耳のうしろを見ている。"},{w:null,t:"台の下で、フォルンがあくびをする。"},{w:null,t:"防波堤の上で、大きな影が、また一歩。"},{w:null,t:"第10話　港町ナフリア",v:"10_0040"}];
GR_SC.g10_02=[{w:null,t:"連絡船の切符の画面の前。"},{w:"hero",t:"いくら。",v:"10_0047"},{w:"alek",t:"三人で、宿の十二日分。",v:"10_0048"},{w:"hero",t:"じゃあ、歩く。",v:"10_0049"},{w:"alek",t:"湾を回ったら山が二つだ。大会の受付に間に合わない。",v:"10_0050"},{w:"hero",t:"じゃあ、泳ぐ。",v:"10_0051"},{w:"alek",t:"……クロッコに引っぱらせる気か。",v:"10_0052"},{w:null,t:"アレクの足もとで、クロッコが顔を上げる。"},{w:null,t:"エリーは、となりのくじの屋台の前にしゃがんでいる。"},{w:null,t:"広場の奥の桟橋に、白と青の少し古い連絡船。"},{w:"marina",t:"次はだれだい！　勝てば、向こう岸まで、ただ！",v:"10_0056"},{w:null,t:"甲板の手すりに、日焼けした女の人が足をかけている。"},{w:null,t:"船の横の海で、青いクジラが頭から潮をふいて、甲板を洗っている。"},{w:null,t:"潮のしぶきが風に乗って、広場まで飛んでくる。"},{w:null,t:"箱のふたが、ぽんと開く。"},{w:null,t:"クジラが、きゅうっと鳴いて、桟橋の下へもぐる。"},{w:"elly",f:"sad",t:"ごめんね。この子、水がかかると、びっくりするの。",v:"10_0062"},{w:"marina",t:"あたしの子もだよ。電気がかかると、びっくりする。",v:"10_0063"},{w:"alek",t:"……その船、人が動かしてるのか。",v:"10_0064"},{w:"marina",t:"あたしが動かしてる。機械の舵は外しちまった。名簿もとらない。文句あるかい。",v:"10_0065"},{w:"alek",t:"ない。",v:"10_0066"},{w:null,t:"ヤマト、もう桟橋の根もとまで走っている。"},{w:"hero",t:"やる！",v:"10_0068"},{w:"marina",t:"船長のマリナ。負けたら、船代はちゃんともらうよ。",v:"10_0069"},{w:null,t:"エリー、走ってきて、箱のふたを開ける。"},{w:"elly",t:"ピリポンも出る？",v:"10_0071"},{w:null,t:"ヤマト、広場のはしを見る。"},{w:"x",n:"港の子3",t:"その狐、お兄ちゃんの言うこと、聞くの？",v:"10_0073"},{w:null,t:"杭の下で、フォルンがそっぽを向いて、耳をかいている。"},{w:"hero",t:"いい。おれ一人でいい。",v:"10_0075"},{w:"alek",t:"向こうは、海の上だぞ。",v:"10_0076"},{w:"hero",t:"桟橋の上でやればいいだろ。",v:"10_0077"},{w:"alek",t:"向こうは、桟橋に上がってこない。",v:"10_0078"},{w:"hero",t:"じゃあ、上がってくるまで待つ。",v:"10_0079"},{w:"alek",t:"その前に、船が出る。",v:"10_0080"},{w:null,t:"ヤマト、もう聞いていない。"},{w:null,t:"アレクの足もとから、クロッコが、どぼんと海へ飛びこむ。"},{w:"alek",t:"おい。",v:"10_0084"},{w:null,t:"陸ではのそのそ歩くクロッコが、水の中では、すうっと速い。"},{w:null,t:"桟橋の横の海に、古い木の杭が一並び、頭を出している。"},{w:null,t:"港の口から、大きな波が一つ、入ってくる。"},{w:null,t:"クロッコ、とっさに杭にかみつく。"},{w:null,t:"アレク、桟橋のふちで、それをじっと見ている。"},{w:null,t:"くつは、流れていく。"},{w:null,t:"クジラが潮をふく。"},{w:null,t:"網の子が、網で受ける。"}];
GR_SC.g10_03=[{w:null,t:"マリナ、甲板から船の横の海を指さす。"},{w:null,t:"港の口の深い海。"},{w:null,t:"クジラ、沖の海で止まって、こちらを向く。"},{w:"marina",t:"この子が、うちのかしら。こいつが沈んだら、あんたの勝ち。",v:"10_0100"},{w:null,t:"ヤマト、片足だけはだしで、フォルンを桟橋の根もとに出す。"},{w:null,t:"フォルンの体から、火の粉がふわっとあふれる。"},{w:"x",n:"港の子1",t:"……でっか。",v:"10_0103"},{w:null,t:"ヤマト、子どもたちをふり返って、胸をはる。"},{w:null,t:"桟橋の根もとに、エリーとアレク。"},{w:"marina",t:"始めるよ。",v:"10_0106"}];
GR_SC.g10_05=[{w:null,t:"マリナ、手すりから海へ飛びこむ。"},{w:null,t:"アレク、桟橋のふちにしゃがんで、手をのばす。"},{w:null,t:"アレク、パーカーのそでで、クロッコの鼻先の海水をふく。"},{w:null,t:"マリナ、船に上がってくる。"},{w:"marina",t:"勝ったのは、ワニだ。ワニの持ち主と、その連れは、ただ。あしたの昼の便。",v:"10_0190"},{w:null,t:"マリナ、切符を三枚、アレクに差し出す。"},{w:"marina",t:"狐は、負けた方だね。乗せるなら、狐の分は払ってもらう。",v:"10_0192"},{w:null,t:"マリナ、船の中へ入っていく。"},{w:null,t:"広場のはしには、だれもいない。"},{w:null,t:"ヤマト、桟橋の先まで、ゆっくり歩く。"},{w:"hero",t:"……なんで、跳ばないんだよ。杭、すぐそこだっただろ。",v:"10_0197"},{w:"hero",t:"おまえがちゃんとやってたら、勝ってた。",v:"10_0199"},{w:"elly",t:"ヤマト。",v:"10_0201"},{w:"hero",f:"serious",t:"……待て。",v:"10_0205"},{w:"elly",t:"フォルン！",v:"10_0208"},{w:"hero",f:"serious",t:"……いいよ。腹へったら、戻ってくる。",v:"10_0211"}];
GR_SC.g10_06=[{w:null,t:"せまい路地の宿。"},{w:null,t:"せまい部屋に、ベッドが三つ。"},{w:null,t:"アレクは、机の上に残った硬貨を並べている。"},{w:null,t:"エリーは、窓ぎわで、空のオリーブの紙袋を、たたんでは広げている。"},{w:null,t:"ヤマトは、ベッドで壁の方を向いて、寝ころんでいる。"},{w:null,t:"窓の外で、雨が降りだす。"},{w:null,t:"通りを、白い車がゆっくり走っていく。"},{w:null,t:"エリーの手が止まる。"},{w:null,t:"アレク、硬貨を財布にもどす。"},{w:null,t:"ヤマトの背中は、動かない。"}];
GR_SC.g10_07=[{w:"elly",t:"フォルン。……フォルーン。",v:"10_0230"},{w:null,t:"うしろを、アレクが、かさもささずに歩いている。"},{w:null,t:"人のいない桟橋。"},{w:null,t:"エリー、かさをアレクの方へ半分かたむける。"}];
GR_SC.g10_08=[{w:null,t:"ぬれた二人がもどってくる。"},{w:"alek",t:"……回収の車、出てる。",v:"10_0237"},{w:null,t:"ヤマトの背中が、少しだけ固くなる。"},{w:null,t:"明かりが消える。"},{w:null,t:"ヤマトが、目を開けている。"},{w:null,t:"壁に、指で線を引く。"},{w:null,t:"指が、桟橋の丸から左のはしの丸へ、何度も行ったり来たりする。"},{w:null,t:"指が止まる。"},{w:null,t:"指が、桟橋の右へ、ゆっくり動く。"},{w:null,t:"昼間、フォルンが一度だけ首を向けた所。"},{w:null,t:"指が、そこから動かない。"},{w:null,t:"ヤマト、手を引っこめる。"},{w:null,t:"毛布のすきまから、ヤマトの目が、カーテンのすきまを見る。"}];
GR_SC.g10_09=[{w:"x",n:"案内の声",t:"お知らせです。港の見張りロボットは、あしたの正午に止めます。歩いたままでは近づけないため、足を切ります。百年間の長いお勤め、ありがとうございました。",v:"10_0252"},{w:null,t:"防波堤の上を、大きな影がゆっくり歩いてくる。"},{w:null,t:"左のくるぶしに、太い古い鉄の栓。"},{w:null,t:"大きな足が、上がって、下りる。"},{w:null,t:"雨が、その火をかくす。"},{w:null,t:"ロボットは、止まらずに、雨の中を回っていく。"}];
GR_EP[10]={"t": "港町ナフリア", "sc": [["g10_01", "ナフリアの港（朝）", 0], ["g10_02", "港の広場", 0], ["g10_03", "向かい合う", 0], ["g10_04", "勝負", 1], ["g10_05", "勝負のあと", 0], ["g10_06", "港の裏の安い宿（夜）", 0], ["g10_07", "港の路地（夜・雨）", 0], ["g10_08", "宿（夜ふけ）", 0], ["g10_09", "港のはし（夜・雨）", 0]]};
GR_SC.g11_01=[{w:null,t:"雨は、夜どおしやまなかった。",v:"11_0020"},{w:null,t:"まだ暗い部屋。"},{w:null,t:"ヤマトが、そっとベッドから起きる。"},{w:null,t:"アレクは、壁を向いて寝ている。"},{w:null,t:"ヤマトがドアノブに手をかけた時、うしろから小さな銀色の物が飛んでくる。"},{w:null,t:"ヤマト、ふり向く。"},{w:null,t:"机の上に、きのうは三枚だった硬貨が、二枚。"},{w:null,t:"ヤマト、硬貨を拾う。"},{w:null,t:"となりのベッドで、エリーが目を開ける。"},{w:null,t:"第11話　雨上がり",v:"11_0030"}];
GR_SC.g11_02=[{w:null,t:"港の朝市は、雨でも開く。",v:"11_0036"},{w:null,t:"雨よけの布の下。"},{w:null,t:"ヤマト、硬貨を台に置いて、たるを指さす。"},{w:null,t:"ヤマト、包みをポケットに押しこむ。"},{w:null,t:"うしろから、エリーがかさを開いて、ヤマトの頭の上にさしかける。"}];
GR_SC.g11_03=[{w:null,t:"雨の防波堤。"},{w:null,t:"防波堤の根もとに、白い回収車。"},{w:null,t:"エリー、ヤマトに追いついて、見上げる。"},{w:null,t:"大きな足が下りるたび、少しだけ横をずれて下りる。"},{w:null,t:"回収のレンズが、防波堤の上をなめていく。"},{w:null,t:"ヤマト、道のまん中で立ち止まる。"},{w:null,t:"フォルンも、止まる。"},{w:null,t:"ロボットは、二人のあいだを、ずしん、と通りすぎていく。"},{w:null,t:"ヤマト、右手を上げかける。"},{w:null,t:"指が、止まる。"},{w:null,t:"ヤマト、手を下ろす。"},{w:null,t:"水たまりに、大きな足あとと、小さな四つ足のあとが、港のはしまで、ずっと並んでいる。"},{w:null,t:"ヤマト、包みからオリーブを一つ出す。"},{w:null,t:"フォルン、オリーブを見る。"},{w:null,t:"ヤマトの手も、動かない。"},{w:null,t:"うしろで、ロボットが一回りして、また近づいてくる。"},{w:null,t:"フォルン、首をのばす。"},{w:null,t:"フォルン、オリーブをしっぽの火の上に落とす。"},{w:null,t:"うしろで、エリーが、かさを二本持ったまま立っている。"},{w:null,t:"ヤマトの顔が、ゆっくりゆるむ。"},{w:"hero",t:"（エリーに）ほらな。腹へったら、戻ってくるって。",v:"11_0064"},{w:"elly",t:"ヤマト、ゆうべ、ごはん、残してた。",v:"11_0065"},{w:"hero",t:"残してない。",v:"11_0066"},{w:"elly",t:"三口。",v:"11_0067"},{w:"hero",f:"serious",t:"……二口。",v:"11_0068"},{w:null,t:"エリー、かさを開いて、くるくる回しながら、そっぽを向く。"},{w:null,t:"ヤマト、フォルンの頭を、わしわしとなでる。"},{w:null,t:"ヤマトの手が止まった時には、フォルン、二つ目のオリーブを、勝手にヤマトのポケットから出して焼いている。"}];
GR_SC.g11_04=[{w:null,t:"ロボットが、港を一回りして、またこっちへ来る。"},{w:null,t:"防波堤の、古い石の段の前。"},{w:null,t:"ロボット、また歩きだす。"},{w:null,t:"次の一回り。"},{w:null,t:"エリー、段の横の壁に近づく。"},{w:null,t:"段の上に、さびた油さしが三つ、並んだまま。"},{w:"elly",t:"ヤマト。これ、あの子だよ。",v:"11_0081"},{w:null,t:"ヤマト、タイルの絵を見る。"},{w:null,t:"空が、低く光る。"},{w:null,t:"エリーのカバンの中で、クッキーの箱のふたが、ぽんとはね上がる。"},{w:"elly",t:"だいじょうぶ、だいじょうぶ。雷さん、遠いよ。",v:"11_0085"},{w:null,t:"エリー、首のピリポンをなでる。"}];
GR_SC.g11_05=[{w:null,t:"防波堤の根もとに、黄色い解体の機械が集まってくる。"},{w:null,t:"作業員たちが、ロボットの通り道に柵を立てていく。"},{w:"x",n:"案内の声",t:"正午から、足の切断を始めます。近づかないでください。",v:"11_0091"},{w:null,t:"かさをさして、マリナが歩いてくる。"},{w:null,t:"アレクも来ている。"},{w:"marina",t:"あたしが子どもの時は、あの段の前で、じいさんたちが毎朝、油をさしてた。栓を抜くと、あいつ、海の方を向いて座って、待ってたっけ。",v:"11_0094"},{w:"alek",t:"……今は。",v:"11_0095"},{w:"marina",t:"じいさんたちが、いなくなった。機械の点検は、機械がやる。あいつは、点検の表に入ってない。",v:"11_0096"},{w:null,t:"黄色い機械の切断の腕が、ためしに一回うなる。"},{w:null,t:"ロボットが、また段の前で止まる。"},{w:"x",n:"作業員",t:"おい、子ども！",v:"11_0101"},{w:"marina",t:"ちょっと！",v:"11_0102"}];
GR_SC.g11_06=[{w:null,t:"ロボットは、倒れない。"},{w:null,t:"ゆっくり、歩きだす。"},{w:null,t:"朝市の前を通る。"},{w:null,t:"連絡船の前を通る。"},{w:null,t:"解体の機械の前を通る。"},{w:null,t:"防波堤のいちばん先。"},{w:null,t:"ゆっくり、ひざを折る。"},{w:null,t:"片目の光が、ゆっくり暗くなって、消える。"},{w:null,t:"作業員の手首の画面に、字。"},{w:null,t:"黄色い機械のエンジンが、一台ずつ止まる。"}];
GR_SC.g11_07=[{w:null,t:"ぬれた桟橋が、日の光で光っている。"},{w:null,t:"船を待つ人たち。"},{w:null,t:"いちばんうしろの方に、三人。"},{w:null,t:"桟橋の屋台。"},{w:null,t:"アレク、財布の中を見る。"},{w:"alek",t:"……狐の分が、ない。",v:"11_0135"},{w:"hero",t:"リュックに入れりゃいいだろ。",v:"11_0136"},{w:null,t:"ヤマト、リュックの口を開ける。"},{w:null,t:"ヤマト、リュックを背負う。"},{w:null,t:"リュックの口から、しっぽの火の先だけ、ぴょこんと出ている。"},{w:null,t:"ヤマト、あわてて口を広げる。"},{w:"elly",t:"ピリポンの箱、貸してあげる。",v:"11_0141"},{w:null,t:"エリー、クッキーの箱のふたを開ける。"},{w:null,t:"フォルン、空いた箱に、するっと入る。"},{w:null,t:"レンズが、三人の足もとをなめる。"},{w:null,t:"箱のすきまから、うすいけむり。"},{w:null,t:"船の手すりの上から、紙が一枚、ひらひら落ちてくる。"},{w:null,t:"手書きの切符。"},{w:null,t:"ヤマト、上を見る。"},{w:null,t:"船に上がったところで、箱のふたが、ぱかっと開く。"}];
GR_SC.g11_08=[{w:null,t:"向こう岸まで、船で半日。",v:"11_0152"},{w:null,t:"連絡船が、港を出ていく。"},{w:null,t:"防波堤のいちばん先に、座ったままのロボット。"},{w:null,t:"足もとの段で、魚屋のおばさんが、さびた油さしを一つ、くるぶしの横に置く。"},{w:null,t:"エリー、手すりから、両手で大きく手をふる。"},{w:null,t:"ヤマト、手すりにひじをついて、胸をそらしている。"},{w:"hero",t:"船、楽勝。おれ、ゆれるの強いから。",v:"11_0158"},{w:"alek",t:"まだ港の中だ。",v:"11_0159"},{w:"hero",t:"港の外でも強いって。",v:"11_0160"},{w:null,t:"船が、防波堤の外へ出る。"},{w:null,t:"ヤマト、ひじをついたまま、だまる。"},{w:null,t:"船が、上がる。"},{w:null,t:"となりの手すりの上で、フォルンが、ヤマトのポケットから持ってきた最後のオリーブを、しっぽの火で焼きはじめる。"},{w:null,t:"ヤマト、においから顔をそむける。"},{w:"elly",t:"強いんだよね。",v:"11_0168"},{w:"hero",f:"serious",t:"……強い。",v:"11_0169"},{w:"elly",t:"お月さま？　昼なのに。",v:"11_0174"},{w:"alek",t:"昼も出てる。",v:"11_0175"},{w:"elly",t:"ふうん。何、見てるの。",v:"11_0176"},{w:"alek",t:"……かげ。山のかげ。",v:"11_0177"}];
GR_SC.g11_09=[{w:null,t:"向こう岸の船着き場。"},{w:null,t:"ヤマトが、桟橋の板の上に、大の字になっている。"},{w:"marina",t:"（船の上から、三人の方を見ずに）次は、船代ちゃんと払える日に来な。",v:"11_0186"},{w:"elly",t:"ありがとう、マリナさん！",v:"11_0187"},{w:null,t:"マリナ、背中を向けたまま、片手だけ上げる。"},{w:null,t:"道の入口に、古い柵。"},{w:null,t:"看板の上に、新しいシールが一枚、まっすぐに貼ってある。"},{w:null,t:"アレクの足が、止まる。"},{w:null,t:"うしろで、船が汽笛を鳴らして、岸をはなれていく。"},{w:null,t:"桟橋の上で、ヤマトがまだ大の字のまま、汽笛の方へ首だけ向ける。"}];
GR_EP[11]={"t": "雨上がり", "sc": [["g11_01", "港の裏の宿（夜明け前・雨）", 0], ["g11_02", "朝市（夜明け・雨）", 0], ["g11_03", "防波堤の道（朝・雨）", 0], ["g11_04", "防波堤・古い石の段（朝・雨）", 0], ["g11_05", "防波堤（昼前・雨）", 0], ["g11_06", "港（正午・雨がやんでいく）", 0], ["g11_07", "連絡船の桟橋（昼）", 0], ["g11_08", "連絡船の上（午後）", 0], ["g11_09", "向こう岸（夕方）", 0]]};
GR_SC.g12_01=[{w:null,t:"獅子門の丘の見学の門。"},{w:null,t:"明るい部屋。"},{w:null,t:"壁の画面に、止めた映像。"},{w:null,t:"となりの小さな窓に、文字が流れている。"},{w:null,t:"赤い爪の指が、「該当なし」を、とん、とたたく。"},{w:null,t:"画面のすみで、ぽん。"},{w:null,t:"赤い爪の手が、ケーキにフォークを入れる。"},{w:null,t:"女の手が、白い日傘を取る。"},{w:null,t:"第12話　獅子門の丘",v:"12_0029"}];
GR_SC.g12_02=[{w:null,t:"獅子門の丘。三千年前の王の城あとだ。今は、アイギス社が管理している。",v:"12_0035"},{w:null,t:"船着き場の、屋根だけの待合。"},{w:null,t:"船着き場からの道は、丘の上で行き止まり。"},{w:null,t:"アレク、紙の地図を広げる。"},{w:"alek",t:"……北へ抜ける道は、あの門の中だけだ。",v:"12_0039"},{w:"hero",t:"ご自由に、だって。ただで、名簿もなし。",v:"12_0040"},{w:"alek",t:"ただ、ってのが気にいらない。",v:"12_0041"},{w:"hero",t:"なんで。",v:"12_0042"},{w:"alek",t:"向こうが、何かほしいからだ。",v:"12_0043"},{w:null,t:"ヤマト、もう門をくぐっている。"},{w:"hero",t:"ほしいのは、こっちの見学だろ。",v:"12_0045"},{w:null,t:"エリー、看板に、ぺこりと頭を下げてから、くぐる。"},{w:null,t:"アレク、門の柱を見上げる。"},{w:null,t:"アレク、クロッコの背中を軽くたたく。"}];
GR_SC.g12_03=[{w:null,t:"見学の客が、二十人ほど。"},{w:"x",n:"案内のロボット",t:"ようこそ、獅子門の丘へ！　本日のお客さまは、二十一名さまと、テリオン三体さまです！",v:"12_0052"},{w:null,t:"客の足もとに、小さな丸い耳の子を抱いた女の子。"},{w:null,t:"ロボットの顔の光が、足もとを一つずつなめていく。"},{w:null,t:"フォルンで、ぴっ。"},{w:"x",n:"案内のロボット",t:"お知らせでーす！　登録の確認できない狐さまを、お連れのお客さまがいらっしゃいまーす！　あとで受付まで、おこしくださーい！",v:"12_0056"},{w:null,t:"客が、いっせいにふり向く。"},{w:null,t:"ヤマト、とっさにフォルンをだき上げて、パーカーのおなかに押しこむ。"},{w:null,t:"パーカーのおなかが、もこもこ動く。"},{w:null,t:"客たちが、手首の画面をかざして写真をとる。"},{w:null,t:"ヤマト、客に小さく会釈する。"},{w:null,t:"エリーは、ロボットの旗に、両手で手をふっている。"},{w:"x",n:"案内のロボット",t:"この町を作った英雄は、見た者を石にしてしまう、おそろしい怪物をたおしました！　怪物の目を見ないように、ぴかぴかにみがいた盾に映して、うしろ向きに近づいたのです！",v:"12_0064"},{w:null,t:"女の子が、腕の丸い耳の子の目を、手でかくす。"},{w:"x",n:"案内のロボット",t:"たおした怪物の顔は、知恵の女神の盾に、かざられました！　その盾の名前は——アイギス！　わが社の名前は、ここからいただきました！",v:"12_0066"},{w:null,t:"ロボットが、自分の胸の印を、旗の先でこんこんとたたく。"},{w:null,t:"ヤマト、ロボットの胸の印を見る。"},{w:"hero",t:"……あの会社のマーク、怪物の顔がついた盾かよ。なんで、そんなのマークにすんだよ。",v:"12_0069"},{w:null,t:"アレク、答えない。"},{w:null,t:"エリーは、坂のわきの小さな黄色い花をつんでいる。"}];
GR_SC.g12_04=[{w:null,t:"大きな石の門。"},{w:"x",n:"老人",t:"（となりのアレクに）頭は、どうしたんだね。",v:"12_0075"},{w:"alek",t:"……別の石で作って、はめてあった。だれかが持っていった。",v:"12_0076"},{w:null,t:"老人、うなずいて、アレクの手に硬貨を一枚にぎらせる。"},{w:null,t:"ヤマト、門の下で、獅子の渦巻く毛を見上げている。"},{w:null,t:"エリー、門のわきの石の古い文字に、顔を近づける。"},{w:"elly",t:"「この門をくぐる者は、獅子の見る前で、手を洗え」だって。",v:"12_0080"},{w:null,t:"エリー、自分の手のひらを見る。"},{w:null,t:"客のうしろから、ぱちぱちぱち、と小さな拍手。"},{w:"bella",t:"すごい。今の、古いギリシャ語でしょう？　声に出して読める子、初めて見たわ。",v:"12_0083"},{w:null,t:"白い日傘の、若い女の人。"},{w:null,t:"アレクの肩が、ぴくりと固くなる。"},{w:"bella",t:"アイギス社のベラドンナ。ここの持ち主、ってことになってるの。",v:"12_0086"},{w:"elly",t:"社長さん？　すごい！",v:"12_0087"},{w:"bella",t:"すごいのは、あなたよ。こんなにすらすら読む子、うちの学者にもいないの。",v:"12_0088"},{w:"elly",t:"ほんと？　おばあちゃんにしか、ほめられたことない。",v:"12_0089"},{w:"bella",t:"じゃあ、二人目ね。お名前は？",v:"12_0090"},{w:"elly",t:"エリー！　オリーヴァ村の。おばあちゃん、昔、研究所にいたんだよ。",v:"12_0091"},{w:null,t:"アレクの指が、エリーのそでをつまむ。"},{w:"bella",t:"よかったら、お茶でもどう？　ケーキがあるの。三人と、その子たちの分も。",v:"12_0093"},{w:"elly",t:"ケーキ！",v:"12_0094"},{w:"alek",t:"……先を急ぐ。",v:"12_0095"},{w:"bella",t:"ご心配なく。今日は、見に来ただけ。",v:"12_0096"},{w:null,t:"ベラドンナ、うしろの見回りの二人を、ふり返りもせずに、手のひらで止める。"},{w:null,t:"エリー、アレクの指から、そでをするりと抜く。"},{w:null,t:"ヤマトとアレク、顔を見合わせる。"},{w:"hero",f:"serious",t:"……ケーキって、言ったよな。",v:"12_0100"},{w:"alek",t:"言った。",v:"12_0101"},{w:null,t:"二人、歩きだす。"}];
GR_SC.g12_05=[{w:null,t:"丘のてっぺんの、ガラスの建物。三千年前の城あとを、見下ろす部屋だ。",v:"12_0108"},{w:null,t:"白い、広い部屋。"},{w:null,t:"白い机に、ケーキが並ぶ。"},{w:null,t:"エリーは、ベラドンナのとなりで足をぶらぶらさせている。"},{w:null,t:"ヤマトは、いすのはしに浅く座っている。"},{w:null,t:"アレクは、座らない。"},{w:null,t:"ベラドンナが、指を一つ鳴らす。"},{w:"x",n:"画面のベラドンナ",t:"——古代の力を、チップで。",v:"12_0115"},{w:null,t:"ヤマトの手のフォークが、皿に当たって、かちんと鳴る。"},{w:null,t:"アレクは、窓ガラスに映った画面の字を見ている。"},{w:null,t:"ベラドンナは、画面ではなく、三人の顔を見ている。"},{w:null,t:"ベラドンナ、もう一度、指を鳴らす。"},{w:"bella",t:"食べて食べて。",v:"12_0120"},{w:null,t:"ヤマト、ケーキを見る。"},{w:null,t:"フォークで、いちごのケーキをひと口。"},{w:null,t:"ヤマトの皿が、空になる。"},{w:"hero",f:"serious",t:"……焦げても、うまい。",v:"12_0127"},{w:"bella",t:"その狐ちゃん、登録がないんですってね。うちの施設なら、きょうにでも登録できるわよ。チップを一つ入れるだけ。痛くないの。",v:"12_0130"},{w:"hero",f:"serious",t:"……いい。自分でやる。",v:"12_0134"},{w:"bella",t:"そう。十五歳まで、待つの？",v:"12_0135"},{w:"bella",t:"エリーちゃん。おばあさま、研究者だったのよね。何か、預かってない？　大事な物。",v:"12_0138"},{w:"elly",t:"大事な物？　うーん……",v:"12_0140"},{w:"elly",t:"ねえ、あの獅子の頭、どこ行ったんだろうね。しっぽは残ってるのに。ほら、くるんってなってる。",v:"12_0143"},{w:"bella",t:"……また今度、ゆっくりね。",v:"12_0146"},{w:"bella",t:"困ったら、いつでも。",v:"12_0148"},{w:"elly",t:"「アイギス社　社長　ベラドンナ」。……名刺！　初めてもらった。",v:"12_0149"}];
GR_SC.g12_06=[{w:null,t:"建物の裏の、北へ下りる石の道。"},{w:"x",n:"見回りの男",t:"どうぞ。社長から、お通ししろと。",v:"12_0155"},{w:null,t:"三人、門を出る。"},{w:null,t:"坂を少し下りた所で、アレクがふり返る。"},{w:"elly",t:"いい人だったね。ケーキ、おいしかった。",v:"12_0158"},{w:"hero",t:"うまかった。",v:"12_0159"},{w:null,t:"ヤマト、自分の手を見る。"},{w:"hero",f:"serious",t:"……アレク。あの画面の。古代って。",v:"12_0161"},{w:"alek",t:"聞こえた。",v:"12_0162"},{w:"hero",t:"チップって。",v:"12_0163"},{w:"alek",t:"聞こえた。",v:"12_0164"},{w:null,t:"アレク、それ以上言わない。"},{w:null,t:"エリー、二人の顔を見る。"},{w:null,t:"坂の下に、古い店が一軒。"},{w:"elly",t:"あ、電話。おばあちゃんに、名刺もらったって言わなきゃ。",v:"12_0168"},{w:null,t:"エリー、店に走っていく。"}];
GR_SC.g12_07=[{w:null,t:"丘の西の道。"},{w:null,t:"日傘をたたんで、ベラドンナがうしろの席に乗る。"},{w:null,t:"となりの席。"},{w:"x",n:"影の男",t:"鍵は。",v:"12_0176"},{w:"bella",t:"かわいい子でした。字は、うちのどの学者より読めます。おばあさまの物は、まだ。",v:"12_0177"},{w:null,t:"ベラドンナ、見回りへの指示を打つ。"},{w:null,t:"黒い手袋の手が、横からのびて、画面の上に、ふたをするようにのる。"},{w:null,t:"赤い爪の指が、止まる。"},{w:null,t:"手袋の指が、写真の女の子の顔を、一回だけ、とんとたたく。"},{w:"x",n:"影の男",t:"その子も、いっしょに連れてきなさい。",v:"12_0182"},{w:null,t:"ベラドンナの笑顔が、消える。"},{w:null,t:"ベラドンナ、打った字を一文字ずつ消す。"},{w:"bella",t:"……はい。",v:"12_0185"},{w:null,t:"男は、一度もベラドンナを見ない。"},{w:null,t:"車が動きだす。"}];
GR_SC.g12_08=[{w:null,t:"乾いた道が、北へ長くのびている。"},{w:null,t:"三人と三体が歩いている。"},{w:"hero",t:"あれ、こえたら、白い都？",v:"12_0192"},{w:"alek",t:"あれをこえて、もう少し。",v:"12_0193"},{w:"hero",t:"あれ、雪じゃん。",v:"12_0194"},{w:"alek",t:"雪だ。",v:"12_0195"},{w:"hero",t:"おれ、雪、強いから。",v:"12_0196"},{w:"alek",t:"船も強かったな。",v:"12_0197"},{w:null,t:"ヤマト、だまる。"},{w:null,t:"エリー、二人のうしろを、くるくる回りながら歩いている。"},{w:null,t:"フォルンが、ふり返って、丘の上をしばらく見る。"},{w:null,t:"フォルン、前を向く。"}];
GR_SC.g12_09=[{w:null,t:"村はずれの古い石の家。"},{w:null,t:"机の上の古い電話。"},{w:"x",n:"エリーの声（留守番電話）",t:"おばあちゃん！　エリーだよ。きょうね、丘の上ですっごく親切な社長さんにケーキもらったの。名刺も。ベラドンナさんっていうの。おばあちゃんのこと、聞かれたよ。また電話するね！",v:"12_0206"},{w:null,t:"しわのある手が、ボタンを押して、声を止める。"},{w:null,t:"手が、棚の写真立てにのびる。"},{w:null,t:"手が、写真の上で止まる。"},{w:null,t:"窓の外で、オリーブの葉が、風でさわさわ鳴っている。"},{w:null,t:"手が、写真立てを伏せる。"}];
GR_EP[12]={"t": "獅子門の丘", "sc": [["g12_01", "獅子門の丘・見学の門〜どこかの部屋（朝）", 0], ["g12_02", "船着き場〜見学の門（朝）", 0], ["g12_03", "城あとの坂道（朝）", 0], ["g12_04", "獅子の門（昼前）", 0], ["g12_05", "丘の上・アイギス社の応接間（昼）", 0], ["g12_06", "丘の北の出口〜坂の下（昼すぎ）", 0], ["g12_07", "丘の反対側の道（昼すぎ）", 0], ["g12_08", "北への道（夕方）", 0], ["g12_09", "オリーヴァ村・おばあさんの家（夜）", 0]]};
GR_SC.g13_01=[{w:null,t:"白い都へ行くには、この山を越えるのが一番の近道だ。冬でなければ。",v:"13_0021"},{w:null,t:"横なぐりの雪。"},{w:null,t:"雷が光るたびに、石塚の上に大きな影が浮かぶ。"},{w:null,t:"下の谷から、赤い光を点滅させて、白い救助のドローンがのぼってくる。"},{w:"x",n:"救助のAIの声",t:"救助に、向かいます。到着まで、あと四分。",v:"13_0025"},{w:null,t:"影が、石塚の上で槌をふり上げる。"},{w:null,t:"太い雷が、空を横切って、遠いドローンのすぐ横の岩に落ちる。"},{w:"x",n:"救助のAIの声",t:"落雷のため、引き返します。再開は、天候の回復後です。",v:"13_0028"},{w:null,t:"第13話　雲の山道",v:"13_0031"}];
GR_SC.g13_02=[{w:null,t:"その日の昼。まだ、晴れていた。",v:"13_0037"},{w:null,t:"晴れた山道。"},{w:null,t:"先頭で、アレクが紙の地図を見ながら登る。"},{w:"elly",t:"ねえ、白い都まで、あとどのくらい？",v:"13_0040"},{w:"alek",t:"この山を越えて、運河の町を抜けて、谷を一つ。大会には、ぎりぎり間に合う。",v:"13_0041"},{w:"hero",t:"ぎりぎりって、どのくらい？",v:"13_0042"},{w:"alek",t:"一日でも止まったら、間に合わない。",v:"13_0043"},{w:null,t:"ヤマト、道ばたの雪に気づく。"},{w:"hero",t:"雪！　東京じゃ、画面でしか見たことない！",v:"13_0045"},{w:null,t:"アレク、ふり返らずに、いただきを指さす。"},{w:"alek",t:"あれが下りてきたら、止まれ。道が消える。",v:"13_0047"},{w:"hero",t:"はーい。",v:"13_0048"},{w:null,t:"ヤマト、もう聞いていない。"},{w:"alek",t:"おい。",v:"13_0050"},{w:"hero",t:"一回だけ！",v:"13_0051"},{w:null,t:"ヤマト、雪をける。"},{w:"hero",f:"surprised",t:"うおおおお！　はええ！",v:"13_0053"},{w:null,t:"赤い上着が、白い斜面の下へみるみる小さくなる。"},{w:"hero",f:"surprised",t:"見たー！？",v:"13_0055"},{w:null,t:"アレク、だまって、下りてくる雲を指さす。"},{w:null,t:"ヤマト、斜面を見上げる。"},{w:null,t:"のぼりはじめる。"},{w:null,t:"フォルンが、上から一直線に駆け下りてきて、ヤマトのリュックの上に、ぴょんと乗る。"},{w:"hero",f:"serious",t:"……重いって。",v:"13_0060"},{w:null,t:"フォルン、座ったまま、あくび。"},{w:null,t:"道のすぐ横に、さっきよりもっと長い斜面。"}];
GR_SC.g13_03=[{w:null,t:"アレク、地図をポケットに入れる。"},{w:"alek",t:"ヤマト、おれの上着。エリー、ヤマトの上着。",v:"13_0069"},{w:null,t:"ヤマトがアレクのすそをつかむ。"},{w:"alek",t:"避難小屋まで、百二十歩。さっきの岩から。",v:"13_0071"},{w:null,t:"アレク、歩きだす。"},{w:"alek",t:"……百十九。",v:"13_0073"},{w:null,t:"アレクの手のひらが、冷たい石の壁にさわる。"}];
GR_SC.g13_04=[{w:null,t:"石を積んだ低い小屋。"},{w:null,t:"小屋の手前の雪の上に、赤い登山服の男が、うつぶせに倒れている。"},{w:null,t:"雪の上に、戸口から男の方へ、子どもの足あとが何本も。"},{w:"elly",t:"人！",v:"13_0080"},{w:null,t:"レン、ヤマトを見る。"},{w:"hero",f:"serious",t:"……レン？",v:"13_0083"},{w:null,t:"レンの足もとで、黄色と黒のトラの子が、戸口の内側に立っている。"},{w:null,t:"レンの手もとの画面に、字。"},{w:null,t:"レン、画面を指でおす。"},{w:null,t:"エリー、赤い箱を開けて、古い受話器をつかむ。"},{w:"elly",t:"救助、お願いします！　人が倒れてて——",v:"13_0088"},{w:"x",n:"救助のAIの声",t:"現在、たいへん混み合っております。順番に、おうかがいします。",v:"13_0089"},{w:null,t:"フォルンが、ヤマトの胸から飛び下りる。"},{w:null,t:"ヤマト、男の腕を肩にかけようとする。"},{w:null,t:"反対側に、レンがしゃがむ。"},{w:null,t:"二人、目を合わせない。"},{w:null,t:"戸口の内側で、ライガが、運ばれてくる男を見上げている。"}];
GR_SC.g13_05=[{w:null,t:"だんろの火。"},{w:"x",n:"登山服のAIの声",t:"体温が、もどりつつあります。左足の指の温度が、まだ低いままです。",v:"13_0098"},{w:null,t:"男、子ども四人と、小さなテリオン四体を見る。"},{w:"x",n:"登山家",t:"坊主は、一人か。",v:"13_0100"},{w:null,t:"レン、答えない。"},{w:null,t:"窓の外が、まっ白に光る。"},{w:"x",n:"登山家",t:"……峠の主だ。冬になると下りてくる。空を飛ぶ物が大きらいでな。あいつがいる間は、ドローンは来ない。",v:"13_0103"},{w:null,t:"かち、かち、かち。"},{w:null,t:"エリー、うとうとして、こてんとヤマトの肩に寄りかかって寝る。"},{w:null,t:"フォルンが、男のひざの前で丸くなる。"},{w:"x",n:"登山家",t:"火ってのは、昔は、神さまの物だったんだってさ。それを、こっそり人に渡した神さまがいて、怒られて、山にしばられたんだと。ちょうど、こういう山に。",v:"13_0108"},{w:"hero",t:"しばられて、どうなったの。",v:"13_0109"},{w:"x",n:"登山家",t:"さあな。毎日、鳥につつかれてたらしい。",v:"13_0110"},{w:"hero",f:"serious",t:"……ひでえ。",v:"13_0111"}];
GR_SC.g13_06=[{w:null,t:"朝なのに、窓の外はまっ白。"},{w:null,t:"エリーが、袖をまくって、だんろの前に缶詰を並べている。"},{w:"elly",t:"ヤマト、まき。二本。レンくん、お湯。アレク、缶切り、どこ。",v:"13_0117"},{w:"alek",t:"棚の、いちばん上。",v:"13_0118"},{w:"elly",t:"とどかない。",v:"13_0119"},{w:null,t:"アレク、取ってわたす。"},{w:null,t:"エリー、缶詰をあけて、スプーンを配る。"},{w:null,t:"エリーの前には、何もない。"},{w:null,t:"ヤマト、自分の缶詰を見る。"},{w:null,t:"エリー、缶詰を見る。"},{w:null,t:"エリー、安全ピンを出して、レンのジャージの裂けた袖を、三つとめる。"},{w:"x",n:"登山服のAIの声",t:"左足の指の温度が、さらに下がっています。",v:"13_0126"},{w:"hero",t:"峠のやつ、どかせばいいんだろ。",v:"13_0130"},{w:"alek",t:"この雪じゃ、相手が見えない。",v:"13_0131"},{w:"hero",t:"じゃあ、いつ。",v:"13_0132"},{w:"alek",t:"やんだら。",v:"13_0133"}];
GR_SC.g13_07=[{w:null,t:"風の音が、ふっと止まる。"},{w:null,t:"谷の下から、赤い光の救助のドローンがのぼってくる。"},{w:"x",n:"救助のAIの声",t:"天候が、回復しました。救助に、向かいます。",v:"13_0142"},{w:null,t:"石塚の上に、雲の毛の大きな影が立ち上がる。"},{w:null,t:"ドローンが、ふらつきながら小屋の方へ逃げてくる。"},{w:null,t:"影が、石塚をけって追ってくる。"},{w:null,t:"ドローンは、もう谷へ消えている。"},{w:null,t:"影は、うしろの石塚を、ちらっとふり返る。"},{w:null,t:"ヤマトが、戸口から、それを見ている。"},{w:null,t:"小屋の横の、雪にうもれかけた古い柱が、ぴっと鳴る。"},{w:"x",n:"登山道の柱の声",t:"野生のテリオン、トールガです。近くの方は、建物の中へ。",v:"13_0150"}];
GR_SC.g13_08=[{w:null,t:"トールガは、石塚の上にもどっている。"},{w:null,t:"ヤマト、戸口の前でフォルンを下ろす。"},{w:null,t:"エリーの箱から、ピリポン。"},{w:null,t:"アレクのクロッコ。"},{w:null,t:"ヤマトは、小屋の戸口の前に立つ。"}];
GR_SC.g13_10=[{w:null,t:"フォルレオンの体が、ふわっと光る。"},{w:null,t:"ヤマト、戸口から走り出る。"},{w:null,t:"フォルン、ヤマトを見上げる。"},{w:null,t:"雪原の向こうで、トールガが起き上がる。"},{w:null,t:"トールガ、背を向ける。"},{w:"x",n:"登山服のAIの声",t:"天候が回復しました。夜間の山の飛行は、規則で行っておりません。救助は、あすの朝、七時に到着します。",v:"13_0218"},{w:"x",n:"登山家",t:"……七時か。",v:"13_0219"}];
GR_SC.g13_11=[{w:null,t:"だんろの火。"},{w:null,t:"レンのとなりで、ライガが丸くなっている。"},{w:null,t:"ヤマトのひざで、フォルンが寝ている。"},{w:null,t:"レンの目が、フォルンへ行く。"},{w:"hero",f:"serious",t:"……なんだよ。",v:"13_0226"},{w:"dimi",t:"別に。",v:"13_0227"},{w:null,t:"レン、まきを一本足す。"},{w:"hero",t:"レン、白い都の大会、出んの。",v:"13_0229"},{w:"dimi",t:"出る。",v:"13_0230"},{w:"hero",f:"serious",t:"……おれも。",v:"13_0231"},{w:"dimi",t:"登録、ないだろ。その狐。",v:"13_0232"},{w:"hero",t:"だから、出んの。",v:"13_0233"},{w:null,t:"レン、何か言いかけて、やめる。"}];
GR_SC.g13_12=[{w:null,t:"戸が、そっと開く。"},{w:null,t:"レン、雪の道を峠の方へ歩いていく。"},{w:null,t:"小屋の壁の板。"}];
GR_SC.g13_13=[{w:"x",n:"救助のAIの声",t:"お待たせしました。ご利用、ありがとうございます。",v:"13_0243"},{w:null,t:"男が、担架に乗せられる。"},{w:null,t:"エリー、壁の板の「決勝」を、指でなぞっている。"},{w:"elly",t:"レンくんの字？",v:"13_0246"},{w:"hero",f:"serious",t:"……さあ。",v:"13_0247"},{w:null,t:"ヤマト、リュックをしょって、先に戸口を出る。"},{w:"alek",t:"一日、なくした。",v:"13_0249"},{w:"elly",t:"でも、間に合う？",v:"13_0250"},{w:"alek",t:"……走ればな。",v:"13_0251"}];
GR_SC.g13_14=[{w:null,t:"峠の向こう側。"},{w:null,t:"店先のワゴンに、色ちがいの毛糸のマフラーの山。"},{w:null,t:"エリー、からし色を首に巻く。"},{w:null,t:"エリー、赤いのを、ヤマトにわたす。"},{w:"hero",t:"赤とか、目立つじゃん。",v:"13_0258"},{w:"elly",t:"ヤマト、目立つの好きでしょ。",v:"13_0259"},{w:null,t:"ヤマト、だまって巻く。"},{w:null,t:"アレクが、財布をさかさにふる。"},{w:"x",n:"店のおばあさん",t:"冬の売れ残りだからね。ほつれてても、文句なしだよ。",v:"13_0262"},{w:null,t:"ヤマト、赤いマフラーのはしから出た毛糸を、指で引っぱる。"},{w:"alek",t:"引っぱるな。",v:"13_0264"},{w:null,t:"ヤマト、あわてて毛糸を押しこむ。"},{w:null,t:"町の向こう。"}];
GR_SC.g13_15=[{w:null,t:"三人の横を、白い大きな車が追いこしていく。"},{w:null,t:"男、ペンで、写真の横に小さく丸をつける。"},{w:null,t:"荷台の布のすきまから、虹色の羽の先が一枚だけのぞいて、すぐ引っこむ。"}];
GR_EP[13]={"t": "雲の山道", "sc": [["g13_01", "雲の山・峠（夕方・吹雪）", 0], ["g13_02", "雲の山道（昼）", 0], ["g13_03", "雲の中（夕方）", 0], ["g13_04", "避難小屋の前（夕方）", 0], ["g13_05", "避難小屋の中（夜）", 0], ["g13_06", "避難小屋の中（次の日・吹雪）", 0], ["g13_07", "避難小屋の前（夕方）", 0], ["g13_08", "向かい合う", 0], ["g13_09", "勝負", 1], ["g13_10", "勝負のあと", 0], ["g13_11", "避難小屋の中（夜）", 0], ["g13_12", "避難小屋（夜明け前）", 0], ["g13_13", "避難小屋の前（朝）", 0], ["g13_14", "ふもとの町・小さな店の前（夕方）", 0], ["g13_15", "ふもとの町を出る道（夜）", 0]]};
GR_SC.g14_01=[{w:null,t:"運河の町コリンタ。海と海を、まっすぐな水の道がつないでいる。",v:"14_0020"},{w:null,t:"切り立った岩のかべのあいだを、細い運河がまっすぐ走る。"},{w:null,t:"橋の手前に、貨物船が何そうも、つらなって止まっている。"},{w:null,t:"アイギス社のドローンが、運河のかべに光の文字を映す。"},{w:null,t:"船室の窓から、ひげの男が顔を出す。"},{w:null,t:"橋のたもとに、白い大きな車。"},{w:null,t:"ユスフ、数えていた指を、ぎゅっとにぎる。"},{w:null,t:"第14話　運河の町コリンタ",v:"14_0028"}];
GR_SC.g14_02=[{w:null,t:"三人が山の道から下りてくる。"},{w:null,t:"運河の岸で、洗たく屋のおばさんの水の子が、つるしたシーツに霧をふいている。"},{w:null,t:"広場のまん中に、古い丸いモザイクの床。"},{w:"x",n:"実況の声",t:"ふんばったーっ！　変わったーっ！",v:"14_0038"},{w:null,t:"子どもたちがわっとさけぶ。"},{w:null,t:"エリー、画面の小さい方の子を、じっと見ている。"},{w:null,t:"ヤマト、肩のフォルンを両手で持ち上げて、子どもたちのうしろから割りこむ。"},{w:"hero",t:"おれのフォルンもな、あれより、もっとでっかくなるんだぜ。",v:"14_0042"},{w:"x",n:"子ども",t:"ちっちゃ。",v:"14_0043"},{w:"hero",t:"勝負になったらな。見てろよ。",v:"14_0044"},{w:null,t:"ヤマト、モザイクのまん中にフォルンを置く。"},{w:"hero",t:"フォルン、変われ。",v:"14_0046"},{w:"hero",f:"serious",t:"……こう、ぶわっとだよ、ぶわっと。",v:"14_0048"},{w:"yusuf",t:"お兄ちゃん、画面に出てた！　ぼく、ユスフ。うちの船、すぐそこだよ。",v:"14_0054"}];
GR_SC.g14_03=[{w:null,t:"さびた甲板。"},{w:"yusuf",t:"二年前に、この船で来たの、父さんと。",v:"14_0058"},{w:null,t:"ユスフ、地図の小さな丸を、一つずつ指でさす。"},{w:"yusuf",t:"ここがパン屋さん。きのう、ぼくの名前、おぼえてくれたの。ここ、サッカーする所。でも船、三日で沖へ行かなかったら、お預かりなんだって。",v:"14_0060"},{w:null,t:"ユスフの指が、パン屋の丸を何回もなぞる。"},{w:"yusuf",t:"……あしたも行くって、言っちゃったんだけどな。",v:"14_0062"},{w:null,t:"アレク、甲板のはしから、上がったままの橋を見ている。"},{w:"alek",t:"向こう岸へ渡るには、あの橋か、船だ。",v:"14_0064"},{w:"yusuf",t:"橋、沈むんだよ。水の中に沈めて、その上を船が通るの。ミハリスさんがレバーで。",v:"14_0065"},{w:"hero",t:"橋が、沈むの？",v:"14_0066"},{w:"yusuf",t:"うん。あとね、あのとりでの上の泉は、羽のある馬が、ひづめでこんってやったら、水が出たんだって。",v:"14_0067"},{w:null,t:"ユスフ、町の上の岩山を指さす。"},{w:null,t:"ヤマト、足で甲板を、こんとける。"},{w:null,t:"ヤマトの胸の時計のつまみに、指が当たっている。"}];
GR_SC.g14_04=[{w:null,t:"黄色い機械のあいだの、折りたたみの机。"},{w:null,t:"橋のたもとの小屋の窓から、油だらけの手の男が、こっちを見ている。"},{w:null,t:"ノモス、顔を上げる。"},{w:"nomos",t:"十二番。抹消、と書いてありますが。",v:"14_0076"},{w:"alek",t:"抜けたんだよ。",v:"14_0077"},{w:"nomos",t:"抜けた、とは聞いていません。",v:"14_0078"},{w:null,t:"ノモス、画面を流す。"},{w:"nomos",t:"そちらの娘さんを、保護します。保護者のいない旅行中のお子さんは、保護。決まりですので。",v:"14_0080"},{w:"elly",t:"えー、やだ。",v:"14_0081"},{w:"hero",t:"保護って、どこに連れてくんだよ。",v:"14_0082"},{w:"nomos",t:"上が決めます。わたしは、お連れするだけです。",v:"14_0083"},{w:"hero",t:"じゃあ、勝負しろよ。",v:"14_0084"},{w:"nomos",t:"申しこまれたら、受ける決まりです。わたしが負けたら、班はここから引き上げます。班がいなくなれば、船を動かす命令もなくなります。",v:"14_0085"},{w:null,t:"甲板の上で、ユスフが顔を上げる。"},{w:"alek",t:"そっちが勝ったら。",v:"14_0087"},{w:"nomos",t:"娘さんは保護。それと、その狐。名簿にありますので。",v:"14_0088"},{w:null,t:"ノモス、かごの布に手をかける。"},{w:"nomos",t:"上から、この子を使うように、と。",v:"14_0090"},{w:null,t:"布が取られる。"},{w:null,t:"右の羽の付け根に、白っぽい古い傷あと。"},{w:null,t:"エリーの笑顔が、そのまま止まる。"},{w:"elly",f:"serious",t:"……ニジッコ？",v:"14_0094"},{w:null,t:"鳥の頭が、ぴくっと動く。"},{w:null,t:"ノモスの指が画面をたたく。"}];
GR_SC.g14_05=[{w:null,t:"運河の広場。"},{w:null,t:"鳥は、奥の柱の上に下りて、羽をたたむ。"},{w:null,t:"岸に町の人が集まる。"},{w:null,t:"ヤマト、肩のフォルンを石だたみに下ろす。"},{w:null,t:"エリー、クッキーの箱を足もとに置く。"},{w:"nomos",t:"（腕時計を見て）始めます。",v:"14_0107"}];
GR_SC.g14_07=[{w:null,t:"わらの上の木の箱。"},{w:null,t:"8歳のエリーが、ぶどうを一粒、黄色いひよこに近づける。"},{w:null,t:"ひよこの右の羽の付け根に、小さな白い傷。"},{w:null,t:"次のしゅんかん、ひよこの体がぽうっと光る。"},{w:null,t:"物置の前に、白い回収車。"},{w:"x",n:"回収車の声",t:"持ち主の決まっていない子は、施設へ。審査中の子も、決まりです。持ち主になれるのは、十五歳からです。",v:"14_0143"},{w:null,t:"エリーが、ロボットの腕にしがみつく。"},{w:"x",n:"回収車の声",t:"ご協力、ありがとうございます。",v:"14_0145"},{w:null,t:"坂の上に、羽が一枚。"}];
GR_SC.g14_09=[{w:null,t:"ナルカミが光ってしぼみ、小さなピリポンにもどる。"},{w:null,t:"石だたみに、割れたチップ。"},{w:null,t:"鳥が起き上がる。"},{w:null,t:"エリー、ピリポンを片手に抱いたまま、もう片方の人さし指を、そっと前に出す。"},{w:null,t:"鳥が、ひと羽ばたきで、エリーの指にとまる。"},{w:null,t:"鳥の羽が、ぷうっとふくらむ。"},{w:null,t:"エリーは、指を曲げない。"},{w:null,t:"鳥が飛び立つ。"},{w:null,t:"エリーの手は、しばらく、そのままの形で上がっている。"},{w:null,t:"ノモス、画面の「回収　失敗」を見て、消す。"},{w:"nomos",t:"班は、引き上げます。",v:"14_0190"},{w:null,t:"運河のかべの光の文字が変わる。"},{w:null,t:"作業員が機械をたたむ。"},{w:null,t:"ノモスが机をたたむひょうしに、書類の板から画面が一枚すべり落ちる。"},{w:null,t:"クロッコがのそのそ歩いていって、曲がったあごで画面をくわえ、アレクの足もとに置く。"}];
GR_SC.g14_10=[{w:null,t:"ヤマト、足もとのフォルンを、だまって抱き上げる。"},{w:null,t:"アレクの指が、画面をめくる。"},{w:null,t:"ヤマト、肩のフォルンの耳のうしろを、指でさわる。"},{w:"elly",t:"大理石の谷って、どこ？",v:"14_0201"},{w:"alek",t:"白い都の、すぐ手前だ。",v:"14_0202"},{w:null,t:"エリー、北の山の方を見る。"}];
GR_SC.g14_11=[{w:null,t:"橋の横の小さな小屋。"},{w:null,t:"中で、ミハリスが橋の機械をいじっている。"},{w:"yusuf",t:"ミハリスさん、橋、沈めてよ。会社の人たち、もういないよ。",v:"14_0208"},{w:"mihalis",t:"上からの紙がない。紙がないと、沈めない。",v:"14_0209"},{w:"yusuf",t:"でも、もういないんだよ。",v:"14_0210"},{w:"mihalis",t:"紙は、まだ来てない。",v:"14_0211"},{w:null,t:"ユスフ、戸口の段に座って、紙袋のパンをちぎる。"},{w:"yusuf",t:"パン屋さんがくれたの。ぼくの名前、言って。",v:"14_0213"},{w:null,t:"ミハリスの手が止まる。"},{w:null,t:"フォルンがパンのかけらをしっぽの火であぶっている。"},{w:null,t:"ミハリス、立ち上がる。"},{w:"alek",t:"紙なしで沈めたら、あんた、クビだろ。",v:"14_0217"}];
GR_SC.g14_12=[{w:null,t:"ユスフの船が、沈んだ橋の上をゆっくり通る。"},{w:null,t:"北の岸の小さな船着き場で、三人が下りる。"},{w:"yusuf",t:"ぼくら、このまま白い都の港まで行くの。荷物を積む仕事、父さんが見つけたんだ。",v:"14_0226"},{w:null,t:"ひげの男が、操舵室の窓から一回うなずく。"},{w:null,t:"甲板のはしで、ユスフが右の手のひらを上げる。"},{w:null,t:"船着き場の上の道に、古い道しるべ。"},{w:null,t:"その道を、白い盾のトラックが一台、また一台と走っていく。"},{w:null,t:"エリーの目が、トラックを追う。"}];
GR_EP[14]={"t": "運河の町コリンタ", "sc": [["g14_01", "運河（夜明け）", 0], ["g14_02", "コリンタの広場（朝）", 0], ["g14_03", "止められた貨物船（朝）", 0], ["g14_04", "大橋のたもと", 0], ["g14_05", "向かい合う", 0], ["g14_06", "勝負", 1], ["g14_07", "オリーヴァ村・ぶどう畑の奥の物置（6年前）", 0], ["g14_08", "勝負・つづき", 1], ["g14_09", "勝負のあと", 0], ["g14_10", "橋のたもと（昼すぎ）", 0], ["g14_11", "技師の小屋（夕方）", 0], ["g14_12", "運河（夜）", 0]]};
GR_SC.g15_01=[{w:null,t:"大理石の谷。白い都の神殿の石は、ぜんぶ、ここから運ばれた。",v:"15_0020"},{w:null,t:"天井の高い、白い大理石の広間。"},{w:null,t:"ケースの中で、小さなテリオンたちが眠っている。"},{w:null,t:"作業員が、札の横にシールを貼っていく。"},{w:"x",n:"警備のAIの声",t:"警備の人員は、本日もテリオン一体です。経費は、前年の八割減です。",v:"15_0025"},{w:null,t:"見張りの目が、うすく開く。"},{w:null,t:"第15話　大理石の谷",v:"15_0028"}];
GR_SC.g15_02=[{w:null,t:"山を巨大な包丁で切ったような、まっ白ながけ。"},{w:null,t:"谷のふちで、三人が腹ばいになって見下ろしている。"},{w:"alek",t:"昔、ここも案内してた。あの辺の石で、白い都の丘の神殿を建てたんだ。牛で引いて、何年もかけて。",v:"15_0036"},{w:null,t:"エリー、がけを指でなぞる。"},{w:"elly",t:"……あの日ね、車に、ほかの子も乗ってたの。いるかな。",v:"15_0038"},{w:null,t:"ヤマトとアレクがエリーを見る。"},{w:null,t:"アレク、ポケットからノモスの画面を出す。"},{w:"alek",t:"おれは、この続きがほしい。課長の判を押したやつが、何をやってるか。",v:"15_0041"},{w:null,t:"ヤマトは谷の切れ目の先を見ている。"},{w:"hero",t:"大会、あしただぞ。",v:"15_0043"},{w:"alek",t:"だから、きょうのうちだ。",v:"15_0044"},{w:"hero",t:"分かってるって。",v:"15_0045"},{w:null,t:"ヤマト、立ち上がって、両手を口に当てる。"},{w:"alek",t:"おい——",v:"15_0047"},{w:"hero",t:"やっほーーー！",v:"15_0048"},{w:"x",n:"こだま",t:"……やっほー……やっほー……やっほー……",v:"15_0049"},{w:null,t:"ヤマト、ふり返って、にやっと笑う。"},{w:"hero",f:"smile",t:"三回！　すげえ、三回返ってきた！",v:"15_0051"},{w:null,t:"四回目のかわりに、谷のスピーカーが鳴る。"},{w:"x",n:"谷のスピーカーの声",t:"現在、作業中です。お静かにお願いいたします。",v:"15_0053"},{w:null,t:"建物の屋根から、カメラのついたドローンが二台、ふわりと浮いて、こっちを向く。"},{w:null,t:"アレク、ヤマトのマフラーをつかんで、うしろへ引き倒す。"},{w:null,t:"アレク、マフラーをはなさない。"},{w:"alek",t:"正面の門、なくなった。",v:"15_0057"},{w:"elly",t:"じゃあ、どこから入るの？",v:"15_0058"},{w:null,t:"アレク、がけの下を指さす。"},{w:"alek",t:"昔の石切り場の、排水路だ。",v:"15_0060"}];
GR_SC.g15_03=[{w:null,t:"石の管の中。"},{w:"hero",f:"serious",t:"……くっせえ。なんだここ。",v:"15_0064"},{w:"alek",t:"だれのせいだ。",v:"15_0065"},{w:null,t:"ヤマト、鼻をつまんで前を向く。"},{w:null,t:"ヤマトの足が、ぬるっとした物をふむ。"},{w:null,t:"エリー、箱を頭にのせたまま、ヤマトの上をまたいで通る。"},{w:null,t:"フォルン、アレクの頭の上から、ずぶぬれのヤマトを見下ろしている。"},{w:null,t:"上に、鉄の格子が三つ。"},{w:null,t:"アレク、冷たい水に手を入れる。"}];
GR_SC.g15_04=[{w:null,t:"床の格子が、がたんと持ち上がる。"},{w:null,t:"エリーがケースの並びのあいだを走る。"},{w:null,t:"エリーの足が止まる。"},{w:null,t:"丸い耳の子。"},{w:null,t:"エリー、ガラスに両手をつける。"},{w:null,t:"アレクは札のいちばん下を見ている。"},{w:null,t:"広間の奥で、台の上の金色の影が目を開ける。"},{w:null,t:"グリュプスが立ち上がる。"},{w:"x",n:"警備のAIの声",t:"侵入者のテリオンを確認しました。",v:"15_0082"}];
GR_SC.g15_05=[{w:null,t:"大理石の床。"},{w:null,t:"ヤマトの肩から、フォルンが床に飛び下りる。"},{w:"x",n:"警備のAIの声",t:"ケースに近づく物を、排除します。",v:"15_0090"}];
GR_SC.g15_07=[{w:null,t:"三体が光って、小さなフォルン、ピリポン、クロッコにもどる。"},{w:"x",n:"警備のAIの声",t:"警備のテリオンが倒れました。担当者には、あすの朝、お知らせします。",v:"15_0142"},{w:"hero",f:"serious",t:"……あすの朝？",v:"15_0143"},{w:"x",n:"警備のAIの声",t:"夜間のお知らせは、経費削減のため、行っておりません。",v:"15_0144"},{w:null,t:"グリュプスが目を開ける。"},{w:null,t:"グリュプス、ゆっくり歩いていって、ケースの並びの前で羽をたたんで伏せる。"},{w:"elly",f:"serious",t:"……守ってるの？",v:"15_0147"},{w:"alek",t:"（案内の時の言い方で）グリフォンは、金の番をする。",v:"15_0148"},{w:null,t:"エリーが、いちばん近いケースに走る。"},{w:null,t:"ヤマトが来て、いっしょに引く。"},{w:null,t:"伏せたグリュプスが、二人を見ている。"},{w:null,t:"アレクは、ノモスの画面をケースの札に向ける。"},{w:"hero",t:"それ、どうすんの。",v:"15_0153"},{w:"alek",t:"送る。",v:"15_0154"},{w:"hero",t:"だれに。警察か？",v:"15_0155"},{w:"alek",t:"保護局の研究所の、所長。課長の上だ。",v:"15_0156"}];
GR_SC.g15_08=[{w:null,t:"ガラス戸の小部屋。"},{w:null,t:"アレク、机の紙の束をめくる。"},{w:null,t:"ヤマトが横からのぞいて、胸の時計をにぎる。"},{w:null,t:"細い窓の向こうに、遠くの塔。"},{w:"alek",t:"……本番って、なんのだよ。",v:"15_0163"},{w:null,t:"だれも答えない。"},{w:null,t:"エリーは、壁の絵の前に立っている。"},{w:"elly",f:"serious",t:"……おっきい。",v:"15_0166"},{w:null,t:"ヤマト、絵の巨人の腕と、自分の腕を見くらべる。"},{w:null,t:"アレク、絵も撮る。"},{w:"alek",t:"出るぞ。あいつが知らせるのは、あすの朝だ。",v:"15_0169"},{w:null,t:"エリー、広間をふり返る。"}];
GR_SC.g15_09=[{w:null,t:"画面の横に、もう一つの窓。"},{w:null,t:"女の指が、ボタンの上に来て、止まる。"},{w:null,t:"指を下ろす。"}];
GR_SC.g15_10=[{w:null,t:"机にケーキの箱と紅茶。"},{w:"x",n:"画面の声",t:"谷のドローンが、けさ撮ったものです。昼すぎには、排水路の出口に子どもの足あとが。どうしますか。",v:"15_0181"},{w:"bella",t:"……あら。",v:"15_0182"},{w:null,t:"ベラドンナ、写真をとじる。"},{w:"bella",t:"放っておいて。もう、あそこは要らないもの。大会は、予定どおり。買い手のみなさまにも、そうお伝えして。",v:"15_0184"},{w:null,t:"塔のてっぺんの赤い明かり。"},{w:null,t:"白い都の港。"},{w:null,t:"甲板で、三人が毛布にくるまって並んで寝そべっている。"},{w:null,t:"ヤマト、塔を見たまま、胸の時計をにぎっている。"}];
GR_EP[15]={"t": "大理石の谷", "sc": [["g15_01", "大理石の谷・保管庫（夜）", 0], ["g15_02", "谷の上（朝）", 0], ["g15_03", "古い排水路（昼）", 0], ["g15_04", "保管庫（昼）", 0], ["g15_05", "向かい合う", 0], ["g15_06", "勝負", 1], ["g15_07", "勝負のあと", 0], ["g15_08", "保管庫のとなりの事務室", 0], ["g15_09", "研究所・所長室（夜）", 0], ["g15_10", "白い都・アイギス社のビルの最上階（夜）", 0]]};
GR_SC.g16_01=[{w:null,t:"白い都。神殿の丘のふもとに、二千年分の町が積み重なっている。",v:"16_0020"},{w:null,t:"古い神殿の屋根の上を、広告のドローンが飛ぶ。"},{w:null,t:"大競技場のガラスの屋根の上に、細長い白い塔。"},{w:null,t:"競技場の裏に、黒い車が何台も並ぶ。"},{w:null,t:"出むかえる、日傘の女。"},{w:"bella",t:"ようこそ。きょうは、いい物をお見せできますわ。",v:"16_0025"},{w:null,t:"ベラドンナ、塔を見上げる。"},{w:null,t:"第16話　白い都の大会",v:"16_0028"}];
GR_SC.g16_02=[{w:null,t:"広場はお祭り。"},{w:null,t:"エリーが、両手に串焼きを持って、もう一本くわえている。"},{w:"elly",t:"はい、これ。屋台のおじさんの火、ピリポンがつけてあげたの。そしたら、くれた。",v:"16_0036"},{w:null,t:"屋台の炭の上で、ピリポンの毛がまだぱちぱち鳴っている。"},{w:null,t:"アレク、受け取った串を見て、エリーを見る。"},{w:"alek",t:"……ただか。",v:"16_0039"},{w:null,t:"エリー、もぐもぐしながらうなずく。"},{w:null,t:"ヤマトは、入口の大きな組み合わせ表の前に立っている。"},{w:null,t:"表のいちばん上に、金色の字。"},{w:null,t:"ヤマトの目が、金色の字から足もとのフォルンへ。"},{w:null,t:"広場の上を、白いドローンが二台回っている。"},{w:null,t:"アレク、ヤマトのマフラーを鼻の上まで引き上げる。"}];
GR_SC.g16_03=[{w:null,t:"受付の机の横に、腕が一本の白いカメラの機械。"},{w:"x",n:"受付の係",t:"はい次の方。お名前を。子はこちらで写真をとります。",v:"16_0049"},{w:null,t:"ヤマト、名前の欄に「ヤ」と書きかける。"},{w:"alek",t:"（小さく）本名書いたら、狐ごと回収だぞ。",v:"16_0051"},{w:"hero",t:"（小さく）じゃあ、なんて書くんだよ。",v:"16_0052"},{w:"alek",t:"なんでもいい。",v:"16_0053"},{w:"hero",t:"なんでもいいが、いちばん困るんだって。",v:"16_0054"},{w:null,t:"エリーが、二人のあいだから串焼きごと顔を出す。"},{w:"elly",t:"ダレデモナイは？　おばあちゃんのお話の人。一つ目の巨人を、それでだましたの。",v:"16_0056"},{w:"hero",f:"serious",t:"……ずるっ。",v:"16_0057"},{w:"elly",t:"ずるいよね。",v:"16_0058"},{w:null,t:"ヤマト、もう書いている。"},{w:"x",n:"受付の係",t:"登録名の変更は、受けつけておりません。なりすましの防止のためです。",v:"16_0060"},{w:null,t:"アレク、天井を見る。"},{w:null,t:"ヤマト、フォルンを両手で高くカメラに向ける。"},{w:null,t:"ぱしゃ、の直前。"},{w:null,t:"画面に、歯を見せたヤマトと、そのとなりに、ふさふさのしっぽだけ。"},{w:"x",n:"受付の機械の声",t:"登録にない形式です。判定、できません。",v:"16_0065"},{w:"hero",t:"もう一回！　今のなし！",v:"16_0066"},{w:null,t:"係、画面を見て、うしろに並ぶ大勢の人を見る。"},{w:"x",n:"受付の係",t:"……次の方。",v:"16_0069"},{w:null,t:"ヤマト、押し出されながら、しっぽだけの写真をまだのぞきこんでいる。"},{w:null,t:"机の上の名簿が、風でめくれる。"}];
GR_SC.g16_04=[{w:null,t:"客席は満員。"},{w:"x",n:"司会",t:"昔むかし、この町の名前をめぐって、二人の神さまが、町の人に贈り物をくらべさせました！",v:"16_0075"},{w:null,t:"海の神がほこで地面をつく。"},{w:null,t:"女神がやりで地面をつく。"},{w:"x",n:"司会",t:"町の人が選んだのは、オリーブ！　それで、この町は女神の名前になったのです！",v:"16_0078"},{w:"elly",t:"村のオリーブも、ここから来たのかな。",v:"16_0080"},{w:"alek",t:"さあな。",v:"16_0081"},{w:null,t:"ヤマト、オリーブの木の根もとを見ている。"}];
GR_SC.g16_05=[{w:null,t:"通路の壁の結果の画面に、字が上へ上へとのびていく。"},{w:null,t:"「決勝　ダレデモナイ　対　レン」。"},{w:null,t:"通路の向こうから、レンが来る。"},{w:null,t:"すれちがう。"},{w:"dimi",t:"その狐、まだ言うこと聞かないのか。",v:"16_0089"},{w:"hero",t:"聞くよ。たまにな。",v:"16_0090"},{w:null,t:"レン、何も言わずに歩いていく。"},{w:null,t:"控えのベンチ。"},{w:"elly",t:"フォルン、こっちおいで。",v:"16_0093"},{w:null,t:"フォルンの耳が、くるっと左の箱を向く。"},{w:"elly",f:"serious",t:"……耳だけ、来た。",v:"16_0095"},{w:null,t:"ヤマト、フォルンの耳と足を見くらべる。"},{w:null,t:"頭の上で、ぶうん、と低い音。"},{w:null,t:"通路の向こうで、親子の連れた子が、びくっと体をすくめる。"},{w:null,t:"アレクが、天井を見上げる。"}];
GR_SC.g16_06=[{w:null,t:"ガラスの屋根ごしの夕日。"},{w:"x",n:"司会",t:"決勝は大将戦！　一体どうしの、真っ向勝負です！",v:"16_0106"},{w:null,t:"大競技場の場内。"},{w:null,t:"貴賓席に、ベラドンナと外国の買い手たち。"},{w:null,t:"レンが、足もとにライガを下ろす。"},{w:null,t:"光がはじける。"},{w:null,t:"大きな画面に「エレグリオ」。"},{w:"x",n:"司会",t:"重ねた子も、一体です！",v:"16_0112"},{w:null,t:"ヤマト、フォルンを走路に下ろす。"},{w:"x",n:"司会",t:"決勝、始め！",v:"16_0114"}];
GR_SC.g16_08=[{w:null,t:"フォルレオンが光って、小さなフォルンにもどる。"},{w:null,t:"ヤマトが走路に走りこんで、フォルンの前ですべって止まる。"},{w:null,t:"ヤマト、頭の葉をつまんで取ろうとする。"},{w:null,t:"走路の向こう。"},{w:null,t:"レンが、ライガの横にしゃがんで、背中に手をのせている。"},{w:null,t:"レン、ヤマトの方を見ない。"},{w:null,t:"客席の手すりを乗りこえかけたエリーの上着を、アレクがつかんでいる。"}];
GR_SC.g16_09=[{w:null,t:"いちばん上にヤマト。"},{w:null,t:"係が、フォルンに登録のチップを入れる白い機械を当てる。"},{w:null,t:"係が、ヤマトに金色のふちの登録の札をわたす。"},{w:null,t:"ヤマト、札を見る。"},{w:"hero",f:"serious",t:"……これ、おれ？",v:"16_0185"},{w:null,t:"客席のいちばん前で、エリーがおなかを抱えて笑っている。"},{w:null,t:"ヤマト、札をパーカーのポケットに大事にしまう。"},{w:null,t:"レンも準優勝の札を受け取る。"},{w:"x",n:"司会",t:"それでは、協賛のアイギス社、ベラドンナ社長より、ひとこと！",v:"16_0189"},{w:null,t:"ベラドンナが日傘をたたんで立つ。"},{w:"bella",t:"おめでとう、ダレデモナイくん。いいお名前ね。",v:"16_0191"},{w:null,t:"ベラドンナがヤマトに小さく手をふる。"},{w:"bella",t:"では、本日の目玉を。",v:"16_0193"},{w:null,t:"赤い爪の指が、手もとの画面を、とん、とたたく。"}];
GR_SC.g16_10=[{w:null,t:"頭の上で、塔が鳴る。"},{w:null,t:"客席のチップの子たちが、いっせいに体をすくめる。"},{w:null,t:"エリーの腕の箱の中で、ピリポンが耳をぴんと立てる。"},{w:null,t:"表彰台の上。"},{w:null,t:"四つとも、いっぺんに、まっ赤に光る。"},{w:null,t:"音が、やむ。"},{w:null,t:"足の下から、低い、長い声が上がってくる。"},{w:null,t:"表彰台が、ことん、と小さくゆれる。"}];
GR_EP[16]={"t": "白い都の大会", "sc": [["g16_01", "白い都・大通り（朝）", 0], ["g16_02", "大競技場の前（朝）", 0], ["g16_03", "受付の机（朝）", 0], ["g16_04", "大競技場・開会の出し物（昼前）", 0], ["g16_05", "控えの通路（昼〜夕方）", 0], ["g16_06", "決勝（夕方）", 0], ["g16_07", "勝負", 1], ["g16_08", "勝負のあと", 0], ["g16_09", "表彰台（夕方）", 0], ["g16_10", "大競技場（夕方）", 0]]};
GR_SC.g17_01=[{w:null,t:"白い都の大会は、終わったばかりだった。",v:"17_0022"},{w:null,t:"足の下から、牛の吠える声。"},{w:null,t:"競技場のまん中の白い線に沿って、地面が割れる。"},{w:null,t:"割れ目の前に、警察のロボットが十体、盾をかまえて、横一つにならぶ。"},{w:"x",n:"警察のロボット",t:"危険区域です。下がってください。",v:"17_0027"},{w:null,t:"割れ目の奥で、赤い光が一つ、点いて、消える。"},{w:null,t:"黒く反ったつのが二本、地面から突き出る。"},{w:null,t:"ならんだロボットが、まとめて宙に浮く。"},{w:null,t:"つのが、割れ目の奥へ引っこむ。"},{w:null,t:"第17話　守り①ミノタス・前編",v:"17_0033"}];
GR_SC.g17_02=[{w:null,t:"割れ目は、客席のいちばん前まで来ている。"},{w:null,t:"その前に、レン。"},{w:null,t:"ライガが、レンの前に出て、毛の雷を逆立てる。"},{w:null,t:"割れ目から、つのが、もう一突き。"},{w:null,t:"レン、走って、ライガの前に立つ。"},{w:null,t:"つのは、もう出てこない。"},{w:null,t:"ヤマトが走ってくる。"},{w:null,t:"レン、ヤマトを見ない。"},{w:"dimi",f:"serious",t:"……息は、ある。",v:"17_0047"},{w:null,t:"ヤマト、何か言いかける。"},{w:null,t:"保護局の制服の男が、白い顔で割れ目の前に立つ。"},{w:"x",n:"保護局の職員",t:"近づかないで！　だれも、近づかないでください！",v:"17_0050"},{w:null,t:"職員のうしろで、割れ目のふちが、ぽろぽろと崩れていく。"}];
GR_SC.g17_03=[{w:null,t:"ガラスで囲まれた席。"},{w:null,t:"赤い爪の女、ベラドンナ。"},{w:"bella",t:"……受けつけない？",v:"17_0056"},{w:null,t:"ベラドンナ、画面を伏せる。"},{w:null,t:"競技場の裏。"}];
GR_SC.g17_04=[{w:null,t:"大きな画面に、ニュース。"},{w:"x",n:"ニュースの声",t:"白い都で、地震がありました。市の中心部で、地面が割れています。",v:"17_0062"},{w:null,t:"牛のことは、一言も出ない。"},{w:"alek",t:"……地震で、ロボットが十体、飛ぶか。",v:"17_0064"},{w:null,t:"ヤマト、胸に革ひもで下げた古い時計の、つまみを押す。"},{w:null,t:"村の丘の印だけ、ほかより大きい。"},{w:null,t:"エリー、通路のはしの公衆電話へ走る。"},{w:null,t:"ヤマトが、硬貨を一枚、エリーの手のひらに落とす。"},{w:"elly",t:"おばあちゃん！　ヤマト、優勝したよ！",v:"17_0069"},{w:"oba",n:"おばあさん（電話）",t:"……うん。中継で、見てた。",v:"17_0070"},{w:null,t:"電話の向こうで、食器が、かたかた鳴っている。"},{w:"oba",n:"おばあさん（電話）",t:"こっちも、ゆれてる。丘の方から。……エリー、丘の子が起ききったら、村がつぶれる。",v:"17_0072"},{w:"elly",t:"丘の子？",v:"17_0073"},{w:"oba",n:"おばあさん（電話）",t:"……ごめん。切るね。",v:"17_0074"},{w:null,t:"エリー、受話器を耳に当てたまま、まばたきをする。"},{w:null,t:"足の下で、また、ずん。"},{w:null,t:"レンが、ライガを抱えて救護のテントへ歩いていく。"},{w:null,t:"ヤマト、メダルを首からはずして、ポケットにつっこむ。"},{w:"hero",t:"アレク。丘の下、入れる所ある？",v:"17_0079"},{w:"alek",t:"……裏に、閉めた入口がある。大会の案内の地図に、のってた。",v:"17_0080"},{w:"elly",t:"村は？",v:"17_0081"},{w:"hero",t:"村のは、あとでいい。足の下のが、先。",v:"17_0082"}];
GR_SC.g17_05=[{w:null,t:"丘の裏には、見学をやめた古い入口がある。",v:"17_0085"},{w:null,t:"草にうもれた石の門。"},{w:"x",n:"警察のロボット",t:"立ち入り禁止です。",v:"17_0087"},{w:null,t:"ヤマト、胸を張って、ポケットから優勝の札を出す。"},{w:"hero",t:"白い都の大会、優勝。通して。",v:"17_0089"},{w:null,t:"ロボットの目が、札を読む。"},{w:"x",n:"警察のロボット",t:"登録者、ダレデモナイ。該当者、なし。",v:"17_0091"},{w:null,t:"ロボットの腕が、ヤマトの胸を、やさしく押しもどす。"},{w:null,t:"エリーが札を拾う。"},{w:null,t:"ヤマト、しりもちのまま、口をとがらす。"},{w:null,t:"アレク、さくの横の草をかき分ける。"},{w:null,t:"ロボットは、正面のさくを見たまま。"},{w:null,t:"くぐり戸の上に、色のあせた札。"}];
GR_SC.g17_06=[{w:null,t:"石の柱が二本。"},{w:null,t:"エリー、カバンの中をさぐる。"},{w:"elly",t:"ひも、ない。",v:"17_0102"},{w:"alek",t:"ひも？",v:"17_0103"},{w:"elly",t:"迷路でしょ。",v:"17_0104"},{w:null,t:"エリー、自分のからし色のマフラーに手をかける。"},{w:null,t:"ヤマト、自分の赤いマフラーをはずす。"},{w:"hero",t:"おれの使えよ。",v:"17_0107"},{w:null,t:"エリー、赤いマフラーの端の糸を一本、ぷつりと引く。"},{w:null,t:"エリー、マフラーをヤマトの首に、ふわっともどす。"},{w:"elly",t:"ヤマトが持ってて。歩くと、ほどける。",v:"17_0110"},{w:"hero",f:"serious",t:"……巻いたまま？",v:"17_0111"},{w:"elly",t:"そのほうが、なくさないでしょ。",v:"17_0112"},{w:null,t:"ヤマト、階段を下りる。"}];
GR_SC.g17_07=[{w:null,t:"天井の低い石の通路。"},{w:null,t:"角を曲がる。"},{w:null,t:"アレク、くつの先で送信機のふたを起こす。"},{w:null,t:"アレク、札をポケットにしまう。"},{w:null,t:"ヤマトの首のマフラーが、ひと回り細くなっている。"},{w:null,t:"通路の先の壁に、古い文字が一行。"},{w:null,t:"エリー、指で字を一つずつなぞる。"},{w:null,t:"字の頭の一つが、欠けている。"},{w:"elly",f:"serious",t:"……「……数えて、壁は動く」、だって。",v:"17_0125"},{w:null,t:"……止まる。"},{w:null,t:"三人、だまる。"},{w:null,t:"しんとした中で、どこかで、ゴトン、と石の音。"},{w:null,t:"……カツン、ドン。"},{w:null,t:"ヤマトが歩き出す。"},{w:null,t:"首から出た毛糸が、閉じた壁のすきまにはさまって、ぴんと張る。"},{w:null,t:"アレク、毛糸を拾う。"},{w:null,t:"通路の先が、急に広くなる。"},{w:null,t:"奥の暗がりで、何かが立ち上がる。"},{w:null,t:"大きな茶色い牛。"},{w:null,t:"胸の毛の奥で、四角い物が、赤く点いて、消える。"},{w:null,t:"牛が、ひづめで、床を、ドン、と一回ける。"}];
GR_SC.g17_09=[{w:null,t:"三人、毛糸を手でたぐりながら、早足で通路をもどる。"},{w:null,t:"うしろで、ひづめの音が近づいたり、遠ざかったりする。"},{w:null,t:"角ごとに、毛糸が壁のすきまにはさまっている。"},{w:"alek",t:"引くな。待て。",v:"17_0217"},{w:null,t:"三人、壁の前で止まる。"},{w:null,t:"しばらくして、壁が開いて、毛糸が、ぱさりと落ちる。"}];
GR_SC.g17_10=[{w:null,t:"階段を上がる。"},{w:null,t:"三人、石段に、ばらばらに座りこむ。"},{w:null,t:"フォルン、ヤマトのひざの上で目をつぶっている。"},{w:null,t:"アレク、クロッコの頭に、水の筒から水をたらす。"},{w:null,t:"ヤマトの首には、赤いマフラーが、指二本分だけ残っている。"},{w:null,t:"エリー、柱から階段の下まで続く毛糸を、手のひらの上でたぐる。"},{w:null,t:"エリーの指が止まる。"},{w:null,t:"エリー、跡の一つを、ヤマトの前にさし出す。"},{w:null,t:"アレクが、横から毛糸の別の所を取る。"},{w:null,t:"アレクの手が、止まる。"},{w:null,t:"丘の奥から、牛の吠える声。"},{w:null,t:"ヤマト、胸の時計のつまみを押す。"}];
GR_EP[17]={"t": "守り①ミノタス・前編", "sc": [["g17_01", "白い都の競技場（表彰のすぐあと）", 0], ["g17_02", "客席の前", 0], ["g17_03", "貴賓席", 0], ["g17_04", "表彰台のうら", 0], ["g17_05", "丘の裏・閉めた入口（夕方）", 0], ["g17_06", "迷宮の入口", 0], ["g17_07", "迷宮", 0], ["g17_08", "勝負", 1], ["g17_09", "帰り道", 0], ["g17_10", "迷宮の入口（夜）", 0]]};
GR_SC.g18_01=[{w:null,t:"17話の続き。"},{w:null,t:"アレク、毛糸を石段の上にまっすぐのばしていく。"},{w:null,t:"毛糸の端は、まだ柱に結んだまま。"},{w:null,t:"階段の下から、ゴトン、と石の音。"},{w:null,t:"エリーが、指を一本折る。"},{w:null,t:"ヤマトとアレクが、エリーの手を見る。"},{w:null,t:"同時に、アレクの手の中の毛糸が、ぴん、と張る。"},{w:null,t:"エリー、折った指を、二人の前にそのまま出す。"},{w:null,t:"アレク、エリーの指を見る。"},{w:null,t:"アレク、何も言わずに、ならんだ小石の横の土に、指で通路の形を描きはじめる。"},{w:null,t:"アレクの指が、図のすみの、どこにもつながらない一角で止まる。"},{w:"hero",t:"行き止まり？",v:"18_0038"},{w:"alek",t:"作ったやつも、出られなくなったって話だ。",v:"18_0039"},{w:"hero",t:"ばっかでー。",v:"18_0040"},{w:null,t:"ヤマト、フォルンをひざにのせたまま、図の横に、指でまっすぐな線を一本、長く引く。"},{w:null,t:"アレク、ヤマトの線を見る。"},{w:null,t:"アレク、自分の図の中の一か所を、とんとん、とたたく。"},{w:"alek",t:"七つ目に、ここの溝から壁が出る。",v:"18_0044"},{w:null,t:"ヤマト、柱の四角と、自分の線を見くらべる。"},{w:null,t:"アレク、小石を一つ、柱の四角の中に置く。"},{w:null,t:"エリー、小石を見て、ヤマトを見て、アレクを見る。"},{w:null,t:"丘の奥で、牛の吠える声。"},{w:null,t:"第18話　守り①ミノタス・後編",v:"18_0050"}];
GR_SC.g18_02=[{w:null,t:"白い都の人たちは、その夜、家の外で寝た。",v:"18_0056"},{w:null,t:"広場に、毛布を敷いた人たち。"},{w:null,t:"大きな画面に、ニュース。"},{w:"x",n:"ニュースの声",t:"政府は、今日の地震を、地下の古い水路のくずれによるものと発表しました。余震に注意してください。",v:"18_0059"},{w:null,t:"羊のぬいぐるみをだいた小さな男の子が、画面を見上げている。"},{w:null,t:"三人、広場のはしを通る。"},{w:null,t:"ヤマト、首に手をやる。"},{w:null,t:"エリー、自分のからし色のマフラーをはずして、ヤマトの首に一周だけ巻く。"},{w:null,t:"ヤマト、何も言わない。"}];
GR_SC.g18_03=[{w:null,t:"階段を下りる。"},{w:null,t:"どこかで、ゴトン。"},{w:null,t:"ヤマト、指を折る。"},{w:"hero",f:"serious",t:"……ご、ろく、なな。",v:"18_0070"},{w:null,t:"ヤマト、目の前の溝をまたいで、一歩ふみ出す。"},{w:null,t:"壁は、動かない。"},{w:null,t:"ヤマト、胸を張って、もう一歩。"},{w:null,t:"壁が、ごごご、と立ち上がる。"},{w:null,t:"アレク、ヤマトの顔の前に、指を一本立てる。"},{w:null,t:"ヤマト、ひっくり返ったまま、天井を見て、指を折り直す。"},{w:"hero",f:"serious",t:"……いち、に、さん、し、ご、ろく……",v:"18_0077"}];
GR_SC.g18_04=[{w:null,t:"天井の高い四角い広間。"},{w:null,t:"奥の暗がりで、牛が柱にもたれて、すわっている。"},{w:null,t:"肩と首の葉の毛は、焦げて黒いまま。"},{w:null,t:"牛が、三人を見る。"},{w:null,t:"エリー、牛の目を見る。"},{w:null,t:"牛が、ひづめで、ドン、と一回ける。"}];
GR_SC.g18_08=[{w:null,t:"牛の鼻から、白い息。"},{w:null,t:"ヤマト、牛の方へ、一歩、二歩。"},{w:null,t:"牛の鼻が、ぶふううっと鳴る。"},{w:null,t:"牛が、ひづめで土をかく。"},{w:null,t:"エリーが、クッキーの箱を、ヤマトのひざの上に、そっと置く。"},{w:null,t:"エリー、一人で、牛の方へ歩いていく。"},{w:"alek",t:"おい。",v:"18_0171"},{w:null,t:"エリー、ふり向かずに、片手だけうしろに上げる。"},{w:null,t:"牛の前で、エリーが止まる。"},{w:null,t:"エリーの口から、短い言葉。"},{w:null,t:"牛の耳が、ぴくっと動く。"},{w:null,t:"エリーが、もう一言。"},{w:null,t:"牛が、ゆっくり頭を下げる。"},{w:null,t:"エリー、手のひらを牛の鼻の前に出す。"},{w:null,t:"エリー、割れたチップを拾う。"},{w:"hero",f:"serious",t:"……なんて言ったの。",v:"18_0180"},{w:"elly",t:"ないしょ。",v:"18_0181"},{w:null,t:"ヤマト、口を開けたまま、アレクを見る。"},{w:null,t:"フォルンが、ヤマトのひざから下りて、牛の前まで歩いていく。"},{w:null,t:"エリーが、からし色のマフラーを拾って、ヤマトの首に、ぐるぐる巻く。"}];
GR_SC.g18_09=[{w:null,t:"三人、毛糸をたぐりながら、階段を上がる。"},{w:null,t:"うしろの暗がりに、牛が立っている。"},{w:null,t:"エリーが、階段の上から、古い言葉で一言。"},{w:null,t:"牛が、ひづめで床を、こつん、と軽く鳴らす。"},{w:null,t:"アレク、くぐり戸のハンドルを回して、戸を閉める。"},{w:null,t:"外は、明け方。"},{w:null,t:"広場で、毛布をたたむ人たち。"},{w:null,t:"ヤマト、胸の時計のつまみを押す。"},{w:null,t:"ほかの三つは、赤いまま。"},{w:null,t:"広場の大きな画面。"},{w:"x",n:"ニュースの声",t:"続いて、運河の町コリンタです。きのうの夕方から、町の上空に雷雲がとどまり、落雷が続いています。運河の橋は、すべて沈められ——",v:"18_0197"},{w:null,t:"画面に、コリンタの空。"},{w:"elly",t:"ユスフの町だ。",v:"18_0199"},{w:null,t:"アレク、ポケットのチップを、指でさわる。"},{w:null,t:"ヤマト、からし色のマフラーと赤い結び目を巻き直して、港の方の道を見る。"}];
GR_EP[18]={"t": "守り①ミノタス・後編", "sc": [["g18_01", "迷宮の入口（夜）", 0], ["g18_02", "丘の下の広場（夜）", 0], ["g18_03", "迷宮", 0], ["g18_04", "迷宮の広間", 0], ["g18_05", "勝負・柱の四角", 1], ["g18_06", "勝負・左右から", 1], ["g18_07", "勝負・決め手", 1], ["g18_08", "勝負のあと", 0], ["g18_09", "迷宮の入口（明け方）", 0]]};
GR_SC.g19_01=[{w:null,t:"運河の町の空に、雷雲が居すわった。",v:"19_0022"},{w:null,t:"運河の両岸の、高い岩のかべ。"},{w:null,t:"雲の中を、羽のある白い影が、ぐるりと回る。"},{w:null,t:"橋のたもとの制御室。"},{w:null,t:"ミハリス、レバーを引く。"},{w:null,t:"雷が、橋の沈んだあとの水面に落ちる。"},{w:null,t:"雲の中の白い影が、町の上の高い丘へ、すうっともどっていく。"},{w:null,t:"制御室の小さな画面。"},{w:"x",n:"ニュースの声",t:"コリンタでは、落雷が続いています。市は、屋内にとどまるよう呼びかけています。",v:"19_0031"},{w:null,t:"ミハリス、画面を消す。"},{w:null,t:"第19話　守り②ペガライ・前編",v:"19_0034"}];
GR_SC.g19_02=[{w:null,t:"港の待合の画面に、「コリンタで落雷つづく」。"},{w:null,t:"三人、それを見上げる。"},{w:null,t:"甲板で、ユスフが洗濯物を取りこんでいる。"},{w:"yusuf",t:"エリー！",v:"19_0043"},{w:null,t:"エリー、両手をふり返して、かけていく。"},{w:"yusuf",t:"大会、見たよ。船のみんなで。画面、一個しかないから、取り合いだった。",v:"19_0045"},{w:"elly",t:"ヤマト、優勝したんだよ。",v:"19_0046"},{w:"yusuf",t:"だから、見たって。",v:"19_0047"},{w:null,t:"ヤマト、胸を張る。"},{w:null,t:"ユスフの父さんが、操舵室の窓から顔を出す。"},{w:"x",n:"ユスフの父さん",t:"白い都で荷を積んでた。コリンタへ帰るとこだ。橋が全部沈めてあるから、今なら通れる。……乗るか。",v:"19_0050"}];
GR_SC.g19_03=[{w:null,t:"船が、港を出る。"},{w:null,t:"ヤマト、操舵室の大きな木の舵輪を、じっと見ている。"},{w:"hero",t:"おじさん。それ、ちょっとだけ。",v:"19_0055"},{w:"x",n:"ユスフの父さん",t:"だめだ。",v:"19_0056"},{w:"hero",f:"serious",t:"……ちょっとだけ。",v:"19_0057"},{w:null,t:"父さん、前を見たまま、首をふる。"},{w:"yusuf",t:"ぼくも、前、やらせてもらったよ。",v:"19_0059"},{w:"x",n:"ユスフの父さん",t:"……ちょっとだけな。まっすぐ持ってろ。",v:"19_0060"},{w:null,t:"ヤマト、両手で舵輪をにぎる。"},{w:null,t:"窓の外の甲板で、ユスフが見ている。"},{w:"hero",t:"見ろ、片手！",v:"19_0063"},{w:null,t:"舵輪が、からからと回る。"},{w:null,t:"がりがりがり。"},{w:"hero",f:"serious",t:"……手伝わなくていいよ。",v:"19_0070"}];
GR_SC.g19_04=[{w:null,t:"運河は、岩の山をまっすぐ切ってつくった水の道だ。",v:"19_0074"},{w:null,t:"両側に、そそり立つ岩のかべ。"},{w:null,t:"沈んだ橋の上を、船がゆっくり通る。"},{w:null,t:"運河を出ると、町。"},{w:null,t:"町の上の高い丘。"},{w:"yusuf",t:"あそこのいちばん上に、泉があるんだよ。昔、羽のある馬が——",v:"19_0079"},{w:"hero",t:"ひづめで掘った、だろ。前、聞いた。",v:"19_0080"},{w:"yusuf",t:"……覚えてたんだ。",v:"19_0081"},{w:null,t:"ユスフ、手すりをにぎったまま、だまる。"},{w:null,t:"ヤマト、胸の時計のつまみを押す。"},{w:null,t:"船が、岸に横づけする。"},{w:"yusuf",t:"船、ここで待ってるから。",v:"19_0086"},{w:null,t:"ユスフの父さんが、操舵室から、だまって親指を立てる。"}];
GR_SC.g19_05=[{w:null,t:"乾いた岩の丘。"},{w:null,t:"三つ目の門の下に、保護局の車が一台。"},{w:"x",n:"保護局の職員",t:"……君たち、上はだめだ。雷だから。",v:"19_0092"},{w:"alek",t:"雷？",v:"19_0093"},{w:"x",n:"保護局の職員",t:"雷だよ。発表で、そう言ってる。",v:"19_0094"},{w:null,t:"職員の手は、ハンドルからはなれない。"},{w:null,t:"三人、車の横を通りすぎる。"}];
GR_SC.g19_06=[{w:null,t:"中庭の左に、石でふちどった四角い泉。"},{w:null,t:"水面が、ぶるっとふるえる。"},{w:null,t:"天馬が、泉の上で、ひづめを一つ空にける。"},{w:null,t:"天馬が、塔の上の石にとまる。"},{w:null,t:"ヤマト、首を上に向ける。"},{w:null,t:"天馬の目が、ヤマトの方へ動く。"},{w:null,t:"ヤマトが止まる。"},{w:"elly",t:"ヤマト？",v:"19_0108"},{w:null,t:"ヤマト、まばたきもしない。"},{w:null,t:"アレク、塔の方を見ないように、うつむいたまま、ヤマトの足首をつかむ。"},{w:null,t:"ヤマト、柱のかげから首を出して、上を見ようとする。"},{w:null,t:"アレクの手のひらが、横から、ヤマトの目の上に、ばふっとかぶさる。"},{w:"alek",t:"見るな。",v:"19_0114"},{w:"hero",f:"serious",t:"……おれ、止まってた？",v:"19_0115"},{w:"elly",t:"うん。片足で。",v:"19_0116"},{w:null,t:"ヤマト、手のひらの下で、口をへの字にする。"},{w:null,t:"塔の上で、天馬が、ひづめで石を、かつん、とたたく。"}];
GR_SC.g19_10=[{w:null,t:"三人とも、城壁のかげにひざをつく。"},{w:null,t:"アレク、すきまから泉の水をすくって、クロッコの頭にかける。"},{w:null,t:"エリー、ピリポンの背中を指でなでる。"},{w:null,t:"ヤマトのうでの中で、フォルンが片目を開けて、メダルのひもを前足でちょいとはじく。"},{w:null,t:"ヤマト、石のすきまから、泉の水面を見下ろす。"},{w:null,t:"水面に、黒い雲。"},{w:null,t:"ヤマト、びくっと肩を上げる。"},{w:null,t:"……指が、動く。"},{w:null,t:"水面の中で、天馬の目がこっちを向いている。"},{w:null,t:"ヤマト、動ける。"},{w:null,t:"アレク、ヤマトの横顔を見る。"},{w:null,t:"エリー、二人の顔を見くらべる。"},{w:null,t:"ヤマト、水面から目をそらさないまま、フォルンを胸にかかえ直す。"},{w:null,t:"アレクの手が、ヤマトのパーカーのすそを、うしろから、ぐっとつかむ。"},{w:null,t:"ヤマトの目は、水面からはなれない。"}];
GR_EP[19]={"t": "守り②ペガライ・前編", "sc": [["g19_01", "運河の町コリンタ（きのうの夕方）", 0], ["g19_02", "白い都の港（朝）", 0], ["g19_03", "貨物船・操舵室（昼）", 0], ["g19_04", "運河（午後）", 0], ["g19_05", "とりでの坂道（夕方近く）", 0], ["g19_06", "とりでの上の中庭", 0], ["g19_07", "勝負・一度目", 1], ["g19_08", "勝負・二度目", 1], ["g19_09", "勝負・引く", 1], ["g19_10", "泉の裏・くずれた城壁のかげ（夕方）", 0]]};
GR_SC.g20_01=[{w:null,t:"コリンタの運河。ゆうべ、三人は、とりでを下りて船にもどった。",v:"20_0022"},{w:null,t:"岸に横づけした古い貨物船。"},{w:null,t:"船のへりで、ヤマトが、ロープのついたバケツを運河に下ろしている。"},{w:null,t:"ヤマト、バケツを胸の前に持って、水面をのぞく。"},{w:null,t:"ヤマト、水面から目をはなさずに、甲板を歩きだす。"},{w:null,t:"ヤマトの口のはしが、上がる。"},{w:null,t:"マストの柱に、おでこから当たる。"},{w:null,t:"毛布の中から、アレクの声。"},{w:"alek",t:"……朝から、うるさい。",v:"20_0031"},{w:"hero",t:"今の、マストが悪い。あんなとこに立ってんのが悪い。",v:"20_0032"},{w:"alek",t:"船ができた時から、そこに立ってる。",v:"20_0033"},{w:null,t:"ヤマト、ぬれた前髪のまま、またバケツを運河に下ろす。"},{w:null,t:"操舵室の横で、ユスフがパンをかじりながら見ている。"},{w:"yusuf",t:"何してんの。",v:"20_0036"},{w:"hero",t:"練習。",v:"20_0037"},{w:"yusuf",t:"バケツの？",v:"20_0038"},{w:"hero",f:"serious",t:"……まあ、そんな感じ。",v:"20_0039"},{w:null,t:"第20話　守り②ペガライ・後編",v:"20_0048"}];
GR_SC.g20_02=[{w:null,t:"甲板のまん中に、ユスフが持ってきたパンとオリーブのびん。"},{w:null,t:"フォルン、オリーブを一つくわえて、しっぽの火の上でころがす。"},{w:null,t:"アレク、紙に、とりでの中庭の絵を描いている。"},{w:"alek",t:"ゆうべ、おれがすそを引っぱらなかったら、おまえ、そのまま泉に落ちてたぞ。",v:"20_0057"},{w:"hero",t:"落ちてない。",v:"20_0058"},{w:"alek",t:"片足、もう出てた。",v:"20_0059"},{w:"hero",t:"出てたけど、落ちてない。",v:"20_0060"},{w:null,t:"ヤマト、紙の泉を、指でとん、とたたく。"},{w:"hero",t:"ここで、やる。水の方だけ見てれば、止まんない。",v:"20_0062"},{w:null,t:"アレク、ヤマトの赤いおでこを見る。"},{w:"alek",t:"あいつは塔の石の上で治る。泉からじゃ、石の上までは届かない。",v:"20_0064"},{w:null,t:"ヤマト、パンをかじりながら、紙の塔をにらむ。"},{w:"hero",t:"撃ったら、降りてくるじゃん、あいつ。きのう、そうだった。",v:"20_0066"},{w:"alek",t:"降りてきたのは、ピリポンの顔をのぞきこみに来た時だ。",v:"20_0067"},{w:"hero",t:"水だけ見てりゃ、のぞかれたって平気だろ。",v:"20_0068"},{w:null,t:"アレク、返事をしない。"},{w:"alek",t:"……降りてきたら、そこは草だ。石じゃない。",v:"20_0070"},{w:null,t:"甲板のむこうで、とりでの雲から雷が一つ落ちる。"},{w:null,t:"ユスフが、パンを半分にちぎって、ヤマトにわたす。"},{w:"yusuf",t:"顔を見ないで、どうやって戦うの。",v:"20_0073"},{w:"hero",t:"下、見る。",v:"20_0074"},{w:null,t:"ユスフ、操舵室の父さんの方を見る。"},{w:"x",n:"ユスフの父さん",t:"昼には、船を出す。そのころ、まだ雲があったら、置いていくぞ。",v:"20_0076"},{w:null,t:"ヤマト、パンを口いっぱいにつめこんで、立ち上がる。"}];
GR_SC.g20_03=[{w:null,t:"三つ目の門の下。"},{w:null,t:"奥の塔の上に、白い天馬。"},{w:null,t:"三人、うつむいたまま、中庭のはしを、泉の方へ歩く。"},{w:null,t:"泉のふちの石。"},{w:null,t:"エリー、浮き彫りの前にしゃがむ。"},{w:"elly",t:"この人も、盾、見てる。",v:"20_0086"},{w:null,t:"ヤマト、浮き彫りの盾を見る。"},{w:null,t:"ヤマト、何も言わずに、塔に背を向けて、泉のふちにすわる。"},{w:null,t:"アレクも、塔に背を向けて、となりにすわる。"},{w:null,t:"三人の顔が、水面に並んで映る。"},{w:null,t:"水面の中で、天馬が首を上げる。"}];
GR_SC.g20_07=[{w:null,t:"獣の闘気が引いて、光がほどけて、小さなフォルンと、小さなクロッコ。"},{w:null,t:"フォルン、起き上がる。"},{w:null,t:"フォルン、前足で鼻をごしごしこすって、クロッコから一歩はなれてすわる。"},{w:null,t:"アレク、クロッコの頭を、指で一回、こつんとたたく。"},{w:null,t:"天馬が、前足を折ったまま、首を上げる。"},{w:null,t:"水面に映った天馬の目には、もう、光がない。"},{w:null,t:"エリー、ピリポンの箱をヤマトにあずけて、天馬のそばへ行く。"},{w:null,t:"エリーの口から、短い言葉。"},{w:null,t:"天馬が、水を飲むのをやめる。"},{w:null,t:"エリーが、もう一言。"},{w:null,t:"天馬が、ゆっくり、前のひざを折る。"},{w:null,t:"エリー、天馬の首の毛に、手をのせる。"},{w:null,t:"アレク、草の上の割れたチップを拾う。"},{w:null,t:"ヤマト、浮き彫りの盾の男を、もう一度見る。"},{w:"hero",f:"serious",t:"……これ、乗れんの？",v:"20_0197"},{w:null,t:"エリー、天馬の首をなでて、古い言葉で一言。"},{w:null,t:"天馬が、羽を一回、ばさっと広げる。"}];
GR_SC.g20_08=[{w:null,t:"天馬の背に、三人。"},{w:null,t:"天馬が、泉のふちから草をけって浮く。"},{w:null,t:"とりでが、下へ遠ざかる。"},{w:null,t:"ヤマト、片手を上げかけて、すぐに首の毛をつかみ直す。"},{w:null,t:"海と山と、オリーブの畑が、ずっと先まで見える。"},{w:null,t:"ヤマト、胸の時計のつまみを押す。"},{w:null,t:"村の丘の印が、ゆうべより、また大きい。"},{w:null,t:"エリー、肩ごしに地図を見る。"},{w:null,t:"村の競技場の赤い印が、どくん、と一度強く光る。"},{w:null,t:"天馬が、羽の向きを変える。"}];
GR_EP[20]={"t": "守り②ペガライ・後編", "sc": [["g20_01", "貨物船の甲板（明け方）", 0], ["g20_02", "貨物船・甲板（朝）", 0], ["g20_03", "とりでの上の中庭", 0], ["g20_04", "勝負・はじめ", 1], ["g20_05", "勝負・なか", 1], ["g20_06", "勝負・おわり", 1], ["g20_07", "勝負のあと", 0], ["g20_08", "とりでの上・空（朝）", 0]]};
GR_SC.g21_01=[{w:null,t:"コリンタから、ふるさとの村まで。歩けば四日の道を、天馬は昼までに飛ぶ。",v:"21_0021"},{w:null,t:"下に、見なれた丘。"},{w:null,t:"ヤマト、エリーの肩につかまったまま、立ち上がる。"},{w:"hero",t:"見ろ見ろ！　村！　天馬に乗って帰ってきたやつなんて、村の歴史で、おれが初めてだぞ。",v:"21_0025"},{w:"alek",t:"すわれ。",v:"21_0026"},{w:"hero",t:"村のやつら、腰ぬかすぞ。手、ふっとこ。おーい！",v:"21_0027"},{w:null,t:"ヤマト、両手を大きくふる。"},{w:null,t:"天馬が、左へ、ゆるく曲がる。"},{w:null,t:"ヤマト、背中の上を、ずるずるすべっていく。"},{w:null,t:"エリー、ふり返って、ふき出す。"},{w:"hero",t:"あ、ホテル！　アナの屋根！",v:"21_0034"},{w:null,t:"第21話　守り③ゴッドヘラク",v:"21_0042"}];
GR_SC.g21_02=[{w:null,t:"広場に、村の人たち。"},{w:"x",n:"村のおじいさん",t:"……あそこ、二千年前の運動場だよ。ガスなんか通ってるもんか。",v:"21_0050"},{w:null,t:"だれも答えない。"},{w:null,t:"競技場の方から、何かが飛んでくる。"},{w:null,t:"村の人たちが、いっせいに家の中へ走る。"},{w:null,t:"ホテルの戸が開いて、エプロンのアナが、ほうきを持って出てくる。"},{w:null,t:"ぶどう畑の方から、三人が歩いてくる。"},{w:null,t:"アナ、ほうきを落とす。"},{w:null,t:"天馬が、アナの前で首を下げる。"},{w:null,t:"アナ、髪を押さえたまま、だまって競技場の方を指さす。"}];
GR_SC.g21_03=[{w:null,t:"土手にかこまれた、長い土の走路。"},{w:null,t:"入口の石のアーチの前に、黄色いテープ。"},{w:"x",n:"保護局の職員",t:"……はい。ドローンは、六台目です。ロボットは……今、腕が一本、村まで。……いえ、近づけません。",v:"21_0065"},{w:null,t:"職員、三人に気づいて、片手を広げる。"},{w:"x",n:"保護局の職員",t:"だめ。ここから先は、だめ。",v:"21_0067"},{w:null,t:"アーチの向こう、走路のまん中。"},{w:null,t:"金色のよろい。"},{w:null,t:"アーチのわきの石の扉。"},{w:null,t:"エリー、浮き彫りの角と、走路の王のつのを見くらべる。"},{w:"hero",f:"serious",t:"……カブトムシじゃん。",v:"21_0075"},{w:"elly",t:"ヘラクレスは、人だってば。何回言わせるの。",v:"21_0076"},{w:"x",n:"保護局の職員",t:"……七台目、です。",v:"21_0079"},{w:"x",n:"警察のロボット",t:"危険区域です。立ち止まってください。",v:"21_0081"},{w:"x",n:"保護局の職員",t:"ちょっと、きみ——",v:"21_0086"}];
GR_SC.g21_07=[{w:null,t:"獣の光がほどけて、フォルンとクロッコが、並んで土の上にへたりこむ。"},{w:null,t:"ヤマト、フォルンの横にしゃがむ。"},{w:null,t:"王は、両ひざをついたまま、肩で息をしている。"},{w:null,t:"ヤマトが、王の方へ一歩出かける。"},{w:null,t:"エリーが、ピリポンを抱き上げて箱に入れ、ヤマトの横に置く。"},{w:null,t:"王の顔は、エリーの体より大きい。"},{w:null,t:"エリーが、古代のギリシャ語で、短く話しかける。"},{w:null,t:"王の鼻息が、止まる。"},{w:null,t:"王が、エリーの顔を見る。"},{w:null,t:"王が立ち上がる。"},{w:null,t:"走路のはしで止まって、土手の向こうの、村の丘の方を向く。"},{w:null,t:"エリーも、王のとなりまで歩いていって、同じ方を見る。"},{w:null,t:"ヤマトの時計が、ふるえる。"},{w:null,t:"アレク、土の上の割れたチップを拾う。"},{w:null,t:"アーチの外で、保護局の職員が、手もとの画面に何か言いかけて、やめる。"}];
GR_SC.g21_08=[{w:null,t:"村のうしろの、オリーブ畑の丘。"},{w:null,t:"ため池の水面が、こまかくふるえている。"},{w:null,t:"オリーブの葉が、いっせいに、ざあっと鳴る。"},{w:null,t:"くずれた丸屋根の下の地面が、まん中から割れる。"},{w:null,t:"割れ目から、石の手が出る。"},{w:null,t:"石の指が、ゆっくり、地面をつかむ。"},{w:null,t:"競技場の走路のはしで、王が、低く鳴く。"},{w:null,t:"丘のふもとの道。"}];
GR_EP[21]={"t": "守り③ゴッドヘラク", "sc": [["g21_01", "空・天馬の背（昼前）", 0], ["g21_02", "オリーヴァ村・広場（昼）", 0], ["g21_03", "古代の競技場・入口のアーチ（昼）", 0], ["g21_04", "勝負・はじめ", 1], ["g21_05", "勝負・なかほど", 1], ["g21_06", "勝負・おしまい", 1], ["g21_07", "勝負のあと", 0], ["g21_08", "村の丘（昼すぎ）", 0]]};
GR_SC.g22_01=[{w:null,t:"オリーヴァ村のうしろの丘。二十年前まで、てっぺんに研究所があった。",v:"22_0021"},{w:null,t:"丘のてっぺん。"},{w:null,t:"石の手が、二本。"},{w:null,t:"立ち上がる。"},{w:null,t:"オリーブ畑いっぱいに、巨人の影が落ちる。"},{w:null,t:"村の家の戸が、あちこちで開く。"},{w:null,t:"丘のふもとのオリーブの木の下。"},{w:null,t:"アレクが、パーカーのポケットから、ノモスの画面を出す。"},{w:null,t:"アレク、画面と丘の上を見くらべる。"},{w:null,t:"ヤマトの口が、開いたまま。"},{w:null,t:"第22話　守り④アトラード・前編",v:"22_0032"}];
GR_SC.g22_02=[{w:null,t:"広場の柱から、政府の放送の声。"},{w:"x",n:"政府の放送の声",t:"オリーヴァ村のみなさん。北の丘で、地すべりのおそれがあります。南の道から、すみやかに避難してください。",v:"22_0039"},{w:null,t:"村の人たちが、荷物を持って、南の道へ歩きだす。"},{w:null,t:"ホテルの前で、アナが、泊まり客を順に送り出している。"},{w:null,t:"広場のはしの石のベンチに、おばあさん。"}];
GR_SC.g22_03=[{w:null,t:"丘へのぼる細い道。"},{w:null,t:"車の横に、三本足の台にのった細長い筒の機械。"},{w:null,t:"車のドアが開く。"},{w:"bella",t:"あら、エリーちゃん。お里帰り？　ここ、あなたの村だものね。",v:"22_0048"},{w:"elly",t:"それ、なに？",v:"22_0049"},{w:"bella",t:"お薬。大きい子用の。",v:"22_0050"},{w:null,t:"ベラドンナ、日がさのかげで、丘の上を見上げる。"},{w:"bella",t:"白い都の子も、運河の子も、王さまも、みんなほしかったけど。……一番ほしかったのは、この子。",v:"22_0052"},{w:null,t:"アレク、パーカーのポケットから、割れたチップを三つ出して、手のひらにのせて見せる。"},{w:"bella",t:"あら、拾い集めてるの。えらいわね。",v:"22_0054"},{w:null,t:"ベラドンナ、作業員に、あごで合図。"},{w:null,t:"筒の先から、細い光が一本、丘の上へ走る。"},{w:null,t:"巨人の星座の線が、いっせいに赤くなる。"},{w:null,t:"巨人が、ほえる。"},{w:null,t:"巨人の頭が、ゆっくり回る。"},{w:"x",n:"作業員",t:"社長、……村の方に。",v:"22_0062"},{w:"bella",t:"大きい子は、なれるのに時間がかかるのよ。",v:"22_0063"},{w:"hero",t:"前のより、でかいだけだろ！　あんなの、赤と青のやつで、三発！",v:"22_0066"},{w:"alek",t:"おい。",v:"22_0067"},{w:"hero",f:"serious",t:"……四発！",v:"22_0073"}];
GR_SC.g22_04=[{w:null,t:"段々畑のいちばん上。"},{w:null,t:"手前の左のすみ。"},{w:null,t:"右のはしに、村へ下る細い道。"},{w:null,t:"巨人の足もとから、くずれた石垣の岩が、ごろごろと、その道の方へ転がっていく。"},{w:null,t:"巨人が、三人を見下ろす。"}];
GR_SC.g22_08=[{w:null,t:"巨人は、それから一歩も動かなかった。球を、頭の上に持ったまま。",v:"22_0155"},{w:null,t:"南の丘の、小さな教会。"},{w:null,t:"三人が、石段のはしに並んですわっている。"},{w:null,t:"フォルンが、ヤマトのひざの上で、丸くなって眠っている。"},{w:null,t:"エリーは、ひざの上のピリポンの箱を、指でとん、とん、とたたいている。"},{w:null,t:"石段の下の草地で、天馬が立ったまま眠っている。"},{w:null,t:"教会の扉が開く。"},{w:null,t:"エリーが、箱をたたく指を止めて、おばあさんの横顔を見る。"},{w:"oba",t:"……あの子、昔の本だと、空を持たされてたのよ。ずうっと。",v:"22_0164"},{w:null,t:"それだけ言って、おばあさんは、石段を一段ずつもどっていく。"},{w:null,t:"エリー、何も聞かない。"}];
GR_SC.g22_09=[{w:null,t:"教会の窓のろうそくが、一つずつ消えていく。"},{w:null,t:"ヤマトが、そっと、フォルンをひざから毛布の上に下ろす。"},{w:null,t:"石段を下りて、北の丘の方へ歩きだす。"},{w:null,t:"段々畑の、いちばん下の石垣の前。"},{w:null,t:"ヤマトの手が、石垣の石をつかむ。"},{w:null,t:"ヤマト、自分のあいた両手を見る。"},{w:null,t:"ヤマト、石垣から手をはなす。"},{w:null,t:"教会の石段。"},{w:null,t:"ヤマト、アレクの前で止まる。"},{w:null,t:"ヤマト、頭を下げる。"},{w:null,t:"遠くで、巨人の星座の線が、ゆっくりまたたく。"},{w:null,t:"アレク、ヤマトのつむじを見る。"},{w:null,t:"アレクの枝が、左の手前のすみで止まる。"},{w:null,t:"ヤマト、顔を上げる。"},{w:"hero",f:"serious",t:"……ため池。",v:"22_0186"},{w:null,t:"アレク、何も言わない。"},{w:null,t:"ヤマト、丸屋根の×と、点線の×を、見くらべる。"},{w:null,t:"エリーは、毛布にくるまって、ピリポンの箱を抱いたまま眠っている。"},{w:null,t:"アレクが、枝を、草の中へ放る。"},{w:"alek",t:"……あしたの朝だ。",v:"22_0191"}];
GR_SC.g22_10=[{w:null,t:"空のはしが、少しだけ白い。"},{w:null,t:"丘の上の巨人。"},{w:null,t:"頭の上の星の球が、ほんの少し、南へかたむく。"},{w:null,t:"巨人の腕が、ふるえはじめる。"},{w:null,t:"胸の奥で、二つのチップが、赤く、ちかちかと光る。"},{w:null,t:"村の家の屋根に、球の影が、ゆっくりかかっていく。"},{w:null,t:"丘のふもとの黒い車。"}];
GR_EP[22]={"t": "守り④アトラード・前編", "sc": [["g22_01", "オリーヴァ村・丘のふもとのオリーブ畑（昼すぎ）", 0], ["g22_02", "村の広場（昼すぎ）", 0], ["g22_03", "丘のふもとの道（昼すぎ）", 0], ["g22_04", "丘の上・研究所あとの前（昼すぎ）", 0], ["g22_05", "勝負・はじめ", 1], ["g22_06", "勝負・なかほど", 1], ["g22_07", "勝負・おしまい", 1], ["g22_08", "南の丘の教会・石段（夜）", 0], ["g22_09", "同じ石段（真夜中）", 0], ["g22_10", "丘の上（夜明け前）", 0]]};
GR_SC.g23_01=[{w:null,t:"夜明け。村の人は、南の丘の教会で、眠れない夜を明かした。",v:"23_0021"},{w:null,t:"北の丘の上。"},{w:null,t:"オリーブ畑の中の道を、三人が丘の方へ歩いていく。"},{w:null,t:"いちばん前にアレク。"},{w:null,t:"ヤマトは走らない。"},{w:null,t:"巨人の片足が、丸屋根の石から下りる。"},{w:null,t:"第23話　守り④アトラード・後編",v:"23_0029"}];
GR_SC.g23_02=[{w:null,t:"段々畑のいちばん上。"},{w:null,t:"村へ下る道の上に、黒い車。"},{w:null,t:"車の前の折りたたみのいすに、ベラドンナ。"},{w:"bella",t:"おはよう。早いのね。見に来たのよ。この子が、うちの子になる所。",v:"23_0038"},{w:null,t:"だれも答えない。"},{w:null,t:"巨人が、三人の前で、乾いた土を一回ふむ。"},{w:null,t:"ヤマト、左の手前のすみを見る。"},{w:null,t:"三体が、巨人の前に下りる。"},{w:null,t:"上の段の石垣のきわに、天馬。"}];
GR_SC.g23_06=[{w:null,t:"獣の光がほどけて、ため池のふちに、ピリポンとクロッコ。"},{w:null,t:"赤い光のあった所で、フォルレオンの光がほどける。"},{w:null,t:"巨人の腕から、力がぬける。"},{w:null,t:"フォルン、立ち上がろうとして、前足がくずれる。"},{w:null,t:"エリーが、畑のきわから、乾いた土の上へ一歩出る。"},{w:"elly",t:"（字幕）……ちょっと、持ってて。",v:"23_0129"},{w:null,t:"巨人の目が、エリーを見る。"},{w:null,t:"巨人が、ひざをついたまま、体ごと前へのり出す。"},{w:null,t:"フォルンの、耳の先の、すぐ上。"},{w:null,t:"巨人が、ゆっくり、球を持ち上げていく。"},{w:null,t:"村の屋根から、球の影がひいていく。"},{w:null,t:"フォルン、上を見上げる。"},{w:null,t:"ヤマト、にぎっていた手を、やっと開く。"},{w:null,t:"ヤマトは、近づかない。"},{w:null,t:"エリーが、ピリポンをアレクにあずけて、巨人の足もとまで歩いていく。"},{w:null,t:"エリーが、巨人の足に手をそえて、古代のギリシャ語で話しかける。"},{w:null,t:"巨人が、球を頭の上に持ったまま、ゆっくりひざをつきなおす。"},{w:null,t:"エリーが、巨人のあごの石を、手のひらで、ぽん、とたたく。"},{w:null,t:"上の段の石垣のきわから、天馬と王が、巨人のそばへ歩いてくる。"},{w:null,t:"ベラドンナの足もとまで、割れた銀色のチップが一つ、転がってきている。"},{w:"bella",t:"……負けね。",v:"23_0145"},{w:null,t:"ヤマトが、ベラドンナの前に出る。"},{w:"hero",t:"社長なんだろ。もう、おしまいだぞ。",v:"23_0147"},{w:null,t:"ベラドンナ、ヤマトを見て、いつもの顔で笑う。"},{w:"bella",t:"わたしは、四番目。",v:"23_0149"},{w:null,t:"ヤマトの顔が、止まる。"},{w:null,t:"ベラドンナ、いすにもどって、冷めたコーヒーを、ひと口。"}];
GR_SC.g23_07=[{w:null,t:"丘のふもとから、紺色の車が三台、のぼってくる。"},{w:null,t:"先頭の車から、白衣の女。"},{w:null,t:"所長が、巨人を見上げる。"},{w:null,t:"束のいちばん上の紙。"},{w:null,t:"保護局の人が、ベラドンナの手から画面を取り上げる。"},{w:null,t:"ベラドンナ、だれにも腕をとられずに、紺色の服のあいだを、自分の足で車の方へ歩いていく。"},{w:null,t:"保護局の人が、巨人と、王と、天馬を見上げる。"},{w:"x",n:"保護局の人",t:"……はい。三体、ここに。白い都の一体も、動いていません。……では、古代は、上の指示どおり、もう一度、封印の手続きを——",v:"23_0164"},{w:null,t:"保護局の人が、袋に入れようとしたベラドンナの画面に、目を落とす。"},{w:null,t:"「封印は、また割ればいい」"},{w:null,t:"保護局の人の声が、止まる。"},{w:null,t:"所長、紙の束のいちばん下の一枚を見る。"},{w:"shocho",t:"……今日の書類は、これで全部です。",v:"23_0169"},{w:null,t:"保護局の人が、所長を見る。"},{w:null,t:"巨人の足もとで、エリーが、巨人のひざにすわっている。"}];
GR_SC.g23_08=[{w:null,t:"保護局の車の横の机。"},{w:null,t:"持ち主の欄。"},{w:"x",n:"保護局の人",t:"持ち主の方は……ダレデモナイさん？",v:"23_0176"},{w:"hero",t:"はい。おれ。",v:"23_0177"},{w:null,t:"保護局の人、ヤマトの顔を見る。"},{w:"x",n:"保護局の人",t:"お名前の、書き直しの手続きは——",v:"23_0179"},{w:"hero",t:"あとで、やる。",v:"23_0180"},{w:null,t:"ヤマト、もう、フォルンの方を見ている。"},{w:null,t:"巨人のひざの上で、エリーが、ふき出す。"},{w:null,t:"保護局の人、「ダレデモナイ」の横に、小さく「確認済み」を押す。"}];
GR_SC.g23_09=[{w:null,t:"大きな画面。"},{w:"x",n:"ニュースの声",t:"白い都の電波の塔で起きた事故について、政府は、設備の工事の責任者を——",v:"23_0187"},{w:null,t:"待合室のいすに、レン。"},{w:null,t:"レン、画面を見ている。"},{w:null,t:"レンの画面に、「父さん」からの着信。"}];
GR_SC.g23_10=[{w:null,t:"巨人が、くずれた丸屋根のあった所に、ひざをついてすわっている。"},{w:null,t:"教会から帰ってきた村の人たちが、段々畑の下から、巨人を見上げている。"},{w:null,t:"村の柱から、政府の放送の声。"},{w:"x",n:"政府の放送の声",t:"北の丘の地すべりのおそれは、なくなりました。",v:"23_0197"},{w:null,t:"おじいさんが、オリーブのかごを抱えたまま、巨人を見て、放送の柱を見て、また巨人を見る。"},{w:null,t:"段々畑のいちばん上の石垣に、三人がすわっている。"},{w:null,t:"ヤマトの胸の時計が、小さくふるえる。"},{w:null,t:"地図が、その外へ、ぐうっと広がっていく。"},{w:null,t:"エリーが、その印を見て、ヤマトの顔を見る。"},{w:null,t:"アレクは、印を見たまま、パーカーのポケットの中で、割れたチップの欠けらを、にぎる。"},{w:null,t:"保護局の車の中。"},{w:null,t:"「古代と話せる女の子と、優勝した男の子を」"},{w:null,t:"画面が、消える。"}];
GR_SC.g23_11=[{w:null,t:"割れた石の横に、ヤマトとフォルンが並ぶ。"},{w:null,t:"エリーが、フォルンの前にしゃがんで、手のひらを出す。"},{w:null,t:"フォルン、エリーの手のひらを見る。"},{w:null,t:"エリー、手のひらを出したまま、目を丸くする。"},{w:null,t:"アレクは、土手の石に腰を下ろしている。"},{w:null,t:"走路のはしで、王がすわって見ている。"},{w:null,t:"エリーが、横で片手を上げる。"},{w:"elly",t:"よーい……。",v:"23_0219"},{w:null,t:"ヤマトの足が、ぴくっと前に出かける。"},{w:null,t:"エリーの手が、下りる。"},{w:"hero",t:"いちばん！",v:"23_0222"},{w:null,t:"ヤマト、走りだす。"},{w:null,t:"フォルンが、となりにいる。"},{w:null,t:"走路の向こう。"}];
