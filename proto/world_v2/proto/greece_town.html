EG_DIR.e05_2={"k": "勝負", "t": "墓の番の子たち（アルマガネとパオドンの群れ）・盤＝夜の谷（遺跡の石と荒地）・覚えること＝地の子と遺跡。どちらも地の子で、荒地と遺跡で硬い（受けるダメージが減る）。地に強いのは森の子。森の子がいない時は、平原へ引き出してから。"};
EG_SC.e05_2=[{w:null,t:"穴の前に、帯の甲羅の子と、ゾウの子が、二体ずつ並んでいた。"},{w:"elly",f:"surprised",t:"……思ったより、かわいい。"},{w:"nadia",f:"normal",t:"アルマガネとパオドン。墓の番の子たち。"},{w:"alek",f:"normal",t:"地の子が二体ずつ。……硬いぞ。"}];
EG_SC.e05_3w=[{w:null,t:"番の子たちは、一体ずつ、岩のかげに戻っていった。"},{w:null,t:"群れの先頭のアルマガネだけが、エリーの足もとに残った。"},{w:"elly",f:"surprised",t:"……かたい。"},{w:null,t:"四人は、明かりのついた穴の奥へ進んだ。"}];
EG_SC.e05_3l=[{w:null,t:"番の子たちは、四人を穴の前まで押しもどして、すっと道をあけた。"},{w:"nadia",f:"normal",t:"……通っていいって。試しは、ここじゃないみたい。"},{w:null,t:"群れの先頭のアルマガネだけが、エリーの足もとに残った。"},{w:"elly",f:"surprised",t:"……かたい。"},{w:null,t:"四人は、明かりのついた穴の奥へ進んだ。"}];
EG_SC.e05_4=[{w:null,t:"奥に、石の扉があった。扉の前に、大きな天びん。片方の皿に、白い羽が一枚。"},{w:null,t:"天びんの上に、古い字が光っていた。ナディアが読む。"},{w:"nadia",f:"normal",t:"「うそを言う者は、通さない」。"},{w:"nadia",f:"normal",t:"……一人ずつ、答えるの。連れてる子と、なんで一緒にいるか。"},{w:"hero",f:"normal",t:"エンジュ。……手のひらで、勝手に決められた。"},{w:"partner",t:"勝手じゃない。"},{w:null,t:"天びんは、ゆれなかった。扉が、ヤマトの前で少しだけ開いた。"},{w:"elly",f:"normal",t:"ピリポン。小さい時から、ずっといっしょ。"},{w:"nadia",f:"normal",t:"ヒソリン。弟が、病院の窓から見つけた子。"},{w:null,t:"天びんは、ゆれなかった。扉は、二人の前でも開いた。"},{w:null,t:"最後に、アレクが天びんの前に立った。"},{w:"alek",f:"normal",t:"クロッコ。……川で、拾った。それだけだ。"},{w:null,t:"天びんが、かたん、と羽の方へかたむいた。"},{w:null,t:"石の扉が、アレクの前だけ、ずしんと閉じた。"},{w:"elly",f:"surprised",t:"アレク！"},{w:null,t:"クロッコが、アレクの足に、しっぽを巻きつけた。"},{w:null,t:"扉のこちら側で、アレクは、だまって立っていた。"},{w:null,t:"第5話　おわり"}];
EG_SC.e06_1=[{w:null,t:"第6話　本当のこと"},{w:null,t:"石の扉の前。アレクは、天びんの前から動かなかった。"},{w:"elly",f:"normal",t:"……アレク。"},{w:"alek",f:"normal",t:"先に行け。"},{w:"hero",f:"normal",t:"行かない。"},{w:"nadia",f:"normal",t:"この扉、うそをやめれば、また開くよ。"},{w:"alek",f:"normal",t:"……分かってる。"},{w:null,t:"しばらく、だれも何も言わなかった。クロッコが、アレクの足もとに寄った。"}];
EG_SC.e06_2=[{w:"alek",f:"normal",t:"クロッコは、拾ったんじゃない。研究所の子だった。"},{w:"alek",f:"normal",t:"生まれた時から、あごが弱い。うまくかめない。"},{w:"alek",f:"normal",t:"主が決まらなくて、施設に送られることになった。"},{w:"elly",f:"surprised",t:"……施設。"},{w:"alek",f:"normal",t:"研究所の決まりだ。送ると決めたのは、母さん。"},{w:null,t:"ヤマトは、口をあけかけて、閉じた。"},{w:"alek",f:"normal",t:"送る前の晩に、おれの名前で、主の登録をした。"},{w:"alek",f:"normal",t:"それで、家を出た。クロッコを連れて。"},{w:"alek",f:"normal",t:"案内の仕事を始めたのは、そのあとだ。"},{w:null,t:"アレクは、それだけ言って、天びんの方を向いた。"},{w:null,t:"クロッコが、アレクの靴を、やわらかくかんだ。歯は、立たなかった。"},{w:"hero",f:"normal",t:"……かむの、へたなんだな。"},{w:"alek",f:"normal",t:"ああ。"}];
EG_SC.e06_3=[{w:null,t:"天びんが、かたん、と元に戻った。羽と、釣り合っていた。"},{w:null,t:"石の扉が、アレクの前で、ゆっくり開いた。"},{w:"nadia",f:"smile",t:"……開いた。"},{w:"alek",f:"normal",t:"行くぞ。"},{w:"elly",f:"normal",t:"……うん。"}];
EG_DIR.e06_4={"k": "勝負", "t": "守り①アヌビド（古代テリオン・地と闇）・盤＝墓の中（瘴気と、石の床と、地下の水たまり）・覚えること＝守り①と、二人の子の融合。相手は地と闇。瘴気ではよけやすく、石の床では硬い。炎と水のグレンカイザー（新2）は、水たまりの上で速い。水たまりのそばへ出てきた時にねらう。"};
EG_SC.e06_4=[{w:null,t:"扉の奥は、星の絵の天井の部屋だった。まん中に、天びんと、大きな像。"},{w:null,t:"黒い犬の像。とがった鼻先。首に、金の飾り。像の目が、金色に光った。"},{w:"nadia",f:"surprised",t:"……アヌビド。うそを許さない、墓の守り。"},{w:null,t:"守りは、四人の顔を順に見た。最後に、アレクを見た。"},{w:null,t:"古い言葉で、一言。"},{w:"nadia",f:"normal",t:"……「やるか」。"},{w:"partner",t:"やる。"},{w:"alek",f:"normal",t:"クロッコ、前だ。"},{w:"hero",f:"normal",t:"エンジュ、となりに。"},{w:null,t:"獅子の姿のエンジュと、クロベクの姿のクロッコが、並んで跳んだ。"},{w:null,t:"二体が、湯気の中で重なった。ワニの尾と鱗を持つ、燃える獅子。"},{w:"alek",f:"surprised",t:"……今の、なんだ。"},{w:"hero",f:"surprised",t:"おれも、分かんない。"},{w:"partner",t:"……ワニくさい。"}];
EG_SC.e06_5w=[{w:null,t:"守りは、前足を折って、四人の前に頭を下げた。"},{w:"nadia",f:"surprised",t:"……「通れ」。"},{w:"hero",f:"smile",t:"守り①……！"},{w:null,t:"守りは、目を閉じた。また、像のように動かなくなった。"}];
EG_SC.e06_5l=[{w:null,t:"守りは、四人を見下ろして、もう一度、古い言葉を言った。"},{w:"nadia",f:"normal",t:"……「まだ」。"},{w:"alek",f:"normal",t:"もやと石から、引きはなせ。……もう一回だ。"}];
EG_SC.e06_6=[{w:null,t:"谷の外に出ると、東の空が白くなっていた。"},{w:null,t:"アレクは、自分の端末を出した。少し考えて、短い文を打った。"},{w:null,t:"「エジプトにいる。クロッコも、元気」"},{w:null,t:"アレクは、送るボタンを押した。それから、端末をポケットにしまった。"},{w:"elly",f:"normal",t:"……だれに？"},{w:"alek",f:"normal",t:"……いいだろ、別に。"},{w:null,t:"第6話　おわり"}];
EG_SC.e07_1=[{w:null,t:"第7話　ルクソールの町"},{w:null,t:"昼。ルクソールの船着き場では、町の人たちが、ドラム缶を船に積んでいた。"},{w:"nadia",f:"surprised",t:"……それ、どこへ？"},{w:"x",n:"町の人",t:"カイロの病院へ。発電機の油だ。今日から、いるだろ。"},{w:"nadia",f:"surprised",t:"……弟の病院。"},{w:"x",n:"町の人",t:"市場のパン屋のばあさんから、頼まれてな。"},{w:null,t:"ナディアは、何も言わずに、ドラム缶を一つ持ち上げるのを手伝った。"},{w:"hero",f:"normal",t:"手伝う。"},{w:"partner",t:"重いのは、きらいだ。"},{w:"hero",f:"normal",t:"おまえは持たなくていい。"}];
EG_SC.e07_2=[{w:null,t:"大きな柱が並ぶ神殿の前の広場。町の人たちが、輪になって話し合っていた。"},{w:null,t:"まん中に、背の高い女の人が立っていた。"},{w:"nadia",f:"surprised",t:"……ネフェルさん！"},{w:"x",n:"ネフェル",t:"あら、ナディア。……ギザで、スフィンガの謎を当てた子たちね。"},{w:"hero",f:"surprised",t:"なんで分かるの。"},{w:"x",n:"ネフェル",t:"記憶館から、知らせが来たの。……くわしくは、あとで。"},{w:"x",n:"町の人",t:"ネフェルさん、下の村は、どうするんだ。"},{w:"x",n:"ネフェル",t:"水門が開いたら、川ぞいの村は沈む。高い所へ、人と子を移すわ。"},{w:"x",n:"町の人",t:"でも、年寄りが、家を出たがらない。"},{w:"x",n:"ネフェル",t:"だから、一軒ずつ話を聞くの。……手伝える子は？"},{w:"alek",f:"normal",t:"案内なら、得意だ。"}];
EG_DIR.e07_3={"k": "聞く", "t": "町の人の話を最後まで聞く・覚えること＝町の人から聞く。三人の話を最後まで聞くと、手がかりが一つ分かる。途中で切ると、話は始めからになる。"};
EG_SC.e07_3a=[];
EG_SC.e07_3b=[{w:"x",n:"町の人",t:"うちのじいさん、川の神さまがいるから動かないって。"},{w:"nadia",f:"normal",t:"……おばあちゃんも、昔、同じこと言ってた。"},{w:"x",n:"川の漁師",t:"夜明け前にな、ダムの方へ、黒い船が一そう上がっていった。"},{w:"x",n:"川の漁師",t:"顔を見せない男が一人。手下は、いなかった。"},{w:"alek",f:"normal",t:"……ランサムじゃないな。あいつは、名前を言いたがる。"},{w:"x",n:"市場の女の人",t:"ダムの見張り小屋の人がね、電話で言ってたの。"},{w:"x",n:"市場の女の人",t:"「ダムに、顔を見せない男が入った」って。"}];
EG_DIR.e07_4={"k": "勝負", "t": "ネフェル（町いちばんの使い手。光・地・炎の子）・盤＝神殿の広場（遺跡の石の床）・覚えること＝古印の勝負。遺跡では、光の子は回復が強く、地の子は硬い。いちばん硬い子は、最後に回す。"};
EG_SC.e07_4=[{w:"x",n:"ネフェル",t:"手伝ってくれて、ありがとう。お礼に、古印の勝負よ。"},{w:"hero",f:"surprised",t:"お礼が、勝負なの？"},{w:"x",n:"ネフェル",t:"ここでは、そういう決まりよ。"},{w:"elly",f:"normal",t:"ネフェルさんの子、光と地と炎だよ。"},{w:"alek",f:"normal",t:"石の床だ。地の子は、ここだと硬い。"}];
EG_SC.e07_5w=[{w:"x",n:"ネフェル",t:"……スフィンガの言ったとおりね。最後まで、よく見てた。"},{w:null,t:"ネフェルは、スカラベの形の飾りを、ヤマトの手にのせた。"},{w:null,t:"古印「スカラベ」を受け取った。"}];
EG_SC.e07_5l=[{w:"x",n:"ネフェル",t:"石の上の子は、しぶといでしょう。……また、どうぞ。"}];
EG_SC.e07_6=[{w:null,t:"夕方。燃料を積んだ船が、北へ出ていった。ナディアは、見えなくなるまで見ていた。"},{w:null,t:"南の方、川の上流の空が、うっすら暗かった。"},{w:"x",n:"ネフェル",t:"顔を見せない男……。気をつけて。今夜の川は、静かすぎる。"},{w:"hero",f:"normal",t:"……静かすぎるって？"},{w:"x",n:"ネフェル",t:"夜のナイルには、昔から、大きな子が眠ってるのよ。"},{w:null,t:"第7話　おわり"}];
EG_SC.e08_1=[{w:null,t:"第8話　夜の川の男"},{w:null,t:"夜。じいちゃんの帆船は、ルクソールから南へ。みんなは、船室で眠っていた。"},{w:null,t:"ヤマトは、眠れなくて、甲板に出た。エンジュが、ついてきた。"},{w:"partner",t:"……静かすぎる。"},{w:"hero",f:"normal",t:"ネフェルさんも、そう言ってた。"},{w:null,t:"川の上に、小さな黒い船が一そう、音もなく並んできた。"},{w:null,t:"乗っているのは、男が一人。手下はいない。ランプも、つけていない。"}];
EG_SC.e08_2=[{w:"x",n:"男",t:"こんばんは。"},{w:"hero",f:"surprised",t:"……だれ。"},{w:"x",n:"男",t:"上流から、下ってきたところだ。"},{w:null,t:"エンジュの毛が、背中から逆立った。でも、エンジュは、ほえなかった。"},{w:"x",n:"男",t:"手のひらの子だね。めずらしい。"},{w:"hero",f:"serious",t:"……なんで、分かるの。"},{w:"x",n:"男",t:"首に、何もついていないから。"},{w:null,t:"男は、黒い川の水面を見下ろした。"},{w:"x",n:"男",t:"この下には、古い子が眠っている。何度呼んでも、起きない。"},{w:"hero",f:"normal",t:"……大人だから？"},{w:"x",n:"男",t:"そうらしい。"}];
EG_SC.e08_3=[{w:"x",n:"男",t:"きみは、どうして画面の外へ出た。"},{w:"hero",f:"normal",t:"……妹に、本物をさわらせたいから。"},{w:"hero",f:"normal",t:"あと、エンジュが、番組とちがったから。"},{w:"x",n:"男",t:"そうか。"},{w:null,t:"男は、少しだけ笑ったように見えた。"},{w:"x",n:"男",t:"わたしも、外へ出た。"},{w:"hero",f:"normal",t:"……それで？"},{w:"x",n:"男",t:"外は、間に合わなかった。"},{w:"x",n:"男",t:"……あのダムは、古い図面のまま。だれも直さない。"},{w:"x",n:"男",t:"会議ばかりでね。"},{w:"x",n:"男",t:"ダムの下には、昔の水路が残っている。だれも使わないのにね。"},{w:null,t:"男は、それで話を終えた。"}];
EG_DIR.e08_4={"k": "聞く", "t": "男の話を最後まで聞く・覚えること＝敵の話から手がかりを拾う。途中で言い返すと、男は話をやめて去る（手がかりは聞けない）。最後まで聞くと、「ダムの下の昔の水路」が分かる。"};
EG_SC.e08_4a=[];
EG_SC.e08_4b=[{w:"hero",f:"normal",t:"……あんた、だれ。"},{w:"x",n:"男",t:"アドリアン。"},{w:null,t:"ヤマトの手が、上着のポケットの中で、ぎゅっとかたまった。"},{w:"hero",f:"serious",t:"……書類の、名前。"},{w:"adrian",t:"おやすみ。"},{w:null,t:"黒い船は、来た時と同じように、音もなく南へ消えた。"}];
EG_DIR.e08_5={"k": "勝負", "t": "エレキナギ（夜のナイルの古代テリオン・竜。雷の技も使う）・盤＝夜の川（水辺と、岸の荒地）・覚えること＝夜の大きな子。竜は荒地で攻撃が上がるが、川の上では得がない。岸に上げずに、川の上でまとめてねらう。大技の前は赤いマスが出るので、そこから出る。融合は、アレクのユキマダラとエリーのピリポン（ピリムサ）でオーロフ（氷・氷は竜に強い）。"};
EG_SC.e08_5=[{w:null,t:"船室では、ナディアが眠れずに、おばあちゃんの歌を小さく口ずさんでいた。"},{w:null,t:"黒い船が見えなくなってすぐ、川の水が、大きくもり上がった。"},{w:null,t:"水の中から、細長い竜が首を上げた。体に、青い稲妻の筋が走っている。"},{w:"partner",t:"……起きた。"},{w:"hero",f:"surprised",t:"みんな、起きろ！"},{w:null,t:"船室から、エリーとアレクとナディアが飛び出してきた。"},{w:"nadia",f:"surprised",t:"……エレキナギ。夜の川の竜。"},{w:"alek",f:"serious",t:"さっきの男が呼んでも、起きなかったやつか。"},{w:null,t:"竜は、船のまわりを、ゆっくり一回まわった。それから、こっちに口を開けた。"},{w:"alek",f:"normal",t:"竜だ。……氷が効く。"},{w:null,t:"アレクのユキマダラと、エリーのピリポンが、船べりで重なった。雷をまとう、氷の獣。"},{w:"elly",f:"surprised",t:"……つめたっ。ピリピリする。"}];
EG_SC.e08_6w=[{w:null,t:"竜は、首を川の上に低く下ろした。そして、エンジュを、しばらくじっと見ていた。"},{w:null,t:"竜は、川の底へ沈んでいった。少しして、船のうしろに、黒い波が一本ついてきた。"},{w:"elly",f:"surprised",t:"……ついてくる？"},{w:"nadia",f:"normal",t:"……みたい。"}];
EG_SC.e08_6l=[{w:null,t:"竜の尾が、船をゆらした。でも、竜はそれ以上、何もしなかった。"},{w:null,t:"竜は、エンジュを、しばらくじっと見ていた。"},{w:null,t:"竜は、川の底へ沈んでいった。少しして、船のうしろに、黒い波が一本ついてきた。"},{w:"elly",f:"surprised",t:"……ついてくる？"},{w:"nadia",f:"normal",t:"……みたい。"}];
EG_SC.e08_7=[{w:null,t:"帆船の荷物の山のかげで、だれかが立ち上がった。"},{w:null,t:"レンだった。いつから乗っていたのか、だれも気づいていなかった。"},{w:"partner",t:"……レン。"},{w:"dimi",t:"……乗る船が、これしかなかった。"},{w:null,t:"レンは、南の暗い川を、じっと見ていた。"},{w:null,t:"ヤマトは、男の言ったことを、頭の中で、もう一度はじめから並べた。"},{w:null,t:"第8話　おわり"}];
EG_SC.e09_1=[{w:null,t:"第9話　ひびのオベリスク"},{w:null,t:"朝。夜どおし走った船は、アスワンに着いた。"},{w:null,t:"荷物のかげは、もう空だった。"},{w:null,t:"四人で、川の西岸の、赤い岩の石切り場へ登った。"},{w:null,t:"地面に、巨大な石の柱が、横になったまま半分うまっていた。まん中に、長いひび。"},{w:"nadia",f:"normal",t:"切りかけのオベリスク。ひびが入って、昔の人が捨てたの。"},{w:null,t:"柱の根もとに、丸い大きな岩が一つ。岩の背中に、白い氷が光っていた。"},{w:"elly",f:"surprised",t:"……氷？　ここ、砂漠なのに。"},{w:null,t:"岩が、ごろりと動いた。帯のような甲羅がほどけて、大きな体が立ち上がった。"},{w:null,t:"オベリオンは、眠ってはいなかった。丸まっていただけだった。"},{w:"nadia",f:"surprised",t:"……オベリオン。古い子。"}];
EG_SC.e09_2=[{w:null,t:"オベリオンは、古い言葉で、ゆっくり話しはじめた。一言ごとに、長く黙る。"},{w:"nadia",f:"normal",t:"……「水の道を、さがしているな」。"},{w:null,t:"また、黙った。風の音だけがする。"},{w:"hero",f:"normal",t:"あのさ、その石、なんでひびが入ったの？"},{w:null,t:"オベリオンは、ごろんと丸まった。また、ただの岩になった。"},{w:"nadia",f:"angry",t:"……とちゅうで聞いちゃだめ。丸まる子なの。"},{w:"hero",f:"surprised",t:"え、丸まるの？"},{w:"partner",t:"丸まった。"},{w:"alek",f:"normal",t:"……待つしかないな。"}];
EG_DIR.e09_3={"k": "勝負", "t": "ミラ＆ジョー・盤＝石切り場（荒地が多い）・覚えること＝荒地の勝負。地の子は荒地で硬い。硬い子の相手をせず、硬くない子から先に倒す。"};
EG_SC.e09_3=[{w:null,t:"石切り場の下から、言い争う声が上がってきた。"},{w:"mira",t:"古い水路は、わたしたちが先に見つけるの！　ほめてもらうの！"},{w:"joe",t:"……無理だ。"},{w:"mira",t:"なんで！"},{w:"joe",t:"ボス、聞いてない。"},{w:"mira",t:"……そこの子たち！　古い子の話、横取りする気でしょ！"},{w:"elly",f:"normal",t:"ここ、岩ばかり。荒地は、地の子が硬いよ。"}];
EG_SC.e09_4w=[{w:"mira",t:"負けた！　でも、パッチたちよりは長く戦った！"},{w:"joe",t:"……無理だ。"},{w:null,t:"ミラとジョーは、言い合いながら、坂を下りていった。"}];
EG_SC.e09_4l=[{w:"mira",t:"勝った！　……で、古い子は、どこ？"},{w:null,t:"ジョーは、だまって、丸まった岩を指さした。"},{w:"mira",t:"起こして！"},{w:"joe",t:"……無理だ。"},{w:null,t:"ミラとジョーは、言い合いながら、坂を下りていった。"}];
EG_DIR.e09_5={"k": "聞く", "t": "オベリオンの話を、間に口をはさまずに最後まで聞く・覚えること＝古代から道を聞く。間で何か言うと、丸まって話が止まる。"};
EG_SC.e09_5a=[{w:null,t:"昼すぎ。岩の甲羅が少しだけほどけて、目が一つのぞいた。"},{w:"hero",f:"normal",t:"……ごめん。もう、聞かない。"},{w:null,t:"オベリオンは、しばらくヤマトを見てから、体を起こして、また話しはじめた。"}];
EG_SC.e09_5b=[{w:"nadia",f:"normal",t:"……「水の道を、さがしているな」。"},{w:null,t:"長い間。ヤマトは、口を閉じて待った。エンジュも、じっとしていた。"},{w:"nadia",f:"normal",t:"……「古い水の道は、四つ目の門の下へ通じる」。"},{w:null,t:"また、長い間。オベリオンは、横のオベリスクに、手をそっと当てた。"},{w:"nadia",f:"normal",t:"……「あの石が、運ばれるはずだった道だ」。"},{w:null,t:"オベリオンは、それきり、また丸い岩になった。"},{w:"alek",f:"normal",t:"……四つ目の水門の、下か。"},{w:"hero",f:"normal",t:"ゆうべの男も、ダムの下に昔の水路があるって言ってた。"},{w:"elly",f:"surprised",t:"同じ所？"},{w:"hero",f:"normal",t:"……たぶん。"}];
EG_SC.e09_6=[{w:null,t:"夕方。石切り場から、南の湖の方を見下ろした。"},{w:null,t:"遠くのダムの方で、低い地鳴りがした。"},{w:"nadia",f:"serious",t:"……ラジオ。"},{w:"x",n:"ランサムの声",t:"二つ目の水門を開けた。次がいつかは、まだ言わない。"},{w:null,t:"ナディアの端末の画面の文字が変わった。「水門　2/4」"},{w:null,t:"第9話　おわり"}];
EG_SC.e10_1=[{w:null,t:"第10話　湖のほとり"},{w:null,t:"夜。ダムの湖の岸。四人とじいちゃんで、小さなたき火を囲んでいた。"},{w:null,t:"湖は暗く、広く、向こう岸が見えない。"},{w:"hero",f:"normal",t:"じいちゃん。ゆうべ、船で、男の人と話した。"},{w:"genichi",t:"…………。"},{w:"hero",f:"normal",t:"アドリアンって、言ってた。"},{w:null,t:"じいちゃんは、たき火に枝を一本くべた。しばらく、何も言わなかった。"}];
EG_SC.e10_2=[{w:"genichi",t:"五十年前。エーゲ海に、小さな島があった。ネシ島。"},{w:"genichi",t:"わしと、クロエ博士の親父さんで、島の古い神殿を調べに行った。"},{w:"alek",f:"surprised",t:"……うちの、じいさんが？"},{w:"genichi",t:"神殿の底に、いちばん古い子が眠っとった。"},{w:"genichi",t:"わしらは、その子の記録を取った。姿と、声と、低い音。"},{w:"genichi",t:"その夜、嵐が来た。島が、沈みはじめた。"},{w:null,t:"たき火が、ぱちりとはねた。"},{w:"genichi",t:"逃げる船の順番は、AIが決めた。"},{w:"genichi",t:"記録と、登録された研究者が先だった。"},{w:"genichi",t:"島の子が一人、残った。わしは、迎えに戻ると言った。"},{w:"genichi",t:"……間に合わんかった。"},{w:"hero",f:"normal",t:"…………その子の、名前。"},{w:"genichi",t:"アドリアン。"},{w:null,t:"だれも、何も言わなかった。湖の水が、岸の石を小さくたたいていた。"}];
EG_SC.e10_3=[{w:null,t:"エンジュが、いつものように、地面に耳をつけた。"},{w:"genichi",t:"研究所の子はみんな、あの記録から、姿を写した。"},{w:"genichi",t:"姿は、みんなに写した。耳は、一体にしか入らんかった。"},{w:"elly",f:"surprised",t:"……耳？"},{w:null,t:"じいちゃんは、地面に耳をつけているエンジュを見た。"},{w:"partner",t:"……なんだ。"},{w:"genichi",t:"おまえだ。"},{w:"elly",f:"surprised",t:"……神殿の石。光ったの、エンジュがさわった時だけ。"},{w:"genichi",t:"……そういうことだ。"},{w:null,t:"エンジュは、じいちゃんを見て、それから、また地面に耳をつけた。"},{w:"nadia",f:"normal",t:"……おばあちゃんの湖の底からも、何か鳴ってる？"},{w:"partner",t:"鳴ってる。ずっと。"}];
EG_SC.e10_4=[{w:null,t:"じいちゃんは、それ以上、話さなかった。たき火の番をして、朝まで起きていた。"},{w:null,t:"ヤマトは、横になったまま、自分の手のひらを見ていた。"},{w:null,t:"それから、となりで寝ているエンジュの耳を見た。"},{w:null,t:"湖の向こうの暗い所を、しばらく見ていた。"},{w:null,t:"第10話　おわり"}];
EG_SC.e11_1=[{w:null,t:"第11話　引っこした神殿"},{w:null,t:"昼。じいちゃんの船は、ダムの湖をさらに南へ。両岸は、ずっと砂。"},{w:null,t:"岸の崖に、大きな石の像が四つ、すわって並んでいた。"},{w:"hero",f:"surprised",t:"でっか……。崖に、ほってある。"},{w:"nadia",f:"normal",t:"アブ・シンベルの神殿。……ほんとうは、ここじゃなかったの。"},{w:"elly",f:"surprised",t:"え？"},{w:"nadia",f:"normal",t:"ダムができて、湖に沈むことになった。だから、切って運んだの。"},{w:"nadia",f:"normal",t:"ばらばらに切って、上の崖に、組み直した。"},{w:"hero",f:"surprised",t:"神殿ごと、引っこし？"},{w:"genichi",t:"わしが生まれる前の話だ。千個以上に切ったそうだ。"},{w:"partner",t:"……下の、湖の底から、まだ音がする。"}];
EG_SC.e11_2=[{w:null,t:"四人で、神殿の中へ入った。長い廊下の、いちばん奥に、小さな部屋。"},{w:null,t:"奥の壁の前に、石の像が四つ。足もとに、金と黒の羽の鳥が丸くなっていた。"},{w:"nadia",f:"surprised",t:"……エクリオン。朝の光で起きる鳥。"},{w:"alek",f:"normal",t:"守りか。"},{w:"nadia",f:"normal",t:"毎朝、いちばん最初の光で、目をさますって。"},{w:"hero",f:"normal",t:"じゃあ、あしたの朝、来ればいい。"},{w:"nadia",f:"normal",t:"……でも、光がこの奥まで届くのは、一年に二日だけなの。"},{w:"elly",f:"surprised",t:"二日だけ？"},{w:"nadia",f:"normal",t:"今日は、その日じゃない。"},{w:"hero",f:"normal",t:"……じゃあ、どうするの。"},{w:"nadia",f:"normal",t:"昔の人は、鏡で光を運んで、暗い墓の奥で絵を描いたって。"},{w:"alek",f:"normal",t:"……鏡で、運ぶか。"}];
EG_SC.e11_3=[{w:null,t:"夜。神殿の前の岸で、アレクの端末が、短く鳴った。"},{w:null,t:"アレクは、画面を見て、しばらく動かなかった。"},{w:"elly",f:"normal",t:"……だれから？"},{w:null,t:"アレクは答えずに、画面を、みんなの方へ向けた。"},{w:null,t:"「融合の記録です。一つになると、タイプが変わる。弱点が消えることもある」"},{w:"hero",f:"surprised",t:"……クロエ博士？"},{w:"alek",f:"normal",t:"……返事が、来ただけだ。"},{w:null,t:"画面の下に、小さな字で、もう一行あった。アレクは、そこだけ読まずに閉じた。"}];
EG_DIR.e11_4={"k": "勝負", "t": "ログ＆パッチとミラ＆ジョー（二組の敵）・盤＝神殿の前の岸（遺跡と砂）・覚えること＝融合の使いどころ。融合は二段目どうし。一つになるとタイプが変わり、弱点が消えることがある。攻撃も大きく上がる。相手の得意なタイプに弱い子を、融合で弱点のない姿にする。"};
EG_SC.e11_4=[{w:null,t:"夜ふけ。神殿の前の船着き場で、がちゃがちゃと音がした。"},{w:"patch",t:"あった！　鏡！　これで、光の鳥をつかまえるの！"},{w:"log",t:"鏡で、どうやってつかまえるんだ。"},{w:"patch",t:"……光らせて、びっくりさせる！"},{w:"joe",t:"……無理だ。"},{w:"mira",t:"ちょっと！　その鏡、わたしたちが先に見つけたの！"},{w:"hero",f:"angry",t:"どっちのでもない！　町の人の鏡だろ！"},{w:"alek",f:"normal",t:"……ちょうどいい。届いたやつ、試すぞ。"},{w:"elly",f:"normal",t:"ピリポンの大きい姿と、だれの子で？"}];
EG_SC.e11_5w=[{w:"mira",t:"……ずるい！　二体が一つになるの、聞いてない！"},{w:"joe",t:"……無理だ。……聞いてなかった。"},{w:null,t:"四人の手下は、二人ずつ言い合いながら、暗い岸を去っていった。"}];
EG_SC.e11_5l=[{w:"patch",t:"はい、エリートの勝ち！　鏡、もらっていく！"},{w:null,t:"パッチが鏡を持ち上げた時、鏡に月の光が当たって、パッチの目に入った。"},{w:"patch",t:"まぶしい！"},{w:"log",t:"鏡は、そういうもんだ。"},{w:null,t:"ヤマトたちは、落ちた鏡を、全部拾いあげた。"},{w:null,t:"四人の手下は、二人ずつ言い合いながら、暗い岸を去っていった。"}];
EG_SC.e11_6=[{w:null,t:"四人は、集めた鏡を、神殿の前に並べた。大きいのも、小さいのも。"},{w:"nadia",f:"normal",t:"……足りるかな。"},{w:"genichi",t:"足りなければ、船の窓をはずせばいい。"},{w:null,t:"東の空は、まだ暗い。でも、星が少しずつ消えはじめていた。"},{w:"alek",f:"normal",t:"夜明けまで、あと二時間だ。"},{w:null,t:"第11話　おわり"}];
EG_SC.e12_1=[{w:null,t:"第12話　最初の光"},{w:null,t:"夜明け前。神殿の入口から奥の部屋まで、長い廊下は、まっ暗だった。"},{w:"alek",f:"normal",t:"入口から奥まで、まっすぐじゃない。三回、曲がる。"},{w:"elly",f:"normal",t:"曲がり角ごとに、鏡を一枚ずつ置けばいい？"},{w:"nadia",f:"normal",t:"角度、合わせないと、光が壁に当たって終わり。"},{w:"genichi",t:"船の窓、はずしてきたぞ。二枚。"},{w:"hero",f:"surprised",t:"ほんとに、はずしたの？"},{w:"genichi",t:"帰りは、寒いだろうな。"}];
EG_DIR.e12_2={"k": "謎の盤", "t": "鏡で光を運ぶ・入口から奥の部屋まで、曲がり角に鏡を置いて、向きを決める・覚えること＝光は、鏡に当たった角度と同じ角度ではね返る。一枚でも向きがちがうと、光は奥まで届かない。日がのぼりきる前に、置き終える。"};
EG_SC.e12_2a=[];
EG_SC.e12_2b=[{w:null,t:"東の空が、赤くなった。地平線から、太陽のはしがのぞいた。"},{w:null,t:"最初の光が、神殿の入口に差しこんだ。一枚目の鏡に当たる。"},{w:"elly",f:"surprised",t:"曲がった！"},{w:null,t:"二枚目。三枚目。光の線が、暗い廊下を、角ごとに折れながら進んでいく。"},{w:"nadia",f:"serious",t:"……あと一枚。"},{w:null,t:"最後の鏡に当たった光が、奥の部屋の、眠る鳥の上に落ちた。"}];
EG_DIR.e12_3={"k": "勝負", "t": "守り②エクリオン（古代テリオン・光と闇）・盤＝神殿の奥（遺跡の石の床と、外の砂の平原）・覚えること＝守り②。光は遺跡で回復が強く、闇は遺跡でよけやすい。光と闇の両方が得をする遺跡から、平原へ出させて、一気に。融合は、ヤマトのエンジュ（エンレオ）とコグリフ（グリフォ）でブレイグリオ（光）。"};
EG_SC.e12_3=[{w:null,t:"金と黒の羽が、ふくらんだ。鳥は、ゆっくり首を上げた。"},{w:"nadia",f:"surprised",t:"……起きた。"},{w:null,t:"鳥は、部屋の中を一回飛んで、四人の前に下りた。"},{w:null,t:"古い言葉で、一言。"},{w:"nadia",f:"normal",t:"……「朝だ」。"},{w:"hero",f:"normal",t:"……うん。朝。"},{w:null,t:"鳥は、翼を広げた。部屋じゅうが、まぶしいほど明るくなった。"},{w:"nadia",f:"normal",t:"……「やるか」、だって。"},{w:"partner",t:"やる。"},{w:"alek",f:"normal",t:"光と闇だ。石の上だと、傷がふさがる。"},{w:"hero",f:"normal",t:"エンジュ、コグリフ。……今度は、おれの二体で。"},{w:null,t:"エンジュとコグリフが、同時に跳んだ。翼のある、燃える獅子。"},{w:"nadia",f:"surprised",t:"……鳥と、ライオン？"},{w:"partner",t:"……どっちでもいい。"}];
EG_SC.e12_4w=[{w:null,t:"鳥は、翼をたたんで、四人の前に頭を下げた。"},{w:"nadia",f:"surprised",t:"……「通れ」。"},{w:"hero",f:"smile",t:"守り②……！"},{w:null,t:"鳥は、また丸くなった。光の中で、目を閉じた。"}];
EG_SC.e12_4l=[{w:null,t:"鳥の傷は、石の上の光の中で、すぐにふさがった。"},{w:"nadia",f:"normal",t:"……「まだ」。"},{w:"alek",f:"normal",t:"石の外だ。もう一回。"}];
EG_SC.e12_5=[{w:null,t:"神殿の外へ出ると、日は、もう高くなっていた。"},{w:null,t:"ナディアの端末が鳴った。ルクソールのネフェルからだ。"},{w:"x",n:"ネフェル",t:"下流に、二つ目の水が着いたわ。川が、町の岸までふくらんでる。"},{w:"x",n:"ネフェル",t:"高い所へ移すの、まだ半分。手が足りない。"},{w:"nadia",f:"serious",t:"……行かなきゃ。"},{w:"genichi",t:"空の船の乗り場まで、船で一時間だ。"},{w:null,t:"第12話　おわり"}];
EG_SC.e13_1=[{w:null,t:"第13話　上がる水"},{w:null,t:"昼。アブ・シンベルの岸から空の船に乗りかえて、四人は下流の町へ飛んだ。"},{w:null,t:"空から見ると、川が茶色くふくらんで、畑の上まで広がっていた。"},{w:"elly",f:"surprised",t:"……畑が、川になってる。"},{w:"nadia",f:"serious",t:"スフィンガの謎の、大水。……でも、こんなの、昔とちがう。"},{w:"alek",f:"normal",t:"昔の大水は、毎年少しずつだ。これは、一度に来てる。"}];
EG_SC.e13_2=[{w:null,t:"町の通りの半分が、もう水の中だった。人とテリオンが、坂の上へ逃げていく。"},{w:"x",n:"ネフェル",t:"来てくれた！　坂の上の神殿まで、まだ半分が残ってる。"},{w:"x",n:"ネフェル",t:"水は、一時間ごとに上がる。たぶん、夜明けまで止まらない。"},{w:"hero",f:"serious",t:"……全部、上まで運ぶ。"},{w:"x",n:"町の人",t:"うちのじいさんが、まだ動かない！　川の神さまがいるって！"},{w:"nadia",f:"normal",t:"……わたしが行く。"}];
EG_SC.e13_3=[{w:null,t:"水の入った家の二階で、年取った男の人が、窓の外の川を見ていた。"},{w:"x",n:"町のじいさん",t:"わしは、ここで生まれた。この家は、大水でも沈まん。"},{w:"nadia",f:"normal",t:"……うん。"},{w:"x",n:"町のじいさん",t:"わしの親父の時も。じいさんの時も。この家だけは。"},{w:"nadia",f:"normal",t:"……うん。"},{w:"x",n:"町のじいさん",t:"……でも、今度の水は、音がちがう。"},{w:null,t:"ナディアは、じいさんが話し終わるまで、ずっとうなずいていた。"},{w:"nadia",f:"normal",t:"……一晩だけ、神殿で寝てくれる？　朝には帰れるから。"},{w:"x",n:"町のじいさん",t:"……一晩だけだぞ。"}];
EG_DIR.e13_4={"k": "勝負", "t": "水と時間の盤・相手＝ログ＆パッチとミラ＆ジョー・盤＝水に沈む町（一手ごとに水のマスが一列ずつ広がる）・覚えること＝水と時間の盤。手下を倒すより、町の人と子テリオンのマスを、水が来る前に坂の上の出口へ運ぶ。運んだ数で決まる。雷と水のライゼンギガス（新3）は、水のマスの上で速く、屋根から屋根へ運べる。"};
EG_SC.e13_4=[{w:null,t:"日がかたむいた。水は、また一段上がった。"},{w:null,t:"逃げおくれた子テリオンたちが、屋根の上で鳴いている。そこへ、ゼロデイの手下。"},{w:"patch",t:"はい！　逃げおくれた子は、ゼロデイがもらっていきます！"},{w:"log",t:"水の中の仕事、聞いてない。"},{w:"mira",t:"どっちが多く集めるか、勝負よ！"},{w:"joe",t:"……無理だ。"},{w:"hero",f:"angry",t:"そんなことしてる場合か！"},{w:"alek",f:"normal",t:"一手ごとに水が上がる。手下をかまうな。先に、上へ運べ。"},{w:"elly",f:"normal",t:"屋根まで、遠すぎる。泳げる子がいれば……。"},{w:"alek",f:"normal",t:"……クロッコ。ピリポンの横に。"},{w:null,t:"クロベクの姿のクロッコと、ピリムサの姿のピリポンが、水ぎわに並んだ。"},{w:null,t:"二体が、しぶきの中で重なった。雷をまとった、長い水の竜。"},{w:"elly",f:"surprised",t:"……アレクとも、できた。"},{w:"alek",f:"normal",t:"……乗れるか、聞いてみろ。"}];
EG_SC.e13_5w=[{w:null,t:"最後の子テリオンが、坂の上にたどりついた。町の人たちが、手をたたいた。"},{w:"patch",t:"……一体も、集められなかった。"},{w:"mira",t:"わたしも。……引き分けね。"},{w:"joe",t:"……無理だ。"},{w:"mira",t:"なんで！"},{w:"joe",t:"どっちも、ゼロ。"},{w:null,t:"手下たちは、水の上を、小さな船で逃げていった。"}];
EG_SC.e13_5l=[{w:null,t:"屋根の上に、子テリオンが一体だけ残った。水が、もうすぐそこまで来ていた。"},{w:null,t:"ヒソリンが、水ぎわの岩から、ハサミで子テリオンのしっぽをつかんで、引き上げた。"},{w:"nadia",f:"surprised",t:"ヒソリン！"},{w:null,t:"手下たちは、水の上を、小さな船で逃げていった。"}];
EG_SC.e13_6=[{w:null,t:"夜。神殿の前の坂に、町の人と子テリオンが、肩を寄せあって座っていた。"},{w:null,t:"町のじいさんは、ナディアのとなりで、腕を組んで川を見ていた。"},{w:null,t:"夜明け。東が白くなったころ、川の音が、ふっと静かになった。"},{w:"x",n:"ネフェル",t:"……止まった。水が、上がってない。"},{w:"x",n:"町のじいさん",t:"……朝だな。帰るぞ。"},{w:"nadia",f:"normal",t:"家、まだ水の中だよ。"},{w:"x",n:"町のじいさん",t:"……じゃあ、もう一晩だ。"},{w:null,t:"第13話　おわり"}];
EG_SC.e14_1=[{w:null,t:"第14話　古い水路"},{w:null,t:"昼。空の船でアスワンに戻ると、四人は、ダムを見下ろす丘に登った。"},{w:null,t:"灰色の巨大な壁。上の道には、ゼロデイの車と、飛ぶ機械が並んでいる。"},{w:"alek",f:"serious",t:"正面は、だめだ。見張りが多すぎる。"},{w:"elly",f:"normal",t:"古い水路って、どこから入るんだろ。"},{w:"hero",f:"normal",t:"オベリオン、「石が運ばれるはずだった道」って。"},{w:"nadia",f:"surprised",t:"……石切り場から、オベリスクを運ぶための水路？"},{w:"hero",f:"normal",t:"あの男も、ダムの下に、昔の水路が残ってるって。"},{w:"alek",f:"normal",t:"入口は、石切り場の方か。"}];
EG_SC.e14_2=[{w:null,t:"砂にうもれた崖。ヒソリンが、しっぽを立てて、ハサミで砂をほりはじめた。"},{w:"nadia",f:"surprised",t:"……ここだけ、砂が冷たい、って。"},{w:null,t:"砂の下から、石を四角く組んだ、古いトンネルの口が出てきた。"},{w:"partner",t:"……奥から、水と、低い音。"},{w:"genichi",t:"わしは、ここで待つ。年寄りが入ると、うるさいからな。"},{w:"hero",f:"normal",t:"……すぐ戻る。"},{w:"genichi",t:"戻らんでいい。先へ行け。"}];
EG_DIR.e14_3={"k": "勝負", "t": "ゼロデイの見張りの機械（飛ぶ機械）・盤＝暗い水路（水辺と、石の壁）・覚えること＝潜入。見張りが、仲間を呼ぶ前に倒す（手数が少ないほどよい）。水の上では水の子が一マス多く動ける。炎は水辺で弱る。"};
EG_SC.e14_3=[{w:null,t:"四人は、ひざまでの水の中を、暗い水路の奥へ進んだ。"},{w:null,t:"しばらく行くと、天井から、赤い光が一つ、下りてきた。見張りの機械だ。"},{w:"alek",f:"serious",t:"見つかったら、上に知らせが行く。音を立てずに、こわせ。"},{w:"elly",f:"normal",t:"ここ、水の中。水の子が速いよ。"}];
EG_SC.e14_4w=[{w:null,t:"見張りの機械は、音を出す前に、水の中に落ちた。"},{w:"alek",f:"normal",t:"音を出す前に、だ。"},{w:null,t:"四人は、水路のさらに奥へ進んだ。"}];
EG_SC.e14_4l=[{w:null,t:"見張りの機械が、ピーッと鳴いてから、止まった。"},{w:"alek",f:"serious",t:"……知らせが行ったかもしれない。急ぐぞ。"},{w:null,t:"四人は、水路のさらに奥へ進んだ。"}];
EG_SC.e14_5=[{w:null,t:"水路の先は、大きな石の部屋になっていた。天井の上に、巨大な歯車がいくつも見える。"},{w:null,t:"歯車の横の石に、四角い穴が一つ、あいていた。"},{w:"alek",f:"normal",t:"……水門の下だ。"},{w:"nadia",f:"normal",t:"オベリオンの言ってた、四つ目の門の下……？"},{w:null,t:"その時、頭の上で、地面がふるえるような音がした。"},{w:null,t:"歯車の一つが、ゆっくり回りはじめた。水の音が、遠くで大きくなっていく。"},{w:"elly",f:"surprised",t:"……開いた？"},{w:null,t:"ナディアの端末の画面の文字が変わった。「水門　3/4」"},{w:"alek",f:"normal",t:"……三つ目のだ。こっちのは、まだ動いてない。"},{w:null,t:"第14話　おわり"}];
EG_SC.e15_1=[{w:null,t:"第15話　引き分け"},{w:null,t:"夜。四人は、歯車の部屋から、細い鉄のはしごを登った。"},{w:null,t:"上は、ダムの中の長い通路。白い明かりが、ずっと先まで並んでいる。"},{w:"alek",f:"normal",t:"制御室は、上の階だ。この通路の先に、階段がある。"},{w:"partner",t:"……前に、だれかいる。かいだことのある、においだ。"},{w:null,t:"通路のまん中に、レンが立っていた。肩に、カブトムシの子。"}];
EG_DIR.e15_2={"k": "勝負", "t": "レン・盤＝ダムの通路（細長い石の床）・覚えること＝ライバルと引き分け。決まった手数で、どちらのリーダーも倒れなければ引き分け。レンは強い。無理に攻めず、リーダーを守りきる。"};
EG_SC.e15_2=[{w:"hero",f:"surprised",t:"……レン。なんで、ここに。"},{w:"dimi",t:"別の道から入った。"},{w:"hero",f:"normal",t:"……アドリアンか。"},{w:null,t:"レンは、答えなかった。"},{w:"dimi",t:"制御室へ行くのは、おれだ。どけ。"},{w:"hero",f:"serious",t:"どかない。こっちは、水門を止めに来た。"},{w:"dimi",t:"なら、勝負で決める。"},{w:"elly",f:"sad",t:"今、そんなことしてる場合じゃ……。"},{w:"alek",f:"normal",t:"……言っても聞かない顔だ。"}];
EG_SC.e15_3w=[{w:null,t:"カブトムシの子が、床にひざをついた。でも、すぐに立ち上がった。"},{w:"hero",f:"serious",t:"……まだ立つのかよ。"},{w:null,t:"その時、通路の天井の明かりが、赤く点滅した。上の階で、警報が鳴っている。"},{w:"dimi",t:"……今日は、ここまでだ。"},{w:"hero",f:"normal",t:"……ここまで、って。"},{w:null,t:"レンは、通路のわきの、小さな扉を開けた。"},{w:"dimi",t:"おれは、こっちから行く。"},{w:null,t:"扉が閉まった。足音が、別の通路へ遠ざかっていった。"}];
EG_SC.e15_3l=[{w:null,t:"エンジュが、通路の床にひざをついた。でも、すぐに立ち上がった。"},{w:"dimi",t:"……まだ立つのか。"},{w:null,t:"その時、通路の天井の明かりが、赤く点滅した。上の階で、警報が鳴っている。"},{w:"dimi",t:"……今日は、ここまでだ。"},{w:"hero",f:"normal",t:"……ここまで、って。"},{w:null,t:"レンは、通路のわきの、小さな扉を開けた。"},{w:"dimi",t:"おれは、こっちから行く。"},{w:null,t:"扉が閉まった。足音が、別の通路へ遠ざかっていった。"}];
EG_SC.e15_3d=[{w:null,t:"どちらの子も、息を切らして、立っていた。"},{w:null,t:"その時、通路の天井の明かりが、赤く点滅した。上の階で、警報が鳴っている。"},{w:"dimi",t:"……今日は、ここまでだ。"},{w:"hero",f:"normal",t:"……ここまで、って。"},{w:null,t:"レンは、通路のわきの、小さな扉を開けた。"},{w:"dimi",t:"おれは、こっちから行く。"},{w:null,t:"扉が閉まった。足音が、別の通路へ遠ざかっていった。"}];
EG_SC.e15_4=[{w:"elly",f:"surprised",t:"……引き分け、だった？"},{w:"partner",t:"負けてない。"},{w:"hero",f:"normal",t:"勝ってもない。"},{w:null,t:"通路の先から、話し声が近づいてきた。聞きおぼえのある、二人の声。"},{w:"mira",t:"警報！　だれか入った！　わたしたちが先につかまえるの！"},{w:"joe",t:"……無理だ。"},{w:null,t:"第15話　おわり"}];
EG_SC.e16_1=[{w:null,t:"第16話　手伝って"},{w:null,t:"通路の角を曲がると、ミラとジョーが、腕を組んで立っていた。"},{w:"mira",t:"やっぱり、あんたたち。ここから先は、通さない。"},{w:"mira",t:"ボスは、わたしたちに見張りを任せたの。……たぶん。"},{w:"joe",t:"……無理だ。"},{w:"mira",t:"任されたことに、するの！"},{w:null,t:"通路のすみで、ログとパッチが、床にすわっていた。"},{w:"patch",t:"あ、わたしたちのことは気にしないで。今日は、見学。"},{w:"log",t:"ランサム様が、仕事くれないから。"},{w:"patch",t:"上が、何も言わないのが悪いの。"},{w:"hero",f:"normal",t:"……見学って。"},{w:"log",t:"見るのは、得意だ。"}];
EG_DIR.e16_2={"k": "勝負", "t": "ミラ＆ジョー（二人一組の敵）・盤＝ダムの通路と広間（石の床）・覚えること＝二人一組の敵。一人がばらばらに動く間は、すきができる。二人が組んで動き出したら、大きい子を後回しにして、速い子から止める。素早い子は、攻撃をよけやすい。"};
EG_SC.e16_2=[{w:"mira",t:"ジョー、見てて。わたし一人で、全部やるから。"},{w:"joe",t:"……無理だ。"},{w:"mira",t:"ボスは、いつも一人でやってる！"},{w:"alek",f:"normal",t:"二人一組だ。片方だけ見るな。"},{w:"elly",f:"normal",t:"ジョーの子、大きくて動かない。ミラの子は、速いよ。"}];
EG_SC.e16_3=[{w:null,t:"ミラの子たちが、次々にエンジュの火に押し返された。"},{w:"mira",t:"……くっ。"},{w:null,t:"ミラは、横に立っているジョーを見た。ジョーは、腕を組んだまま動かない。"},{w:null,t:"ミラは、少しだけ下を向いた。"},{w:"mira",t:"……手伝って。"},{w:null,t:"ジョーは、何も言わずに、ミラのとなりに一歩出た。大きな子が、前に出る。"},{w:null,t:"通路のすみで、ログとパッチが、ぱちぱちと手をたたいた。"},{w:"patch",t:"いいぞー！"},{w:"log",t:"どっちの味方だ、おまえ。"},{w:"patch",t:"……今日は、見学だから！"}];
EG_SC.e16_4w=[{w:"mira",t:"……負けた。二人でも。"},{w:"joe",t:"……無理だ。"},{w:"mira",t:"……それ、今言う？"},{w:null,t:"ログとパッチは、まだ拍手していた。ジョーが一回にらむと、止まった。"}];
EG_SC.e16_4l=[{w:"mira",t:"……勝った。二人で。"},{w:"joe",t:"…………。"},{w:"mira",t:"……通っていいわよ。勝ったから、気分がいいの。"},{w:null,t:"ミラは、通路のわきに、すっとよけた。"},{w:null,t:"ログとパッチは、まだ拍手していた。ジョーが一回にらむと、止まった。"}];
EG_SC.e16_5=[{w:null,t:"階段を上がると、重い扉の前の広い部屋に出た。"},{w:null,t:"扉の前に、男が一人、腕を組んで立っていた。ランサムだった。"},{w:"ransom",t:"……ミラは、何をしてた。"},{w:"hero",f:"serious",t:"水門、止めに来た。"},{w:"ransom",t:"止めさせない。……おまえらの相手も、おれ一人で十分だ。"},{w:null,t:"第16話　おわり"}];
EG_SC.e17_1=[{w:null,t:"第17話　一人で十分"},{w:null,t:"制御室の重い扉の前。ランサムが、腕を組んで立っていた。"},{w:"ransom",t:"おまえらの相手も、おれ一人で十分だ。"},{w:null,t:"階段の下から、ミラとジョーが上がってきた。うしろに、ログとパッチ。"},{w:"mira",t:"ボス！　わたしたちも——"},{w:"ransom",t:"いらん。下がってろ。"},{w:"mira",t:"……でも、四人もいます。"},{w:"ransom",t:"四人でも、五人でも、おれ一人で足りる。"},{w:"patch",t:"……ほら、またそれ。"},{w:"log",t:"上が、そう言うなら。"},{w:null,t:"ランサムは、何体もの子を、一度に盤の上へ出した。"}];
EG_DIR.e17_2={"k": "勝負", "t": "ランサム（何体も同時に出す）・盤＝制御室の前の広間（石の床）・覚えること＝ボス戦。相手は一人で何体も動かすので、一度に命令できる数に限りがある。こちらは、四人の子を同時に動かして、手が回らない所をつく。融合は、ヤマトのエンジュ（エンレオ）とアレクのユキマダラでヒョウエンコ（炎）。"};
EG_SC.e17_2=[{w:"alek",f:"normal",t:"数が多い。でも、動かしてるのは、一人だ。"},{w:"elly",f:"normal",t:"全部に命令してたら、間に合わないよ。"},{w:"hero",f:"serious",t:"……じゃあ、全部いっぺんに動かす。"},{w:"nadia",f:"normal",t:"ヒソリン、しっぽ。どの子が次に動くか、見て。"},{w:"hero",f:"serious",t:"エンジュ、アレクのユキマダラと。"},{w:null,t:"火と氷が重なった。白い炎をまとった、大きな狐。"},{w:"alek",f:"normal",t:"……燃えてるのに、冷たい。"}];
EG_SC.e17_3w=[{w:"ransom",t:"……右も、左も。……なんで全部、手が足りない。"},{w:"mira",t:"……ボス。"},{w:"joe",t:"……無理だ。"},{w:"ransom",t:"だまれ。"},{w:null,t:"階段の下から、足音がたくさん上がってきた。町の人と、警察だった。"},{w:"x",n:"ネフェル",t:"古い水路は、じいちゃんが、案内してくれたわ。"},{w:null,t:"警察が、ランサムの両わきに立った。ランサムは、しばらく動かなかった。"}];
EG_SC.e17_3l=[{w:"ransom",t:"ほらな。おれ一人で——"},{w:null,t:"ランサムの子たちが、ばらばらの方を向いて、ぶつかり合った。"},{w:"ransom",t:"右！　……左もだ！　……全部、待て！"},{w:"mira",t:"ボス、手伝い——"},{w:"ransom",t:"いらんと言っただろう！"},{w:null,t:"その間に、エンジュの火が、ランサムの足もとまで届いた。"},{w:null,t:"階段の下から、足音がたくさん上がってきた。町の人と、警察だった。"},{w:"x",n:"ネフェル",t:"古い水路は、じいちゃんが、案内してくれたわ。"},{w:null,t:"警察が、ランサムの両わきに立った。ランサムは、しばらく動かなかった。"}];
EG_SC.e17_4=[{w:null,t:"その時、制御室の扉の向こうから、静かな声がした。"},{w:"x",n:"アドリアンの声",t:"ランサム。"},{w:"ransom",t:"……ボス。"},{w:"x",n:"アドリアンの声",t:"ランサムに頼んだのは、わたしだ。"},{w:"x",n:"アドリアンの声",t:"残りは、わたしがやる。"},{w:null,t:"ランサムは、何か言いかけて、口を閉じた。それから、自分から手を出した。"},{w:null,t:"ミラとジョー、ログとパッチは、だまって、それを見ていた。"},{w:null,t:"制御室の扉が、内側から、ゆっくり開いた。"},{w:null,t:"中に、男が一人、機械の画面の前にすわっていた。"},{w:null,t:"第17話　おわり"}];
EG_SC.e18_1=[{w:null,t:"第18話　制御室"},{w:null,t:"明け方。制御室の中は、水門の画面が四つ、青く光っていた。三つは「開」。"},{w:null,t:"四つ目の画面の前に、アドリアンが一人、すわっていた。"},{w:"adrian",t:"……ヤマト、だったか。"},{w:"hero",f:"serious",t:"四つ目、止めて。"},{w:"adrian",t:"止めない。湖の底に、王が眠っている。水を抜けば、先に会える。"},{w:"elly",f:"surprised",t:"……下流の町が、また沈む。"},{w:"adrian",t:"一日だけだ。人は、高い所へ移した。きみたちが、手伝った。"},{w:null,t:"アドリアンの指は、画面の上。四つ目の画面が、ゆっくり赤くなっていく。"}];
EG_DIR.e18_2={"k": "謎", "t": "聞いた中身で解く・二つの手がかりを組み合わせて、止め方を選ぶ・覚えること＝聞いた中身で解く謎。手がかり①「古い図面のまま。だれも直さない」（第8話）。手がかり②歯車の部屋（第14話）。答え＝下の歯車に、手で止め棒を差しこむ。"};
EG_SC.e18_2a=[{w:null,t:"ヤマトは、エンジュの耳を見た。それから、床を見た。この下に、歯車の部屋がある。"}];
EG_SC.e18_2b=[{w:"hero",f:"normal",t:"……アレク。歯車の部屋に、穴、あったよな。棒が入りそうな。"},{w:"alek",f:"surprised",t:"……あった。歯車の横に、四角い穴。"},{w:"hero",f:"normal",t:"古い図面のままなら、昔の、手で止めるやつだ。"},{w:"alek",f:"serious",t:"ナディア、行くぞ。水路を戻る。"},{w:null,t:"アレクとナディアは、だまって制御室を出ていった。"},{w:"elly",f:"normal",t:"……ヤマトは？"},{w:"hero",f:"normal",t:"ここにいる。"}];
EG_SC.e18_3=[{w:null,t:"ヤマトは、制御室の床に、すわった。エンジュも、横にすわった。"},{w:"adrian",t:"……止めないのか、わたしを。"},{w:"hero",f:"normal",t:"話、聞く。"},{w:null,t:"アドリアンは、少しだけ、ヤマトの顔を見た。"},{w:"adrian",t:"ゲンイチは、元気か。"},{w:"hero",f:"normal",t:"……外の岸で、待ってる。"},{w:"adrian",t:"そうか。"},{w:null,t:"アドリアンは、画面に目をもどした。"},{w:"adrian",t:"昔、島があった。わたしは、そこで待っていた。"},{w:"adrian",t:"船は来なかった。AIが、決めた順番どおりにな。"},{w:"adrian",t:"だから、順番を決める側に回った。"},{w:null,t:"ヤマトは、何も言わなかった。エンジュも、動かなかった。"},{w:"adrian",t:"王が起きれば、子たちは王にしたがう。"},{w:"adrian",t:"……もう、だれも待たなくていい。"},{w:null,t:"アドリアンは、それで話を終えた。"},{w:"hero",f:"normal",t:"……うん。"},{w:null,t:"制御室が、しんとした。"}];
EG_SC.e18_4=[{w:null,t:"その時、床の下から、がちん、と大きな音がした。"},{w:null,t:"四つ目の画面の赤が、半分のところで止まった。そのまま、動かない。"},{w:"x",n:"アレクの声",t:"……入った。止め棒、入ったぞ。"},{w:"x",n:"ナディアの声",t:"歯車、止まってる！"},{w:"adrian",t:"…………。"},{w:null,t:"アドリアンは、画面を見て、それから、すわっているヤマトを見た。"},{w:"adrian",t:"……川の上の話を、覚えていたか。"},{w:"hero",f:"normal",t:"……島で、ずっと待ってたんだろ。"},{w:null,t:"アドリアンは、立ち上がった。窓の外では、湖の水が、半分まで下がっていた。"},{w:null,t:"湖の底に、沈んでいた村の屋根が、いくつも見えていた。"},{w:null,t:"アドリアンは、制御室の奥の扉から、湖の方へ下りていった。"},{w:"elly",f:"surprised",t:"……湖の底へ、行く気だ。"},{w:null,t:"第18話　おわり"}];
EG_SC.e19_1=[{w:null,t:"第19話　湖の底"},{w:null,t:"昼。半分まで水の引いた湖。岸から、ぬれた泥と石の道が、底の方へ続いていた。"},{w:"nadia",f:"serious",t:"……おばあちゃんの村、この下。"},{w:"alek",f:"normal",t:"アドリアンは、北の岸から下りた。こっちの方が、近い。"},{w:"hero",f:"serious",t:"先に着く。"},{w:null,t:"四人は、すべる泥の坂を下りはじめた。じいちゃんは、岸で見ていた。"}];
EG_SC.e19_2=[{w:null,t:"湖の底に、白い家の壁が、いくつも残っていた。屋根は、魚の巣になっている。"},{w:"nadia",f:"normal",t:"……ここ、市場だったんだって。おばあちゃんが、言ってた。"},{w:"elly",f:"normal",t:"ほんとに、村だったんだ。"},{w:null,t:"村のまん中の石だたみの上で、ヒソリンが、急に止まった。"},{w:null,t:"ヒソリンは、ハサミをたたんで、ぺたりと地面におなかをつけ、目を閉じた。"},{w:"nadia",f:"surprised",t:"……ヒソリン？　こんな所で寝ないで。"},{w:"partner",t:"……寝かせとけ。"},{w:null,t:"エンジュも、となりで、地面に耳をつけた。"}];
EG_DIR.e19_3={"k": "勝負", "t": "ログ＆パッチ・盤＝湖の底の沈んだ村（遺跡の石）・覚えること＝遺跡の地形。光の子は遺跡で回復が強く、地の子は硬く、闇の子はよけやすい。どの子が得をしている所かを見る。"};
EG_SC.e19_3=[{w:null,t:"村の石の塀のかげから、ログとパッチが出てきた。"},{w:"patch",t:"……あ。ゼロデイのエリート、パッチ。……一応、参上。"},{w:"hero",f:"normal",t:"一応って。"},{w:"patch",t:"ランサム様、つかまっちゃったし。次の上は、だれ？"},{w:"log",t:"……アドリアン様、かな。"},{w:"patch",t:"……こわい。"},{w:"log",t:"でも、命令が来ないと、何をしたらいいか分からない。"},{w:"patch",t:"だから、とりあえず勝負！　いつもの！"},{w:"alek",f:"normal",t:"石の村だ。遺跡と同じ。光の子は、ここで回復が強い。"}];
EG_SC.e19_4w=[{w:"patch",t:"負けた！　……で、次、何するの？"},{w:"log",t:"命令、待ってみるか。"},{w:null,t:"二人は、石の塀にもたれて、すわりこんだ。"}];
EG_SC.e19_4l=[{w:"patch",t:"勝った！　……で、次、何するの？"},{w:"log",t:"命令、待ってみるか。"},{w:null,t:"二人は、石の塀にもたれて、すわりこんだ。"}];
EG_SC.e19_5=[{w:null,t:"その時、足の下の、ずっと深い所で、地面が低く鳴った。"},{w:null,t:"石だたみの水たまりが、ふるえて、小さな輪を作った。"},{w:"partner",t:"……下の、でかいの。……近い。"},{w:null,t:"村の奥の、半分うまった神殿の入口が、泥の中から見えていた。"},{w:null,t:"第19話　おわり"}];
EG_SC.e20_1=[{w:null,t:"第20話　沈んだ神殿"},{w:null,t:"夕方。泥にうまった神殿の中は、ひんやりしていた。天井から、水がしたたる。"},{w:null,t:"いちばん奥の暗い部屋に、羊の角を持つ大きな竜が、船の形の石の上で眠っていた。"},{w:"nadia",f:"surprised",t:"……ラーガ。太陽の船の、王さま。"},{w:"partner",t:"……音のもとは、こいつだ。"},{w:"elly",f:"normal",t:"呼ぶね。……でも、ここの言葉の歌が、いる。"},{w:"nadia",f:"normal",t:"……おばあちゃんに、電話する。"}];
EG_SC.e20_2=[{w:null,t:"ナディアの端末の画面に、パン屋の祖母の顔が映った。後ろで、市場の人の声。"},{w:"nadia",f:"normal",t:"おばあちゃん。村の歌、歌って。……今、村にいるの。"},{w:null,t:"祖母は、少しだけナディアの顔を見てから、歌いはじめた。"},{w:null,t:"「ほー、ほー」と呼ぶ音。そのあとに、古い言葉の一行。"},{w:null,t:"ナディアが、画面に合わせて、同じ歌を歌った。"},{w:null,t:"エリーが、「ほー、ほー」の所に、自分の呼びかけを重ねた。"},{w:null,t:"竜の、閉じたまぶたが、ふるえた。"}];
EG_SC.e20_3=[{w:null,t:"竜が、ゆっくり目を開けた。金色の目が、部屋の中を見回す。"},{w:null,t:"竜は、四人を見た。最後に、画面の中の祖母を見た。"},{w:"nadia",f:"surprised",t:"……起きた。"},{w:"elly",f:"normal",t:"ナディア。歌の、うしろの一行。どういう意味？"},{w:"nadia",f:"normal",t:"……「おまえの音のある所で」。"},{w:"nadia",f:"normal",t:"続きは、おばあちゃんも知らないって。"},{w:null,t:"画面の中で、祖母が、小さくうなずいた。"},{w:null,t:"その時、神殿の入口の方から、足音が近づいてきた。"}];
EG_SC.e20_4=[{w:null,t:"アドリアンが、泥のついた靴で、部屋に入ってきた。"},{w:"adrian",t:"……起きたか。"},{w:null,t:"アドリアンは、竜の前に立った。"},{w:"adrian",t:"わたしと来い。おまえがいれば、子たちは迷わない。"},{w:null,t:"竜は、アドリアンの方を、一度も見なかった。子どもたちの方を向いたままだった。"},{w:"adrian",t:"…………。"},{w:null,t:"アドリアンは、しばらく竜を見上げていた。それから、何も言わずに背を向けた。"},{w:"hero",f:"normal",t:"……行くの？"},{w:"adrian",t:"ここには、もう用がない。"},{w:null,t:"足音が、神殿の外へ遠ざかっていった。"}];
EG_DIR.e20_5={"k": "勝負", "t": "湖の底の王ラーガ（古代テリオン・光と竜）・盤＝沈んだ神殿（遺跡の石と、ぬれた荒地）・覚えること＝王。光は遺跡で回復し、竜は荒地で攻撃が上がる。遺跡でも荒地でもない所（水たまり）へ出させてから、手持ち全部で。融合は、ヤマトのセイリュとエリーのアルマガネでサジンオロチ（竜）。中国26の古代サジンオロチと同じ種類の子（ゲーム側へのメモ：名前がぶつかるので、古代とは別の子として扱う）。"};
EG_SC.e20_5=[{w:null,t:"竜が、四人の前に、大きな首を下ろした。古い言葉で、一言。"},{w:"nadia",f:"normal",t:"……「やるか」、だって。"},{w:"partner",t:"やる。"},{w:"alek",f:"normal",t:"光と竜だ。石の上で回復する。竜は荒地で強い。"},{w:null,t:"セイリュとアルマガネが、ぬれた荒地で重なった。砂をまとった、首の多い竜。"},{w:"elly",f:"surprised",t:"……首、ふえた。"},{w:"hero",f:"normal",t:"中国で見たやつに、にてる。"}];
EG_SC.e20_6w=[{w:null,t:"竜は、首を低く下ろして、四人の前で目を細めた。"},{w:"nadia",f:"normal",t:"……「よし」。"},{w:null,t:"竜は、船の形の石から下りて、神殿の天井の穴を見上げた。夕方の光が差している。"},{w:null,t:"竜は、翼を広げて、天井の穴から、夕方の空へ飛び立った。"},{w:"elly",f:"surprised",t:"……どこ行くの？"},{w:"nadia",f:"normal",t:"北の方。……ピラミッドの方。"},{w:null,t:"神殿の外。湖の北の岸を、アドリアンの黒い車が、北へ走っていくのが見えた。"},{w:null,t:"第20話　おわり"}];
EG_SC.e20_6l=[{w:null,t:"竜の傷は、石の上で、すぐにふさがった。"},{w:"nadia",f:"normal",t:"……「まだ」。"},{w:null,t:"竜は、船の形の石から下りて、神殿の天井の穴を見上げた。夕方の光が差している。"},{w:null,t:"竜は、翼を広げて、天井の穴から、夕方の空へ飛び立った。"},{w:"elly",f:"surprised",t:"……どこ行くの？"},{w:"nadia",f:"normal",t:"北の方。……ピラミッドの方。"},{w:null,t:"神殿の外。湖の北の岸を、アドリアンの黒い車が、北へ走っていくのが見えた。"},{w:null,t:"第20話　おわり"}];
EG_SC.e21_1=[{w:null,t:"第21話　北の電話"},{w:null,t:"朝。夜の空の船で戻った、カイロの病院。"},{w:null,t:"ナディアの弟のベッドのそばで、機械の明かりが、ふつうに光っていた。"},{w:"x",n:"看護師",t:"電気、全部戻ったわ。発電機の油、最後まで足りたの。"},{w:null,t:"弟が、目をあけた。ナディアの顔を見て、小さくあくびをした。"},{w:"x",n:"ナディアの弟",t:"……ねえちゃん。のど、かわいた。"},{w:"nadia",f:"smile",t:"……水、出るよ。もう、水道から出る。"},{w:null,t:"ヒソリンが、ベッドに上って、弟の指を、ハサミでそっとつまんだ。"},{w:"hero",f:"smile",t:"……よかったな。"},{w:"nadia",f:"normal",t:"……うん。"}];
EG_SC.e21_2=[{w:null,t:"昼。空の港。じいちゃんは、日本へ帰る船の前に立っていた。"},{w:"genichi",t:"わしは、帰る。母さんに、怒られに行かんとな。"},{w:"hero",f:"normal",t:"……じいちゃん。エンジュ、日本に連れていけないんだよな。"},{w:"genichi",t:"日本は、そう簡単には変わらんぞ。"},{w:"hero",f:"normal",t:"……じゃあ、ハナがこっちに来ればいい。"},{w:null,t:"じいちゃんは、少し考えてから、鼻で笑った。"},{w:"genichi",t:"……母さんを説得する方が、大変だな。"},{w:"hero",f:"smile",t:"がんばって。"},{w:"genichi",t:"おまえがやれ。"},{w:null,t:"じいちゃんは、ナディアとエリーとアレクに、一人ずつ頭を下げてから、船に乗った。"}];
EG_SC.e21_3=[{w:null,t:"船を見送ったあと、ナディアが、港のはしで立ち止まった。"},{w:"nadia",f:"normal",t:"わたしは、ここにいる。弟と、おばあちゃんの店がある。"},{w:"elly",f:"normal",t:"……うん。"},{w:"nadia",f:"smile",t:"案内、またいる時は、言って。安くするから。"},{w:"alek",f:"normal",t:"……同じ値段でいい。"},{w:"nadia",f:"smile",t:"じゃあ、高くする。"},{w:null,t:"ヒソリンが、しっぽの先でエンジュの鼻を一回つついた。エンジュは、よけなかった。"}];
EG_SC.e21_4=[{w:null,t:"夜。空の港の宿で、ヤマトの端末が鳴った。父からだ。"},{w:"ryo",t:"ヤマト。……今、いいか。",ph:1},{w:null,t:"父の後ろに、暗い海が映っていた。高い風車が、何本も並んでいる。"},{w:null,t:"空には、緑色の光の帯が、ゆらゆらと流れていた。"},{w:"ryo",t:"こっちの風車の電気が、おかしい。止めても、勝手に回る。",ph:1},{w:"ryo",t:"だれかが、外から——",ph:1},{w:null,t:"画面が、ざっと乱れた。父の声が、そこで切れた。"},{w:"hero",f:"surprised",t:"……父さん？"},{w:null,t:"画面には、もう何も映らなかった。"},{w:null,t:"第21話　おわり　エジプト編　おわり"}];
