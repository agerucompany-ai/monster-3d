<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<link rel="icon" href="data:,">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>テリオンモンスター</title>
<style>
:root{--ink:#2c3e66;--cream:rgba(255,250,240,.86);--line:rgba(120,96,60,.18)}
html,body{margin:0;height:100%;overflow:hidden;background:#dbe8ee;touch-action:none;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none;
  font-family:"Hiragino Maru Gothic ProN","Hiragino Sans","BIZ UDPGothic","Yu Gothic UI","Meiryo",sans-serif}
#cv{position:fixed;inset:0;width:100%;height:100%;display:block}
#vig{position:fixed;inset:0;pointer-events:none;background:radial-gradient(ellipse 120% 95% at 50% 46%,rgba(0,0,0,0) 58%,rgba(70,48,24,.20) 100%)}
#area{position:fixed;top:calc(14px + env(safe-area-inset-top));left:50%;transform:translateX(-50%) translateY(-6px);padding:7px 20px;border-radius:999px;background:var(--cream);color:var(--ink);
  font-weight:800;font-size:15px;letter-spacing:.12em;box-shadow:0 3px 12px rgba(80,60,30,.16);border:1px solid var(--line);opacity:0;transition:opacity .7s,transform .7s;pointer-events:none;white-space:nowrap}
#area.on{opacity:1;transform:translateX(-50%) translateY(0)}
@media (max-width:520px){#area{top:calc(62px + env(safe-area-inset-top))}}
#tod{position:fixed;top:calc(12px + env(safe-area-inset-top));right:12px;display:flex;gap:4px;padding:4px;border-radius:999px;background:var(--cream);border:1px solid var(--line);box-shadow:0 2px 8px rgba(80,60,30,.12)}
#tod button{border:0;background:transparent;color:#6b5a44;font:inherit;font-weight:800;font-size:13px;width:34px;height:30px;border-radius:999px;cursor:pointer}
#tod button.sel{background:var(--ink);color:#fff}
#btSave{position:fixed;top:calc(52px + env(safe-area-inset-top));right:12px;padding:6px 14px;border-radius:999px;border:1px solid var(--line);background:var(--cream);color:var(--ink);font:inherit;font-weight:800;font-size:13px;box-shadow:0 2px 8px rgba(80,60,30,.12);cursor:pointer;display:none;z-index:4}
#pgHud{position:fixed;top:calc(92px + env(safe-area-inset-top));right:12px;display:none;flex-direction:column;gap:6px;z-index:4}
#pgHud button{padding:6px 14px;border-radius:999px;border:1px solid var(--line);background:var(--cream);color:var(--ink);font:inherit;font-weight:800;font-size:13px;box-shadow:0 2px 8px rgba(80,60,30,.12);cursor:pointer}
#pgHud button img.ui-ic{width:1.5em;height:1.5em;vertical-align:-.42em;margin-right:.2em}
#btMap{position:fixed;top:calc(136px + env(safe-area-inset-top));right:12px;padding:5px 12px 5px 8px;border-radius:999px;border:1px solid var(--line);background:var(--cream);color:var(--ink);font:inherit;font-weight:800;font-size:13px;box-shadow:0 2px 8px rgba(80,60,30,.12);cursor:pointer;display:none;z-index:4}
#btMap img.ui-ic{width:1.5em;height:1.5em;vertical-align:-.42em;margin-right:.2em}
/* 地図の案内(2026-10-27) */
#brief{position:fixed;inset:0;z-index:40;display:none;align-items:center;justify-content:center;background:rgba(30,36,52,.38);padding:calc(10px + env(safe-area-inset-top)) 10px calc(10px + env(safe-area-inset-bottom));box-sizing:border-box}
#brief.on{display:flex}
#brief .bc{width:min(100%,440px);max-height:100%;overflow:auto;-webkit-overflow-scrolling:touch;touch-action:pan-y;background:rgba(255,250,240,.98);border:2px solid #fff;border-radius:18px;box-shadow:0 8px 26px rgba(30,30,50,.3);padding:12px 14px 14px;box-sizing:border-box;color:#3e3428;font-weight:800}
#brief .bh{display:flex;align-items:center;gap:8px;font-size:19px;color:var(--ink)}
#brief .bh img.ui-ic{width:34px;height:34px}
#brief .chips{display:flex;gap:6px;margin:6px 0 2px}
#brief .chip{padding:2px 11px;border-radius:999px;background:var(--ink);color:#fff;font-size:13px}
#brief .sec{margin:10px 0 4px;font-size:13px;color:var(--ink);display:flex;align-items:center;gap:4px;border-bottom:1px solid var(--line);padding-bottom:3px}
#brief .sec img.ui-ic{width:20px;height:20px}
#brief .bd{display:grid;grid-template-columns:6.2em 1fr;gap:1px 8px;align-items:center;margin:4px 0;font-size:14px}
#brief .bd small{grid-column:2/3;color:#8a7a62;font-size:11px;line-height:1.3}
#brief .bar{display:flex;height:12px;border-radius:6px;overflow:hidden;background:#cfc6b4}
#brief .bar i{display:block;height:100%}
#brief .trw{display:grid;grid-template-columns:3.6em 1fr;align-items:center;gap:3px 8px;margin:5px 0;font-size:13px}
#brief .trw>.tn{grid-row:span 2;align-self:start}
#brief .trw>.dn{grid-column:2}
#brief .tn{display:inline-block;min-width:3.4em;text-align:center;padding:2px 6px;border-radius:7px;color:#fff;text-shadow:0 1px 1px rgba(0,0,0,.5);font-size:13px;box-sizing:border-box}
#brief .tn.lt{color:#3e3428;text-shadow:none;border:1px solid rgba(0,0,0,.18)}
#brief .up,#brief .dn{display:inline-flex;flex-wrap:wrap;align-items:center;gap:3px 5px}
#brief .up>b{color:#1f7a3a}#brief .dn>b{color:#c0392b}
#brief .ty{display:inline-flex;align-items:center;gap:2px}
#brief .ty small{font-size:11px;color:#1f7a3a}
#brief .tyb{display:inline-block;min-width:1.55em;padding:0 .2em;border-radius:6px;font-size:13px;font-weight:900;line-height:1.55em;text-align:center;color:#fff;text-shadow:0 1px 1px rgba(0,0,0,.6)}
#brief img.ui-ic{width:1.35em;height:1.35em;vertical-align:-.32em;object-fit:contain}
#brief .row{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
#brief .rec{display:inline-flex;align-items:center;gap:2px;padding:2px 7px 2px 3px;border-radius:999px;background:#fff;border:1px solid var(--line)}
#brief .btns{display:flex;gap:10px;margin-top:14px}
#brief .btns button{flex:1;padding:11px 0;border-radius:999px;border:2px solid var(--ink);background:#fff;color:var(--ink);font:inherit;font-weight:800;font-size:16px;cursor:pointer}
#brief .btns button.pri{background:var(--ink);color:#fff}
#enter{position:fixed;left:50%;bottom:calc(34px + env(safe-area-inset-bottom));transform:translateX(-50%) scale(.92);padding:11px 26px;border-radius:999px;border:2px solid #fff;
  background:var(--ink);color:#fff;font:inherit;font-weight:800;font-size:16px;letter-spacing:.1em;box-shadow:0 4px 14px rgba(30,40,80,.28);opacity:0;pointer-events:none;transition:opacity .25s,transform .25s}
#enter.on{opacity:1;pointer-events:auto;transform:translateX(-50%) scale(1)}
#stick{position:fixed;width:116px;height:116px;margin:-58px 0 0 -58px;border-radius:50%;background:rgba(255,250,240,.22);border:2px solid rgba(255,255,255,.55);pointer-events:none;display:none}
#knob{position:absolute;left:50%;top:50%;width:46px;height:46px;margin:-23px 0 0 -23px;border-radius:50%;background:rgba(255,252,246,.85);box-shadow:0 2px 6px rgba(60,40,20,.25)}
.lbl{position:fixed;left:0;top:0;transform:translate(-50%,-100%);padding:3px 10px;border-radius:999px;background:rgba(255,250,240,.88);color:#4a3d2c;font-weight:800;font-size:12px;white-space:nowrap;pointer-events:none;
  border:1px solid var(--line);opacity:0;transition:opacity .3s}
.lbl.on{opacity:1}
#load{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;background:linear-gradient(#cfe2ee,#f3e6d2);transition:opacity .6s;z-index:9}
#load b{color:var(--ink);font-size:20px;letter-spacing:.2em}
#bar{width:180px;height:8px;border-radius:9px;background:rgba(44,62,102,.15);overflow:hidden}#bar i{display:block;height:100%;width:0;background:var(--ink);transition:width .2s}
#toast{position:fixed;left:50%;bottom:calc(96px + env(safe-area-inset-bottom));transform:translateX(-50%);padding:6px 16px;border-radius:999px;background:rgba(40,40,50,.72);color:#fff;font-weight:700;font-size:13px;opacity:0;transition:opacity .3s;pointer-events:none}
#talk{position:fixed;left:50%;bottom:calc(96px + env(safe-area-inset-bottom));transform:translateX(-50%);width:min(92vw,520px);padding:14px 18px 16px;border-radius:18px;background:rgba(255,250,240,.95);border:2px solid #fff;box-shadow:0 6px 18px rgba(60,50,30,.2);display:none;z-index:6}
#talk b{display:inline-block;margin-bottom:6px;padding:2px 12px;border-radius:999px;background:#2c3e66;color:#fff;font-size:13px}
#talk p{margin:0;color:#3e3428;font-size:15px;line-height:1.6;font-weight:700}
#bang{position:fixed;left:0;top:0;transform:translate(-50%,-100%);font:900 34px/1 sans-serif;color:#e2574c;text-shadow:0 2px 0 #fff,0 0 6px #fff;display:none;pointer-events:none;z-index:5}
#flash{position:fixed;inset:0;background:#fff;opacity:0;pointer-events:none;transition:opacity .35s;z-index:8}
#fps{position:fixed;left:8px;bottom:8px;color:#fff;font:12px monospace;text-shadow:0 1px 2px #000;display:none}
#fade{position:fixed;inset:0;background:#0b0d14;opacity:0;pointer-events:none;transition:opacity .25s;z-index:25}
#fade.on{opacity:1;pointer-events:auto}
#obj{position:fixed;top:calc(12px + env(safe-area-inset-top));left:12px;max-width:min(54vw,300px);padding:6px 12px 6px 10px;border-radius:12px;background:var(--cream);color:var(--ink);border:1px solid var(--line);
  box-shadow:0 2px 8px rgba(80,60,30,.12);font-weight:800;font-size:12.5px;line-height:1.35;display:none;z-index:4}
#obj::before{content:"";display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--ink);margin-right:7px;vertical-align:1px}
/* 物語の画面(タイトル・イントロ・設定・会話) */
#st{position:fixed;inset:0;z-index:30;display:none;overflow:hidden;background:#0b0d14;color:#3e3428}
#st.field{background:transparent;pointer-events:none}
#st.field #stBox{pointer-events:auto}
#st.field #stPick{pointer-events:auto}
#stBg{position:absolute;inset:0;background:center/cover no-repeat;transition:opacity .5s}
#st.field #stBg{display:none}
.stP{position:absolute;bottom:calc(112px + env(safe-area-inset-bottom));width:min(64vw,440px);height:min(64vw,440px);object-fit:contain;transition:opacity .2s,transform .25s,filter .2s;pointer-events:none;filter:drop-shadow(0 6px 14px rgba(0,0,0,.25))}
#stL{left:max(-6vw,calc(50% - 480px))}#stR{right:max(-6vw,calc(50% - 480px))}
.stP.dim{filter:brightness(.6) drop-shadow(0 6px 14px rgba(0,0,0,.25));transform:scale(.95)}
.stP.off{opacity:0}
/* 右の枠は左右反転(全員右向きで描いてある)・右のうしろの枠は少し小さく奥に */
/* 向き: 絵ごとの向き(v3/portraits/index.json の facing)と置く側から --fx(1/-1)を決める。左の枠=右向き、右の枠=左向き */
.stP{transform:scaleX(var(--fx,1))}.stP.dim{transform:scaleX(calc(var(--fx,1)*.95)) scaleY(.95)}
#stR2{right:max(-16vw,calc(50% - 560px));bottom:calc(132px + env(safe-area-inset-bottom));width:min(58vw,396px);height:min(58vw,396px);filter:brightness(.72) drop-shadow(0 6px 14px rgba(0,0,0,.25))}
/* 3人の場面: 3人を横に並べ直す(顔は重ねない。重なるのは体の端だけ)。話している人を前に出して明るく、ほかは少し下げて暗く */
#st.trio .stP{--wc:min(100vw,760px);width:calc(var(--wc)*.46);height:calc(var(--wc)*.46);right:auto;bottom:calc(112px + env(safe-area-inset-bottom));transition:opacity .2s,transform .25s,filter .2s,left .25s}
#st.trio #stL{left:calc((100vw - var(--wc))/2 + var(--wc)*.18 - var(--wc)*.23)}
#st.trio #stR{left:calc((100vw - var(--wc))/2 + var(--wc)*.51 - var(--wc)*.23)}
#st.trio #stR2{left:calc((100vw - var(--wc))/2 + var(--wc)*.83 - var(--wc)*.23)}
#st.trio .stP:not(.dim){z-index:1}
#st.trio .stP.dim{transform:translateY(10px) scaleX(calc(var(--fx,1)*.92)) scaleY(.92);filter:brightness(.62) drop-shadow(0 6px 14px rgba(0,0,0,.25))}
/* 手帳の電話の画面(右上) */
#stPh{position:absolute;right:14px;top:calc(56px + env(safe-area-inset-top));width:min(36vw,210px);aspect-ratio:1;border-radius:20px;overflow:hidden;display:none;z-index:2;
  border:3px solid rgba(170,236,255,.95);box-shadow:0 0 22px rgba(120,210,255,.65);background:linear-gradient(#bfe6ff,#e8f6ff)}
#stPh img{width:100%;height:100%;object-fit:cover;object-position:50% 12%}
#stBox{position:absolute;left:50%;bottom:calc(16px + env(safe-area-inset-bottom));transform:translateX(-50%);width:min(94vw,640px);min-height:92px;box-sizing:border-box;padding:16px 20px 18px;border-radius:18px;
  background:rgba(255,250,240,.97);border:2px solid #fff;box-shadow:0 6px 18px rgba(20,20,30,.28);cursor:pointer;display:none;z-index:2}
#stBox b{position:absolute;top:-14px;left:18px;padding:3px 14px;border-radius:999px;background:var(--ink);color:#fff;font-size:14px}
#stBox p{margin:4px 0 0;font-size:16px;line-height:1.65;font-weight:700;min-height:2.6em;white-space:pre-wrap;color:#3e3428}
#stBox.nar{background:rgba(20,24,40,.84);border-color:rgba(255,255,255,.4)}#stBox.nar p{color:#fff}#stBox.nar b{display:none}
#stBox i{position:absolute;right:16px;bottom:8px;width:0;height:0;border:7px solid transparent;border-top-color:var(--ink);animation:bob 1s infinite}
#stBox.nar i{border-top-color:#fff}
@keyframes bob{50%{transform:translateY(3px)}}
#stCard{position:absolute;inset:0;display:none;cursor:pointer}
#stCard::after{content:"";position:absolute;left:0;right:0;bottom:0;height:46%;background:linear-gradient(rgba(0,0,0,0),rgba(0,0,0,.55));pointer-events:none}
#stCard .cap{position:absolute;left:0;right:0;bottom:calc(52px + env(safe-area-inset-bottom));text-align:center;color:#fff;font-weight:800;font-size:clamp(17px,4.6vw,24px);line-height:1.7;letter-spacing:.06em;
  text-shadow:0 2px 10px rgba(0,0,0,.6),0 0 2px rgba(0,0,0,.6);padding:0 16px;white-space:pre-line;opacity:0;transition:opacity .6s;z-index:2}
#stCard .cap.on{opacity:1}
#stSkip{position:absolute;top:calc(14px + env(safe-area-inset-top));right:14px;padding:6px 14px;border-radius:999px;border:1px solid rgba(255,255,255,.6);background:rgba(0,0,0,.3);color:#fff;font:inherit;font-weight:800;font-size:13px;display:none;z-index:3;cursor:pointer}
.stBtn{border:2px solid #fff;border-radius:999px;background:var(--ink);color:#fff;font:inherit;font-weight:800;font-size:17px;letter-spacing:.12em;padding:12px 34px;box-shadow:0 4px 14px rgba(20,30,60,.3);cursor:pointer;min-width:220px}
.stBtn.sub{background:rgba(255,250,240,.95);color:var(--ink);border-color:rgba(44,62,102,.25)}
.stBtn:disabled{opacity:.45;cursor:default}
/* 2026-10-27 確認用: タイトルの小さいボタン(全部ためす・CPU対戦)・テストの印・ワープ */
.stMini{display:grid;grid-template-columns:1fr 1fr;gap:6px;justify-content:center;width:min(280px,76vw)}   /* 2026-10-27: 2×2(全部ためす・CPU対戦・テリオン表・融合表) */
.stMini button,.stMini a{border:1px solid rgba(255,255,255,.7);border-radius:999px;background:rgba(20,30,60,.55);color:#fff;font:inherit;font-weight:800;font-size:13px;padding:9px 16px;min-height:40px;text-decoration:none;display:inline-flex;align-items:center;cursor:pointer}
.stMini button,.stMini a{justify-content:center;padding:0 10px;white-space:nowrap;height:38px;min-height:0;font-size:12.5px;box-sizing:border-box}
#testBadge{position:fixed;top:calc(12px + env(safe-area-inset-top));left:12px;padding:4px 12px;border-radius:999px;background:#c0392b;color:#fff;font-weight:900;font-size:13px;letter-spacing:.1em;z-index:5;display:none;pointer-events:none}
#btWarp{position:fixed;top:calc(52px + env(safe-area-inset-top));left:12px;padding:6px 14px 6px 10px;border-radius:999px;border:1px solid var(--line);background:var(--cream);color:var(--ink);font:inherit;font-weight:800;font-size:13px;box-shadow:0 2px 8px rgba(80,60,30,.12);cursor:pointer;display:none;z-index:4}
#btWarp img.ui-ic{width:1.5em;height:1.5em;vertical-align:-.42em;margin-right:.2em}
#warp{position:fixed;inset:0;z-index:60;background:rgba(20,28,50,.94);display:none;flex-direction:column;color:#fff}
#warp.on{display:flex}
#warp .wt{display:flex;gap:8px;align-items:center;padding:calc(10px + env(safe-area-inset-top)) 12px 8px;border-bottom:1px solid rgba(255,255,255,.18)}
#warp .wt b{flex:1;font-size:17px}
#warp .wt button{min-height:40px;border-radius:999px;border:1px solid rgba(255,255,255,.4);background:rgba(255,255,255,.12);color:#fff;font:inherit;font-weight:800;padding:0 14px}
#warp .wl{flex:1;overflow-y:auto;padding:8px 12px calc(20px + env(safe-area-inset-bottom));-webkit-overflow-scrolling:touch}
#warp h3{margin:12px 0 6px;font-size:14px;color:#ffd977}
#warp .wg{display:grid;grid-template-columns:1fr 1fr;gap:6px}
#warp .wg button{min-height:48px;border-radius:10px;border:1px solid rgba(255,255,255,.25);background:rgba(255,255,255,.08);color:#fff;font:inherit;font-weight:800;font-size:13px;text-align:left;padding:4px 10px}
#warp .wg button small{display:block;font-size:10.5px;opacity:.7;font-weight:700}
#warp .wg button.cur{background:#2f5fb0;border-color:#8fb4ff}
#stTitle{position:absolute;inset:0;display:none;flex-direction:column;align-items:center;justify-content:flex-end;gap:14px;padding-bottom:calc(70px + env(safe-area-inset-bottom))}
#stTitle h1{position:absolute;top:17%;left:0;right:0;margin:0;text-align:center;color:#fff;font-size:clamp(32px,9.5vw,58px);letter-spacing:.14em;text-shadow:0 3px 16px rgba(20,30,60,.6),0 0 3px rgba(20,30,60,.7)}
#st.ttl #stBg{animation:ttlZoom 26s ease-in-out infinite alternate;transform-origin:50% 70%}   /* タイトル(2026-10-27): ゆっくり寄る */
@keyframes ttlZoom{from{transform:scale(1)}to{transform:scale(1.04)}}
#st.ttl #stTitle{background:linear-gradient(to bottom,rgba(20,40,80,.22),rgba(20,40,80,0) 30%,rgba(20,40,80,0) 74%,rgba(20,40,80,.28))}
#stTitle h1 small{display:block;font-size:.34em;letter-spacing:.3em;margin-top:8px;opacity:.9}
#stTitle h1 img{display:block;width:88vw;max-width:560px;height:auto;margin:0 auto;filter:drop-shadow(0 4px 10px rgba(20,30,60,.55)) drop-shadow(0 0 2px rgba(20,30,60,.6))}   /* オーナーのロゴ(ui/logo.webp 1400×296・2026-10-26) */
#stPick{position:absolute;left:50%;top:calc(12px + env(safe-area-inset-top));transform:translateX(-50%);width:min(96vw,640px);display:none;flex-direction:column;align-items:center;gap:8px;z-index:2}
#stPickCv{width:100%;aspect-ratio:3/1.3;display:block;border-radius:20px;background:radial-gradient(ellipse at 50% 72%,rgba(255,250,235,.96),rgba(236,224,200,.88));box-shadow:0 6px 18px rgba(20,20,30,.25)}
#stPick .row{display:flex;width:100%;justify-content:space-around;gap:6px}
#stPick .row button{flex:1;border:2px solid #fff;border-radius:14px;background:rgba(255,250,240,.95);color:var(--ink);font:inherit;font-weight:800;font-size:15px;padding:9px 0;cursor:pointer}
#stPick .row button.sel{background:var(--ink);color:#fff}
#stPick .go{display:none}
</style>
</head>
<body>
<canvas id="cv"></canvas>
<div id="vig"></div>
<div id="area"></div>
<div id="tod"><button data-t="morning">朝</button><button data-t="noon" class="sel">昼</button><button data-t="evening">夕</button></div><button id="btSave">セーブ</button><div id="pgHud"><button id="btMenu"><img class="ui-ic" src="../battle/img/ui/ally.webp" alt="">メニュー</button></div><div id="testBadge">テスト</div><button id="btWarp"><img class="ui-ic" src="../battle/img/ui/map.webp" alt="">ワープ</button><div id="warp"><div class="wt"><b>ワープ</b><button id="wpReset">リセット</button><button id="wpX">とじる</button></div><div class="wl" id="wpList"></div></div>
<button id="btMap"><img class="ui-ic" src="../battle/img/ui/map.webp" alt="">地図</button><div id="brief"></div>
<button id="enter"></button>
<div id="stick"><div id="knob"></div></div>
<div id="toast"></div>
<div id="fps"></div>
<div id="talk"><b></b><p></p></div><div id="bang">!</div><div id="flash"></div>
<div id="obj"></div><div id="fade"></div>
<div id="load" style="display:none"><b>オリーヴァ村</b><div id="bar"><i></i></div></div>
<div id="st">

  const pick=[1001,178,1022,1003,180,1024].map(id=>mine.find(m=>m.id===id)?id:null).filter(Boolean); for(const m of mine){ if(pick.length>=6) break; if((m.level||1)===3&&!pick.includes(m.id)) pick.push(m.id); }
  const party=pick.slice(0,6).map(id=>roster.find(c=>c.mid===id).uid);
  const lines={}; for(const m of mine) if(m.evolves_from==null) lines[m.id]=1;

window.WORLD={ prof:{n:0,chunk:0,npc:0,mon:0,render:0,all:0,cam:0,ui:0}, READY, CFG, HERO, CAM, STATS, CHUNKS, MONS, NPCS, DOORS,

  npcReady(){ return NPCS.filter(n=>n.want).every(n=>n.rig); },
  setTime, cam(){}, fixCam(a){ CAM.fixed=a; }, POST, FP, MIDX:()=>MIDX, modelsPending(){ return Object.values(PROPM).filter(p=>!p._done).length; },
  overlaps(){ const o=[]; for(let i=0;i<FP.length;i++) for(let j=i+1;j<FP.length;j++){ const a=FP[i], b=FP[j]; const d=Math.hypot(a.x-b.x,a.z-b.z); if(d<Math.min(Math.max(a.hw,a.hd),Math.max(b.hw,b.hd))*0.9) o.push([a.k0,a.x.toFixed(1),a.z.toFixed(1),b.k0,b.x.toFixed(1),b.z.toFixed(1)]); } return o; },

  pending(){ let n=0; for(const c of CHUNKS.values()){ if(!c.far&&c.state!==2&&chunkDist(c,HERO.x,HERO.z)<CFG.loadR) n++; } return n+cellsWaiting(HERO.x,HERO.z); },
  monReady(){ return MONS.filter(m=>m.inst).length; },

  triReport(){ const fr=new THREE.Frustum(); fr.setFromProjectionMatrix(new THREE.Matrix4().multiplyMatrices(camera.projectionMatrix,camera.matrixWorldInverse)); const o={};
    scene.traverse(m=>{ if(!m.isMesh||!m.visible) return; let vis=m.frustumCulled===false||fr.intersectsObject(m); if(!vis) return; const g=m.geometry; const t=(g.index?g.index.count:g.attributes.position.count)/3*(m.isInstancedMesh?m.count:1);
      let k=m.isInstancedMesh?'inst_'+(m.userData.k||m.parent&&m.parent.type)+'_'+(m.parent&&m.parent.parent===chunkRoot?'c':'x'):(m.isSkinnedMesh?'skin':'mesh'); if(m.isInstancedMesh&&m.userData.k==='flowers'){ (o._fl=o._fl||[]).push([m.count,m.geometry.boundingSphere.center.toArray().map(v=>v.toFixed(0)).join(','),m.geometry.boundingSphere.radius.toFixed(1),m.geometry.index.count]); } o[k]=(o[k]||0)+t; });
    const per={}; for(const c of CHUNKS.values()){ if(!c.group) continue; c.group.traverse(m=>{ if(m.isInstancedMesh&&fr.intersectsObject(m)){ const t=m.geometry.index.count/3*m.count; const k=[...PROPMAT.entries()].find(e=>e[1]===m.material); per[m.material.uuid.slice(0,4)+'_'+m.count]=(per[m.material.uuid.slice(0,4)+'_'+m.count]||0)+t; } }); }
    const byk={}; for(const c of CHUNKS.values()){ if(!c.group) continue; c.group.traverse(m=>{ if(m.isInstancedMesh&&fr.intersectsObject(m)){ const k=m.userData.k; byk[k]=(byk[k]||0)+m.geometry.index.count/3*m.count; } }); }
    let a1=0,a2=0,g1=0,g2=0; chunkRoot.traverse(m=>{ if(m.isInstancedMesh) a1++; }); g1=chunkRoot.children.length; for(const c of CHUNKS.values()){ if(c.group){ g2++; c.group.traverse(m=>{ if(m.isInstancedMesh) a2++; }); } }
    const fl=[]; chunkRoot.traverse(m=>{ if(m.isInstancedMesh&&m.userData.k==='flowers'&&fr.intersectsObject(m)) fl.push([m.count,m.geometry.boundingSphere.center.toArray().map(v=>v.toFixed(0)).join(','),m.geometry.boundingSphere.radius.toFixed(1)]); });
    return {o,byk,a1,a2,g1,g2,fl:fl.slice(0,20),nfl:fl.length}; },
