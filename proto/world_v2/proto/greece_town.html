<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<link rel="icon" href="data:,">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>テリオンモンスター</title>
<style>
:root{--ink:#2c3e66;--cream:rgba(255,250,240,.86);--line:rgba(120,96,60,.18)}
html,body{margin:0;height:100%;overflow:hidden;background:#dbe8ee;touch-action:none;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none;
  font-family:"Hiragino Maru Gothic ProN","Hiragino Sans","BIZ UDPGothic","Yu Gothic UI","Meiryo",sans-serif}
#cv{position:fixed;inset:0;width:100%;height:100%;display:block}
#vig{position:fixed;inset:0;pointer-events:none;background:radial-gradient(ellipse 120% 95% at 50% 46%,rgba(0,0,0,0) 58%,rgba(70,48,24,.20) 100%)}
#area{position:fixed;top:calc(14px + env(safe-area-inset-top));left:50%;transform:translateX(-50%) translateY(-6px);padding:7px 20px;border-radius:999px;background:var(--cream);color:var(--ink);
  font-weight:800;font-size:15px;letter-spacing:.12em;box-shadow:0 3px 12px rgba(80,60,30,.16);border:1px solid var(--line);opacity:0;transition:opacity .7s,transform .7s;pointer-events:none;white-space:nowrap}
#area.on{opacity:1;transform:translateX(-50%) translateY(0)}
@media (max-width:520px){#area{top:calc(62px + env(safe-area-inset-top))}}
#tod{position:fixed;top:calc(12px + env(safe-area-inset-top));right:12px;display:flex;gap:4px;padding:4px;border-radius:999px;background:var(--cream);border:1px solid var(--line);box-shadow:0 2px 8px rgba(80,60,30,.12)}
#tod button{border:0;background:transparent;color:#6b5a44;font:inherit;font-weight:800;font-size:13px;width:34px;height:30px;border-radius:999px;cursor:pointer}
#tod button.sel{background:var(--ink);color:#fff}
#btSave{position:fixed;top:calc(52px + env(safe-area-inset-top));right:12px;padding:6px 14px;border-radius:999px;border:1px solid var(--line);background:var(--cream);color:var(--ink);font:inherit;font-weight:800;font-size:13px;box-shadow:0 2px 8px rgba(80,60,30,.12);cursor:pointer;display:none;z-index:4}
#pgHud{position:fixed;top:calc(92px + env(safe-area-inset-top));right:12px;display:none;flex-direction:column;gap:6px;z-index:4}
#pgHud button{padding:6px 14px;border-radius:999px;border:1px solid var(--line);background:var(--cream);color:var(--ink);font:inherit;font-weight:800;font-size:13px;box-shadow:0 2px 8px rgba(80,60,30,.12);cursor:pointer}
#pgHud button img.ui-ic{width:1.5em;height:1.5em;vertical-align:-.42em;margin-right:.2em}
#btMap{position:fixed;top:calc(136px + env(safe-area-inset-top));right:12px;padding:5px 12px 5px 8px;border-radius:999px;border:1px solid var(--line);background:var(--cream);color:var(--ink);font:inherit;font-weight:800;font-size:13px;box-shadow:0 2px 8px rgba(80,60,30,.12);cursor:pointer;display:none;z-index:4}
#btMap img.ui-ic{width:1.5em;height:1.5em;vertical-align:-.42em;margin-right:.2em}
/* 地図の案内(2026-10-27) */
#brief{position:fixed;inset:0;z-index:40;display:none;align-items:center;justify-content:center;background:rgba(30,36,52,.38);padding:calc(10px + env(safe-area-inset-top)) 10px calc(10px + env(safe-area-inset-bottom));box-sizing:border-box}
#brief.on{display:flex}
#brief .bc{width:min(100%,440px);max-height:100%;overflow:auto;-webkit-overflow-scrolling:touch;touch-action:pan-y;background:rgba(255,250,240,.98);border:2px solid #fff;border-radius:18px;box-shadow:0 8px 26px rgba(30,30,50,.3);padding:12px 14px 14px;box-sizing:border-box;color:#3e3428;font-weight:800}
#brief .bh{display:flex;align-items:center;gap:8px;font-size:19px;color:var(--ink)}
#brief .bh img.ui-ic{width:34px;height:34px}
#brief .chips{display:flex;gap:6px;margin:6px 0 2px}
#brief .chip{padding:2px 11px;border-radius:999px;background:var(--ink);color:#fff;font-size:13px}
#brief .sec{margin:10px 0 4px;font-size:13px;color:var(--ink);display:flex;align-items:center;gap:4px;border-bottom:1px solid var(--line);padding-bottom:3px}
#brief .sec img.ui-ic{width:20px;height:20px}
#brief .bd{display:grid;grid-template-columns:6.2em 1fr;gap:1px 8px;align-items:center;margin:4px 0;font-size:14px}
#brief .bd small{grid-column:2/3;color:#8a7a62;font-size:11px;line-height:1.3}
#brief .bar{display:flex;height:12px;border-radius:6px;overflow:hidden;background:#cfc6b4}
#brief .bar i{display:block;height:100%}
#brief .trw{display:grid;grid-template-columns:3.6em 1fr;align-items:center;gap:3px 8px;margin:5px 0;font-size:13px}
#brief .trw>.tn{grid-row:span 2;align-self:start}
#brief .trw>.dn{grid-column:2}
#brief .tn{display:inline-block;min-width:3.4em;text-align:center;padding:2px 6px;border-radius:7px;color:#fff;text-shadow:0 1px 1px rgba(0,0,0,.5);font-size:13px;box-sizing:border-box}
#brief .tn.lt{color:#3e3428;text-shadow:none;border:1px solid rgba(0,0,0,.18)}
#brief .up,#brief .dn{display:inline-flex;flex-wrap:wrap;align-items:center;gap:3px 5px}
#brief .up>b{color:#1f7a3a}#brief .dn>b{color:#c0392b}
#brief .ty{display:inline-flex;align-items:center;gap:2px}
#brief .ty small{font-size:11px;color:#1f7a3a}
#brief .tyb{display:inline-block;min-width:1.55em;padding:0 .2em;border-radius:6px;font-size:13px;font-weight:900;line-height:1.55em;text-align:center;color:#fff;text-shadow:0 1px 1px rgba(0,0,0,.6)}
#brief img.ui-ic{width:1.35em;height:1.35em;vertical-align:-.32em;object-fit:contain}
#brief .row{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
#brief .rec{display:inline-flex;align-items:center;gap:2px;padding:2px 7px 2px 3px;border-radius:999px;background:#fff;border:1px solid var(--line)}
#brief .btns{display:flex;gap:10px;margin-top:14px}
#brief .btns button{flex:1;padding:11px 0;border-radius:999px;border:2px solid var(--ink);background:#fff;color:var(--ink);font:inherit;font-weight:800;font-size:16px;cursor:pointer}
#brief .btns button.pri{background:var(--ink);color:#fff}
#brief .mapc{width:min(100%,560px)}
#brief .mapw{position:relative;width:100%;margin-top:8px;border-radius:12px;overflow:hidden;border:2px solid #fff;box-shadow:0 1px 6px rgba(60,40,20,.25);margin-left:auto;margin-right:auto}
#brief .mapcv{position:absolute;inset:0;width:100%;height:100%;display:block}
#brief .ml{position:absolute;transform:translate(-50%,-50%);white-space:nowrap;font-size:12px;font-weight:900;color:#3e3428;text-shadow:0 0 3px #fff,0 0 3px #fff,0 0 2px #fff;pointer-events:none}
#brief .ml.mx{padding:1px 7px;border-radius:999px;background:rgba(44,62,102,.88);color:#fff;text-shadow:none;font-size:11px}
#brief .ml.me{width:0;height:0;border-left:7px solid transparent;border-right:7px solid transparent;border-top:13px solid #d9483b;filter:drop-shadow(0 0 2px #fff) drop-shadow(0 0 1px #fff)}
#enter{position:fixed;left:50%;bottom:calc(34px + env(safe-area-inset-bottom));transform:translateX(-50%) scale(.92);padding:11px 26px;border-radius:999px;border:2px solid #fff;
  background:var(--ink);color:#fff;font:inherit;font-weight:800;font-size:16px;letter-spacing:.1em;box-shadow:0 4px 14px rgba(30,40,80,.28);opacity:0;pointer-events:none;transition:opacity .25s,transform .25s}
#enter.on{opacity:1;pointer-events:auto;transform:translateX(-50%) scale(1)}
#stick{position:fixed;width:116px;height:116px;margin:-58px 0 0 -58px;border-radius:50%;background:rgba(255,250,240,.22);border:2px solid rgba(255,255,255,.55);pointer-events:none;display:none}
#knob{position:absolute;left:50%;top:50%;width:46px;height:46px;margin:-23px 0 0 -23px;border-radius:50%;background:rgba(255,252,246,.85);box-shadow:0 2px 6px rgba(60,40,20,.25)}
.lbl{position:fixed;left:0;top:0;transform:translate(-50%,-100%);padding:3px 10px;border-radius:999px;background:rgba(255,250,240,.88);color:#4a3d2c;font-weight:800;font-size:12px;white-space:nowrap;pointer-events:none;
  border:1px solid var(--line);opacity:0;transition:opacity .3s}
.lbl.on{opacity:1}
#load{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;background:linear-gradient(#cfe2ee,#f3e6d2);transition:opacity .6s;z-index:9}
#load b{color:var(--ink);font-size:20px;letter-spacing:.2em}
#bar{width:180px;height:8px;border-radius:9px;background:rgba(44,62,102,.15);overflow:hidden}#bar i{display:block;height:100%;width:0;background:var(--ink);transition:width .2s}
#toast{position:fixed;left:50%;bottom:calc(96px + env(safe-area-inset-bottom));transform:translateX(-50%);padding:6px 16px;border-radius:999px;background:rgba(40,40,50,.72);color:#fff;font-weight:700;font-size:13px;opacity:0;transition:opacity .3s;pointer-events:none}
#talk{position:fixed;left:50%;bottom:calc(96px + env(safe-area-inset-bottom));transform:translateX(-50%);width:min(92vw,520px);padding:14px 18px 16px;border-radius:18px;background:rgba(255,250,240,.95);border:2px solid #fff;box-shadow:0 6px 18px rgba(60,50,30,.2);display:none;z-index:6}
#talk b{display:inline-block;margin-bottom:6px;padding:2px 12px;border-radius:999px;background:#2c3e66;color:#fff;font-size:13px}
#talk p{margin:0;color:#3e3428;font-size:15px;line-height:1.6;font-weight:700}
#bang{position:fixed;left:0;top:0;transform:translate(-50%,-100%);font:900 34px/1 sans-serif;color:#e2574c;text-shadow:0 2px 0 #fff,0 0 6px #fff;display:none;pointer-events:none;z-index:5}
#flash{position:fixed;inset:0;background:#fff;opacity:0;pointer-events:none;transition:opacity .35s;z-index:8}
#fps{position:fixed;left:8px;bottom:8px;color:#fff;font:12px monospace;text-shadow:0 1px 2px #000;display:none}
#fade{position:fixed;inset:0;background:#0b0d14;opacity:0;pointer-events:none;transition:opacity .25s;z-index:25}
#fade.on{opacity:1;pointer-events:auto}
#obj{position:fixed;top:calc(12px + env(safe-area-inset-top));left:12px;max-width:min(54vw,300px);padding:6px 12px 6px 10px;border-radius:12px;background:var(--cream);color:var(--ink);border:1px solid var(--line);
  box-shadow:0 2px 8px rgba(80,60,30,.12);font-weight:800;font-size:12.5px;line-height:1.35;display:none;z-index:4}
#obj::before{content:"";display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--ink);margin-right:7px;vertical-align:1px}
/* 物語の画面(タイトル・イントロ・設定・会話) */
#st{position:fixed;inset:0;z-index:30;display:none;overflow:hidden;background:#0b0d14;color:#3e3428}
#st.field{background:transparent;pointer-events:none}
#st.field #stBox{pointer-events:auto}
#st.field #stPick{pointer-events:auto}
#stBg{position:absolute;inset:0;background:center/cover no-repeat;transition:opacity .5s}
#st.field #stBg{display:none}
/* 縦長の画面(スマホ縦)では横長の絵を切らない(2026-11-04 オーナー「画像切れまくり」): 絵は横幅に合わせて全体を台詞の箱の上に出し、まわりは同じ絵をぼかして敷く。タイトル(.ttl)は別 */
@media (max-aspect-ratio:6/5){
  #st:not(.ttl) #stBg{background-size:0 0}
  #st:not(.ttl) #stBg::before,#st:not(.ttl) #stBg::after{content:"";position:absolute;background-image:inherit;background-repeat:no-repeat;pointer-events:none}
  #st:not(.ttl) #stBg::before{inset:-48px;background-size:cover;background-position:center;filter:blur(24px) brightness(.6) saturate(1.1)}
  #st:not(.ttl) #stBg::after{left:0;right:0;top:calc(56px + env(safe-area-inset-top));bottom:calc(150px + env(safe-area-inset-bottom));background-size:contain;background-position:center 46%}
}
.stP{position:absolute;bottom:calc(112px + env(safe-area-inset-bottom));width:min(64vw,440px);height:min(64vw,440px);object-fit:contain;transition:opacity .2s,transform .25s,filter .2s;pointer-events:none;filter:drop-shadow(0 6px 14px rgba(0,0,0,.25))}
#stL{left:max(-6vw,calc(50% - 480px))}#stR{right:max(-6vw,calc(50% - 480px))}
.stP.dim{filter:brightness(.6) drop-shadow(0 6px 14px rgba(0,0,0,.25));transform:scale(.95)}
.stP.off{opacity:0}
/* 右の枠は左右反転(全員右向きで描いてある)・右のうしろの枠は少し小さく奥に */
/* 向き: 絵ごとの向き(v3/portraits/index.json の facing)と置く側から --fx(1/-1)を決める。左の枠=右向き、右の枠=左向き */
.stP{transform:scaleX(var(--fx,1))}.stP.dim{transform:scaleX(calc(var(--fx,1)*.95)) scaleY(.95)}
#stR2{right:max(-16vw,calc(50% - 560px));bottom:calc(132px + env(safe-area-inset-bottom));width:min(58vw,396px);height:min(58vw,396px);filter:brightness(.72) drop-shadow(0 6px 14px rgba(0,0,0,.25))}
/* 3人の場面: 3人を横に並べ直す(顔は重ねない。重なるのは体の端だけ)。話している人を前に出して明るく、ほかは少し下げて暗く */
#st.trio .stP{--wc:min(100vw,760px);width:calc(var(--wc)*.46);height:calc(var(--wc)*.46);right:auto;bottom:calc(112px + env(safe-area-inset-bottom));transition:opacity .2s,transform .25s,filter .2s,left .25s}
#st.trio #stL{left:calc((100vw - var(--wc))/2 + var(--wc)*.18 - var(--wc)*.23)}
#st.trio #stR{left:calc((100vw - var(--wc))/2 + var(--wc)*.51 - var(--wc)*.23)}
#st.trio #stR2{left:calc((100vw - var(--wc))/2 + var(--wc)*.83 - var(--wc)*.23)}
#st.trio .stP:not(.dim){z-index:1}
#st.trio .stP.dim{transform:translateY(10px) scaleX(calc(var(--fx,1)*.92)) scaleY(.92);filter:brightness(.62) drop-shadow(0 6px 14px rgba(0,0,0,.25))}
/* 手帳の電話の画面(右上) */
#stPh{position:absolute;right:14px;top:calc(56px + env(safe-area-inset-top));width:min(36vw,210px);aspect-ratio:1;border-radius:20px;overflow:hidden;display:none;z-index:2;
  border:3px solid rgba(170,236,255,.95);box-shadow:0 0 22px rgba(120,210,255,.65);background:linear-gradient(#bfe6ff,#e8f6ff)}
#stPh img{width:100%;height:100%;object-fit:cover;object-position:50% 12%}
#stBox{position:absolute;left:50%;bottom:calc(16px + env(safe-area-inset-bottom));transform:translateX(-50%);width:min(94vw,640px);min-height:92px;box-sizing:border-box;padding:16px 20px 18px;border-radius:18px;
  background:rgba(255,250,240,.97);border:2px solid #fff;box-shadow:0 6px 18px rgba(20,20,30,.28);cursor:pointer;display:none;z-index:2}
#stBox b{position:absolute;top:-14px;left:18px;padding:3px 14px;border-radius:999px;background:var(--ink);color:#fff;font-size:14px}
#stBox p{margin:4px 0 0;font-size:16px;line-height:1.65;font-weight:700;min-height:2.6em;white-space:pre-wrap;color:#3e3428}
#stBox.nar{background:rgba(20,24,40,.84);border-color:rgba(255,255,255,.4)}#stBox.nar p{color:#fff}#stBox.nar b{display:none}
#stBox i{position:absolute;right:16px;bottom:8px;width:0;height:0;border:7px solid transparent;border-top-color:var(--ink);animation:bob 1s infinite}
#stBox.nar i{border-top-color:#fff}
@keyframes bob{50%{transform:translateY(3px)}}
#stCard{position:absolute;inset:0;display:none;cursor:pointer}
#stCard::after{content:"";position:absolute;left:0;right:0;bottom:0;height:46%;background:linear-gradient(rgba(0,0,0,0),rgba(0,0,0,.55));pointer-events:none}
#stCard .cap{position:absolute;left:0;right:0;bottom:calc(52px + env(safe-area-inset-bottom));text-align:center;color:#fff;font-weight:800;font-size:clamp(17px,4.6vw,24px);line-height:1.7;letter-spacing:.06em;
  text-shadow:0 2px 10px rgba(0,0,0,.6),0 0 2px rgba(0,0,0,.6);padding:0 16px;white-space:pre-line;opacity:0;transition:opacity .6s;z-index:2}
#stCard .cap.on{opacity:1}
#stFF{position:absolute;top:calc(14px + env(safe-area-inset-top));right:104px;padding:6px 14px;border-radius:999px;border:1px solid rgba(255,255,255,.6);background:rgba(0,0,0,.3);color:#fff;font:inherit;font-weight:800;font-size:13px;display:none;z-index:3;cursor:pointer}#stFF.on{background:#e8a53a;border-color:#fff}
#stVc{position:absolute;top:calc(14px + env(safe-area-inset-top));padding:6px 14px;border-radius:999px;border:1px solid rgba(255,255,255,.6);background:rgba(0,0,0,.3);color:#fff;font:inherit;font-weight:800;font-size:13px;display:none;z-index:3;cursor:pointer}#stVc.off{opacity:.6}
#stBgm{position:absolute;top:calc(14px + env(safe-area-inset-top));padding:6px 14px;border-radius:999px;border:1px solid rgba(255,255,255,.6);background:rgba(0,0,0,.3);color:#fff;font:inherit;font-weight:800;font-size:13px;display:none;z-index:3;cursor:pointer}#stBgm.off{opacity:.6}
#btBgm{position:fixed;top:calc(52px + env(safe-area-inset-top));right:96px;padding:6px 14px;border-radius:999px;border:1px solid var(--line);background:var(--cream);color:var(--ink);font:inherit;font-weight:800;font-size:13px;box-shadow:0 2px 8px rgba(80,60,30,.12);cursor:pointer;display:none;z-index:4}#btBgm.off{opacity:.6}
#st.field #stSkip,#st.field #stFF,#st.field #stVc,#st.field #stBgm{top:calc(64px + env(safe-area-inset-top))}
#stSkip{position:absolute;top:calc(14px + env(safe-area-inset-top));right:14px;padding:6px 14px;border-radius:999px;border:1px solid rgba(255,255,255,.6);background:rgba(0,0,0,.3);color:#fff;font:inherit;font-weight:800;font-size:13px;display:none;z-index:3;cursor:pointer}
.stBtn{border:2px solid #fff;border-radius:999px;background:var(--ink);color:#fff;font:inherit;font-weight:800;font-size:17px;letter-spacing:.12em;padding:12px 34px;box-shadow:0 4px 14px rgba(20,30,60,.3);cursor:pointer;min-width:220px}
.stBtn.sub{background:rgba(255,250,240,.95);color:var(--ink);border-color:rgba(44,62,102,.25)}
.stBtn:disabled{opacity:.45;cursor:default}
/* 2026-10-27 確認用: タイトルの小さいボタン(全部ためす・CPU対戦)・テストの印・ワープ */
.stMini{display:grid;grid-template-columns:1fr 1fr;gap:6px;justify-content:center;width:min(280px,76vw)}   /* 2026-10-27: 2×2(全部ためす・CPU対戦・テリオン表・融合表) */
.stMini button,.stMini a{border:1px solid rgba(255,255,255,.7);border-radius:999px;background:rgba(20,30,60,.55);color:#fff;font:inherit;font-weight:800;font-size:13px;padding:9px 16px;min-height:40px;text-decoration:none;display:inline-flex;align-items:center;cursor:pointer}
.stMini button,.stMini a{justify-content:center;padding:0 10px;white-space:nowrap;height:38px;min-height:0;font-size:12.5px;box-sizing:border-box}
#testBadge{position:fixed;top:calc(12px + env(safe-area-inset-top));left:12px;padding:4px 12px;border-radius:999px;background:#c0392b;color:#fff;font-weight:900;font-size:13px;letter-spacing:.1em;z-index:5;display:none;pointer-events:none}
#btWarp{position:fixed;top:calc(52px + env(safe-area-inset-top));left:12px;padding:6px 14px 6px 10px;border-radius:999px;border:1px solid var(--line);background:var(--cream);color:var(--ink);font:inherit;font-weight:800;font-size:13px;box-shadow:0 2px 8px rgba(80,60,30,.12);cursor:pointer;display:none;z-index:4}
#btWarp img.ui-ic{width:1.5em;height:1.5em;vertical-align:-.42em;margin-right:.2em}
#warp{position:fixed;inset:0;z-index:60;background:rgba(20,28,50,.94);display:none;flex-direction:column;color:#fff}
#warp.on{display:flex}
#warp .wt{display:flex;gap:8px;align-items:center;padding:calc(10px + env(safe-area-inset-top)) 12px 8px;border-bottom:1px solid rgba(255,255,255,.18)}
#warp .wt b{flex:1;font-size:17px}
#warp .wt button{min-height:40px;border-radius:999px;border:1px solid rgba(255,255,255,.4);background:rgba(255,255,255,.12);color:#fff;font:inherit;font-weight:800;padding:0 14px}
#warp .wl{flex:1;overflow-y:auto;padding:8px 12px calc(20px + env(safe-area-inset-bottom));-webkit-overflow-scrolling:touch}
#warp h3{margin:12px 0 6px;font-size:14px;color:#ffd977}
#warp .wg{display:grid;grid-template-columns:1fr 1fr;gap:6px}
#warp .wg button{min-height:48px;border-radius:10px;border:1px solid rgba(255,255,255,.25);background:rgba(255,255,255,.08);color:#fff;font:inherit;font-weight:800;font-size:13px;text-align:left;padding:4px 10px}
#warp .wg button small{display:block;font-size:10.5px;opacity:.7;font-weight:700}

<script>
(function(){
'use strict';
// =====================================================================================
//  ギリシャ地方 オリーヴァ村 — 歩ける見本 (three r128)
//  地形・建物・小物・草は regions/<マップ>.json から組み立てる。街(オリーヴァ村)と自然(オリーブの丘)は別のマップで、
//  門に入ると暗転して切り替える(そのマップの分だけ読む)。マップの中は48m角の区画で、主人公の近くだけ細かく作る。
//  テリオンモンスター ギリシャ編(2026-10-26 正本: world_v2/ギリシャ編_設定まとめ_2026-10-26.md)。生き物の呼び名は「テリオン」。
//  タイトル → イントロ → 主人公の設定(ヤマト) → 東京のひまな夏(じいちゃん) → 空の港 → 飛行船(ピーグルの群れ) → オリーヴァ村(エリー・エレナ博士・逃げた3体)
//  → 手のひらの約束で相棒を選ぶ → レン登場 → 丘でレン → ログ＆パッチの網(初バトル)→言い伝え「王は、四つの守りに認められた子の前でだけ、目をさます」
//  → 丘の西の入口でアレク(最初は敵) → 丘の下の迷路(oliva_maze) → 守り①ミノタス(古代テリオン)。記録は localStorage(w2_save_v1)。
//  人物は world_v2/v3(characters_v3・style_v3): 3D は v3/chars/{key}.glb(char_v3.js)、立ち絵は v3/portraits/{key}_{表情}.webp(全員右向き・右の枠は反転)。
//  WORLD.swapHero(url) で差し替えられる。
// =====================================================================================
const Q=new URLSearchParams(location.search);
const IS_MOBILE = Q.get('q')==='low' || (Q.get('q')!=='high' && (/iPhone|iPad|Android|Mobile/i.test(navigator.userAgent) || (matchMedia('(pointer:coarse)').matches && Math.min(innerWidth,innerHeight)<820)));
const CFG={
  map0: Q.get('map') || 'oliva_town',   // マップは regions/<id>.json(街 oliva_town / 自然 oliva_hill)
  hero:{ urls:['../chars/hero_m.glb'], height:1.2, walk:1.5, run:4.4 },   // 主人公: 先頭から順に探す。c3:<key> は丹波農商と同じ c3 形式(顔の焼き込み+目のオーバーレイ)
  monBase:'../../design_v2/models/n',
  loadR: 52, unloadR: 76, modelR: 22,
};

// ---------------------------------------------------------------- 小道具
const sm=(a,b,x)=>{ let t=(x-a)/(b-a); t=t<0?0:t>1?1:t; return t*t*(3-2*t); };
const clamp=(x,a,b)=>x<a?a:x>b?b:x, lerp=(a,b,t)=>a+(b-a)*t;
function hash2(x,z){ let h=(Math.imul(x|0,374761393)+Math.imul(z|0,668265263))|0; h=Math.imul(h^(h>>>13),1274126177); h^=h>>>16; return (h>>>0)/4294967296; }
function vnoise(x,z){ const xi=Math.floor(x), zi=Math.floor(z); let fx=x-xi, fz=z-zi; fx=fx*fx*(3-2*fx); fz=fz*fz*(3-2*fz);
  const a=hash2(xi,zi), b=hash2(xi+1,zi), c=hash2(xi,zi+1), d=hash2(xi+1,zi+1); return a+(b-a)*fx+(c-a)*fz+(a-b-c+d)*fx*fz; }
function fbm(x,z){ return vnoise(x,z)*0.5+vnoise(x*2.03+17.1,z*2.03-9.2)*0.25+vnoise(x*4.07-3.3,z*4.07+5.5)*0.125+vnoise(x*8.1+1.7,z*8.1)*0.0625; }
function rng(seed){ let a=seed>>>0; return ()=>{ a|=0; a=a+0x6D2B79F5|0; let t=Math.imul(a^a>>>15,1|a); t=t+Math.imul(t^t>>>7,61|t)^t; return ((t^t>>>14)>>>0)/4294967296; }; }
function segDT(px,pz,ax,az,bx,bz){ const dx=bx-ax,dz=bz-az, L=dx*dx+dz*dz; let t=L?((px-ax)*dx+(pz-az)*dz)/L:0; t=t<0?0:t>1?1:t; const qx=ax+dx*t-px, qz=az+dz*t-pz; return [Math.sqrt(qx*qx+qz*qz),t]; }
function gauss(x,z,cx,cz,r,a){ const dx=x-cx, dz=z-cz; return a*Math.exp(-(dx*dx+dz*dz)/(r*r)); }
const col3=c=>new THREE.Color(c);
const DEG=Math.PI/180;

// ---------------------------------------------------------------- 地形(データから)
let D=null, TER=null;
function prepPoly(p,w){ let x0=1e9,z0=1e9,x1=-1e9,z1=-1e9; for(const q of p){ x0=Math.min(x0,q[0]);x1=Math.max(x1,q[0]);z0=Math.min(z0,q[1]);z1=Math.max(z1,q[1]); } return {p,w,bb:[x0-w-2,z0-w-2,x1+w+2,z1+w+2]}; }
function polyD(x,z,P){ if(x<P.bb[0]||x>P.bb[2]||z<P.bb[1]||z>P.bb[3]) return 1e9; let b=1e9; const p=P.p; for(let i=0;i<p.length-1;i++){ const d=segDT(x,z,p[i][0],p[i][1],p[i+1][0],p[i+1][1])[0]; if(d<b) b=d; } return b; }
function makeTerrain(D){
  const T=D.terrain;
  // coast: dir=-1 で向きを逆にする(axis z なら「at より南が海」・axis x なら「at より東が海」)。アテネの東の港・クレタの南の港(2026-10-25)
  const coastD=(x,z)=>{ let d=1e9; for(const c of (T.coast||[])){ const v=(c.axis==='z' ? z-c.at : x-c.at)*(c.dir||1)+c.noise*(c.axis==='z'?(vnoise(x*0.05,3.3+c.at)-0.5)*2:(vnoise(7.7+c.at,z*0.05)-0.5)*2); if(v<d) d=v; } return d; };
  const natural=(x,z)=>{ const b=T.base; let h=b.h+b.amp*(fbm(x*b.freq+11,z*b.freq-7)-0.45);
    for(const g of (T.hills||[])) h+=gauss(x,z,g[0],g[1],g[2],g[3]);
    for(const e of (T.edges||[])) h+=sm(e.from,e.to,e.axis==='x'?x:z)*e.h; return h; };
  const pads=(T.pads||[]).map(p=>p.t==='road'?Object.assign({},p,{P:prepPoly(p.pts.map(q=>[q[0],q[1]]),p.w+p.soft)}):p);
  function shaped(x,z){
    const d=coastD(x,z); let h=natural(x,z); h=0.5+(h-0.5)*sm(0,16,d); h=-4+(h+4)*sm(-7,2,d);
    for(const p of pads){
      if(p.t==='rect'){ const fx=sm(p.x0-p.softx,p.x0,x)*(1-sm(p.x1,p.x1+p.softx,x)), fz=sm(p.z0-p.softz,p.z0,z)*(1-sm(p.z1,p.z1+p.softz,z)); h=lerp(h,p.h,fx*fz); }
      else if(p.t==='circle'){ const dd=Math.hypot(x-p.x,z-p.z); const m=1-sm(p.r,p.r+p.soft,dd); h=lerp(h,p.mode==='max'?Math.max(h,p.h):p.h,m); }
      else if(p.t==='road'){ const P=p.P; if(x<P.bb[0]||x>P.bb[2]||z<P.bb[1]||z>P.bb[3]) continue; let best=1e9, bh=0; const q=p.pts;
        for(let i=0;i<q.length-1;i++){ const r=segDT(x,z,q[i][0],q[i][1],q[i+1][0],q[i+1][1]); if(r[0]<best){ best=r[0]; bh=lerp(q[i][2],q[i+1][2],sm(0,1,r[1])*0.5+r[1]*0.5); } }
        h=lerp(h,bh,1-sm(p.w,p.w+p.soft,best)); }
      else if(p.t==='quay'){ const fx=sm(p.x0-p.soft,p.x0,x)*(1-sm(p.x1,p.x1+p.soft,x)); if(fx<=0) continue;
        if(p.dir<0){ if(z<=p.z1){ h=lerp(h,p.h,fx*sm(p.z0-p.soft,p.z0,z)); } else { const k=sm(p.z1,p.z1+1.2,z); h=lerp(h,lerp(p.h,-3.5,k),fx); } }   // 南向きの岸壁(z1 より南が海)
        else if(z>=p.z0){ h=lerp(h,p.h,fx*(1-sm(p.z1,p.z1+p.soft,z))); } else { const k=1-sm(p.z0-1.2,p.z0,z); h=lerp(h,lerp(p.h,-3.5,k),fx); } }
      else if(p.t==='ramp'){ if(x>=p.x0&&x<=p.x1&&z>=p.z0&&z<=p.z1) h=lerp(p.h0,p.h1,(z-p.z0)/(p.z1-p.z0)); }
    }
    return h;
  }
  // 小川: 中心線を細かく取り、水面の高さを上流から下流へ下がるだけにする
  const streams=(T.streams||[]).map(s=>{ const cv=new THREE.CatmullRomCurve3(s.pts.map(q=>new THREE.Vector3(q[0],0,q[1])));
    const L=cv.getLength(), n=Math.ceil(L/0.8), pts=cv.getSpacedPoints(n); const xs=[],zs=[],wl=[];
    let lv=1e9; for(let k=0;k<pts.length;k++){ const p=pts[k], q=pts[Math.min(pts.length-1,k+1)], r0=pts[Math.max(0,k-1)]; let tx=q.x-r0.x, tz=q.z-r0.z; const L=Math.hypot(tx,tz)||1; const nx=-tz/L*2.7, nz=tx/L*2.7;
      if(shaped(p.x,p.z)<0.25) break; xs.push(p.x); zs.push(p.z); lv=Math.min(lv,shaped(p.x,p.z)-0.5,shaped(p.x+nx,p.z+nz)-0.3,shaped(p.x-nx,p.z-nz)-0.3); wl.push(Math.max(0.04,lv)); }
    let bb=[1e9,1e9,-1e9,-1e9]; for(let i=0;i<xs.length;i++){ bb[0]=Math.min(bb[0],xs[i]);bb[1]=Math.min(bb[1],zs[i]);bb[2]=Math.max(bb[2],xs[i]);bb[3]=Math.max(bb[3],zs[i]); }
    const segs=[]; for(let i=0;i<xs.length-1;i+=8){ const j=Math.min(xs.length-1,i+8); let a=[1e9,1e9,-1e9,-1e9]; for(let k=i;k<=j;k++){ a[0]=Math.min(a[0],xs[k]);a[1]=Math.min(a[1],zs[k]);a[2]=Math.max(a[2],xs[k]);a[3]=Math.max(a[3],zs[k]); } segs.push([i,j,a]); }
    return Object.assign({},s,{xs,zs,wl,bb,segs}); });
  function streamQ(x,z){ let best=1e9, wl=0; for(const s of streams){ const R=s.bank+1; if(x<s.bb[0]-R||x>s.bb[2]+R||z<s.bb[1]-R||z>s.bb[3]+R) continue;
      for(const g of s.segs){ const a=g[2]; if(x<a[0]-R||x>a[2]+R||z<a[1]-R||z>a[3]+R) continue;
        for(let i=g[0];i<g[1];i++){ const r=segDT(x,z,s.xs[i],s.zs[i],s.xs[i+1],s.zs[i+1]); if(r[0]<best){ best=r[0]; wl=lerp(s.wl[i],s.wl[i+1],r[1]); } } } }
    return [best,wl]; }
  function full(x,z){ let h=shaped(x,z); const q=streamQ(x,z); if(q[0]<4){ const s=streams[0]; const k=1-sm(s.w,s.bank,q[0]); h=Math.min(h,lerp(h,q[1]-s.depth,k)); } return h; }
  const bridges=(T.bridges||[]).map(b=>{ const hz0=shaped((b.x0+b.x1)/2,b.z0), hz1=shaped((b.x0+b.x1)/2,b.z1); return Object.assign({},b,{e0:b.h!=null?b.h:hz0, e1:b.h!=null?b.h:hz1}); });
  function deckAt(x,z){ for(const b of bridges){ if(x>=b.x0&&x<=b.x1&&z>=b.z0&&z<=b.z1){ const t=(z-b.z0)/(b.z1-b.z0); const arch=b.kind==='stone'?0.6:(b.kind==='wood'?0.25:0); return lerp(b.e0,b.e1,t)+Math.sin(t*Math.PI)*arch+0.05; } } return null; }
  return {coastD,natural,shaped,full,streamQ,streams,bridges,deckAt};
}
// 道(石畳・土)の重み
let PATHS=null;
function pathMask(x,z){ let s=0,d=0;
  for(const P of PATHS.stone){ const dd=polyD(x,z,P); if(dd<9) s=Math.max(s,1-sm(P.w-0.25,P.w+0.45,dd)); }
  for(const c of PATHS.sc){ const dd=Math.hypot(x-c[0],z-c[1]); s=Math.max(s,1-sm(c[2]-0.5,c[2]+0.3,dd)); }
  for(const r of PATHS.sr){ const f=sm(r[0]-0.4,r[0],x)*(1-sm(r[2],r[2]+0.4,x))*sm(r[1]-0.4,r[1],z)*(1-sm(r[3],r[3]+0.4,z)); s=Math.max(s,f); }
  for(const P of PATHS.dirt){ const dd=polyD(x,z,P); if(dd<9) d=Math.max(d,1-sm(P.w-0.3,P.w+0.6,dd)); }
  if(PATHS.town){ const t=PATHS.town; let f=sm(t[0]-1.5,t[0],x)*(1-sm(t[2],t[2]+1.5,x))*sm(t[1]-1.5,t[1],z)*(1-sm(t[3],t[3]+1.5,z)); if(PATHS.un) for(const u of PATHS.un){ f*=sm(u[2],u[3],Math.hypot(x-u[0],z-u[1])); } s=Math.max(s,f); }
  return [s,d]; }
// なめらかな舗装(砂の模様)の区画: paths.sandRects。未来の街の通り・広場(アテネ 2026-10-25)。草も散らす物も置かない
function sandAt(x,z){ if(!PATHS||!PATHS.sa) return false; for(const r of PATHS.sa){ if(x>=r[0]&&x<=r[2]&&z>=r[1]&&z<=r[3]) return true; } return false; }
function inEll(x,z,e){ const a=(x-e[0])/e[2], b=(z-e[1])/e[3]; return a*a+b*b; }
const SNOWC=col3('#eef2f6');
const GC={ g1:col3('#9db463'), g2:col3('#84a35a'), g3:col3('#bdb672'), sand:col3('#ead9b2'), wet:col3('#cdbb93'), rock:col3('#cdbb9c'), bank:col3('#a9a68a'), tall:col3('#6f9a47'), deep:col3('#b9a77f') };
const _gc=new THREE.Color();
function groundCol(x,z,h,slope,out){
  const n=fbm(x*0.05,z*0.05), dry=sm(0.45,0.72,fbm(x*0.018+3,z*0.018-2))*(0.45+0.55*sm(2.5,7,h));
  _gc.copy(GC.g1).lerp(GC.g2,sm(0.3,0.72,n)).lerp(GC.g3,dry*0.75);
  for(const e of D.grass.tall){ const r=inEll(x,z,[e[0],e[1],e[2]+1.5,e[3]+1.5]); if(r<1) _gc.lerp(GC.tall,(1-r)*0.6); }
  const cd=TER.coastD(x,z); let s=(1-sm(3,8,cd))*(1-sm(1.0,1.9,h)); if(h<0.25) s=1;
  let rk=0; const sq=TER.streamQ(x,z); if(sq[0]<2.8) rk=Math.max(rk,(1-sm(1.2,2.8,sq[0]))*0.8);
  if(slope>0.75) rk=Math.max(rk,sm(0.75,1.4,slope));
  if(h<0.2) _gc.multiplyScalar(0.85);
  if(D.snow){ const k=sm(D.snow[0],D.snow[1],h)*(0.55+0.45*fbm(x*0.09+5,z*0.09-3)); if(k>0.02){ _gc.lerp(SNOWC,Math.min(1,k*1.3)); if(D.snowSand!=null){ s=Math.max(s,k); rk=Math.max(rk,k*D.snowSand); } else { rk=Math.max(rk,k*0.95); s=0; } } }   // 高い所は残雪(雲の山道): 白く染めた岩の模様で雪。snowSand(中国編の雪の高原 2026-10-26)=白く染めた砂の模様+少しの岩(一面の雪)
  out[0]=_gc.r; out[1]=_gc.g; out[2]=_gc.b; out[3]=s; out[4]=rk; return out; }

// ---------------------------------------------------------------- レンダラ・場面
const cv=document.getElementById('cv');
const renderer=new THREE.WebGLRenderer({canvas:cv,antialias:false,powerPreference:'high-performance',stencil:false});
const PR=Math.min(devicePixelRatio||1, IS_MOBILE?1.5:2);
renderer.setPixelRatio(PR);
renderer.outputEncoding=THREE.LinearEncoding; renderer.toneMapping=THREE.NoToneMapping;
renderer.shadowMap.enabled=true; renderer.shadowMap.type=THREE.PCFShadowMap;   // PCF + radius = 柔らかい影
const scene=new THREE.Scene();
const camera=new THREE.PerspectiveCamera(30,1,4,420);
scene.fog=new THREE.Fog(0xdbe9ef,90,330);
const hemi=new THREE.HemisphereLight(0xd6e7f6,0xb5aa86,0.58); scene.add(hemi);
const amb=new THREE.AmbientLight(0xffffff,0.06); scene.add(amb);
const sun=new THREE.DirectionalLight(0xfff3e0,0.62); sun.castShadow=true;

function monUpdate(m,dt,now){ const dh=Math.hypot(m.x-HERO.x,m.z-HERO.z); if(!grShown(m.o)){ if(m.inst&&m.inst.root.parent) scene.remove(m.inst.root); return; }   // ---- 物語(gr_story.js): 野生の need/until

    if(m.st==='look'){ const ty=Math.atan2(HERO.x-m.x,HERO.z-m.z); m.yaw+=angD(ty,m.yaw)*Math.min(1,dt*5); }

  const sq=TER.streamQ(x,z); if(TER.streams.length&&sq[0]<TER.streams[0].w+0.55) return false; const c=chunkAt(x,z); if(!c||c.state!==2) return false; return true; }
function colFree(x,z,r){ const q=pushOut(x,z,r); return Math.hypot(q[0]-x,q[1]-z)<1e-3; }   // 障害物(壁など)に触れないか。迷宮(monCol)の野生の子の歩き先に使う

  if(ok(nx,nz)){ HERO.x=nx; HERO.z=nz; return; } if(ok(nx,oz)){ HERO.x=nx; return; } if(ok(ox,nz)){ HERO.z=nz; } }

const GR_STEPS=[]; const GR_BY={};

  for(let ep=1;ep<=23;ep++){ const E=GR_EP[ep], P=GR_PLAN[ep]; if(!E||!P) continue; const sc=E.sc;
    const bi=sc.findIndex(x=>x[2]); let bl=-1; for(let i=sc.length-1;i>=0;i--) if(sc[i][2]){ bl=i; break; }
    const list=[]; sc.forEach((x,i)=>{ if(bi<0||i<bi||i>bl){ list.push(x[0]); return; } if(!x[2]) list.push(x[0]); if(i===bl) list.push('B'); });
    let map=P.map, first=true;
    for(const k of list){
      const head=first?{at:P.at, tod:P.tod, obj:P.obj, head:1}:{at:'*'}; first=false;
      if(P.tp&&P.tp.before===k) grS(Object.assign({id:'g'+pad2g(ep)+'_t', ep, kind:'tp', map, x:P.tp.x, z:P.tp.z, yaw:P.tp.yaw}, head.head?head:{at:'*'}));
      if(k==='B') grS(Object.assign({id:'g'+pad2g(ep)+'_b', ep, kind:'battle', map, F:GR_FIGHTS[ep]}, head));
      else grS(Object.assign({id:k, ep, kind:'scene', key:k, map, bg:GR_BG[k], pro:!!(P.pro&&P.pro.includes(k))}, head));
      if(P.go&&P.go.after===k){ grS({id:'g'+pad2g(ep)+'_g', ep, kind:'go', map, to:P.go.to, toAt:P.go.at, at:'*'}); map=P.go.to; } }
    if(P.end) grS({id:'g'+pad2g(ep)+'_e', ep, kind:'go', map, to:P.end.to, toAt:P.end.at, at:'*'}); }
  GR_STEPS.forEach((s,i)=>{ const n=GR_STEPS[i+1]; s.last=!n||n.ep!==s.ep; }); }

function grHere(s){ if(!s||s.map!==MAP) return false; if(!s.at||s.at==='*') return true; return (Array.isArray(s.at)?s.at:[s.at]).includes(AREA); }
async function grRun(){ if(GR_RUN) return; GR_RUN=true;
  try{ for(let g=0;g<400;g++){ const s=grCur(); if(!s||!grHere(s)||STORY||TRANS||ENC) break; const ok=await grStep(s); if(!ok) break;
      if(s.last){ const n=grCur(); if(!n||!(GR_PLAN[n.ep]&&GR_PLAN[n.ep].chain)) break; } } }
  catch(e){ console.error('gr story',e); }
  finally{ GR_RUN=false; bgmScene(null); objUpdate(); } }
async function grStep(s){ const f=GF();
  if(s.tod&&TODN!==s.tod&&TOD[s.tod]) setTime(s.tod,true);
  if(s.kind==='scene'){ bgmScene(s.key); if(GR_HOOK[s.key]) await GR_HOOK[s.key](); if(SC[s.key]){ if(s.bg) await runScene(SC[s.key],{bg:s.bg}); else await storyField(s.key); } }
  else if(s.kind==='go'){ await goMap(s.to,s.toAt); if(MAP!==s.to) return false; }
  else if(s.kind==='tp'){ await grTp(s.x,s.z,s.yaw); }
  else if(s.kind==='battle'){ const b=f[s.id+'_b'];
    if(!b){ GR_RETRY=false; await grFight(s); return false; }
    const win=b===2;
    if(!win&&s.F.must){ delete f[s.id+'_b']; GR_RETRY=true; saveGame(); await runScene(grLoseLines(s.F),{field:true}); objUpdate(); return false; } }
  flag(s.id); if(s.last){ if(GR_DONE[s.ep]) GR_DONE[s.ep](); flag('a'+pad2g(s.ep)); } saveGame(); return true; }

async function grFight(s){ const F=s.F; F._ep=s.ep; const say=GR_SAY[s.ep];
  if(!SAVE.flags.gr_bond) grBond();
  if(say&&!GF()['seen_'+s.id]){ bgmCue('idea'); await runScene([{w:say[0],f:say[1],t:say[2]}],{field:true}); SAVE.flags['seen_'+s.id]=1; }
  if(F.anc){ const o={id:F.anc.mid, ancient:1, tier:F.anc.tier, lv:F.lv, h:1.6, size:9, flag:GR_ANC_FLAG[s.ep]||('gr_w'+s.ep), x:HERO.x, z:HERO.z-3};
    const m={o, x:o.x, z:o.z, wild:true}; await startEncounter({type:'wild', m, gr:{s,F}}); }
  else { const n=stubFoe({n:F.foe.n, trainer:1, party:F.foe.party.map(x=>Object.assign({lv:F.lv},x))}); await startEncounter({type:'trainer', n, gr:{s,F}}); } }
// 物語の勝負の opt(シムの battle/sim/study_gr23.js と同じ組み立て)。隊は表どおり・覚えた姿は隊の子＋own だけ・相手1体(古代は子分なし)
const grStageOf=mid=>{ const M=window.MonBattle&&MonBattle.MID; const m=M&&M[+mid]; if(m) return m.role==='fusion'?3:(m.level||1); return +mid>=2000?3:(ENJU_LINE.indexOf(+mid)+1||1); };
function grFightOpt(opt,F){ const lv=F.lv; if(!opt.player) opt.player={}; let party=opt.player.party; if(!Array.isArray(party)){ party=[]; opt.player.party=party; }
  const enju=party.find(p=>ENJU_LINE.includes(+p.mid))||null;
  const L=F.me.map(m=>{ if(typeof m==='string'){ const mid=GR_PMID[m]; return enju&&enju.uid?{uid:enju.uid, mid, lv:Math.max(+enju.lv||1, lv)}:{mid, lv, guest:1}; } return {mid:+m, lv, guest:1}; });
  party.length=0; L.forEach(p=>party.push(p));
  opt.player.owned=[...new Set(L.map(p=>p.mid).concat(F.own||[]))]; opt.player.fusionKnown=(F.fuse||[]).slice(); opt.player.stageFree=true;
  opt.fusionUnlocked=!!(F.fuse&&F.fuse.length); opt.tripleUnlocked=false; opt.startStage=1; opt.alignMinions=true;
  opt.budget=L.reduce((a,p)=>a+grStageOf(p.mid),0);
  const bd=grBoard(F.board,F.look); if(bd){ opt.terrainTheme=bd; opt.backdrop=undefined; }
  if(F.anc){ opt.kind='ancient'; opt.size=9; opt.enemy={party:[{mid:F.anc.mid, lv, fixed:true}], name:'古代テリオン '+monName(F.anc.mid), ancient:{tier:F.anc.tier, minions:[], tune:Object.assign({},F.anc.tune)}, catchable:!!F.learn};
    opt.recruit=F.learn?(()=>grLearn(F.anc.mid)):(()=>null); }
  else { opt.kind='trainer'; opt.size=9; opt.enemy={name:F.foe.n, party:F.foe.party.map(x=>Object.assign({lv},x)), ai:Object.assign({},F.ai||{})}; opt.recruit=()=>null; } }
// 古代を倒した → エリーの古代の言葉で仲間に(=その融合の仕方を必ず覚える。ゲームのふだんの古代は 約33%)
function grLearn(mid){ if(!(window.Progress&&Progress.learnBoss)) return null; const c=Progress.config&&Progress.config.cfg; const p=c?c.bossLearn:null;
  try{ if(c) c.bossLearn=1; return Progress.learnBoss({mid:+mid, lv:1}); } finally{ if(c) c.bossLearn=p; } }

// ---- 第1話のはじめ(新しいセーブ・前の版のセーブを1話から): 語り→市場(全画面)。そのあと本体が村に下ろす ----
async function ep1Open(){ const f=GF(); for(const k of (GR_PLAN[1].pro||[])){ if(f[k]) continue; bgmScene(k); if(SC[k]) await runScene(SC[k],{bg:GR_BG[k],keepPaused:true,prologue:true}); if(SAVE){ SAVE.flags[k]=1; saveGame(); } }
  bgmScene(null); if(SAVE) SAVE.stage='now'; }

const GR_MAPJ={oliva_town:'オリーヴァ村', oliva_hill:'オリーブの丘', arcadia:'アルカディアの森', dig:'森の外れの発掘場', facility:'森の奥の施設', nafria:'港町ナフリア', liongate:'獅子門の丘',
  cloudroad:'雲の山道', corinth:'運河の町コリンタ', marble:'大理石の谷', athens:'白い都', crete_maze:'丘の下の迷宮'};
function grObjText(f){ if(!grOn()) return null; if(GR_RETRY) return 'もう一度、勝負'; const s=grCur(); if(!s) return null; const P=GR_PLAN[s.ep]||{};
  if(MAP!==s.map) return (P.obj&&s.head)?P.obj:(GR_MAPJ[s.map]||s.map)+'へ';
  if(s.at&&s.at!=='*'&&!(Array.isArray(s.at)?s.at:[s.at]).includes(AREA)) return P.obj||(s.at+'へ');
  return P.obj||'第'+s.ep+'話'; }

// ---- 前の版(30話)のセーブ: 30話を終えていれば 23話も終えた扱い。途中なら新しい1話から(仲間・Lv・ジェムはそのまま) ----
function grMigrate(){ const f=SAVE&&SAVE.flags; if(!f||f.g23) return;
  if(f.ep30||f.king){ f.g23=1; for(const s of GR_STEPS) f[s.id]=1; for(let i=1;i<=23;i++) f['a'+pad2g(i)]=1; f.gr_bond=1; return; }
  if(!f.arrived){ f.g23=1; return; }
  const old={}; for(const k of Object.keys(f)){ old[k]=f[k]; delete f[k]; } f.old30=old; f.g23=1;
  if(SAVE.map) SAVE.map='oliva_town'; }   // 本体の contGame が arrived の無いセーブとして第1話のはじめ(ep1Open)から流す

GR_SC.g01_05=[{w:null,t:"石段の下から、ごろごろと音。"},{w:"elly",t:"あ、いたいた！　ねえ、これ、きみのでしょ？　オリーブのおばさんから預かってきたよ。",v:"01_0104"},{w:"hero",t:"あ……ありがと。わざわざ持ってきてくれたの？",v:"01_0105"},{w:"elly",t:"おばさんが「男の子が荷物置いて、狐を追っかけてった」って、大さわぎしてたんだもん。……って、ちょっと、その右手！　血、出てるじゃない！",v:"01_0106"},{w:"hero",t:"ああ、これ？　なでようとしたら、かまれた。",v:"01_0107"},{w:"elly",t:"かまれたって、なんでそんな、うれしそうなの！　ほら、すわって！",v:"01_0108"},{w:null,t:"ヤマト、木の根もとに座らされる。"},{w:"elly",t:"しみるよ。がまんしてね。",v:"01_0110"},{w:"hero",t:"いっ……！　しみる、しみる！",v:"01_0111"},{w:"elly",t:"あの子、フォルンっていうの。この丘に住んでる野良の狐の子。村の人はみんなそう呼んでる。だれにもさわらせないんだよ。",v:"01_0112"},{w:"elly",t:"わたしなんか、三年、毎日クッキー持ってきてるのに、一回もなでさせてもらったことないんだから。",v:"01_0113"},{w:null,t:"根もとの石のくぼみに、クッキーが一枚。"},{w:"hero",t:"フォルンか。かっこいい名前じゃん。",v:"01_0115"},{w:null,t:"木の上で、フォルンの耳が、ぴくっとこっちを向く。"},{w:"elly",t:"さっきの黒い車の二人、見た？　あれが、ヴィクター。持ち主のいないテリオンを、つかまえて売ってるの。フォルン、何回もねらわれてるんだよ。",v:"01_0117"},{w:"hero",t:"警察とか、なにもしねーの？",v:"01_0118"},{w:"elly",t:"村の駐在さん、ひとりしかいないもん。それも、おじいちゃん。",v:"01_0119"},{w:"elly",t:"で、きみは？　観光？",v:"01_0120"},{w:"hero",t:"日本から。けさ着いた。",v:"01_0121"},{w:null,t:"エリーの手が止まる。"},{w:"elly",t:"ちょっと待って。日本から来た、男の子。きみ、もしかして、ヤマト？",v:"01_0123"},{w:"hero",t:"え、なんでおれの名前知ってんの。",v:"01_0124"},{w:"elly",t:"わたし、エリー！　うち、ホテルやってるの！　きみのおじいちゃんから電話があって、空港まで迎えに行ったんだよ！　三時間待ったんだからね、三時間！",v:"01_0125"},{w:"hero",t:"じいちゃん、それ、おれにひと言も言ってない。",v:"01_0126"},{w:null,t:"ヤマト、手首の画面をつける。"},{w:"elly",t:"ホテル、うちだね。",v:"01_0128"},{w:"hero",t:"なんで、そこで切れるんだよ……。",v:"01_0129"},{w:"elly",t:"で、おじいちゃんは？",v:"01_0130"},{w:"hero",t:"知らない。空港でトイレ行って、もどったら、いなかった。",v:"01_0131"},{w:"elly",f:"surprised",t:"ええっ！？　それ、すっごく大変なことじゃない！",v:"01_0132"},{w:"hero",t:"いつものことだよ。じいちゃん、急に消えるの、得意だから。",v:"01_0133"},{w:null,t:"ヤマトは、話しながらも、木の上のフォルンばかり見ている。"},{w:"elly",t:"もう。心配してるの、わたしだけみたいじゃない。",v:"01_0135"}];
GR_SC.g01_06=[{w:null,t:"ヤマト、ポケットをさぐる。"},{w:"hero",t:"これ、さっきあいつが落としたやつ。",v:"01_0142"},{w:"elly",t:"それで、どうするの？",v:"01_0143"},{w:"hero",t:"今度は、手をのばさない。こっちから行くから、かまれたんだと思う。",v:"01_0144"},{w:null,t:"ヤマト、オリーブを手のひらに乗せて、ひざの上に置く。"},{w:null,t:"フォルン、木から下りてくる。"},{w:"elly",t:"（小声で）ほら、やっぱり食べない。",v:"01_0147"},{w:"hero",t:"（小声で）しっ。",v:"01_0148"},{w:null,t:"フォルン、オリーブをくわえて、自分のしっぽの火の上に落とす。"},{w:null,t:"くわえ直して、ヤマトの手のひらの上で、かりっと食べる。"},{w:"hero",t:"食った。おれの手の上で、食った！",v:"01_0151"},{w:"elly",f:"surprised",t:"うそでしょ……。焦がしたのが好きだったの？　わたし、三年間、クッキーだったんだけど！",v:"01_0152"},{w:"hero",t:"クッキーは焦がせねーもんな。",v:"01_0153"},{w:"elly",t:"焦がせるよ！　オーブンで！",v:"01_0154"},{w:null,t:"エリー、カバンの中のクッキーの箱を見る。"}];
GR_SC.g01_07=[{w:null,t:"ブーンと、羽の音。"},{w:"marco",t:"はあ、はあ……坂、長すぎっす……。",v:"01_0159"},{w:"nina",t:"いた。……なんで子どもが、狐にエサやってんのよ。",v:"01_0160"},{w:null,t:"フォルン、身がまえる。"},{w:"nina",t:"おい、おチビちゃん。その狐、よこしな！",v:"01_0162"},{w:"hero",t:"嫌だ！　おまえら、誰だ？",v:"01_0163"},{w:"nina",t:"あたしらは、泣く子も黙るマフィア・ヴィクターよ。痛い目見る前に、さっさとよこしな。",v:"01_0164"},{w:"hero",t:"マフィン？　なんだそれ！",v:"01_0165"},{w:"elly",t:"マフィアよ！　こいつら、テリオンをさらっていってる悪いやつらなの！　村の子も、何びきも連れていかれたんだから！",v:"01_0166"},{w:"marco",t:"人聞き悪いっすね。持ち主のいない子を、拾ってるだけっすよ。",v:"01_0167"},{w:"nina",t:"マルコ、しゃべってないで、囲みな！",v:"01_0168"},{w:null,t:"三機のドローンが、フォルンを三方から囲む。"},{w:"elly",t:"ヤマト！",v:"01_0170"},{w:null,t:"ヤマトの肩ごしに、フォルンの目が、網と二人組を見る。"},{w:"marco",t:"あー！　六枚目っす！",v:"01_0172"},{w:null,t:"ヤマト、立ち上がる。"},{w:"hero",t:"マフィンかマフィアか知らねーけど、フォルンは、さっきおれが出会った友達だ！　ぜってー渡さねー！　おまえらこそ、あっち行け！",v:"01_0174"},{w:"nina",t:"友達ねえ。かまれたくせに。",v:"01_0175"},{w:"nina",t:"しょうがない。口で言っても分からないようだから、力ずくで頂くことにするか。",v:"01_0176"},{w:null,t:"オリーブの林の中から、がさがさと音。"},{w:"nina",t:"林に先回りさせといて正解だったね。やれ、クマッパ！",v:"01_0178"},{w:null,t:"フォルン、ヤマトの足もとから、すっと前に出る。"},{w:"elly",t:"フォルンが、ヤマトの前に出た……。",v:"01_0180"},{w:"hero",f:"smile",t:"いっしょにやってくれんのか？　よし、望むところだ！　いっけー、フォルン！",v:"01_0181"},{w:null,t:"神殿の柱のかげに、市場の子どもたちが三人、しゃがんで並ぶ。"}];
GR_SC.g01_09=[{w:null,t:"柱のかげから、市場の子どもたちが走ってくる。"},{w:"x",n:"子ども1",t:"ヴィクターに、勝っちゃった！",v:"01_0239"},{w:"x",n:"子ども3",t:"泥棒狐、すげー！",v:"01_0240"},{w:"x",n:"子ども2",t:"泥棒じゃないよ、もう。ヒーローだよ。",v:"01_0241"},{w:null,t:"ニーナ、ひっくり返ったクマッパを抱き上げる。"},{w:"nina",t:"よくやったよ。休みな。",v:"01_0243"},{w:null,t:"ニーナ、目を回したクマッパを、両腕でかかえ直す。"},{w:"nina",t:"覚えときな、おチビちゃん。ヴィクターに逆らって、ただで済んだやつはいないんだから。",v:"01_0245"},{w:"hero",t:"何回来たって、同じだ！　なあ、フォルン！",v:"01_0246"},{w:null,t:"フォルン、ヤマトの前を素通りして、マルコの前へ。"},{w:"marco",t:"あ。",v:"01_0248"},{w:"marco",t:"あちちちちっ！　ニーナさーん！",v:"01_0250"},{w:"nina",t:"バカ、走るな！　置いてくよ！",v:"01_0251"},{w:null,t:"二人組、石段を転げるように逃げていく。"},{w:null,t:"ヤマト、にやにやしながら、フォルンに手をのばす。"},{w:"hero",f:"smile",t:"やったな、フォルン！　ほら、ちょっとだけ——",v:"01_0254"},{w:null,t:"フォルン、喉の奥で、ぐるる。"},{w:"elly",t:"まだ、なでさせてはくれないみたいね。",v:"01_0256"},{w:"hero",t:"ちぇっ。いいよ、そのうちな。",v:"01_0257"},{w:null,t:"エリー、スーツケースを持ち上げる。"},{w:"elly",t:"さ、ホテル行こ。お姉ちゃん、ずっと待ってるから。",v:"01_0259"},{w:null,t:"二人、坂を下りはじめる。"}];
GR_SC.g01_10=[{w:null,t:"坂の下に止めた黒いワゴン車。"},{w:"marco",t:"ボスに、なんて言うっすか？　狐、とれませんでしたって言うんすか？",v:"01_0264"},{w:null,t:"ニーナ、手首の画面に、ドローンが撮った写真を出す。"},{w:"nina",t:"だれにもなつかない野良が、会ったばっかりの子どもをかばって、自分から前に出た。そんな話、聞いたことないよ。",v:"01_0266"},{w:"marco",t:"それ、まずいやつっすか。",v:"01_0267"},{w:"nina",t:"まずいどころか。ボスが一番ほしがる話だよ。手ぶらで帰っても、これなら怒られずにすむってわけ。",v:"01_0268"},{w:null,t:"ニーナ、送り先を選ぶ。"}];
GR_SC.g01_11=[{w:null,t:"その夜。坂の上の、小さなホテル。",v:"01_0273"},{w:null,t:"ホテルの一階のはしの、小さな部屋。"},{w:null,t:"ヤマト、戸を開ける。"},{w:"elly",t:"その図鑑、お姉ちゃんが置いといてくれたの。「日本の子なら、きっと読むから」って。",v:"01_0276"},{w:"hero",t:"お姉ちゃんって、さっき受付にいた人？",v:"01_0277"},{w:"elly",t:"そう、アナ。このホテル、お姉ちゃんが一人でやってるの。きみの焦げた前髪見て、笑いこらえてたでしょ。",v:"01_0278"},{w:null,t:"ヤマト、図鑑をひらく。"},{w:"hero",t:"日本だけ、白いんだな。",v:"01_0280"},{w:"elly",t:"日本って、テリオン、いないんでしょ？",v:"01_0281"},{w:"hero",t:"いない。画面でしか見たことなかった。さわったのも、かまれたのも、今日が初めて。",v:"01_0282"},{w:"elly",t:"見て。あの子、ここまでついてきてる。",v:"01_0284"},{w:"hero",t:"友達だからな。",v:"01_0285"},{w:"elly",t:"なでさせてもらえないのに？",v:"01_0286"},{w:"hero",f:"angry",t:"うっせ。",v:"01_0287"},{w:null,t:"エリー、笑って戸を閉める。"},{w:null,t:"スーツケースの中身を、ベッドにあける。"},{w:null,t:"ヤマト、戸を開けて、ろうかのエリーを呼びとめる。"},{w:"hero",t:"エリー。これ、おれのじゃない。スーツケースに入ってた。",v:"01_0291"},{w:"elly",t:"入れた覚え、ないの？",v:"01_0292"},{w:"hero",t:"ない。見たこともない。じいちゃんかな。",v:"01_0293"},{w:null,t:"時計のガラスの奥で、小さな歯車が、かちり、と鳴る。"},{w:null,t:"柵の上のフォルンの耳が、ヤマトではなく、時計の方へ、ぴんと向く。"}];
GR_EP[1]={"t": "テリオン・ワールド", "sc": [["g01_01", "語り", 0], ["g01_02", "オリーヴァ村・市場の坂（昼）", 0], ["g01_03", "坂道の追いかけっこ", 0], ["g01_04", "神殿のあとの丘", 0], ["g01_05", "同じ場所・女の子", 0], ["g01_06", "同じ場所・手のひらのオリーブ", 0], ["g01_07", "丘・ヴィクター", 0], ["g01_08", "勝負", 1], ["g01_09", "勝負のあと", 0], ["g01_10", "黒いワゴン車の中（夕方）", 0], ["g01_11", "坂の上のホテル・一階のはしの部屋（夜）", 0]]};
GR_SC.g02_01=[{w:null,t:"オリーヴァ村。坂の上のホテルの朝。",v:"02_0025"},{w:null,t:"裏のぶどう畑。"},{w:null,t:"畑のはしのベンチに、毛布にくるまったヤマト。"},{w:null,t:"ベンチの前の柵の上で、フォルンが丸くなっている。"},{w:null,t:"エリーが、パンとオリーブの皿を持ってのぞきこむ。"},{w:"elly",t:"ヤマト？　まさか、ひと晩じゅうここにいたの？",v:"02_0030"},{w:"hero",t:"寝てない！　見張ってたんだよ。ヴィクター、また来るかもしれないだろ。",v:"02_0031"},{w:"elly",t:"よだれ、ついてるけど。",v:"02_0032"},{w:"hero",f:"serious",t:"……これは、夜つゆ。",v:"02_0033"},{w:null,t:"フォルン、あくびをして起き上がる。"},{w:"hero",t:"なあ、今の見た？　投げて、しっぽで焼いて、食う。かっけえ……。",v:"02_0035"},{w:"elly",t:"毎朝やってるよ、あれ。",v:"02_0036"},{w:null,t:"ヤマト、エリーの皿からオリーブを一つつまむ。"},{w:"hero",t:"おれもできる。見てて。",v:"02_0038"},{w:"elly",t:"しっぽ、ないでしょ。",v:"02_0039"},{w:"hero",t:"口でキャッチするんだよ。",v:"02_0040"},{w:null,t:"ヤマト、オリーブを高く投げる。"},{w:null,t:"オリーブ、ヤマトのおでこに当たって、ぽんとはねる。"},{w:"elly",t:"……おいしそうに食べてるね、きみのオリーブ。",v:"02_0043"},{w:"hero",f:"serious",t:"……今のは、フォルンにあげたの。",v:"02_0044"},{w:null,t:"エリー、皿で口をかくして、肩をふるわせている。"},{w:null,t:"二階の窓が、ばんと開く。"},{w:"ana",t:"エリー！　お客さんの朝ごはん！　日本の子の分も！　早く！",v:"02_0047"},{w:"elly",t:"はーい、お姉ちゃん！",v:"02_0048"},{w:null,t:"第2話　オリーブの丘",v:"02_0050"}];
GR_SC.g02_02=[{w:null,t:"白い壁の小さな食堂。"},{w:null,t:"台所でフライパンをふるのも、運ぶのも、つぐのも、アナ一人。"},{w:"hero",t:"（パンをほおばりながら）なあ、このホテル、ロボットいないの？　日本のホテル、みんなロボットだったけど。",v:"02_0058"},{w:"elly",t:"うちは、いない。お姉ちゃんが、ぜんぶやるの。",v:"02_0059"},{w:"ana",t:"（台所から）ロボット入れたら、借りたお金、返せなくなるの！　聞こえてるからね！",v:"02_0060"},{w:null,t:"アナ、皿を三枚いっぺんに持って出てくる。"},{w:"ana",t:"ゆうべの前髪の子ね。明るいとこで見ると、もっとひどいわ。",v:"02_0062"},{w:"hero",t:"狐に焦がされた。",v:"02_0063"},{w:"ana",t:"知ってる。村じゅうの話よ。ヴィクターとやり合って、勝ったんだって？",v:"02_0064"},{w:"hero",f:"smile",t:"勝ったよ！　フォルンがさ、根もとでぶわーって火を——",v:"02_0065"},{w:"ana",t:"はいはい、あとで聞く。冷めないうちに食べな。",v:"02_0066"},{w:null,t:"アナ、もう次の客の方へ行っている。"},{w:"hero",f:"serious",t:"……聞く気ねーじゃん。",v:"02_0068"},{w:"elly",t:"お姉ちゃん、朝はいつもああなの。",v:"02_0069"},{w:null,t:"エリーの長い髪のかげから、うす茶色の、まんまるの毛玉が、そっと顔を出す。"},{w:"hero",f:"surprised",t:"うわっ！　なにそれ、いつからいたの！？",v:"02_0071"},{w:"elly",t:"ずっといたよ。ピリポン。うちの子。きのうは、お姉ちゃんと留守番してたの。",v:"02_0072"},{w:null,t:"エリー、パンを小さくちぎって、肩のピリポンにわたす。"},{w:"hero",f:"surprised",t:"ちっちぇえ！　よろしくな、ピリ——",v:"02_0074"},{w:null,t:"ヤマトが顔を近づける。"},{w:"elly",t:"こわがりなの。知らない人の前だと、すぐかくれちゃう。",v:"02_0076"},{w:"hero",t:"なあ、さわってもいい？　ふわふわか確かめたい。",v:"02_0077"},{w:"elly",t:"だめ。とくに寝てる時は、ぜったいだめ。びりってするから。",v:"02_0078"},{w:"hero",t:"さわらねーよ。",v:"02_0079"}];
GR_SC.g02_03=[{w:null,t:"古いソファと、壁の大きな画面。"},{w:null,t:"ソファで、客のおじいさんが新聞を読んでいる。"},{w:null,t:"エリーはカウンターでアナに何か頼まれている。"},{w:null,t:"ヤマト、カウンターのエリーを見る。"},{w:null,t:"新聞の鳥の子が、めくるのを止めて、ヤマトを見る。"},{w:"hero",t:"（小声で）ちょっとだけ。ふわふわか、確かめるだけだから。",v:"02_0087"},{w:null,t:"指先が、毛にふれる。"},{w:null,t:"ピリポンの毛が、ぜんぶ逆立つ。"},{w:null,t:"ヤマトの前髪が、まっすぐ上に立つ。"},{w:null,t:"ピリポン、ソファの背もたれのうしろにかくれる。"},{w:null,t:"エリーがもどってくる。"},{w:"elly",f:"serious",t:"……さわった？",v:"02_0093"},{w:"hero",t:"さわってない。",v:"02_0094"},{w:null,t:"ヤマトの前髪から、まだ、ぱちっと小さな火花。"},{w:"elly",t:"さわったでしょ。両方焦げてるもん。",v:"02_0096"},{w:"hero",f:"serious",t:"……ちょっとだけ。",v:"02_0097"},{w:"elly",t:"さっき「さわらねーよ」って言ったの、だれ？",v:"02_0098"},{w:null,t:"エリー、手をのばす。"},{w:"elly",f:"sad",t:"（ピリポンに）ごめんね。この人、勝手にさわるの。",v:"02_0100"},{w:null,t:"画面のお知らせが切りかわる。"},{w:"hero",t:"あ、あの車！　きのうのやつだ。",v:"02_0102"},{w:null,t:"アナが、カウンターから出てくる。"},{w:"ana",t:"ヴィクターよ。パン屋の猫の子も、八百屋さんの鳥の子も、あいつら。",v:"02_0104"},{w:"hero",t:"警察は？　なんで捕まえねーの？",v:"02_0105"},{w:"ana",t:"持ち主のいる子なら、警察も探してくれる。でも、持ち主のいない子は「いなくなっただけ」で終わり。八百屋さんの鳥の子だって、登録してなかったから。",v:"02_0106"},{w:"hero",t:"じゃあ、フォルンは……。",v:"02_0107"},{w:"ana",t:"野良でしょ、あの狐。さらわれても、だれも探してくれないわね。",v:"02_0108"},{w:"hero",t:"だったら、おれが持ち主になる！　登録って、どこでやんの？",v:"02_0109"},{w:"ana",t:"持ち主の登録は、十五から。あんた、いくつ。",v:"02_0110"},{w:"hero",f:"serious",t:"……十一。",v:"02_0111"},{w:"ana",t:"残念でした。",v:"02_0112"},{w:null,t:"アナ、ヤマトの肩をぽんとたたいて、台所へもどる。"},{w:null,t:"画面が、また切りかわる。"},{w:null,t:"画面「白い都テリオン大会　参加者募集　年れい不問」。"},{w:null,t:"ヤマト、ソファから、がばっと立ち上がる。"},{w:"hero",t:"エリー、これ！　年れいにかかわらずって書いてある！",v:"02_0117"},{w:"elly",f:"serious",t:"……ほんとだ。",v:"02_0118"},{w:"hero",f:"surprised",t:"優勝したら、十一でも登録できるってことだろ！？　白い都って、どこ？",v:"02_0119"},{w:"elly",t:"アテネのこと。ここから、ずっと東だよ。車で行っても、一日じゃ着かないくらい。",v:"02_0120"},{w:"hero",t:"遠っ……。",v:"02_0121"},{w:null,t:"ヤマト、画面の「年れいにかかわらず」の字から、目をはなさない。"},{w:"elly",t:"とにかく、先におばあちゃんち、行かなきゃ。きのうから、あんたを連れてこいって言われてるの。",v:"02_0123"},{w:"hero",t:"なんで、おれ？",v:"02_0124"},{w:"elly",t:"知らない。行けば分かるよ。",v:"02_0125"},{w:null,t:"エリー、ヤマトの腕を引く。"},{w:null,t:"アナが、画面の横の紙のちらしを一枚ぬいて、ヤマトの手にねじこむ。"},{w:"ana",t:"持ってきな。お客さんの分、いっぱいあるから。……本気にするんじゃないよ。",v:"02_0128"},{w:"hero",t:"する！",v:"02_0129"},{w:"ana",t:"……でしょうね。",v:"02_0130"}];
GR_SC.g02_04=[{w:null,t:"昼。村の畑は、今も人の手で実をとる。",v:"02_0136"},{w:null,t:"白い家のあいだを、オリーブの林が段々にのぼっていく。"},{w:null,t:"ヤマト、ちらしをにぎったまま歩いている。"},{w:"hero",t:"なあ、あれ、全部、手でとってんの？　2100年だぜ？",v:"02_0139"},{w:"elly",t:"うん。機械でとると、実に傷がつくんだって。手でとったオリーブは、すっごく高く売れるの。遠くのお金持ちの国の人しか買えないくらい。",v:"02_0140"},{w:"hero",t:"へえ……。じゃあ、フォルンが盗んでたの、高いやつじゃん。",v:"02_0141"},{w:"elly",t:"そう。だから村の人、みんな怒ってたの。",v:"02_0142"},{w:null,t:"畑の上の道を、白い車が音もなく走っていく。"},{w:"hero",t:"あ、ロボタクシー！　あれ乗ってけば、白い都まですぐじゃん！",v:"02_0144"},{w:"elly",t:"乗らないよ。あれ、乗った人がいつどこに行ったか、ぜんぶ記録されるの。",v:"02_0145"},{w:"hero",t:"それが、なに？",v:"02_0146"},{w:"elly",t:"その記録、お金で買ってる人たちがいるんだって。お姉ちゃんが言ってた。",v:"02_0147"},{w:"hero",f:"serious",t:"……ヴィクター？",v:"02_0148"},{w:null,t:"エリー、うなずく。"},{w:null,t:"二人のうしろを、フォルンが段々の石垣の上を伝ってついてくる。"},{w:null,t:"畑のおばさんが、フォルンに気づいて手を止める。"},{w:"x",n:"畑のおばさん",t:"あっ、泥棒狐——",v:"02_0152"},{w:null,t:"おばさん、言いかけて、エリーの方を見る。"},{w:"elly",t:"おばさん、この子、きのうヴィクターを追っぱらったんだよ。",v:"02_0154"},{w:"x",n:"畑のおばさん",t:"聞いたよ。……しょうがないね。一個だけだよ。",v:"02_0155"},{w:null,t:"おばさん、エプロンのポケットからオリーブを一つ出して、石垣の上に置く。"},{w:"x",n:"畑のおばさん",t:"焼いて食べるのかい。ぜいたくな泥棒だこと。",v:"02_0157"},{w:null,t:"おばさん、口のはしを上げて、また実をしごきはじめる。"}];
GR_SC.g02_05=[{w:null,t:"村のいちばん上の丘。",v:"02_0161"},{w:null,t:"オリーブ畑のまん中に、石でかこんだ小さなため池。"},{w:null,t:"フォルン、池のふちへ。"},{w:"hero",t:"はは、びびってやんの。……あれ？",v:"02_0164"},{w:null,t:"ヤマト、池と、フォルンのしっぽを見くらべる。"},{w:"hero",t:"今、水のそばで、火がちっちゃくなったよな。",v:"02_0166"},{w:"elly",t:"炎の子は、水がきらいなんだよ。図鑑にのってなかった？",v:"02_0167"},{w:"hero",t:"まだ半分しか読んでねーもん。",v:"02_0168"},{w:"elly",t:"この池の水で、丘の畑、ぜんぶやってるの。雨、ちょっとしかふらないから。",v:"02_0169"},{w:null,t:"池の向こう、丘の頂上に、白い大きな建物のあと。"},{w:"hero",t:"あれ、なに？　でっけー。",v:"02_0171"},{w:"elly",t:"昔の研究所。おばあちゃん、若いころ、あそこで働いてたんだって。",v:"02_0172"},{w:"hero",t:"なんの研究？",v:"02_0173"},{w:"elly",t:"聞いても、「むかしむかしの話」しか言わないの。入っちゃだめって、それだけ。",v:"02_0174"},{w:null,t:"くずれた丸屋根のすきまから、空が見える。"},{w:null,t:"フォルンの耳が、建物の方へ、ぴくっと動く。"}];
GR_SC.g02_06=[{w:null,t:"丘の向こうの、石の家。",v:"02_0179"},{w:null,t:"小さな石の家。"},{w:"elly",t:"おばあちゃーん！　つれてきたよ！",v:"02_0181"},{w:"oba",t:"はいはい。……あんたが、ヤマトだね。",v:"02_0182"},{w:"hero",t:"こんにちは！　ヤマトです！",v:"02_0183"},{w:null,t:"おばあさん、ヤマトの顔をじっと見る。"},{w:"oba",t:"……両方、焦げてるね。",v:"02_0185"},{w:"hero",t:"こっちは狐で、こっちはピリポン。",v:"02_0186"},{w:"oba",t:"あら。あの子、寝てる時にさわると、怒るんだよ。",v:"02_0187"},{w:"elly",t:"ほらね！",v:"02_0188"},{w:"hero",f:"serious",t:"……先に言ってくれよ。",v:"02_0189"},{w:null,t:"おばあさん、くっくっと笑って、家の中へ入っていく。"},{w:null,t:"棚のすみに、色あせた絵本。"},{w:null,t:"ヤマトの目は、すぐ、となりの写真立てに行く。"},{w:"hero",t:"これ、さっきの研究所？　この女の人、おばあちゃん？",v:"02_0194"},{w:"oba",t:"さあ、どうだったかね。むかしむかしの話だよ。",v:"02_0195"},{w:null,t:"おばあさんが、お茶を三つ持ってくる。"},{w:"oba",t:"ゆうべ、アナから電話があったよ。ヴィクターを追い返したんだって？",v:"02_0197"},{w:"hero",t:"うん！　でも、ニーナってやつが「覚えときな」って。",v:"02_0198"},{w:"oba",t:"あの連中は、ねらった子はあきらめないよ。今度は、もっと大勢で来るね。",v:"02_0199"},{w:null,t:"ヤマト、くしゃくしゃのちらしをテーブルに置く。"},{w:"hero",t:"だから、これ。優勝したら、フォルンの持ち主になれる。持ち主になったら、さらわれても、みんな探してくれるんだろ。",v:"02_0201"},{w:null,t:"おばあさん、ちらしの「年れいにかかわらず」の字を見る。"},{w:"oba",t:"……エリー。一緒に行っておいで。",v:"02_0203"},{w:"elly",t:"うん。いいよ。",v:"02_0204"},{w:null,t:"エリー、クッキーをかじりながら返事をする。"},{w:"hero",f:"surprised",t:"え、いいの！？　白い都、遠いんだろ？",v:"02_0206"},{w:"elly",t:"遠いよ。でも、行ってみたかったんだ。わたし、村の外、ほとんど出たことないから。",v:"02_0207"},{w:"oba",t:"あしたの昼は、ホテルにいない方がいいね。",v:"02_0208"},{w:"elly",t:"お昼なら、ちょうど競技場の案内の仕事あるよ。",v:"02_0209"},{w:"oba",t:"じゃあ、それ。",v:"02_0210"},{w:"elly",t:"今夜、出る？",v:"02_0211"},{w:"oba",t:"（空を、あごでさす）ほら。ヴィクターのドローンだよ。ゆうべから、ずっと村の上を回ってる。今夜はだめ。……あしたの夜。森の道なら、上から見えない。",v:"02_0213"},{w:null,t:"おばあさん、棚の引き出しを開ける。"},{w:"oba",t:"これ、持っておいき。なくすんじゃないよ。",v:"02_0215"},{w:"elly",t:"なにこれ？　中身は？",v:"02_0216"},{w:"oba",t:"見ても、わかんないよ。古いもんだから。",v:"02_0217"},{w:null,t:"エリー、札を服の中にしまう。"},{w:"oba",t:"それとね、ついでに、あのヴィクターって連中、ちょっと、こらしめておいで。",v:"02_0219"},{w:"hero",f:"surprised",t:"ついで！？",v:"02_0220"},{w:"elly",t:"いいよー。",v:"02_0221"},{w:"hero",f:"surprised",t:"いいの！？　相手、マフィアだぞ！？",v:"02_0222"},{w:"elly",t:"だって、パン屋さんの猫の子、まだ帰ってきてないもん。",v:"02_0223"},{w:null,t:"ヤマト、身を乗り出す。"},{w:null,t:"おばあさんの手が、お茶のカップを持ったまま、止まる。"},{w:null,t:"古いガラス。"},{w:"hero",f:"sad",t:"あ、ごめんなさい。これ、なんか、スーツケースに入ってて。じいちゃんのかな。",v:"02_0227"},{w:null,t:"おばあさん、カップを置く。"},{w:"oba",t:"……古い時計だね。大事にしな。",v:"02_0229"},{w:null,t:"おばあさん、フォルンを見る。"}];
GR_SC.g02_07=[{w:null,t:"その夜。",v:"02_0234"},{w:null,t:"ヤマト、リュックにものをつめている。"},{w:null,t:"図鑑の終わりのページの、ギリシャの地図。"},{w:null,t:"戸口に、パジャマのエリー。"},{w:"elly",t:"その線、海の上、通ってるよ。",v:"02_0238"},{w:"hero",t:"泳ぐ。",v:"02_0239"},{w:"elly",t:"フォルン、水きらいなのに？",v:"02_0240"},{w:"hero",f:"serious",t:"……じゃあ、回る。",v:"02_0241"},{w:"elly",t:"出るのは、あしたの夜だからね。お姉ちゃんには、ないしょ。言ったら、ぜったい止めるから。",v:"02_0242"},{w:"hero",t:"分かった。",v:"02_0243"},{w:null,t:"エリー、自分の部屋へもどりかけて、止まる。"},{w:"elly",t:"それと、ヤマト。ピリポンに、もう勝手にさわらないでね。",v:"02_0245"},{w:"hero",t:"さわらねーよ。",v:"02_0246"},{w:null,t:"エリーの肩のピリポンが、ヤマトを見て、ぱちっ。"},{w:null,t:"ヤマト、ちりちりの前髪を手で押さえる。"}];
GR_SC.g02_08=[{w:null,t:"同じころ、遠くの丘。",v:"02_0251"},{w:null,t:"男の手首の画面が鳴る。"},{w:"x",n:"ヴィクターの男（画面）",t:"十二番。仕事だ。オリーヴァ村。狐を一匹。ニーナとマルコがしくじった。",v:"02_0254"},{w:null,t:"画面のすみに、少年の前に立って、しっぽを立てる狐の写真。"},{w:"x",n:"ヴィクターの男（画面）",t:"子どもがついている。じゃまなら、子どもごとでいい。",v:"02_0256"},{w:null,t:"男、望遠鏡から目を離さないまま、写真を開かずに、画面を指で消す。"},{w:null,t:"それから、ゆっくり望遠鏡を下ろす。"}];
GR_EP[2]={"t": "オリーブの丘", "sc": [["g02_01", "ホテルの裏・ぶどう畑のはし（朝）", 0], ["g02_02", "ホテルの食堂（朝）", 0], ["g02_03", "ロビー（朝）", 0], ["g02_04", "村の道（昼）", 0], ["g02_05", "丘の上・ため池と研究所あと（昼）", 0], ["g02_06", "おばあさんの家（昼）", 0], ["g02_07", "ホテルのヤマトの部屋（夜）", 0], ["g02_08", "どこかの丘（夜）", 0]]};
GR_SC.g03_01=[{w:null,t:"まっ暗な石の通路。"},{w:null,t:"つきあたりの壁のあたりから、大きな生き物の寝息のような、低い音。"},{w:null,t:"天井から、砂がひとすじ、寝息に合わせて、さらさらと落ちる。"},{w:null,t:"第3話　古代の競技場",v:"03_0019"}];
GR_SC.g03_02=[{w:null,t:"次の日の朝。",v:"03_0025"},{w:null,t:"白い小さなホテルの玄関。"},{w:null,t:"エリー、小さな白い肩かけカバン。"},{w:"hero",t:"なあ、なんで昼、ホテルにいちゃだめなんだ？",v:"03_0028"},{w:"elly",t:"おばあちゃんが言ってたでしょ。ヴィクターが来るかもって。",v:"03_0029"},{w:"hero",t:"来たら、おれとフォルンでやっつける。",v:"03_0030"},{w:"elly",t:"このあいだ、ぎりぎりだったのに？",v:"03_0031"},{w:"hero",f:"serious",t:"……あれは、作戦だ。",v:"03_0032"},{w:null,t:"玄関から、アナがほうきを持って出てくる。"},{w:"ana",t:"エリー、仕事なんだから、ちゃんと案内しなさいよ。お客さん、迷子にしないでね。",v:"03_0034"},{w:"elly",t:"はーい。",v:"03_0035"},{w:"ana",t:"ヤマトくんは……前髪、まだ焦げてるね。",v:"03_0036"},{w:null,t:"ヤマト、前髪を両手で押さえる。"},{w:null,t:"玄関から、ドイツ人の夫婦が出てくる。"},{w:"elly",t:"（夫婦に、ドイツ語で何か言う。夫婦が笑う）",v:"03_0039"},{w:"hero",f:"serious",t:"……今の、何語？",v:"03_0040"},{w:"elly",t:"ドイツ語。",v:"03_0041"},{w:"hero",t:"何語しゃべれんの？",v:"03_0042"},{w:"elly",f:"surprised",t:"えっとね……いっぱい。",v:"03_0043"},{w:"hero",t:"いっぱいって、何こ？",v:"03_0044"},{w:"elly",t:"数えたことない。",v:"03_0045"},{w:null,t:"塀の上で、フォルンがあくびをする。"}];
GR_SC.g03_03=[{w:null,t:"村の外れ。三千年前の競技場。",v:"03_0049"},{w:null,t:"オリーブの林を抜けると、石を積んだ古い入口のアーチ。"},{w:null,t:"観光客がたくさん。"},{w:"hero",f:"serious",t:"……え、ここ？　ただの広場じゃん。",v:"03_0052"},{w:"x",n:"案内のロボット",t:"ここは、世界で最初のオリンピックが開かれた場所です。",v:"03_0053"},{w:"hero",f:"serious",t:"……マジか。",v:"03_0054"},{w:"elly",t:"ほらね。",v:"03_0055"},{w:null,t:"アーチの下は、すりへった石だたみ。"},{w:null,t:"エリー、夫婦の前に立つ。"},{w:"elly",t:"（夫婦に）この走る所の長さはね、昔の、すっごい力持ちの人の、足の大きさ六百こ分なんだって。",v:"03_0058"},{w:null,t:"夫婦、うなずいて、向こうのはしまでを見わたす。"},{w:"hero",t:"足六百こ？　じゃあ、おれが数えてやる。",v:"03_0060"},{w:null,t:"ヤマト、スタートの線につま先を合わせる。"},{w:"hero",t:"いち。に。さん……。",v:"03_0062"},{w:null,t:"……足が、だんだん速くなる。"},{w:"hero",f:"serious",t:"……ひゃくはち。ひゃくきゅう……。",v:"03_0064"},{w:"hero",f:"serious",t:"……そいつ、足、何センチあんの？",v:"03_0066"},{w:"elly",t:"ヤマトの足が小さいんだよ。",v:"03_0067"},{w:"hero",t:"小さくねーよ！　おれ、クラスで二番目にでかいんだぞ！",v:"03_0068"},{w:"elly",t:"なんのクラス？",v:"03_0069"},{w:"hero",f:"serious",t:"……足の。",v:"03_0070"},{w:null,t:"ドイツ人の夫婦が、くすくす笑う。"}];
GR_SC.g03_04=[{w:null,t:"ヤマト、走ってもどってくる。"},{w:"hero",t:"エリー、勝負しよ。向こうの端まで。",v:"03_0075"},{w:"elly",t:"えー。わたし、仕事中なんだけど。",v:"03_0076"},{w:"hero",t:"負けるのが、こわいんだ。",v:"03_0077"},{w:"elly",f:"serious",t:"……いいよ。",v:"03_0078"},{w:null,t:"エリー、スタートの線に並ぶ。"},{w:"elly",t:"よーい……。",v:"03_0080"},{w:null,t:"ヤマト、前のめりになる。"},{w:null,t:"ヤマト、とび出す。"},{w:"elly",t:"まだ「ドン」って言ってないよ。",v:"03_0083"},{w:null,t:"ヤマト、三歩目でふり返る。"},{w:"hero",t:"え、まだ——",v:"03_0085"},{w:null,t:"ふり返ったまま足がもつれて、顔から土につっこむ。"},{w:"elly",t:"ドン。",v:"03_0087"},{w:null,t:"エリーが、のんびり走りだす。"},{w:"hero",t:"ずりーぞ！",v:"03_0089"},{w:null,t:"ヤマト、とび起きて追いかける。"},{w:null,t:"観光客から、ぱらぱらと拍手。"},{w:"hero",t:"（息を切らして）……おれ、二番。",v:"03_0092"},{w:"elly",t:"三番だよ。",v:"03_0093"},{w:null,t:"ヤマト、胸に手を当てる。"},{w:"hero",f:"serious",t:"……あれ。時計。",v:"03_0095"}];
GR_SC.g03_05=[{w:null,t:"林の方から、ぴいっと高い声。"},{w:null,t:"オレンジ色の、ふかふかの羽のタカの子。"},{w:null,t:"タカの子、左のすみの角の石に、すっと下りる。"},{w:null,t:"角の石の上で羽を広げかける。"},{w:"hero",t:"あっ！　おれの時計！",v:"03_0103"},{w:null,t:"時計の革ひもが、タカの子の足の下で、ぶらぶらゆれる。"},{w:null,t:"案内のロボットが、広場のまん中へ走ってくる。"},{w:"x",n:"案内のロボット",t:"野生のテリオンです。安全のため、お客さまは、土手の上へ。",v:"03_0106"},{w:null,t:"観光客が、土手へ上がっていく。"},{w:"x",n:"案内のロボット",t:"なお、お客さまの持ち物は、補償の対象外です。",v:"03_0108"},{w:"hero",t:"じいちゃんのなんだよ！",v:"03_0109"},{w:"x",n:"案内のロボット",t:"テリオンをお連れのお客さまは、広場へどうぞ。",v:"03_0110"},{w:null,t:"タカの子が、広場の上を、大きく回る。"},{w:"elly",t:"あの子、林に帰らないね。",v:"03_0112"},{w:"hero",t:"なんで？",v:"03_0113"},{w:"elly",t:"かたいものを手に入れたら、まず割ろうとするの。カラスがクルミを割るみたいに。",v:"03_0114"},{w:"hero",t:"割らせるか！",v:"03_0115"},{w:null,t:"フォルンが、向こうの端から、とことこもどってくる。"},{w:"hero",t:"フォルン、たのむ。じいちゃんの時計なんだ。",v:"03_0117"},{w:null,t:"フォルン、ヤマトを見ない。"},{w:"elly",t:"（髪のかげのピリポンに）ピリポンも、手伝ってあげて。",v:"03_0119"},{w:null,t:"ピリポン、髪のかげで首をぶんぶんふる。"},{w:"elly",t:"……きのう、ヤマトにさわられたの、まだ怒ってる？",v:"03_0121"}];
GR_SC.g03_07=[{w:null,t:"ヤマト、走ってきて、時計を両手ですくい上げる。"},{w:"hero",t:"……動いてない。……あ、もとから動いてないんだった。",v:"03_0163"},{w:"elly",t:"割れてない？",v:"03_0164"},{w:"hero",t:"ちょっと傷。……でも、だいじょうぶ。",v:"03_0165"},{w:null,t:"タカの子、しびれが取れて、ばさばさ羽をふる。"},{w:null,t:"ピリポン、とことこ走って、エリーの腕をよじのぼる。"},{w:"elly",t:"えらかったね、ピリポン。",v:"03_0168"},{w:"hero",t:"ピリポン、ありがとな。",v:"03_0169"},{w:null,t:"ヤマト、ピリポンをなでようと手をのばす。"},{w:null,t:"ヤマトの前髪が、また、ちりちりになる。"},{w:"elly",t:"さわらないでって、ゆうべ言ったでしょ。",v:"03_0173"},{w:"hero",f:"serious",t:"……お礼なのに。",v:"03_0174"},{w:"x",n:"案内のロボット",t:"安全が確認されました。引き続き、観光をお楽しみください。",v:"03_0175"},{w:null,t:"観光客から拍手。"},{w:null,t:"ドイツ人のだんなさんが、カメラを持って、ヤマトの方へまっすぐ歩いてくる。"},{w:null,t:"ヤマト、土だらけの顔をそででふく。"},{w:null,t:"だんなさん、ヤマトの手にカメラをのせる。"},{w:"hero",f:"serious",t:"……え。",v:"03_0180"},{w:"elly",t:"フォルンと、三人で撮りたいんだって。",v:"03_0181"},{w:"hero",t:"おれは？",v:"03_0182"},{w:"elly",t:"撮る人。",v:"03_0183"},{w:null,t:"ヤマト、カメラをかまえる。"}];
GR_SC.g03_08=[{w:null,t:"正午。",v:"03_0187"},{w:null,t:"枯れかけた草の土手。"},{w:null,t:"エリー、アイスを食べている。"},{w:null,t:"エリーの手首の画面が、ぴこん。"},{w:"elly",f:"serious",t:"……来たって。ヴィクター。",v:"03_0191"},{w:"hero",t:"ほんとに来たんだ。……アナさん、だいじょうぶ？",v:"03_0192"},{w:"elly",t:"お姉ちゃんは、だいじょうぶ。ほうき、持ってたし。",v:"03_0193"},{w:"hero",t:"ほうきで勝てんの？",v:"03_0194"},{w:"elly",t:"勝てるよ。",v:"03_0195"},{w:null,t:"エリー、画面に「わかった」と打つ。"},{w:null,t:"ヤマト、時計を見る。"},{w:"hero",t:"これ、もどるかな。",v:"03_0198"},{w:null,t:"ヤマト、つまみを、指でかちっと押しこむ。"},{w:null,t:"時計から、うすい光が宙に広がって、地図の形になる。"},{w:null,t:"地図の上に、小さな光の印が、四つ。"},{w:"hero",f:"surprised",t:"うわ、うわ、なにこれ！　じいちゃんの時計、こんなことできたの！？",v:"03_0202"},{w:"elly",t:"ネット、つながってないのに……。",v:"03_0203"},{w:null,t:"印の一つは、今いる場所と重なっている。"},{w:null,t:"もう一つは、村のいちばん上の丘。"},{w:"elly",t:"あ、それ、おばあちゃんが前に働いてた所の近く。",v:"03_0206"},{w:null,t:"残りの二つは、地図のずっとはし。"},{w:"hero",t:"この真下って……下に何かあんの？",v:"03_0208"},{w:null,t:"ヤマト、土手のすそを見る。"},{w:"hero",f:"serious",t:"……ちょっと見るだけ。",v:"03_0210"},{w:"elly",t:"ちょっとって、どれくらい？",v:"03_0211"},{w:"hero",t:"入口から、見えるとこまで。",v:"03_0212"},{w:"elly",t:"中、まっ暗だよ。",v:"03_0213"},{w:"hero",t:"じゃあ、見えるとこまで、全部。",v:"03_0214"},{w:null,t:"フォルンが、先に札の下をくぐる。"}];
GR_SC.g03_09=[{w:null,t:"競技場の、真下。",v:"03_0218"},{w:null,t:"ひんやりした石の通路。"},{w:"elly",t:"ヤマト、もう、見えるとこ、過ぎてるよ。",v:"03_0220"},{w:"hero",t:"フォルンが明るいから、ずっと見えてる。",v:"03_0221"},{w:null,t:"つきあたりに、大きな石の扉。"},{w:null,t:"扉のふちに、細かい文字がびっしり。"},{w:"hero",f:"serious",t:"……でっか。",v:"03_0224"},{w:"elly",f:"serious",t:"……これ、古いギリシャの字。",v:"03_0225"},{w:null,t:"エリー、文字を指でなぞって、声に出して読む。"},{w:"elly",f:"surprised",t:"えっとね……ここで寝てる子、起こさないでね、だって。",v:"03_0227"},{w:null,t:"エリーの声が、通路にひびいて、消える。"},{w:null,t:"……足の下の、ずっと深い所から、低い音が一つだけ返ってくる。"},{w:null,t:"天井から、砂がひとすじ落ちる。"},{w:null,t:"ヤマトは角を見上げている。"},{w:"elly",f:"serious",t:"……ヤマト。今日は、帰ろ。",v:"03_0236"},{w:"hero",f:"serious",t:"……うん。",v:"03_0237"}];
GR_SC.g03_10=[{w:null,t:"来た通路をもどる。"},{w:"x",n:"若い男",t:"……立ち入り禁止って、書いてあっただろ。",v:"03_0241"},{w:"hero",t:"読めなかった。",v:"03_0242"},{w:"x",n:"若い男",t:"……英語でも書いてある。",v:"03_0243"},{w:"hero",t:"英語も読めない。",v:"03_0244"},{w:"x",n:"若い男",t:"……絵もある。",v:"03_0245"},{w:null,t:"男、あごで、入口の札の×の絵をさす。"},{w:"hero",f:"serious",t:"……絵は、見てない。",v:"03_0247"},{w:"elly",t:"わたし、ぜんぶ読めたよ。奥の扉のも。",v:"03_0248"},{w:null,t:"男、だまる。"},{w:null,t:"男の目が、ヤマトの足もとのフォルンに止まる。"},{w:"x",n:"若い男",t:"……その狐、置いていけ。",v:"03_0251"},{w:"hero",t:"やだね。お前、だれだよ。",v:"03_0252"},{w:null,t:"男、手首を返す。"},{w:"elly",f:"serious",t:"……ヴィクター。",v:"03_0254"},{w:"hero",t:"フォルンは、だれのでもねーよ。お前らのでも、おれのでもない。",v:"03_0255"},{w:"x",n:"若い男",t:"だから、もらう。",v:"03_0256"},{w:null,t:"男、手首の画面を指で一回たたく。"},{w:null,t:"フォルンのしっぽの火が、ぼっと大きくなる。"},{w:null,t:"出口の外から、人の声。"},{w:"x",n:"案内のロボット",t:"（出口から）そちらは、立ち入り禁止です。",v:"03_0260"},{w:null,t:"男、出口の人だかりを見る。"},{w:"x",n:"若い男",t:"……人が多いな。",v:"03_0262"},{w:null,t:"男、画面をもう一回たたく。"},{w:null,t:"男、二人とフォルンの横をすりぬけて、オリーブの林の方へ出ていく。"},{w:"elly",f:"serious",t:"……今の人、こわかった。",v:"03_0265"},{w:"hero",t:"……でも、あいつのワニ、あごが、ちょっと曲がってた。",v:"03_0266"},{w:"elly",t:"そこ見てたの？",v:"03_0267"},{w:"hero",t:"見てた。",v:"03_0268"},{w:null,t:"林の入口で、男が一度だけふり返る。"}];
GR_EP[3]={"t": "古代の競技場", "sc": [["g03_01", "地下（だれもいない）", 0], ["g03_02", "ホテルの前（朝）", 0], ["g03_03", "古代の競技場（昼前）", 0], ["g03_04", "スタートの線", 0], ["g03_05", "タカの子", 0], ["g03_06", "勝負（2Dアニメ）", 1], ["g03_07", "勝負のあと", 0], ["g03_08", "土手の上（正午）", 0], ["g03_09", "地下の扉", 0], ["g03_10", "通路の出口", 0]]};
GR_SC.g04_01=[{w:null,t:"同じ日の夕方。村の裏の森。",v:"04_0021"},{w:null,t:"小川の上の平たい岩に、背の高い若い男が一人、ひざを立てて座っている。"},{w:null,t:"小川の中を、頭に卵のからをかぶった緑のワニの子が、ぐるぐる回って泳いでいる。"},{w:null,t:"ワニの子が、岸の白っぽい乾いた石の上へ上がる。"},{w:null,t:"男、かばんから、やわらかく煮た魚の包みを出す。"},{w:null,t:"男、うすい財布を開けて、中を見る。"},{w:null,t:"手首の画面が鳴る。"},{w:"x",n:"画面の声（男）",t:"十二番。昼の競技場は、どうでしたか。",v:"04_0028"},{w:"x",n:"男",t:"人が多かった。……今夜、やる。",v:"04_0029"},{w:"x",n:"画面の声（男）",t:"ご苦労さまです。……それと、狐と一緒にいた子どもも、連れてきてください。",v:"04_0030"},{w:"x",n:"男",t:"……子ども？　狐一匹って、聞いた。",v:"04_0031"},{w:"x",n:"画面の声（男）",t:"部署がちがいますので。狐の、持ち主の反応が出た子どもです。",v:"04_0032"},{w:null,t:"通話が切れる。"},{w:null,t:"第4話　夜の森",v:"04_0037"}];
GR_SC.g04_02=[{w:null,t:"その夜。",v:"04_0043"},{w:null,t:"ホテルの裏口の戸が、そっと開く。"},{w:"hero",f:"serious",t:"……遠足？",v:"04_0045"},{w:"elly",t:"夜の森、虫いるもん。",v:"04_0046"},{w:null,t:"エリー、戸のすきまに、クッキーを一枚と紙きれをはさむ。"},{w:null,t:"柵の上から、フォルンが、とん、と下りてくる。"}];
GR_SC.g04_03=[{w:null,t:"ぶどう畑を抜けた先の、暗い森。"},{w:null,t:"かえるの声。"},{w:"elly",t:"この道、カメラないの。昔の石切り場に行く道だから。",v:"04_0053"},{w:null,t:"ランプのまわりに、羽虫がわっと集まる。"},{w:null,t:"エリー、スプレーをかまえて、ぷしゅー。"},{w:null,t:"フォルンは、森の奥をじっと見ている。"},{w:null,t:"小川の上の平たい岩。"},{w:null,t:"ヤマト、ランプを頭の上にかかげて、腰をひねったまま、止まる。"},{w:"x",n:"男",t:"……何してんだ。",v:"04_0059"},{w:"hero",f:"serious",t:"……虫、はらってた。",v:"04_0060"},{w:"x",n:"男",t:"踊ってたろ。",v:"04_0061"},{w:"hero",t:"はらいながら。",v:"04_0062"},{w:null,t:"ヤマト、ランプを下ろす。"},{w:"hero",f:"serious",t:"……いつから、いたの。",v:"04_0064"},{w:"x",n:"男",t:"夕方から。",v:"04_0065"},{w:"hero",t:"なんで、ここ通るってわかったの。",v:"04_0066"},{w:"x",n:"男",t:"狐連れて、タクシーには乗れない。昼の道はカメラだらけ。夜、ここしかない。",v:"04_0067"},{w:null,t:"男、望遠鏡から目をはなさない。"},{w:"hero",f:"serious",t:"……なに見てんの。",v:"04_0069"},{w:"x",n:"男",t:"星だ。",v:"04_0070"},{w:"hero",t:"どの星？",v:"04_0071"},{w:"x",n:"男",t:"……星だ。",v:"04_0072"},{w:null,t:"男、望遠鏡の筒をていねいにちぢめて、かばんにもどす。"},{w:"x",n:"男",t:"狐は、施設へ。新しい持ち主を探してくれるとこだ。",v:"04_0074"},{w:"hero",t:"やだ。",v:"04_0075"},{w:"x",n:"男",t:"……だろうな。網、燃やすんだろ。勝負だ。おれが勝ったら、狐はもらう。",v:"04_0076"},{w:"hero",f:"smile",t:"おれが勝ったら？",v:"04_0077"},{w:"x",n:"男",t:"帰る。……報告は、「いなかった」にする。",v:"04_0078"},{w:null,t:"男の目が、一瞬だけ、ヤマトの顔に止まる。"},{w:"hero",f:"serious",t:"……いいよ。",v:"04_0080"},{w:"elly",t:"ヤマト！",v:"04_0081"},{w:null,t:"エリー、しゃがんで、ワニの子の頭の卵のからを見る。"},{w:"elly",t:"（ワニの子に）こんばんは、タマゴちゃん。",v:"04_0083"},{w:"x",n:"男",t:"……ちがう。",v:"04_0084"}];
GR_SC.g04_04=[{w:null,t:"男が手首の画面を伏せる。"},{w:null,t:"右手を、小川が上から下までまっすぐ流れている。"},{w:null,t:"男、ワニの子を小川に放す。"},{w:"hero",f:"smile",t:"（エリーに）木の下だ。おととい、それで勝った。",v:"04_0090"},{w:"elly",f:"serious",t:"……うん。",v:"04_0091"},{w:null,t:"エリーは、小川を見ている。"},{w:null,t:"エリー、カバンからクッキーの箱を出す。"},{w:null,t:"エリー、箱を森のはしの切り株に置く。"},{w:null,t:"ピリポンが、エリーの指を小さな手でつかむ。"},{w:"x",n:"男",t:"……二体か。",v:"04_0096"},{w:null,t:"フォルン、大きな木の根もとへ歩いていく。"},{w:"x",n:"男",t:"始め。",v:"04_0098"}];
GR_SC.g04_06=[{w:null,t:"ピリポン、固まっている。"},{w:null,t:"男、倒れたワニの子のそばにひざをつく。"},{w:null,t:"耳のうしろのうろこのすき間から、小さな板が、ころっと落ちる。"},{w:null,t:"乾いた草の上で、ワニの子の背中のうろこが、白っぽくかわいていく。"},{w:null,t:"ヤマト、小川へ走る。"},{w:null,t:"男、それを見ている。"},{w:"x",n:"画面の声（男）",t:"十二番。回収した狐と、子どもは。",v:"04_0173"},{w:"x",n:"男",t:"……逃げられた。",v:"04_0175"},{w:"x",n:"画面の声（男）",t:"両方ですか。",v:"04_0176"},{w:"x",n:"男",t:"両方。",v:"04_0177"},{w:"x",n:"画面の声（男）",t:"……そうですか。",v:"04_0178"},{w:"elly",t:"その子、休ませなきゃ。……うち、すぐそこ。",v:"04_0187"}];
GR_SC.g04_07=[{w:null,t:"夜ふけ。坂の上のホテル。",v:"04_0191"},{w:null,t:"玄関の明かりだけが、ついている。"},{w:null,t:"門の内側に、アナが、ほうきを持って立っている。"},{w:"ana",t:"……どこ行ってたの。二人とも。",v:"04_0194"},{w:"elly",f:"serious",t:"……ちょっと。",v:"04_0195"},{w:"ana",t:"ちょっとで、泥だらけになるの。……で、あの人、だれ。",v:"04_0196"},{w:null,t:"門の外の、石の塀のそば。"},{w:"x",n:"男",t:"（ヤマトの胸の時計を見て）……その時計。競技場で、光ってたな。",v:"04_0198"},{w:null,t:"ヤマト、時計を手で押さえる。"},{w:null,t:"男の目が、ヤマトのリュックの横ポケットに行く。"},{w:"x",n:"男",t:"この辺の遺跡は、全部、案内してる。……白い都までの道も、わかる。案内、いるか。",v:"04_0201"},{w:"hero",f:"serious",t:"……お金、ないよ。",v:"04_0202"},{w:"x",n:"男",t:"……金は、観光客の案内で稼ぐ。",v:"04_0203"},{w:"hero",t:"じゃあ、おれらは、ただ？",v:"04_0204"},{w:"x",n:"男",t:"……ただとは言ってない。",v:"04_0205"},{w:"elly",t:"いくら？",v:"04_0206"},{w:null,t:"男、指を折りかける。"},{w:"elly",t:"クッキー、一枚なら出せるよ。",v:"04_0208"},{w:"x",n:"男",t:"……いらない。",v:"04_0209"},{w:"hero",t:"オリーブ、五つ。",v:"04_0210"},{w:null,t:"フォルンの耳が、ぴくっとヤマトの方へ向く。"},{w:"x",n:"男",t:"……それ、狐のだろ。",v:"04_0212"},{w:"hero",f:"serious",t:"……じゃあ、四つ。",v:"04_0213"},{w:null,t:"フォルン、ヤマトのリュックの前に、どすっと座りこむ。"},{w:null,t:"エリー、塀の下にしゃがむ。"},{w:"elly",t:"（ワニの子に）おやすみ、タマゴちゃん。",v:"04_0216"},{w:"x",n:"男",t:"……クロッコ。",v:"04_0217"},{w:"elly",t:"クロッコちゃん。",v:"04_0218"},{w:"x",n:"男",t:"……ちゃんは、いらない。",v:"04_0219"},{w:"hero",f:"serious",t:"……いる。案内。……おれ、ヤマト。",v:"04_0220"},{w:"alek",t:"……アレク。",v:"04_0221"},{w:"elly",t:"お姉ちゃん、この人、泊めて！",v:"04_0222"},{w:null,t:"アナ、ほうきを持ったまま、アレクを上から下まで見る。"},{w:"ana",t:"……一泊いくら。",v:"04_0224"},{w:null,t:"アレク、ポケットの中で、うすい財布をにぎる。"}];
GR_EP[4]={"t": "夜の森", "sc": [["g04_01", "森の小川（夕方）", 0], ["g04_02", "ホテルの裏口（夜）", 0], ["g04_03", "森の道（夜）", 0], ["g04_04", "向かい合う", 0], ["g04_05", "勝負", 1], ["g04_06", "勝負のあと", 0], ["g04_07", "ホテルの門（夜ふけ）", 0]]};
GR_SC.g05_01=[{w:null,t:"坂のとちゅうに、白い小さな車。"},{w:null,t:"うしろの席。"},{w:"nina",t:"マルコ。起きて。仕事。",v:"05_0024"},{w:"marco",t:"……それ、十二番の仕事でしょ。",v:"05_0025"},{w:"nina",t:"その十二番が、ゆうべから返事しないの。",v:"05_0026"},{w:null,t:"マルコ、帽子を少しだけ上げる。"},{w:"marco",t:"……めんど。",v:"05_0028"},{w:null,t:"マルコの足もとで、黒い体にオレンジの点の散った大きなヤモリが、目をあける。"},{w:null,t:"耳のうしろで、小さな白い盾が、ちかっと光る。"},{w:null,t:"第5話　夜明けの火",v:"05_0032"}];
GR_SC.g05_02=[{w:null,t:"坂の上のホテル。四日目の朝。",v:"05_0038"},{w:null,t:"ぶどう畑のはしの道具小屋から、アレクが毛布をたたみながら出てくる。"},{w:null,t:"二階の窓から、アナの手が紙を一枚さし出す。"},{w:null,t:"アレク、ポケットの硬貨を数えて、窓の手にのせる。"},{w:null,t:"小屋の横の石の水おけ。"}];
GR_SC.g05_03=[{w:null,t:"朝ごはんのテラス。"},{w:"hero",t:"でさ、相手、水なわけ。こっちは炎。ふつう、負けるじゃん。",v:"05_0046"},{w:"x",n:"客の子A",t:"負けるの？",v:"05_0047"},{w:"hero",t:"負ける。でも、そこでおれが気づいちゃったわけ。",v:"05_0048"},{w:null,t:"ヤマト、指を立てて、炎、森、水、と一本ずつ折っていく。"},{w:"hero",t:"じゃんけんになってんの。全部。",v:"05_0050"},{w:"x",n:"客の子B",t:"じゃんけんで勝ったの？",v:"05_0051"},{w:"hero",f:"smile",t:"じゃんけんみたいなもんで、勝ったの。",v:"05_0052"},{w:"elly",t:"（パンをちぎりながら）気づいたの、負けそうになってからだよね。",v:"05_0053"},{w:"hero",t:"負けそうでも、気づいたもんは気づいたの。",v:"05_0054"},{w:null,t:"テーブルのはしで、フォルンがしっぽの火の上でオリーブを転がしている。"},{w:null,t:"ヤマト、いちばん大きい焼きオリーブを、ひょいとつまむ。"},{w:"hero",t:"これ、作戦料ね。",v:"05_0057"},{w:null,t:"フォルンのしっぽの火が、ぼっとふくらむ。"},{w:"hero",t:"あっ、ち、ち、ち——",v:"05_0059"},{w:null,t:"オリーブが手のひらの上でおどる。"},{w:null,t:"フォルン、宙のオリーブを口で受けとめる。"},{w:null,t:"子どもたちが、どっと笑う。"},{w:"hero",f:"serious",t:"……今のは、わざと。",v:"05_0063"},{w:"x",n:"客の子C",t:"わざとなの？",v:"05_0064"},{w:"hero",t:"わざと。……まあ、次、だれが来ても、おれとフォルンで——",v:"05_0065"},{w:null,t:"ロビーの画面に、村のお知らせ。"},{w:null,t:"アナが、その画面を見ている。"},{w:"ana",t:"ヤマト。お客さん。門に。",v:"05_0068"}];
GR_SC.g05_04=[{w:null,t:"門の外に、マルコ。"},{w:"marco",t:"どうも。網の係の、マルコっす。……狐、いますよね、ここ。",v:"05_0072"},{w:null,t:"ヤマトの足もとで、フォルンの耳が立つ。"},{w:null,t:"マルコの目が、フォルンから、そのうしろへ行く。"},{w:"marco",t:"……十二番。なにしてんすか、そこで。",v:"05_0075"},{w:null,t:"アレク、答えない。"},{w:"marco",t:"まあ、いいや。そういうの報告すんの、めんどいんで。",v:"05_0077"},{w:null,t:"坂の下で、ニーナの画面が、かしゃっと鳴る。"},{w:"marco",t:"一対一で、どうすか。そっちが勝ったら、おれは手を引きます。おれが勝ったら、狐はもらってく。",v:"05_0079"},{w:"hero",t:"いいよ。",v:"05_0080"},{w:"alek",t:"……待て。",v:"05_0081"},{w:"hero",f:"smile",t:"なんで。ゆうべ勝ったじゃん。",v:"05_0082"},{w:null,t:"マルコの肩のヤモリが、口をあける。"},{w:null,t:"エリーのカバンの中で、ぱちっ。"},{w:"elly",f:"serious",t:"……ピリポン、ああいう火、だめなの。",v:"05_0085"},{w:"alek",t:"あれは二段目だ。おまえの狐は、まだ一段目。",v:"05_0086"},{w:"hero",t:"段とか関係ないって。どっちも炎だろ。",v:"05_0087"},{w:null,t:"アレク、水おけを見る。"},{w:"alek",t:"……待てって。",v:"05_0089"},{w:null,t:"ヤマトは、もう門の外に出ている。"},{w:"marco",t:"どこでもいいっすけど。……裏の畑で。木の下、すずしいんで。",v:"05_0091"}];
GR_SC.g05_05=[{w:null,t:"ぶどう棚の前で、マルコが畑を見わたす。"},{w:null,t:"向こう半分は、古いオリーブの林。"},{w:null,t:"マルコ、林の木の下に木箱を置いて、座る。"},{w:null,t:"ヤマト、フォルンを手前の畑のまん中に置く。"},{w:null,t:"アレクとエリーが、ぶどう棚の下に立つ。"},{w:"marco",t:"じゃ、始め。",v:"05_0102"}];
GR_SC.g05_09=[{w:null,t:"フォルンの体から、光がすうっと引いていく。"},{w:null,t:"マルコ、オキヤモを両腕でかかえ上げて、重そうに肩にかつぎ直す。"},{w:"marco",t:"……約束は約束なんで。",v:"05_0173"},{w:"nina",t:"マルコ、写真。本部に。",v:"05_0174"},{w:"marco",t:"もう撮ってたでしょ、坂の下で。",v:"05_0175"},{w:null,t:"マルコ、帰りかけて、アレクの前で止まる。"},{w:"marco",t:"十二番。……抜けんなら、もっと遠くまで行った方がいいっすよ。うちの本部、しつこいんで。",v:"05_0177"},{w:"alek",t:"……分かってる。",v:"05_0178"},{w:null,t:"マルコ、坂を下りていく。"},{w:null,t:"ヤマト、フォルンの前にしゃがむ。"},{w:null,t:"フォルン、首をくるっと回して、ヤマトの帽子を、ぱくっとくわえて取る。"},{w:"hero",t:"おい。",v:"05_0182"},{w:null,t:"フォルン、忘れ物の札をぶらぶらさせながら、畑の外へすたすた出ていく。"},{w:"hero",t:"返せって！",v:"05_0184"}];
GR_SC.g05_10=[{w:null,t:"ロビーの画面。"},{w:null,t:"画面が切りかわって、広告。"},{w:null,t:"ヤマト、その前に立っている。"},{w:null,t:"アレクがうしろに来て、画面の時計を見る。"},{w:"alek",t:"昼に、白いのが来る。",v:"05_0193"},{w:null,t:"パンの袋をつめていたエリーの手が、一瞬だけ止まる。"},{w:"hero",t:"白い都まで、どれくらい。",v:"05_0195"},{w:"alek",t:"歩きなら、二週間。",v:"05_0196"},{w:"hero",f:"serious",t:"……歩き？",v:"05_0197"},{w:null,t:"門の前を、ロボタクシーがすうっと通る。"},{w:"alek",t:"乗るな。居場所が出る。",v:"05_0199"},{w:null,t:"アレク、水おけからクロッコを出して、背中にかつぐ。"},{w:"ana",t:"おばあちゃんから、電話あった。……止めても行くんでしょ。",v:"05_0201"},{w:null,t:"エリー、目をそらして、笑う。"},{w:"ana",t:"（アレクに）帰ってきたら、払って。",v:"05_0205"},{w:"alek",t:"昼でも、森の道だ。",v:"05_0208"}];
GR_SC.g05_11=[{w:null,t:"朝の光が、小川の底までさしこんでいる。"},{w:null,t:"画面が、水の中でぽうっと光る。"},{w:null,t:"白い小さなドローンが一機、低く飛んでくる。"},{w:null,t:"赤い光が、岸のぬかるみで止まる。"},{w:null,t:"ドローンが高く上がる。"}];
GR_EP[5]={"t": "夜明けの火", "sc": [["g05_01", "村を見下ろす坂（夜明け）", 0], ["g05_02", "ホテルの裏・道具小屋（朝）", 0], ["g05_03", "ホテルのテラス（朝）", 0], ["g05_04", "ホテルの門", 0], ["g05_05", "ホテルの裏の畑・向かい合う", 0], ["g05_06", "勝負・突っこむ", 1], ["g05_07", "勝負・止まらない", 1], ["g05_08", "勝負・水をまたがない", 1], ["g05_09", "勝負のあと", 0], ["g05_10", "ホテルの門（昼前）", 0], ["g05_11", "ホテル裏の森の小川", 0]]};
GR_SC.g06_01=[{w:null,t:"フォルンが、いちばん外がわで丸くなっている。"},{w:null,t:"丘の下の道。"},{w:null,t:"アレク、目をあける。"},{w:null,t:"ドローンが、丘の方へ向きを変える。"},{w:null,t:"アレク、ヤマトの毛布のはしをつかんで、木のかげの奥へ引っぱる。"},{w:null,t:"ドローンが木の上を通りすぎる。"},{w:"hero",t:"（寝ぼけて）……なに。",v:"06_0028"},{w:"alek",t:"道は、もう使わない。畑を行く。",v:"06_0029"},{w:null,t:"第6話　丘の畑",v:"06_0031"}];
GR_SC.g06_02=[{w:null,t:"オリーヴァ村の東。オリーブの丘が、いくつも続く。",v:"06_0037"},{w:"hero",t:"手でとると、高く売れるんだろ。エリーに聞いた。",v:"06_0039"},{w:"alek",t:"……手で摘んだ、って書くと、高い。",v:"06_0040"},{w:"hero",f:"serious",t:"……書くと？",v:"06_0041"},{w:null,t:"ヤマト、少し考える。"},{w:null,t:"ヤマト、布を持ったまま動けなくなる。"},{w:"hero",f:"serious",t:"……ちょっと、待って。",v:"06_0044"},{w:null,t:"クロッコが、アレクの背中から自分で下りて、足のうしろを歩いている。"},{w:null,t:"ピリポンは、エリーのカバンのクッキーの箱から顔だけ出している。"}];
GR_SC.g06_03=[{w:null,t:"丘のいちばん上の畑。"},{w:null,t:"幹の小さな穴のいくつかに、白い網の切れはしがひっかかったまま。"},{w:null,t:"畑のはしを、石を組んだ溝が流れている。"},{w:null,t:"手前のすみに、昔の脱穀場の、丸い石の床。"},{w:null,t:"男が一人、くずれた溝の石を、だまって積み直している。"},{w:null,t:"ヤマト、石の床の上に、大の字に寝ころがる。"},{w:"hero",t:"エリー、ここ、石がぽかぽか。ちょっと寝てっていい？",v:"06_0055"},{w:null,t:"エリーのカバンから、ピリポンが石の床に、ぴょんと下りる。"},{w:null,t:"火花が、寝ているヤマトのおしりに届く。"},{w:"hero",t:"いでっ！",v:"06_0058"},{w:null,t:"ヤマト、とび起きる。"},{w:null,t:"太いオリーブの幹に、大きなカブトムシの子がとまっている。"},{w:"hero",t:"うわ、でっか。……これ、ヘラクレスオオカブトだろ。動画で見た。",v:"06_0061"},{w:"elly",t:"ヘラクレスは、人だよ。",v:"06_0062"},{w:"hero",t:"人？",v:"06_0063"},{w:"elly",t:"すっごく力持ちの人。昔の。",v:"06_0064"},{w:"hero",f:"serious",t:"……カブトムシじゃなくて？",v:"06_0065"},{w:"elly",t:"人。",v:"06_0066"},{w:null,t:"カブトムシの子が、幹の上で前足を、ぐっとふんばる。"},{w:null,t:"エリーだけが、それを見ている。"},{w:null,t:"ヤマトは男のかごの黒い実を一つつまんで、光にかざしている。"},{w:"hero",t:"（男に）これ、なに味？",v:"06_0070"},{w:null,t:"ヤマト、もう口を大きくあけている。"},{w:"stavros",f:"serious",t:"……なまは、食えない。",v:"06_0072"},{w:null,t:"ヤマトの口が、あいたまま止まる。"},{w:null,t:"男の目が、ヤマトのうしろへ行く。"},{w:"stavros",t:"……先月。白い盾の連中を、この畑まで連れてきたのは、おまえだな。",v:"06_0075"},{w:null,t:"アレク、目をそらさない。"},{w:"alek",t:"……ああ。",v:"06_0077"},{w:"hero",t:"え。",v:"06_0078"},{w:"elly",t:"アレク？",v:"06_0079"},{w:"alek",t:"……前の仕事だ。",v:"06_0080"},{w:null,t:"ヤニス、幹の穴に指を入れて、白い網の切れはしをつまみ出す。"},{w:"stavros",t:"あの晩、この木の子が、みんないなくなった。小さいのが、十二。",v:"06_0082"},{w:null,t:"カブトムシの子が、羽を一度だけふるわせる。"},{w:"hero",t:"おれたち、あいつらじゃない！",v:"06_0084"},{w:"stavros",t:"あの連中も、最初は、そう言った。",v:"06_0085"},{w:null,t:"ヤニス、棒を、畑の入口に横にわたす。"},{w:"stavros",t:"通るなら、こいつに勝て。負けたら、来た道を帰れ。",v:"06_0087"},{w:null,t:"ヤマトの顔が、少しだけ固まる。"},{w:"alek",t:"……三体で、いいか。",v:"06_0090"},{w:"stavros",t:"いい。",v:"06_0091"}];
GR_SC.g06_04=[{w:null,t:"ヤニスが、畑のまん中まで歩いていく。"},{w:null,t:"向こうのはしはオリーブの木。"},{w:null,t:"ヤニス、ヘラツノを木の手前の草に置く。"},{w:null,t:"ヤマト、フォルンを手前のまん中に。"},{w:null,t:"ヤマトの口のはしが、上がる。"},{w:null,t:"アレク、クロッコを溝のそばの草に。"},{w:null,t:"エリー、石の床の左がわのはしに立つ。"},{w:"stavros",t:"始め。",v:"06_0105"}];
GR_SC.g06_08=[{w:null,t:"フォルンとピリムサの体から、光がすうっと引いていく。"},{w:null,t:"ヤニス、ヘラツノのそばにしゃがむ。"},{w:null,t:"エリー、石の床の上のピリポンをだき上げる。"},{w:"elly",t:"ピリポン、さっき、おっきかった！",v:"06_0179"},{w:null,t:"ピリポン、エリーの顔に、ぱちっ。"},{w:null,t:"アレク、クロッコをだき起こす。"},{w:null,t:"ヤニス、立ち上がって、アレクの前に来る。"},{w:null,t:"ヤニス、アレクの手首を見る。"},{w:"stavros",f:"serious",t:"……これは、食える。",v:"06_0185"},{w:"stavros",f:"serious",t:"……そこじゃない。",v:"06_0189"},{w:"hero",t:"これ、何年？",v:"06_0192"},{w:"stavros",f:"serious",t:"……千年は、こえてる。",v:"06_0193"},{w:"hero",t:"千……。",v:"06_0194"},{w:"elly",f:"serious",t:"……出てるじゃん。",v:"06_0198"}];
GR_SC.g06_09=[{w:null,t:"丘のてっぺんに、三人と三体。"},{w:null,t:"アレク、紙の地図を広げて、煙の方をなぞる。"},{w:"alek",t:"……アルカディアの森だ。",v:"06_0204"},{w:"hero",t:"あれ、燃えてんの？",v:"06_0205"},{w:null,t:"アレク、答えない。"},{w:null,t:"フォルンの鼻が、ひくっと動く。"}];
GR_EP[6]={"t": "丘の畑", "sc": [["g06_01", "丘のオリーブの木の下（夜明け）", 0], ["g06_02", "丘の斜面（朝）", 0], ["g06_03", "ヤニスの畑", 0], ["g06_04", "向かい合う", 0], ["g06_05", "勝負・追う", 1], ["g06_06", "勝負・下がる先", 1], ["g06_07", "勝負・決着", 1], ["g06_08", "勝負のあと", 0], ["g06_09", "丘の上（夕方）", 0]]};
GR_SC.g07_01=[{w:null,t:"川べりの大きな岩の上に、ニーナが白い箱を置く。"},{w:"nina",t:"これで、歌が流れる。あとは、勝手に歩いてくる。",v:"07_0022"},{w:"marco",t:"……じゃあ、網、いらなくないすか。",v:"07_0023"},{w:"nina",t:"歌で来ない子は、網。今度しくじったら、番号、下がるからね。",v:"07_0024"},{w:null,t:"ニーナが網の銃を撃つ。"},{w:"marco",t:"あばれると、網、破れるんすよね。……オキヤモ、ちょっとだけ、おどかして。",v:"07_0026"},{w:null,t:"マルコの肩のオキヤモが、口をあける。"},{w:null,t:"耳のうしろで、白い盾がちかっと光る。"},{w:null,t:"オキヤモ、口を閉じない。"},{w:null,t:"網から抜けた角の子が、森の奥へ逃げていく。"},{w:"marco",t:"止まれ。……止まれって。",v:"07_0031"},{w:null,t:"ニーナの手首の画面。"},{w:"nina",t:"……また入ってる。",v:"07_0033"},{w:"marco",t:"切っても、入ってくるんすよ、これ。",v:"07_0034"},{w:null,t:"マルコ、水の筒の水を、燃える落ち葉にかける。"},{w:null,t:"第7話　ラドン川の歌",v:"07_0037"}];
GR_SC.g07_02=[{w:null,t:"夜明けの道。"},{w:null,t:"アルカディア。楽園の名を持つ森。入口に、料金所がある。",v:"07_0044"},{w:null,t:"木のゲート。"},{w:"x",n:"受付のロボット",t:"十五さい以上一名、十五さい未満二名、テリオン三体。森の保全料を、いただきます。",v:"07_0046"},{w:null,t:"ロボットの胸の画面に、金額。"},{w:"x",n:"受付のロボット",t:"……追加料金で、お通りいただけます。",v:"07_0048"},{w:null,t:"エリー、しゃがんで、フォルンをカメラの前へ押し出そうとする。"},{w:"elly",t:"この子、フォルン。テリオンだよ。",v:"07_0050"},{w:"x",n:"受付のロボット",t:"フォルン様。判定できません。",v:"07_0051"},{w:null,t:"アレク、画面の数字を見たまま、しばらく動かない。"},{w:"x",n:"受付のロボット",t:"なお、本日、森の東がわで煙が確認されています。消防のドローンが向かっております。",v:"07_0053"},{w:null,t:"棒が上がる。"}];
GR_SC.g07_03=[{w:null,t:"焦げたにおいが、だんだん強くなる。"},{w:null,t:"木のあいだがひらけた所。"},{w:null,t:"腰のまがったおばあさんが、バケツの水を燃える草にかけている。"},{w:null,t:"バケツを回す人たちの中に、すすで顔のまっ黒な男。"},{w:null,t:"アレク、もうクロッコを小川に下ろしている。"},{w:null,t:"エリー、ピリポンを地面に下ろしかけて、やめる。"},{w:null,t:"エリー、ピリポンを箱に入れたまま、自分でバケツを回す人たちの中に入る。"},{w:null,t:"フォルン、燃える草の前に立つ。"},{w:null,t:"ヤマト、バケツを回す人たちの所へ走っていく。"},{w:null,t:"わたしてきたのは、マルコ。"},{w:"hero",t:"あ。門の——",v:"07_0067"},{w:"marco",t:"今、それ、いいっす。",v:"07_0068"},{w:null,t:"ヤマト、バケツを次の人にわたす。"},{w:null,t:"フォルン、四つ目の火を吸いこむ。"},{w:null,t:"最後の煙が、消える。"},{w:null,t:"みんな、すすだらけで地面に座りこむ。"},{w:"nina",t:"ドローン。行くよ。",v:"07_0074"},{w:null,t:"ニーナ、マルコの腕を引く。"},{w:null,t:"赤い消防のドローンが一機、下りてくる。"},{w:null,t:"森の奥へ続く道の入口に、細い棒を二本立てる。"},{w:null,t:"ドローン、そのまま飛んで帰っていく。"},{w:null,t:"おばあさん、バケツの上から、空を見上げる。"},{w:"x",n:"森番のおばあさん",t:"……あれが来るのは、いつも、消えたあとだね。",v:"07_0080"},{w:null,t:"ヤマト、光るひもに手を近づける。"},{w:null,t:"エリー、焦げた草の中から、燃え残った網の切れはしを拾う。"},{w:null,t:"アレク、それを見る。"}];
GR_SC.g07_04=[{w:null,t:"ラドン川。この秋、夜になると、川から歌が聞こえる。",v:"07_0086"},{w:null,t:"森の外がわを流れる川。"},{w:null,t:"アレク、紙の地図を広げる。"},{w:"alek",t:"……道は、止まった。川しかない。",v:"07_0089"},{w:null,t:"切符売り場の窓口に、古い電話。"},{w:null,t:"アレク、切符の機械に硬貨を入れる。"},{w:null,t:"ヤマト、それを横から見ている。"},{w:null,t:"アレク、ヤマトを見る。"}];
GR_SC.g07_05=[{w:null,t:"むかしの帆船をまねた、小さな観光船。"},{w:null,t:"案内のロボットが、かごを持って回っている。"},{w:"x",n:"案内のロボット",t:"このあと「歌の瀬」を通ります。歌を聞いたテリオンが、岸へ歩いていってしまうことがございます。お客さまも、お連れのテリオンも、こちらをどうぞ。",v:"07_0098"},{w:null,t:"エリー、ピリポンに耳あてをかぶせる。"},{w:null,t:"エリーがフォルンにも耳あてを持っていく。"},{w:null,t:"ヤマトだけ、耳せんを取らない。"},{w:"elly",t:"ヤマト、耳せん。",v:"07_0102"},{w:"hero",t:"聞きたい。どんなのか。",v:"07_0103"},{w:"alek",t:"……川に飛びこむぞ、おまえ。",v:"07_0104"},{w:null,t:"ヤマト、太い帆柱を見上げる。"},{w:"hero",t:"じゃ、しばって。あの柱に。……いちおう。",v:"07_0106"},{w:null,t:"アレク、長いあいだヤマトを見る。"},{w:"alek",t:"……ほどくか。",v:"07_0108"},{w:"hero",f:"serious",t:"……いや。",v:"07_0109"},{w:"alek",t:"どっちだ。",v:"07_0110"},{w:"hero",t:"いちおう。",v:"07_0111"},{w:null,t:"アレク、結び目を、もう一つ足す。"},{w:null,t:"案内のロボットが、船のまん中で話しはじめる。"},{w:"x",n:"案内のロボット",t:"この川には、昔から歌の話がございます。海の岩の上で歌う、鳥の体をした女の人たち。その歌を聞いた船乗りは、船ごと岩へ寄っていってしまう。そこで、ある船長は、自分を帆柱にしばらせて、歌を聞いたそうです。",v:"07_0114"},{w:null,t:"客の何人かが、帆柱のヤマトを見る。"},{w:"x",n:"案内のロボット",t:"また、この森のそばの山には、生まれたその日に、牛をうしろ向きに歩かせて、足あとで大人をだました、子どもの神さまの話がございます。",v:"07_0116"},{w:"elly",t:"かしこい！",v:"07_0117"},{w:"hero",t:"なに？",v:"07_0118"},{w:"elly",t:"うしろ向きの足あとで、大人をだましたの。赤ちゃんが。",v:"07_0119"},{w:"hero",f:"serious",t:"……ふーん。",v:"07_0120"},{w:null,t:"ヤマト、また結び目をさぐる。"}];
GR_SC.g07_06=[{w:null,t:"川幅が広くなる。"},{w:null,t:"歌が聞こえてくる。"},{w:null,t:"岸の葦のあいだから、野生の子たちが出てくる。"},{w:null,t:"ヤマトの目が、その子たちを追う。"},{w:"hero",t:"ほどいて。ちょっとだけ！",v:"07_0131"},{w:null,t:"だれも、ふり向かない。"},{w:"hero",t:"エリー！　ほどいてって！　エリー！",v:"07_0133"},{w:null,t:"エリー、ヤマトに気づく。"},{w:"hero",t:"ちがう！！",v:"07_0135"},{w:null,t:"ヤマト、帆柱ごと岸の方へ体を投げ出そうとする。"},{w:null,t:"船べりで、フォルンが頭を上げる。"},{w:null,t:"船は、岸の大きな岩のすぐ横を通っている。"},{w:null,t:"フォルン、立ち上がる。"},{w:null,t:"岩の上に着地。"},{w:null,t:"フォルン、線に、がぶっとかみつく。"},{w:null,t:"川の中の子たちが、歩きかけた足のまま止まる。"},{w:null,t:"フォルン、口から線をぺっと吐く。"},{w:null,t:"ヤマト、ロープにぶら下がるように、ぐったりする。"},{w:null,t:"アレク、耳せんを片方だけ外す。"},{w:"alek",t:"……なんか言ったか。",v:"07_0148"},{w:"hero",f:"serious",t:"……ぜんぜん、平気だった。",v:"07_0149"}];
GR_SC.g07_07=[{w:"x",n:"案内のロボット",t:"機械の確認のため、こちらで少し停まります。",v:"07_0152"},{w:null,t:"観光船が岩に寄る。"},{w:null,t:"箱は横だおし。"},{w:null,t:"アレクがしゃがんで、箱の底に懐中電灯を当てる。"},{w:null,t:"エリー、カバンから、昼に拾った網の切れはしを出す。"},{w:null,t:"エリー、箱の丸い穴を見る。"},{w:"elly",t:"あの子たち、どこに歩いてくとこだったの。",v:"07_0158"},{w:null,t:"アレク、札の字を、指でなぞる。"},{w:"alek",t:"……森の奥。",v:"07_0160"},{w:null,t:"アレク、自分の手首を、そでの上からぎゅっとにぎる。"},{w:null,t:"ヤマト、ロープのあとの残る腕で、フォルンの首をなでようとする。"},{w:null,t:"ヤマト、なでかけた手のまま、ついていく。"}];
GR_SC.g07_08=[{w:null,t:"最後の船着き場。"},{w:null,t:"岸から上がる道に、また、細い棒が二本。"},{w:"hero",f:"serious",t:"……また？",v:"07_0168"},{w:null,t:"アレク、地図を広げかけて、手を止める。"},{w:null,t:"明かりの方へ歩く。"},{w:null,t:"そのはしに、小さな木の小屋。"},{w:null,t:"小屋のうしろの夜空に、背の高い鉄の骨組みが、まっすぐ立っている。"},{w:null,t:"骨組みの足もとに、工事の看板。"},{w:null,t:"エリー、小屋の戸を、こんこんとたたく。"},{w:"x",n:"女の人",t:"……なに。",v:"07_0176"},{w:"elly",t:"泊まるとこ、ありますか！",v:"07_0177"},{w:null,t:"女の人、三人を見る。"},{w:null,t:"女の人の目が、少しだけ細くなる。"},{w:"x",n:"女の人",t:"……床で、いいなら。",v:"07_0180"}];
GR_EP[7]={"t": "ラドン川の歌", "sc": [["g07_01", "アルカディアの森・川べりの岩（ゆうべ）", 0], ["g07_02", "アルカディアの森の入口（朝）", 0], ["g07_03", "森の中（朝）", 0], ["g07_04", "川の船着き場（夕方）", 0], ["g07_05", "観光船の上（夜）", 0], ["g07_06", "歌の瀬（夜）", 0], ["g07_07", "岸の大岩（夜）", 0], ["g07_08", "森の外れの船着き場（夜ふけ）", 0]]};
GR_SC.g08_01=[{w:null,t:"頭に明かりをつけた研究者が、土の中にしゃがんでいる。"},{w:null,t:"土の中から、白っぽい、丸い物が出てくる。"},{w:null,t:"研究者、ブラシを止める。"},{w:null,t:"穴の奥は、まっ暗。"},{w:null,t:"第8話　巨人の骨",v:"08_0025"}];
