<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>CPU対戦</title>
<link rel="icon" href="data:,">
<style>
:root{--bg:#0d1120;--pn:#141b33;--pn2:#1b2448;--ln:rgba(150,170,235,.22);--tx:#eef2ff;--sub:#9fb0dc;--sel:#2f5fb0;--selb:#8fb4ff;--bad:#e05a50;--good:#3fb36b;--gold:#ffd977}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--tx);font-family:'Hiragino Sans','Yu Gothic UI','Noto Sans JP',sans-serif;font-size:14px;overscroll-behavior:none}
body{padding:0 0 calc(130px + env(safe-area-inset-bottom))}
button{font:inherit;color:inherit;cursor:pointer}
img.ic{width:18px;height:18px;vertical-align:-4px;object-fit:contain}
#top{position:sticky;top:0;z-index:20;display:flex;align-items:center;gap:8px;padding:calc(8px + env(safe-area-inset-top)) 12px 8px;background:rgba(13,17,32,.96);border-bottom:1px solid var(--ln)}
#top h1{flex:1;margin:0;font-size:18px;color:var(--gold);letter-spacing:.08em}
.tb{min-width:44px;min-height:40px;border-radius:8px;border:1px solid var(--ln);background:var(--pn);font-size:13px;font-weight:800;padding:0 10px;display:flex;align-items:center;gap:6px;justify-content:center;text-decoration:none;color:var(--tx)}
.tb.on{background:var(--sel);border-color:var(--selb)}
main{max-width:640px;margin:0 auto;padding:6px 12px}
section{margin:12px 0;background:var(--pn);border:1px solid var(--ln);border-radius:12px;padding:10px}
section>h2{margin:0 0 8px;font-size:15px;display:flex;align-items:center;gap:6px;color:#dfe6ff}
section>h2 img{width:22px;height:22px}
.row{display:flex;gap:6px;flex-wrap:wrap;margin:6px 0;align-items:center}
.lab{font-size:12px;color:var(--sub);font-weight:800;min-width:44px}
.seg{display:flex;gap:4px;flex:1;flex-wrap:wrap}
.seg button,.chip{min-height:40px;border-radius:8px;border:1px solid var(--ln);background:#11183a;color:var(--sub);font-size:13px;font-weight:800;padding:0 10px;flex:1;white-space:nowrap}
.seg button.on,.chip.on{background:var(--sel);color:#fff;border-color:var(--selb)}
.chip{flex:0 0 auto}
.scenes{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.scn{min-height:64px;border-radius:10px;border:1px solid var(--ln);background:linear-gradient(180deg,#1b2448,#11183a);text-align:left;padding:6px 8px;display:flex;gap:8px;align-items:center}
.scn:active,.go:active{transform:scale(.97)}
.scn img{width:46px;height:46px;object-fit:contain;flex:0 0 auto}
.scn b{display:block;font-size:13px;line-height:1.25}
.scn i{display:block;font-style:normal;font-size:10.5px;color:var(--sub);margin-top:2px;line-height:1.3}
.slots{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
.slot{position:relative;min-height:92px;border-radius:10px;border:1px dashed var(--ln);background:#0f1530;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:4px;font-size:11px}
.slot.f{border-style:solid}
.slot img.a{width:58px;height:58px;object-fit:contain}
.slot .nm{font-weight:800;font-size:11.5px;text-align:center;line-height:1.2}
.slot .plus{font-size:28px;color:var(--sub)}
.slot .ld{position:absolute;left:4px;top:4px;width:16px;height:16px}
.ty{display:inline-flex;gap:2px;margin-top:2px}
.ty span{font-size:10px;font-weight:800;color:#fff;border-radius:4px;padding:0 4px;line-height:15px}
.st{position:absolute;right:4px;top:3px;font-size:10px;color:var(--sub);font-weight:800}
input[type=range]{flex:1;height:32px;accent-color:#5f8fe0}
.num{min-width:52px;text-align:right;font-weight:800;font-size:15px}
.list{display:flex;flex-direction:column;gap:6px}
details{border:1px solid var(--ln);border-radius:8px;background:#10162f}
details>summary{min-height:42px;display:flex;align-items:center;padding:0 10px;font-weight:800;font-size:13px;list-style:none;cursor:pointer}
details>summary::-webkit-details-marker{display:none}
details>summary::after{content:'+';margin-left:auto;color:var(--sub)}
details[open]>summary::after{content:'−'}
details .wrap{display:flex;flex-wrap:wrap;gap:6px;padding:0 8px 8px}
.mapn{width:100%;font-size:11px;color:var(--sub);margin:6px 0 0;font-weight:800}
.bossb{min-height:48px;border-radius:8px;border:1px solid var(--ln);background:#11183a;display:flex;align-items:center;gap:6px;padding:2px 8px;font-size:12.5px;font-weight:800;text-align:left;flex:1 1 46%}
.bossb img{width:38px;height:38px;object-fit:contain}
.bossb small{display:block;color:var(--sub);font-size:10.5px;font-weight:700}
.bossb.on{background:var(--sel);border-color:var(--selb)}
.tg{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
.tg button{min-height:52px;border-radius:10px;border:1px solid var(--ln);background:#11183a;color:var(--sub);font-weight:800;font-size:13px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px}
.tg button img{width:22px;height:22px}
.tg button.on{background:var(--sel);color:#fff;border-color:var(--selb)}
#goBar{position:fixed;left:0;right:0;bottom:0;z-index:30;padding:10px 12px calc(10px + env(safe-area-inset-bottom));background:linear-gradient(180deg,rgba(13,17,32,0),rgba(13,17,32,.96) 30%)}
.go{display:flex;align-items:center;justify-content:center;gap:10px;width:100%;max-width:640px;margin:0 auto;min-height:62px;border-radius:12px;border:1px solid #f0c060;background:linear-gradient(180deg,#e0a838,#b97a1c);color:#1a1006;font-size:20px;font-weight:900;letter-spacing:.2em}
.go img{width:26px;height:26px}
.sum{display:flex;flex-wrap:wrap;gap:4px;max-width:640px;margin:0 auto 6px}
.sum span{font-size:10.5px;background:#1b2448;border:1px solid var(--ln);border-radius:6px;padding:1px 6px;color:var(--sub);font-weight:800}
/* 選ぶ画面 */
#pk{position:fixed;inset:0;z-index:50;background:var(--bg);display:none;flex-direction:column}
#pk.on{display:flex}
#pkTop{padding:calc(8px + env(safe-area-inset-top)) 10px 6px;border-bottom:1px solid var(--ln);background:#10162f}
#pkTop .row{margin:4px 0}
#pkQ{flex:1;min-height:42px;border-radius:8px;border:1px solid var(--ln);background:#0b1024;color:var(--tx);font:inherit;font-size:16px;padding:0 10px}
#pkF{display:flex;gap:4px;overflow-x:auto;padding-bottom:2px;-webkit-overflow-scrolling:touch}
#pkF .chip{min-height:36px;font-size:12px;padding:0 9px}
#pkGrid{flex:1;overflow-y:auto;display:grid;grid-template-columns:repeat(auto-fill,minmax(104px,1fr));gap:6px;padding:8px 10px calc(16px + env(safe-area-inset-bottom));align-content:start;-webkit-overflow-scrolling:touch}
.cd{position:relative;border-radius:10px;border:1px solid var(--ln);background:#11183a;padding:4px 4px 6px;display:flex;flex-direction:column;align-items:center;min-height:126px}
.cd img.a{width:76px;height:76px;object-fit:contain}
.cd .nm{font-size:12px;font-weight:800;text-align:center;line-height:1.2}
.cd.in{outline:2px solid var(--selb)}
#pkN{font-size:12px;color:var(--sub);font-weight:800;min-width:40px;text-align:right}
/* 結果 */
#rs{position:fixed;inset:0;z-index:40;background:rgba(6,9,20,.94);display:none;flex-direction:column;align-items:center;justify-content:center;gap:14px;padding:20px}
#rs.on{display:flex}
#rsT{font-size:40px;font-weight:900;letter-spacing:.2em}
#rsT.win{color:var(--gold)} #rsT.lose{color:var(--bad)} #rsT.draw{color:var(--sub)}
#rsS{display:flex;gap:6px;flex-wrap:wrap;justify-content:center}
#rsS span{background:var(--pn2);border:1px solid var(--ln);border-radius:8px;padding:4px 10px;font-weight:800;font-size:13px}
#rs .go,#rs .bk{max-width:340px}
.bk{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;min-height:54px;border-radius:12px;border:1px solid var(--ln);background:var(--pn2);font-size:16px;font-weight:800}
#perf{position:fixed;left:6px;top:calc(64px + env(safe-area-inset-top));z-index:10050;pointer-events:none;background:rgba(0,0,0,.66);color:#9dff9d;font:12px/1.35 ui-monospace,Menlo,Consolas,monospace;padding:4px 7px;border-radius:6px;display:none;white-space:pre}
#perf.on{display:block}
#pk.on~#perf{display:none}
#perf.bad{color:#ff9a8a}
#load{position:fixed;inset:0;z-index:60;background:var(--bg);display:flex;align-items:center;justify-content:center;color:var(--sub);font-weight:800}
</style>
</head>
<body>
<div id="load">…</div>
<div id="top">
  <a class="tb" id="bBack" href="../proto/greece_town.html"><img class="ic" src="img/ui/cancel.webp" alt="">タイトル</a>
  <h1>CPU対戦</h1>
  <button class="tb" id="bPerf"><img class="ic" src="img/ui/hint.webp" alt="">重さ</button>
</div>
<main>
  <section><h2><img src="img/ui/leader.webp" alt="">場面</h2><div class="scenes" id="scenes"></div></section>

  <section><h2><img src="img/ui/ally.webp" alt="">自分</h2>
    <div class="slots" id="meSlots"></div>
    <div class="row"><button class="chip" data-mp="start">最初の3体</button><button class="chip" data-mp="rand">ランダム6</button><button class="chip" data-mp="fuse">融合できる組</button><button class="chip" data-mp="anc">進化の最後</button><button class="chip" data-mp="clear"><img class="ic" src="img/ui/cancel.webp" alt=""></button></div>
    <div class="row"><span class="lab">Lv</span><input type="range" id="meLv" min="1" max="99"><span class="num" id="meLvN"></span></div>
    <div class="row"><span class="lab">開始の段</span><div class="seg" id="meStage"><button data-v="0">自動</button><button data-v="1">1</button><button data-v="2">2</button><button data-v="3">3</button></div></div>
  </section>

  <section><h2><img src="img/ui/enemy.webp" alt="">相手</h2>
    <div class="row"><div class="seg" id="foeMode"><button data-v="random">ランダム</button><button data-v="pick">えらぶ</button><button data-v="boss">ボス・古代</button><button data-v="wild">野生の群れ</button></div></div>
    <div id="foeRandom"><div class="row"><span class="lab">数</span><div class="seg" id="foeN"><button data-v="1">1</button><button data-v="2">2</button><button data-v="3">3</button><button data-v="4">4</button><button data-v="5">5</button><button data-v="6">6</button></div></div></div>
    <div id="foePick"><div class="slots" id="foeSlots"></div></div>
    <div id="foeLvRow" class="row"><span class="lab">Lv</span><input type="range" id="foeLv" min="1" max="99"><span class="num" id="foeLvN"></span></div>
    <div id="foeBoss" class="list"></div>
    <div id="foeWild"><div class="row"><span class="lab">数</span><div class="seg" id="wildN"><button data-v="1">1</button><button data-v="2">2</button><button data-v="3">3</button></div></div><div class="list" id="wildMaps"></div></div>
    <div class="row"><span class="lab">強さ</span><div class="seg" id="foeStr"><button data-v="0">よわい</button><button data-v="1">ふつう</button><button data-v="2">つよい</button></div></div>
  </section>

  <section id="secBoard"><h2><img src="img/ui/terrain.webp" alt="">盤</h2>
    <div class="row"><span class="lab">種類</span><div class="seg" id="bKind"><button data-v="wild">野生</button><button data-v="trainer">人</button><button data-v="master">ボス</button><button data-v="ancient">古代</button></div></div>
    <div class="row" id="tierRow"><span class="lab">古代の格</span><div class="seg" id="bTier"><button data-v="1">1</button><button data-v="2">2</button><button data-v="3">3</button><button data-v="4">4</button><button data-v="5">5</button><button data-v="6">6</button></div></div>
    <div class="row"><span class="lab">出せる数</span><div class="seg" id="bSize"><button data-v="7">3体</button><button data-v="9">4体</button><button data-v="11">5体</button><button data-v="13">6体</button></div></div>
    <div class="row"><span class="lab">ターン</span><div class="seg" id="bTurn"><button data-v="0">自動</button><button data-v="10">10</button><button data-v="15">15</button><button data-v="20">20</button><button data-v="25">25</button><button data-v="30">30</button></div></div>
    <div class="list" id="places"></div>
  </section>

  <section><h2><img src="img/ui/fuse.webp" alt="">ルール</h2>
    <div class="tg" id="rules">
      <button data-k="fuse"><img src="img/ui/fuse.webp" alt="">融合</button>
      <button data-k="triple"><img src="img/ui/fuse3.webp" alt="">3体融合</button>
      <button data-k="evo"><img src="img/ui/evolve.webp" alt="">進化</button>
      <button data-k="shake"><img src="img/ui/area.webp" alt="">揺れ</button>
      <button data-k="sfx"><img src="img/ui/combo.webp" alt="">音</button>
      <button data-k="cutin"><img src="img/ui/atk.webp" alt="">大技の演出</button>
    </div>
  </section>
</main>
<div id="goBar"><div class="sum" id="sum"></div><button class="go" id="bGo"><img src="img/ui/atk.webp" alt="">たたかう</button></div>

<div id="pk">
  <div id="pkTop">
    <div class="row"><input id="pkQ" type="search" placeholder="なまえ" autocomplete="off"><span id="pkN"></span><button class="tb" id="pkDel"><img class="ic" src="img/ui/cancel.webp" alt="">はずす</button><button class="tb" id="pkX">とじる</button></div>
    <div id="pkF"></div>
  </div>
  <div id="pkGrid"></div>
</div>

<div id="rs"><div id="rsT"></div><div id="rsS"></div><button class="go" id="rsAgain"><img src="img/ui/atk.webp" alt="">もう一回</button><button class="bk" id="rsBack"><img class="ic" src="img/ui/undo.webp" alt="">設定にもどる</button></div>
<div id="perf"></div>

<script src="../../three.min.js"></script>
<script src="../../gltfloader.128.js"></script>
<script src="../../meshopt_decoder.js"></script>
<script src="battle.js"></script>
<script src="../proto/lib/progress.js"></script>
<script>
(()=>{
'use strict';
// ---- CPU対戦(2026-10-27): 盤のバトル(battle.js)をそのまま呼ぶ。ルール・数値は battle.js と regions/*.json のまま(読むだけ) ----
const $=id=>document.getElementById(id);
const LSK='mb_vs_setup_v1';
const REGB='../proto/regions/';
// 物語の順(地図の正本は regions/*.json。ここは並び順だけ)
const ARCS=[
  ['greece','ギリシャ',['oliva_town','oliva_hill','oliva_maze','arcadia','corinth','cloudroad','delphi','stadium_under']],
  ['china','中国',['cn_bund','cn_bamboo','cn_plateau','cn_fossil','cn_karst','cn_pillars','cn_gorges','cn_thunder','cn_capital','cn_kunlun','cn_sea']],
  ['egypt','エジプト',['eg_cairo','eg_giza','eg_delta','eg_luxor','eg_valley','eg_tomb','eg_aswan','eg_abusimbel','eg_white','eg_redsea']],
  ['norse','北欧',['nr_oslo','nr_fjord','nr_lofoten','nr_iceland','nr_uppsala','nr_lapland','nr_ygg','nr_svalbard','nr_glacier','nr_core']],
  ['proto','試作',['athens','crete','crete_maze','greece_oliva']],
];
const ORDER=ARCS.slice(0,4).flatMap(a=>a[2]);
const arcOf=id=>{ for(const a of ARCS) if(a[2].includes(id)) return a[0]; return 'greece'; };
const TYPE_COL={炎:'#e8503a',水:'#2f86c5',地:'#9c7a3c',風:'#4fa86a',雷:'#d6a915',闇:'#6a4a8c',氷:'#5cc8e0',光:'#f3d65a',竜:'#b15ad6',森:'#5cbf3a'};
let MB, MON=[], MID={}, REG={}, ANC=new Set(), BOSSES=[], POOLS={}, STARTERS=[1001,178,1022], RECIPE2=[];
const D0={ me:{party:[1001,178,1022], lv:50, stage:0}, foe:{mode:'random', n:3, party:[], lv:50, boss:null, wildMap:'cn_kunlun', wildN:2, str:1},
  board:{kind:'trainer', size:9, turn:0, tier:6, place:{tt:'olive', bd:'olive'}}, rule:{fuse:true, triple:false, evo:true} };
let S=load();
function load(){ try{ const s=JSON.parse(localStorage.getItem(LSK)); if(s&&s.me&&s.foe&&s.board&&s.rule) return Object.assign(JSON.parse(JSON.stringify(D0)), s); }catch(e){} return JSON.parse(JSON.stringify(D0)); }
function save(){ try{ localStorage.setItem(LSK, JSON.stringify(S)); }catch(e){} }
const mon=id=>MID[+id];
const canOwn=id=>{ const m=mon(id); return !!m&&m.role!=='fusion'&&!ANC.has(m.id); };   // 2026-10-28 オーナー: 融合体・3体融合・古代テリオンは最初から出せない(戦いの中の融合でだけ出る)。相手側は今まで通り
const nm=id=>(mon(id)||{}).name||('#'+id);
const art=id=>'img/'+id+'.webp';
const stg=id=>{ const m=mon(id); return m?(m.role==='fusion'?'融合':String(m.level||1)):''; };
const tyHTML=id=>{ const m=mon(id); if(!m) return ''; return '<span class="ty">'+[m.type,m.type2].filter(Boolean).map(t=>`<span style="background:${TYPE_COL[t]||'#666'}">${t}</span>`).join('')+'</span>'; };
const rnd=a=>a[Math.floor(Math.random()*a.length)];
const shuffle=a=>{ a=a.slice(); for(let i=a.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [a[i],a[j]]=[a[j],a[i]]; } return a; };
const placeJP=(tt)=>{ const P=MB.PLACES[tt]; if(P) return P.jp; const J=MB.BRIEF&&MB.BRIEF.THEME_JP; return (J&&J[tt])||({gloom:'瘴気'})[tt]||tt; };
const ICON=n=>`<img class="ic" src="img/ui/${n}.webp" alt="">`;

// ---- 系統・編 ----
function baseOf(id){ let m=mon(id), g=0; while(m&&m.evolves_from!=null&&g++<5) m=mon(m.evolves_from); return m?m.id:+id; }
function lineOf(id){ const o=[]; let m=mon(baseOf(id)), g=0; while(m&&g++<5){ o.push(m.id); m=m.evolves_to!=null?mon(m.evolves_to):null; } return o; }
function arcTag(id){ const m=mon(id); if(!m) return ''; if(ANC.has(m.id)) return 'anc'; if(m.role==='fusion') return 'fuse'; const b=baseOf(id); if(STARTERS.includes(b)) return 'start'; for(const a in POOLS) if(POOLS[a].includes(b)) return a; return 'other'; }

// ---- マップの読み込み(regions/*.json) ----
async function loadRegions(){ const ids=ARCS.flatMap(a=>a[2]);
  await Promise.all(ids.map(id=>fetch(REGB+id+'.json').then(r=>r.ok?r.json():null).then(j=>{ if(j) REG[id]=j; }).catch(()=>{})));
  for(const id in REG) for(const w of (REG[id].wild||[])) if(w.ancient||w.boss) ANC.add(+w.id); }
function segD(px,pz,ax,az,bx,bz){ const dx=bx-ax, dz=bz-az, L=dx*dx+dz*dz||1; let t=((px-ax)*dx+(pz-az)*dz)/L; t=Math.max(0,Math.min(1,t)); return Math.hypot(px-(ax+dx*t), pz-(az+dz*t)); }
function zoneAt(D,x,z){ for(const a of (D.areas||[])){ if(a.c&&Math.hypot(x-a.c[0],z-a.c[1])<a.c[2]) return a.n; if(a.r&&x>a.r[0]&&x<a.r[2]&&z>a.r[1]&&z<a.r[3]) return a.n; if(a.seg){ const p=a.seg; if(segD(x,z,p[0][0],p[0][1],p[1][0],p[1][1])<a.w) return a.n; } } return ''; }
// フィールドと同じ: D.battle.byArea[区画] → D.battle.default(川・海辺の判定は地形の形が要るので default を使う)。battle が無いマップは草原
function placeFor(D,x,z){ const b=D.battle; if(!b) return {tt:'meadow', bd:'olive'}; const zn=zoneAt(D,x,z); const p=(b.byArea&&b.byArea[zn])||b.default||{terrainTheme:'meadow',backdrop:'olive'}; return {tt:p.terrainTheme, bd:p.backdrop}; }
function mapPlaces(D){ const out=[], seen=new Set(); const add=(p)=>{ if(!p||!p.terrainTheme) return; const k=p.terrainTheme+'|'+(p.backdrop||''); if(seen.has(k)) return; seen.add(k); out.push({tt:p.terrainTheme, bd:p.backdrop}); };
  const b=D.battle; if(!b){ add({terrainTheme:'meadow',backdrop:'olive'}); add({terrainTheme:'olive',backdrop:'olive'}); add({terrainTheme:'stream',backdrop:'olive'}); add({terrainTheme:'seaside',backdrop:'aegean'}); return out; }
  add(b.default); for(const k in b) if(k!=='default'&&k!=='byArea') add(b[k]); for(const k in (b.byArea||{})) add(b.byArea[k]); return out; }
const arcRule=a=>(window.Progress&&Progress.config&&Progress.config.arcs[a])||{greece:{lv:[2,4],startStage:1,pack:2},china:{lv:[18,24],startStage:2,pack:2},egypt:{lv:[30,38],startStage:2,pack:2},norse:{lv:[47,68],startStage:3,pack:3}}[a]||{lv:[2,4],startStage:1,pack:2};

function partyFor(map, final){ const P=pointOf(map); const arc=arcOf(map); const band=mapLv(map); const lv=Math.min(99,(band[1]||band[0])+1);
  if(final){ const used=new Set(), out=[]; for(const r of shuffle(RECIPE2)){ if(out.length>=6) break; if(r.some(x=>used.has(baseOf(x)))) continue; r.forEach(x=>{ used.add(baseOf(x)); out.push(x); }); }
    return {party:out.map(m=>({mid:m, lv:70})), owned:out.slice(), P:Object.assign({}, P, {fuse:true, count:6}), lv:70}; }   // 北欧の終盤(sim_boss_norse.js と同じ): 融合の組になる2段目の子 3組=6体 Lv70・その姿のまま(owned=その姿)
  const arcs=['greece','china','egypt','norse']; const upto=arcs.slice(0, arcs.indexOf(arc)+1);
  const lines=shuffle(upto.flatMap(a=>POOLS[a]||[])).filter((x,i,a)=>a.indexOf(x)===i);
  const mids=[rnd(STARTERS)].concat(lines.slice(0, P.count-1));
  const owned=P.evo?[...new Set(mids.flatMap(lineOf))]:mids.slice();

segBind('bTier', v=>S.board.tier=+v);

// ---- 設定 → startBattle の opts ----
const STR=[{skill:0.5, hpX:0.8, atkX:0.8, eg:0.4}, null, {skill:1, hpX:1.25, atkX:1.25, eg:0.85}];   // よわい/ふつう(そのまま)/つよい
function buildOpt(){ const allIds=MON.map(m=>m.id);
  if(!S.me.party.length) S.me.party=STARTERS.slice();
  S.me.party=S.me.party.filter(canOwn); if(!S.me.party.length) S.me.party=STARTERS.slice();
  const me=S.me.party.slice(0,6).map(m=>({mid:m, lv:S.me.lv}));
  const owned=S.rule.evo?allIds:S.me.party.slice();
  let opt={ kind:S.board.kind, size:S.board.size, terrainTheme:S.board.place.tt, backdrop:S.board.place.bd||undefined, player:{party:me, owned, items:{}, rankCap:20}, enemy:null };
  const m=S.foe.mode;
  if(m==='boss'&&S.foe.boss){ const B=BOSSES.find(b=>b.key===S.foe.boss); if(B){ const o=encounterOpt(B); opt.enemy=o.enemy; if(!S.me.stage) opt.startStage=o.startStage; if(S.board.kind!==o.kind&&!(S.board.kind==='ancient'||o.kind==='ancient')) opt.kind=S.board.kind; else opt.kind=o.kind; } }
  if(!opt.enemy&&m==='wild'){ const D=REG[S.foe.wildMap]; const pool=D?wildPool(D):[]; if(pool.length){ const band=mapLv(S.foe.wildMap); const lv=()=>band[0]+Math.floor(Math.random()*(band[1]-band[0]+1));
      const ep=[{mid:rnd(pool), lv:Math.min(99,lv()+2), leader:true}]; for(let k=1;k<S.foe.wildN;k++) ep.push({mid:rnd(pool), lv:lv(), pack:true}); opt.enemy={party:ep}; if(!S.me.stage) opt.startStage=mapStage(S.foe.wildMap); } }
  if(!opt.enemy){ const ids=m==='pick'&&S.foe.party.length?S.foe.party.slice(0,6):shuffle(allIds).slice(0,S.foe.n);
    opt.enemy={ name:'CPU', party:ids.map((id,i)=>Object.assign({mid:id, lv:S.foe.lv, fixed:true}, i===0?{leader:true}:{}, S.rule.evo?{evo:true}:{})) }; }
  if(opt.kind==='ancient'&&!opt.enemy.ancient){ opt.enemy.ancient={tier:S.board.tier, minions:[]}; opt.enemy.party[0].fixed=true; }
  if(opt.kind==='wild') opt.enemy.party.forEach(e=>{ delete e.evo; });
  // 開始の段: 自動=えらんだ姿で置く(出せる数は全員ぶん。ボス・野生の群れはそのマップの段) / 1〜3=物語と同じ(その段まで進化した姿・出せる段の合計×段)
  const need=me.reduce((s,p)=>s+((mon(p.mid)||{}).level||1),0);
  if(S.me.stage) opt.startStage=S.me.stage;
  else { if(opt.startStage==null) opt.startStage=1; opt.budget=Math.max(((MB.SIZE_RULES[opt.size]||{}).budget||3)*opt.startStage, need); }
  if(S.rule.fuse) opt.fusionUnlocked=true; if(S.rule.triple) opt.tripleUnlocked=true;
  if(!S.rule.evo){ opt.enemy.ai=Object.assign({}, opt.enemy.ai||{}, {evo:0}); opt.enemy.party.forEach(e=>{ delete e.evo; }); }
  const st=STR[S.foe.str]; if(st) opt.enemy.ai=Object.assign({}, opt.enemy.ai||{}, st, (opt.enemy.ai&&opt.enemy.ai.hpX)?{hpX:opt.enemy.ai.hpX*st.hpX, atkX:(opt.enemy.ai.atkX||1)*st.atkX}:{});
  if(S.board.turn) opt.maxTurn=S.board.turn;
  return opt; }

// ---- たたかう / 結果 ----
let LAST=null, RUNNING=false;
async function run(opt, again){ if(RUNNING) return; RUNNING=true; LAST=again||(()=>buildOpt()); $('rs').classList.remove('on');
  opt=Object.assign({ autoButton:true, recruit:()=>null }, opt);
  window._vsLastOpt=JSON.parse(JSON.stringify(opt, (k,v)=>typeof v==='function'?undefined:v));
  let res=null; try{ res=await MB.startBattle(opt); }catch(e){ console.error('vs battle', e); }
  RUNNING=false; window._vsLastResult=res; showResult(res); }
function showResult(res){ if(!res||res.result==='quit'){ $('rs').classList.remove('on'); return; }
  const T=$('rsT'); const r=res.result; T.className=r==='win'?'win':(r==='lose'||r==='resign')?'lose':'draw'; T.textContent={win:'勝ち',lose:'負け',draw:'引き分け',flee:'にげた',resign:'降参'}[r]||r;
  const s=[res.turns+'ターン', Math.round(res.sec||0)+'秒', res.how==='timeout'?'時間切れ':null, res.hpShare!=null?`残り ${Math.round(100*res.hpShare)}% : ${100-Math.round(100*res.hpShare)}%`:null, res.stats&&res.stats.evo?ICON('evolve')+' '+res.stats.evo[0]+' : '+res.stats.evo[1]:null, res.stats&&res.stats.fuse?ICON('fuse')+' '+res.stats.fuse[0]+' : '+res.stats.fuse[1]:null].filter(Boolean);
  $('rsS').innerHTML=s.map(x=>`<span>${x}</span>`).join(''); $('rs').classList.add('on'); }
$('rsAgain').onclick=()=>{ const o=LAST?LAST():buildOpt(); if(o) run(o, LAST); };
$('rsBack').onclick=()=>{ $('rs').classList.remove('on'); };
$('bGo').onclick=()=>{ save(); run(buildOpt()); };

// ---- 重さ(fps・描画回数・三角形) ----
let PERF=false; try{ PERF=localStorage.getItem('mb_vs_perf')==='1'; }catch(e){}
const pf={calls:0, tris:0, frames:0, t0:performance.now(), lastCalls:0, lastTris:0, dt:[]};
// three r128 は render をコンストラクタの中で作るので、作った renderer ごとに包む(battle.js は触らない)
(function patch(){ const Orig=window.THREE&&THREE.WebGLRenderer; if(!Orig||Orig._vs) return;
  const W=function(o){ const r=new Orig(o); const rr=r.render; r.render=function(){ const x=rr.apply(this, arguments); try{ const i=this.info.render; pf.calls+=i.calls; pf.tris+=i.triangles; }catch(e){} return x; }; return r; };
  W.prototype=Orig.prototype; W._vs=true; try{ THREE.WebGLRenderer=W; }catch(e){} })();
let lastT=performance.now();
function perfTick(now){ requestAnimationFrame(perfTick); const dt=now-lastT; lastT=now; if(!PERF) { pf.calls=pf.tris=0; return; }
  pf.dt.push(dt); if(pf.dt.length>60) pf.dt.shift(); pf.frames++; pf.lastCalls=pf.calls; pf.lastTris=pf.tris; pf.calls=0; pf.tris=0;
  if(pf.frames%15===0){ const avg=pf.dt.reduce((a,b)=>a+b,0)/pf.dt.length; const fps=1000/avg; const worst=Math.max(...pf.dt); const el=$('perf');
    el.textContent=`${fps.toFixed(0)} fps  ${worst.toFixed(0)}ms\n${pf.lastCalls} 描画  ${(pf.lastTris/1000).toFixed(0)}k 三角`+(performance.memory?`\n${(performance.memory.usedJSHeapSize/1048576).toFixed(0)}MB`:''); el.classList.toggle('bad', fps<40); } }
requestAnimationFrame(perfTick);
function perfShow(){ $('perf').classList.toggle('on', PERF); $('bPerf').classList.toggle('on', PERF); }
$('bPerf').onclick=()=>{ PERF=!PERF; try{ localStorage.setItem('mb_vs_perf', PERF?'1':'0'); }catch(e){} perfShow(); };
perfShow();

// ---- 起動 ----
(async()=>{ try{
  await MonBattle.init(); MB=window.MonBattle; MON=MB.MONSTERS.slice(); for(const m of MON) MID[m.id]=m;
  if(window.Progress&&Progress.config){ POOLS=Progress.config.pools||{}; STARTERS=Progress.config.starters||STARTERS; }
  RECIPE2=MON.filter(m=>m.recipe&&!m.recipe3).map(m=>m.recipe.map(Number)).filter(r=>r.every(x=>mon(x)&&mon(x).level===2));
  await loadRegions(); buildBosses(); buildPickFilters();
  // 並び: 相棒→編の順→融合→古代
  const ord={start:0, greece:1, china:2, egypt:3, norse:4, other:5, fuse:6, anc:7}; MON.sort((a,b)=>(ord[arcTag(a.id)]-ord[arcTag(b.id)])||(baseOf(a.id)-baseOf(b.id))||((a.level||1)-(b.level||1)));
  S.me.party=S.me.party.filter(canOwn); S.foe.party=S.foe.party.filter(id=>mon(id)); if(S.foe.boss&&!BOSSES.some(b=>b.key===S.foe.boss)) S.foe.boss=null;
  renderScenes(); renderAll(); $('load').style.display='none';
  window.VS={S, buildOpt, sceneOpt, SCENES, BOSSES, REG, run, encounterOpt};
}catch(e){ console.error(e); $('load').textContent='読み込みエラー'; } })();
})();
</script>
